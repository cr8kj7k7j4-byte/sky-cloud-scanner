name: W3 Data and Systems Engineering

on:
  push:
    branches: [main, engineering/w3-data-infra-20261025]
    paths:
      - "src/data_quality.py"
      - "src/mobile_api.py"
      - "src/runtime_health.py"
      - "src/alert_transport.py"
      - "src/feature_store.py"
      - "src/feature_registry.py"
      - "src/knowledge_engine.py"
      - "tests/test_data_quality.py"
      - "tests/test_mobile_api.py"
      - "tests/test_runtime_health.py"
      - "tests/test_alert_transport.py"
      - "tests/test_feature_registry.py"
      - "tests/test_knowledge_engine.py"
      - ".github/workflows/test-w3-engineering.yml"
  pull_request:
    paths:
      - "src/data_quality.py"
      - "src/mobile_api.py"
      - "src/runtime_health.py"
      - "src/alert_transport.py"
      - "src/feature_store.py"
      - "src/feature_registry.py"
      - "src/knowledge_engine.py"
      - "tests/test_data_quality.py"
      - "tests/test_mobile_api.py"
      - "tests/test_runtime_health.py"
      - "tests/test_alert_transport.py"
      - "tests/test_feature_registry.py"
      - "tests/test_knowledge_engine.py"
      - ".github/workflows/test-w3-engineering.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install pytest
      - name: Run W3 engineering tests
        env:
          PYTHONPATH: .
        run: >
          python -m pytest -q
          tests/test_data_quality.py
          tests/test_mobile_api.py
          tests/test_runtime_health.py
          tests/test_alert_transport.py
          tests/test_feature_registry.py
          tests/test_knowledge_engine.py
