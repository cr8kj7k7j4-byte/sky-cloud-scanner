name: Sky V2.1 Consolidation Tests

on:
  pull_request:
    branches: [ main ]
  push:
    branches:
      - integration/sky-v2.1-consolidation
      - 'governance/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile
        run: python -m compileall -q src tests
      - name: Run consolidated unit tests
        run: |
          pytest -q             tests/test_risk_engine.py             tests/test_knowledge_engine.py             tests/test_agent_orchestrator.py             tests/test_feature_model_arena.py             tests/test_sky100_core.py             tests/test_monitor_engine.py             tests/test_state_store.py             tests/test_strategy_builder.py             tests/test_sky_v2_p1_p3.py             tests/test_sky80_outcome_validation.py             tests/test_sky90_ranking.py \
            tests/test_sector_rs_replay.py \
            tests/test_vwap_entry_replay.py \
            tests/test_execution_engine.py \
            tests/test_cost_profiles.py \
            tests/test_execution_calibration_ledger.py \
            tests/test_governance_pit_gate.py \
            tests/test_revenue_pit.py \
            tests/test_mops_revenue_pit_collector.py \
            tests/test_revenue_pit_coverage.py \
            tests/test_historical_universe_audit.py \
            tests/test_official_universe_events.py \
            tests/test_point_in_time_universe.py
