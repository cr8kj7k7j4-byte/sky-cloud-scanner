name: Sky 100 Phase 7 Rule Stability

on:
  push:
    branches:
      - feat/sky-100-phase7-stability-matrix
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pandas numpy
      - name: Compile
        run: python -m compileall -q src research tests
      - name: Phase 7 tests
        run: python tests/test_rule_stability_matrix.py
      - name: Risk engine tests
        run: python tests/test_risk_engine.py
