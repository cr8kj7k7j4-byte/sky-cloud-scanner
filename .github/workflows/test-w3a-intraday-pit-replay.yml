name: test-w3a-intraday-pit-replay

on:
  pull_request:
    paths:
      - "research/build_intraday_pit_replay.py"
      - "research/intraday_replay_validator.py"
      - "src/point_in_time_universe.py"
      - "src/data_quality.py"
      - "tests/test_intraday_pit_replay_builder.py"
      - ".github/workflows/test-w3a-intraday-pit-replay.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pandas pytest
      - name: Run W3A replay builder tests
        run: python -m pytest -q tests/test_intraday_pit_replay_builder.py tests/test_w2_intraday_validation.py
