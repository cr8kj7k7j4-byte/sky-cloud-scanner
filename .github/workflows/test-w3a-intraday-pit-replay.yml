name: test-w3a-intraday-pit-replay

on:
  pull_request:
    paths:
      - "research/build_intraday_pit_replay.py"
      - "research/audit_intraday_pit_replay.py"
      - "research/intraday_pit_costs.py"
      - "research/run_intraday_pit_replay_pipeline.py"
      - "research/build_intraday_market_context.py"
      - "research/collect_current_sector_anchor.py"
      - "research/build_effective_sector_mapping.py"
      - "research/intraday_pit_replay_readiness.py"
      - "tests/test_pit_history_sharding.py"
      - "research/merge_pit_history_shards.py"
      - "research/shard_pit_history_manifest.py"
      - "research/intraday_replay_validator.py"
      - "src/point_in_time_universe.py"
      - "src/data_quality.py"
      - "tests/test_intraday_pit_replay_builder.py"
      - "tests/test_intraday_pit_replay_audit.py"
      - "tests/test_intraday_pit_pipeline_v2.py"
      - "tests/test_intraday_pit_source_builders.py"
      - ".github/workflows/test-w3a-intraday-pit-replay.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pandas pytest

      - name: Run W3A replay builder and audit tests
        run: |
          python -m pytest -q             tests/test_intraday_pit_replay_builder.py             tests/test_intraday_pit_replay_audit.py             tests/test_w2_intraday_validation.py

      - name: Run source-readiness gate
        run: |
          python research/intraday_pit_replay_readiness.py             --out research_output/w3a_intraday_pit/readiness.json

      - name: Publish readiness summary
        if: always()
        run: |
          echo "## W3A Issue #81 Readiness" >> "$GITHUB_STEP_SUMMARY"
          cat research_output/w3a_intraday_pit/readiness.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload readiness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w3a-issue81-readiness
          path: research_output/w3a_intraday_pit/readiness.json
          if-no-files-found: error
          retention-days: 30
