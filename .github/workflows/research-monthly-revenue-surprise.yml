name: Sky Monthly Revenue Surprise Research

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/research-monthly-revenue-surprise.yml'

permissions:
  actions: read
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas lxml html5lib beautifulsoup4

      - name: Download historical 5m artifact
        uses: dawidd6/action-download-artifact@v11
        with:
          run_id: 39963770301
          name_is_regexp: true
          name: sky-history-5m-.*
          path: _hist
          search_artifacts: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare history dataset
        id: data
        run: |
          mkdir -p _hist_unpacked
          HIST_TAR=$(find _hist -name 'sky-history-5m-*.tar.gz' | head -1)
          test -n "$HIST_TAR"
          tar -xzf "$HIST_TAR" -C _hist_unpacked
          HIST_DIR=$(find _hist_unpacked -type d -path '*/research_data/history' | head -1)
          test -n "$HIST_DIR"
          echo "history_dir=$HIST_DIR" >> "$GITHUB_OUTPUT"

      - name: Run monthly revenue research
        run: |
          python research/research_monthly_revenue_surprise.py             --history-dir "${{ steps.data.outputs.history_dir }}"             --start 2022-12             --end 2026-09             --out research_output_revenue

      - name: Publish summary
        if: always()
        run: |
          if [ -f research_output_revenue/monthly_revenue_summary.md ]; then
            cat research_output_revenue/monthly_revenue_summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-monthly-revenue-${{ github.run_id }}
          path: research_output_revenue
          if-no-files-found: warn
          retention-days: 14

# rerun-current-main
