name: Sky Feature Half-Life Cost Frontier

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/analyze-feature-half-life.yml'

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Download historical 5m artifact
        uses: dawidd6/action-download-artifact@v11
        with:
          run_id: 39963770301
          name_is_regexp: true
          name: sky-history-5m-.*
          path: _hist
          search_artifacts: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare history dataset
        id: data
        run: |
          mkdir -p _hist_unpacked
          HIST_TAR=$(find _hist -name 'sky-history-5m-*.tar.gz' | head -1)
          test -n "$HIST_TAR"
          tar -xzf "$HIST_TAR" -C _hist_unpacked
          HIST_DIR=$(find _hist_unpacked -type d -path '*/research_data/history' | head -1)
          test -n "$HIST_DIR"
          echo "history_dir=$HIST_DIR" >> "$GITHUB_OUTPUT"

      - name: Run half-life and cost frontier diagnostic
        run: |
          python research/analyze_feature_half_life_cost_frontier.py             --history-dir "${{ steps.data.outputs.history_dir }}"             --out research_output_half_life

      - name: Publish summary
        if: always()
        run: |
          if [ -f research_output_half_life/feature_half_life_summary.md ]; then
            cat research_output_half_life/feature_half_life_summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-feature-half-life-${{ github.run_id }}
          path: research_output_half_life
          if-no-files-found: warn
          retention-days: 14
