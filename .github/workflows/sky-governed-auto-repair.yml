name: Sky Governed Auto-Repair (Research Only)
on:
  workflow_dispatch:
    inputs:
      apply_safe_patch:
        description: "Allow only exact-match research patch in isolated draft PR"
        required: false
        type: boolean
        default: false
  workflow_run:
    workflows: ["Sky Chat Bridge Unit Checks"]
    types: [completed]
  pull_request:
    paths:
      - 'scripts/sky_governed_auto_repair.py'
      - 'tests/test_sky_governed_auto_repair.py'
      - '.github/workflows/sky-governed-auto-repair.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/sky_governed_auto_repair.py'
      - 'tests/test_sky_governed_auto_repair.py'
      - '.github/workflows/sky-governed-auto-repair.yml'
# IMPORTANT: no cron and no paid market data. Prior user-requested pause remains.
permissions:
  contents: read
  actions: read
concurrency:
  group: sky-governed-auto-repair
  cancel-in-progress: false
jobs:
  security-contract-tests:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify event SHA, fork, replay and no-write guards without credentials
        run: |
          python -m py_compile scripts/sky_governed_auto_repair.py
          python -m unittest tests.test_sky_governed_auto_repair -v
  governed-repair:
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
      pull-requests: write
      actions: write # only to dispatch free Sky Chat Bridge Unit Checks for isolated smoke repair
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      GH_TOKEN: ${{ github.token }}
      SKY_APPROVED_SAFE_PATCH: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure') || (github.event_name == 'workflow_dispatch' && inputs.apply_safe_patch) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline tests and self-review policy
        run: python -m unittest tests.test_sky_governed_auto_repair -v
      - name: Diagnose and apply allowlisted safety patch to separate draft research PR only
        run: python -m scripts.sky_governed_auto_repair
      - name: Publish run summary
        if: always()
        shell: bash
        run: |
          if [ -f output/sky_governed_auto_repair/latest.json ]; then
            cat output/sky_governed_auto_repair/latest.json >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve diagnosis, rejected fix, and review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-governed-auto-repair-${{ github.run_id }}
          path: output/sky_governed_auto_repair/latest.json
          if-no-files-found: warn
          retention-days: 21
