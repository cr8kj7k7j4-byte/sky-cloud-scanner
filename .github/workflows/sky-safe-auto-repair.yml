name: Sky Safe Auto-Repair (Research Only)
on:
  # Event-driven only. No cron: previously paused scheduled watchdogs stay paused.
  workflow_run:
    workflows:
      - Sky Chat Bridge Unit Checks
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: sky-safe-repair-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  bounded-repair:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      # ALWAYS check out default-branch trusted code, never the failed PR head.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify safe repair invariants before any write
        run: python -m unittest tests.test_sky_bounded_auto_repair -v
      - name: Diagnose and perform at most one AST-preserving fix
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m research.sky_bounded_auto_repair
      - name: Publish diagnosis and self-review
        if: always()
        shell: bash
        run: |
          if test -f output/sky_auto_repair/latest.md; then
            cat output/sky_auto_repair/latest.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No auto-repair report produced; blocked. Production stays NO_TRADE." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Archive evidence including blocked or failure states
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-safe-auto-repair-${{ github.run_id }}
          path: output/sky_auto_repair/
          if-no-files-found: warn
          retention-days: 30
