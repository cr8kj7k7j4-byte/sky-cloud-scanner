name: Sky Institutional History Export
# trigger-version: 4

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/export-institutional-history.yml"

permissions:
  contents: read
  actions: read

jobs:
  shard:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Unit tests
        run: python tests/test_institutional_export.py
      - name: Download Official Enrichment Artifact
        uses: dawidd6/action-download-artifact@v11
        with:
          workflow: export-official-enrichment.yml
          workflow_conclusion: success
          name_is_regexp: true
          name: sky-official-enrichment-.*
          path: _enrichment
          search_artifacts: true
          if_no_artifact_found: fail
      - name: Locate TAIEX
        id: locate
        shell: bash
        run: |
          TAIEX=$(find _enrichment -name taiex_daily.csv | head -1)
          test -n "$TAIEX"
          echo "taiex=$TAIEX" >> "$GITHUB_OUTPUT"
      - name: Export shard
        run: |
          python -u research/export_institutional_history.py \
            --manifest research/sky_100_manifest.json \
            --taiex "${{ steps.locate.outputs.taiex }}" \
            --out-dir "research_data/institutional/shard-${{ matrix.shard }}" \
            --start 2023-05-23 \
            --end 2026-10-22 \
            --sleep 0.20 \
            --shard-index ${{ matrix.shard }} \
            --shard-count 4
      - uses: actions/upload-artifact@v4
        with:
          name: institutional-shard-${{ matrix.shard }}
          path: research_data/institutional/shard-${{ matrix.shard }}/
          retention-days: 2

  merge:
    needs: shard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: institutional-shard-*
          path: _shards
      - name: Merge and validate
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          root=Path("_shards")
          out=Path("research_data/institutional"); out.mkdir(parents=True,exist_ok=True)

          rows=[]; coverage=[]; reports=[]
          for p in sorted(root.rglob("institutional_flows.csv")):
              with p.open(encoding="utf-8-sig") as f: rows += list(csv.DictReader(f))
          for p in sorted(root.rglob("daily_coverage.csv")):
              with p.open(encoding="utf-8-sig") as f: coverage += list(csv.DictReader(f))
          for p in sorted(root.rglob("validation.json")):
              reports.append(json.loads(p.read_text(encoding="utf-8")))

          rows.sort(key=lambda r:(r["date"],r["exchange"],r["symbol"]))
          fields=["date","symbol","name","exchange","foreign_net","trust_net","dealer_net","total_inst_net","source"]
          with (out/"institutional_flows.csv").open("w",newline="",encoding="utf-8-sig") as f:
              w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(rows)
          with (out/"daily_coverage.csv").open("w",newline="",encoding="utf-8-sig") as f:
              fields2=["date","exchange","market_rows","sample_rows"]
              w=csv.DictWriter(f,fieldnames=fields2); w.writeheader(); w.writerows(coverage)

          failures=sum((r.get("failures") or []) for r in reports,[])
          report={
              "shards":len(reports),
              "requested_trade_dates":sum(r.get("requested_trade_dates",0) for r in reports),
              "covered_trade_dates":len({r["date"] for r in rows}),
              "unique_sample_symbols":len({(r["symbol"],r["exchange"]) for r in rows}),
              "rows":len(rows),
              "sources":sorted({r["source"] for r in rows}),
              "failure_count":len(failures),
              "failures":failures,
              "first_date":rows[0]["date"] if rows else None,
              "last_date":rows[-1]["date"] if rows else None,
          }
          report["validation_pass"]=(report["shards"]==4 and report["requested_trade_dates"]>=800 and
                                     report["covered_trade_dates"]>=780 and report["unique_sample_symbols"]>=90 and
                                     report["rows"]>=30000 and report["failure_count"]<=20)
          (out/"validation.json").write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(report,ensure_ascii=False,indent=2))
          if not report["validation_pass"]: raise SystemExit("Merged institutional validation failed")
          PY
      - name: Archive
        run: tar -czf sky-institutional-history-${{ github.run_id }}.tar.gz research_data/institutional
      - name: Publish validation
        run: |
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat research_data/institutional/validation.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: sky-institutional-history-${{ github.run_id }}
          path: |
            sky-institutional-history-${{ github.run_id }}.tar.gz
            research_data/institutional/
          retention-days: 14
