name: TPEx Delisting API Probe

on:
  workflow_dispatch:
  push:
    branches:
      - 'feature/historical-universe-audit'
    paths:
      - 'research/probe_tpex_delisting_api.py'
      - '.github/workflows/probe-tpex-delisting-api.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python research/probe_tpex_delisting_api.py
      - uses: actions/upload-artifact@v4
        with:
          name: tpex-delist-api-${{ github.run_id }}
          path: output/tpex_delist_api/
          retention-days: 30
