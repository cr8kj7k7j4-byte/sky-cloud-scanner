name: Sky One-shot Research Visibility Acceptance 2026-11-09
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sky-research-once-20261109.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch existing scanner once on current main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Triggering current main scanner; separate job will verify real market data."
          gh workflow run scan.yml --repo "$GH_REPO" --ref main
          echo "DISPATCHED_ONLY; not a passed coverage or research report"
          echo "Main scanner outputs: sky-scan-<run_id>/output/research_visibility/latest.json"
