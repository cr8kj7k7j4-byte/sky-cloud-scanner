name: Sky Mandatory Market Information Fields
on:
  pull_request:
    paths:
      - 'research/sky_full_universe_information.py'
      - 'tests/test_sky_full_universe_information.py'
      - '.github/workflows/sky-mandatory-market-info-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  information-display-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install testing dependencies
        run: pip install pytest requests
      - name: Test all rows keep required columns and unverified remain NO_TRADE
        run: PYTHONPATH=. python -m pytest -q tests/test_sky_full_universe_information.py
