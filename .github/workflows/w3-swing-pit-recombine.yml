name: W3 Swing PIT Artifact Repair

on:
  push:
    branches: [engineering/w3-swing-pit-price-20261025]
    paths:
      - "research/repair_swing_pit_history.py"
      - "tests/test_repair_swing_pit_history.py"
      - ".github/workflows/w3-swing-pit-recombine.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: w3-swing-pit-artifact-repair
  cancel-in-progress: true

jobs:
  repair-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: .
      PRIMARY_RUN_ID: "40251277897"
      FALLBACK_RUN_ID: "40230254227"
      PRIMARY_ARTIFACT: "swing-canonical-pit-daily-40251277897"
      FALLBACK_ARTIFACT: "swing-canonical-pit-daily-40230254227"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: pip install pytest

      - name: Validate repair logic
        run: python -m pytest -q tests/test_repair_swing_pit_history.py tests/test_swing_pit_price_coverage.py tests/test_swing_pit_readiness.py

      - name: Download Run 67 primary canonical bundle
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.PRIMARY_ARTIFACT }}
          path: primary_bundle
          repository: cr8kj7k7j4-byte/sky-cloud-scanner
          run-id: ${{ env.PRIMARY_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Download Run 59 fallback canonical bundle
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.FALLBACK_ARTIFACT }}
          path: fallback_bundle
          repository: cr8kj7k7j4-byte/sky-cloud-scanner
          run-id: ${{ env.FALLBACK_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Validate source bundle layout
        run: |
          test -f primary_bundle/canonical_pit/pit_intervals.json
          test -d primary_bundle/canonical_history_flat/history
          test -d fallback_bundle/canonical_history_flat/history
          echo "Primary files: $(find primary_bundle/canonical_history_flat/history -name '*_D.json' | wc -l)"
          echo "Fallback files: $(find fallback_bundle/canonical_history_flat/history -name '*_D.json' | wc -l)"

      - name: Repair missing raw history with fresh PIT remap
        run: >
          python research/repair_swing_pit_history.py
          --primary-history primary_bundle/canonical_history_flat/history
          --fallback-history fallback_bundle/canonical_history_flat/history
          --pit-json primary_bundle/canonical_pit/pit_intervals.json
          --out-history repaired_history
          --report repaired_audit/repair_report.json

      - name: Run repaired coverage audit
        run: >
          python research/audit_swing_pit_price_coverage.py
          --history-dir repaired_history
          --pit-json primary_bundle/canonical_pit/pit_intervals.json
          --out repaired_audit

      - name: Run W1 repaired readiness validator
        run: >
          python research/validate_swing_pit_readiness.py
          --history-dir repaired_history
          --pit-json primary_bundle/canonical_pit/pit_intervals.json
          --out w1_readiness

      - name: Enforce repaired data-readiness gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          coverage=json.loads(Path("repaired_audit/coverage_report.json").read_text(encoding="utf-8"))
          readiness=json.loads(Path("w1_readiness/swing_pit_readiness.json").read_text(encoding="utf-8"))
          repair=json.loads(Path("repaired_audit/repair_report.json").read_text(encoding="utf-8"))
          print({
            "coverage_status":coverage.get("status"),
            "w1_status":readiness.get("status"),
            "repaired_symbols":repair.get("repaired_symbols"),
            "final_files":repair.get("final_files"),
          })
          assert coverage.get("status") == "READY_FOR_W1_CANONICAL_REPLAY"
          assert readiness.get("status") == "READY_FOR_CANONICAL_SWING_REPLAY"
          PY

      - name: Build reproducible repair manifest
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          files=sorted(Path("repaired_history").glob("*_D.json"))
          manifest={
            "schema_version":"SWING_PIT_DAILY_REPAIRED_MANIFEST_1.0",
            "primary_run_id":40251277897,
            "fallback_run_id":40230254227,
            "repair_method":"REUSE_RAW_HISTORY_REMAP_FRESH_PIT_V1",
            "new_api_calls":0,
            "files":len(files),
            "sha256":{p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in files},
          }
          Path("repaired_audit/manifest.json").write_text(
            json.dumps(manifest,ensure_ascii=False,indent=2),encoding="utf-8"
          )
          PY

      - name: Upload repaired canonical daily PIT dataset
        uses: actions/upload-artifact@v4
        with:
          name: w3-swing-canonical-daily-history-repaired-${{ github.run_id }}
          path: |
            repaired_history/
            repaired_audit/
            w1_readiness/
            primary_bundle/canonical_pit/pit_intervals.json
          retention-days: 90
          compression-level: 9

      - name: Dispatch W1 automatic acceptance gate
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          artifact=f"w3-swing-canonical-daily-history-repaired-{os.environ['GITHUB_RUN_ID']}"
          payload=json.dumps({
            "event_type":"w3_swing_data_ready",
            "client_payload":{
              "run_id":os.environ["GITHUB_RUN_ID"],
              "artifact_name":artifact
            }
          }).encode()
          req=urllib.request.Request(
            "https://api.github.com/repos/${{ github.repository }}/dispatches",
            data=payload,
            method="POST",
            headers={
              "Authorization":f"Bearer {os.environ['GH_TOKEN']}",
              "Accept":"application/vnd.github+json",
              "X-GitHub-Api-Version":"2022-11-28",
              "Content-Type":"application/json"
            }
          )
          with urllib.request.urlopen(req, timeout=30) as r:
            print("repository_dispatch status", r.status)
          PY
