name: W3 Swing PIT Recombine Repair

on:
  push:
    branches: [engineering/w3-swing-pit-price-20261025]
    paths:
      - ".github/workflows/w3-swing-pit-recombine.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  recombine-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: .
      SOURCE_RUN_ID: "40194690718"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download canonical PIT from successful source run
        uses: dawidd6/action-download-artifact@v11
        with:
          run_id: ${{ env.SOURCE_RUN_ID }}
          name: swing-canonical-pit
          path: canonical_pit
          search_artifacts: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all successful price shards
        uses: dawidd6/action-download-artifact@v11
        with:
          run_id: ${{ env.SOURCE_RUN_ID }}
          name_is_regexp: true
          name: swing-pit-shard-.*
          path: canonical_history_raw
          search_artifacts: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize artifact layout
        run: |
          mkdir -p canonical_history/history
          find canonical_history_raw -type f -name '*_D.json' -exec cp {} canonical_history/history/ \;
          find canonical_history_raw -type f -name 'shard_report_*.json' -exec cp {} canonical_history/ \;
          DAILY=$(find canonical_history/history -type f -name '*_D.json' | wc -l)
          REPORTS=$(find canonical_history -type f -name 'shard_report_*.json' | wc -l)
          echo "Daily JSON files: $DAILY"
          echo "Shard reports: $REPORTS"
          test "$REPORTS" -eq 16
          test "$DAILY" -gt 0

      - name: Run coverage and missingness audit
        run: >
          python research/audit_swing_pit_price_coverage.py
          --history-dir canonical_history/history
          --pit-json canonical_pit/pit_intervals.json
          --out canonical_audit

      - name: Run W1 registered readiness gate
        run: >
          python research/validate_swing_pit_readiness.py
          --history-dir canonical_history/history
          --pit-json canonical_pit/pit_intervals.json
          --out w1_readiness

      - name: Build reproducible manifest
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          files=sorted(Path("canonical_history/history").glob("*_D.json"))
          manifest={
            "schema_version":"SWING_PIT_DAILY_MANIFEST_1.0",
            "source_run_id":"40194690718",
            "files":len(files),
            "sha256":{p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in files},
          }
          Path("canonical_audit").mkdir(exist_ok=True)
          Path("canonical_audit/manifest.json").write_text(
            json.dumps(manifest,ensure_ascii=False,indent=2),encoding="utf-8"
          )
          PY

      - name: Upload canonical daily PIT dataset
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: w3-swing-canonical-daily-history
          path: |
            canonical_history/history/
            canonical_audit/
            w1_readiness/
            canonical_pit/pit_intervals.json
          retention-days: 90
          compression-level: 9

      - name: Dispatch W1 automatic acceptance gate
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          payload=json.dumps({
            "event_type":"w3_swing_data_ready",
            "client_payload":{
              "run_id":os.environ["GITHUB_RUN_ID"],
              "artifact_name":"w3-swing-canonical-daily-history"
            }
          }).encode()
          req=urllib.request.Request(
            "https://api.github.com/repos/${{ github.repository }}/dispatches",
            data=payload,
            method="POST",
            headers={
              "Authorization":f"Bearer {os.environ['GH_TOKEN']}",
              "Accept":"application/vnd.github+json",
              "X-GitHub-Api-Version":"2022-11-28",
              "Content-Type":"application/json"
            }
          )
          with urllib.request.urlopen(req, timeout=30) as r:
            print("repository_dispatch status", r.status)
          PY
