name: Nova local-probe offline tests (research only)
on:
  push:
    branches:
      - research/nova-marketdata-intake-20261107
  pull_request:
    paths:
      - tools/nova_quote_probe.py
      - tests/test_nova_quote_probe.py
      - .github/workflows/nova_probe_offline.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-normalization:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile read-only probe
        run: python -m py_compile tools/nova_quote_probe.py tests/test_nova_quote_probe.py
      - name: Run offline tests with no credentials or vendor requests
        run: python -m unittest discover -s tests -p 'test_nova_quote_probe.py' -v
