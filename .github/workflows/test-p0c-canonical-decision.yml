name: P0-C Canonical Decision Tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test/runtime dependencies
        run: pip install -r requirements.txt pytest
      - name: Compile
        run: python -m compileall -q src tests
      - name: P0-C contract tests
        run: PYTHONPATH=. pytest -q tests/test_decision_engine.py tests/test_p0c_canonical_decision.py
      - name: Production E2E
        run: PYTHONPATH=. pytest -q tests/test_production_e2e_acceptance.py
