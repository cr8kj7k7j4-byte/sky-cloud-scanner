name: Three Model Evidence Gate (Research Only)
on:
  pull_request:
    paths:
      - 'research/three_model_evidence_gate.py'
      - 'tests/test_three_model_evidence_gate.py'
      - '.github/workflows/three-model-evidence-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runner
        run: python -m pip install pytest
      - name: Validate fail-closed evidence contract
        run: python -m pytest -q tests/test_three_model_evidence_gate.py
