name: Disclosure GCS Durable Readback Gate
on:
  pull_request:
    paths:
      - 'research/disclosure_gcs_readback.py'
      - 'tests/test_disclosure_gcs_readback.py'
      - 'research/gcs_crossday_ledger.py'
      - 'tests/test_gcs_crossday_ledger.py'
      - 'research/gcs_evidence_health.py'
      - 'tests/test_gcs_evidence_health.py'
      - '.github/workflows/disclosure-gcs-readback-gate.yml'
      - 'docs/DISCLOSURE_GCS_PERSISTENCE_GATE_20261108.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify create-only, source hashes and fail-closed
        run: python -m unittest discover -s tests -p test_disclosure_gcs_readback.py -v
      - name: Verify cross-day ledger dedup and immutable checkpoint
        run: python -m unittest discover -s tests -p test_gcs_crossday_ledger.py -v
      - name: Verify evidence health and governance summary
        run: python -m unittest discover -s tests -p test_gcs_evidence_health.py -v
  store:
    if: github.event_name == 'workflow_dispatch'
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      id-token: write
    env:
      DISCLOSURE_GCS_BUCKET: ${{ vars.DISCLOSURE_GCS_BUCKET }}
      WIF_PROVIDER: ${{ secrets.DISCLOSURE_GCP_WIF_PROVIDER }}
      WIF_SERVICE_ACCOUNT: ${{ secrets.DISCLOSURE_GCP_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require configured GCS target and approved WIF identity
        shell: bash
        run: |
          if [ -z "$DISCLOSURE_GCS_BUCKET" ] || [ -z "$WIF_PROVIDER" ] || [ -z "$WIF_SERVICE_ACCOUNT" ]; then
            echo "GCS_CONFIG_PENDING: verify bucket var and WIF identity secrets"; exit 1
          fi
      - name: Capture official first-seen snapshots
        run: python -m research.forward_disclosure_evidence_capture --out-dir research_output/disclosure_forward_snapshot
      - name: Confirm all four official feeds passed
        run: |
          python -c "from pathlib import Path; from research.disclosure_gcs_readback import validate_capture; assert len(validate_capture(Path('research_output/disclosure_forward_snapshot'))) == 5; print('FOUR_SOURCE_CAPTURE_GATE_PASS')"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}
      - name: Install GCS SDK for readback
        run: python -m pip install 'google-cloud-storage>=2.16,<4'
      - name: Create-only GCS upload and exact readback
        run: python -m research.disclosure_gcs_readback --folder research_output/disclosure_forward_snapshot --receipt research_output/gcs_readback_receipt.json
      - name: Rebuild immutable cross-day event ledger from verified GCS snapshots
        run: python -m research.gcs_crossday_ledger --receipt research_output/gcs_crossday_ledger_receipt.json
      - name: Preserve event ledger provenance and block trade promotion
        run: |
          python -c "import json; r=json.load(open('research_output/gcs_crossday_ledger_receipt.json')); assert r['status']=='GCS_CROSSDAY_LEDGER_READBACK_PASS' and r['source_batches']>=1 and r['eligible_trade_events']==0 and not r['production_signal']; print('CROSSDAY_LEDGER_PROVENANCE_GATE_PASS')"
      - name: Publish Chinese GCS evidence health summary
        run: |
          python -m research.gcs_evidence_health \
            --raw research_output/gcs_readback_receipt.json \
            --ledger research_output/gcs_crossday_ledger_receipt.json \
            --out research_output/gcs_evidence_health.json \
            --summary "$GITHUB_STEP_SUMMARY"
      - name: Save diagnostics and bounded evidence on both success and failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: disclosure-gcs-readback-diagnostics
          path: research_output/
          retention-days: 30
          if-no-files-found: warn

  notify_manual_failure:
    if: ${{ always() && github.event_name == 'workflow_dispatch' && (needs.unit.result == 'failure' || needs.store.result == 'failure') }}
    needs: [unit, store]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SOURCE_RUN: ${{ github.run_id }}
      SOURCE_REPO: ${{ github.repository }}
    steps:
      - name: Notify failed GCS evidence capture via existing Telegram integration
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          token=os.getenv("TELEGRAM_BOT_TOKEN","")
          chat=os.getenv("TELEGRAM_CHAT_ID","")
          if not token or not chat:
              print("GCS_ALERT_CHANNEL_NOT_CONFIGURED; failure remains visible on GitHub")
          else:
              url="https://github.com/"+os.environ["SOURCE_REPO"]+"/actions/runs/"+os.environ["SOURCE_RUN"]
              msg="【Sky GCS證據異常】\\n人工採集／跨日帳本失敗\\n"+url+"\\n停止將本次視為合格證據。"
              data=urllib.parse.urlencode({"chat_id":chat,"text":msg}).encode()
              request=urllib.request.Request("https://api.telegram.org/bot"+token+"/sendMessage",
                  data=data,method="POST")
              try:
                  with urllib.request.urlopen(request,timeout=12) as response:
                      body=json.loads(response.read().decode())
                  if body.get("ok") is not True:
                      raise ValueError("Telegram non-ok response")
                  print("GCS_FAILURE_ALERT_SENT")
              except Exception as exc:
                  raise SystemExit("GCS_ALERT_DELIVERY_FAILED: "+type(exc).__name__)
          PY
