name: W0 Risk Projection Contract Tests
on:
  pull_request:
    paths:
      - 'src/main.py'
      - 'src/risk_engine.py'
      - 'tests/test_w0_risk_projection_contract.py'
      - '.github/workflows/w0-risk-projection-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  risk-projection-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline test dependencies
        run: python -m pip install pytest requests pandas numpy
      - name: Verify missing ledger is a safe HOLD, not a scanner crash
        run: PYTHONPATH=. python -m pytest -q tests/test_w0_risk_projection_contract.py
