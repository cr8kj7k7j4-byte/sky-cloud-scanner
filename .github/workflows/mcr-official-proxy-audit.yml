name: MCR Official Margin Proxy Research Audit
on:
  workflow_dispatch:
  push:
    branches:
      - research/mcr-official-margin-proxy-20261108
    paths:
      - 'research/mcr_official_margin_proxy.py'
      - 'tests/test_mcr_official_margin_proxy.py'
      - '.github/workflows/mcr-official-proxy-audit.yml'
  pull_request:
    paths:
      - 'research/mcr_official_margin_proxy.py'
      - 'tests/test_mcr_official_margin_proxy.py'
      - '.github/workflows/mcr-official-proxy-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline parser, date, and no-trade tests
        run: python -m unittest tests.test_mcr_official_margin_proxy -v
      - name: Fetch official TWSE two-session source (research only)
        id: source
        continue-on-error: true
        run: python -m research.mcr_official_margin_proxy --date 2026-11-06
      - name: Publish truthful source audit
        if: always()
        run: |
          python - <<'PY'
          import json,os
          p="research_output/mcr_official_proxy.json"
          if not os.path.exists(p):
              print("NO_OUTPUT: collector did not execute")
          else:
              d=json.load(open(p,encoding="utf-8"))
              print("SOURCE_DATA_QUALITY:", d.get("data_quality"))
              print("SOURCE_COVERAGE:", d.get("coverage","unavailable"))
              print("OBSERVED_ROWS:",d.get("total"))
              print("ERROR_REASON:",d.get("reason","none"))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcr-official-proxy-audit-${{ github.run_id }}
          path: research_output/mcr_official_proxy.json
          if-no-files-found: warn
      - name: Require actual source verification for live publish eligibility
        run: |
          python - <<'PY'
          import json
          with open("research_output/mcr_official_proxy.json",encoding="utf-8") as f: d=json.load(f)
          assert d.get("data_quality")=="TWSE_PASSED_TPEX_NOT_CHECKED", d.get("reason")
          assert d.get("mode")=="RESEARCH_PROXY_ONLY"
          assert d.get("maintenance_below_130_verified") is False
          assert d.get("total") is not None
          print("TWSE historical source verified; still NOT full TWSE+TPEx or trade validated.")
          PY
