name: MCR Official Margin Proxy Research Audit
on:
  workflow_dispatch:
  schedule:
    - cron: '40 10 * * 1-5' # Asia/Taipei 18:40 weekdays, exchange holiday fails closed
  push:
    branches:
      - research/mcr-official-margin-proxy-20261108
      - main
    paths:
      - 'research/mcr_official_margin_proxy.py'
      - 'research/mcr_tpex_margin_proxy.py'
      - 'research/mcr_merged_proxy.py'
      - 'research/mcr_daily_volume.py'
      - 'tests/test_mcr_daily_volume.py'
      - 'research/mcr_proxy_event_ledger.py'
      - 'tests/test_mcr_proxy_event_ledger.py'
      - 'tests/test_mcr_merged_proxy.py'
      - 'tests/test_mcr_official_margin_proxy.py'
      - '.github/workflows/mcr-official-proxy-audit.yml'
  pull_request:
    paths:
      - 'research/mcr_official_margin_proxy.py'
      - 'tests/test_mcr_official_margin_proxy.py'
      - '.github/workflows/mcr-official-proxy-audit.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline parser, date, and no-trade tests
        run: python -m unittest tests.test_mcr_official_margin_proxy -v
      - name: Test cross-market verified-session merge
        run: python -m unittest tests.test_mcr_tpex_margin_proxy tests.test_mcr_merged_proxy tests.test_mcr_proxy_event_ledger tests.test_mcr_daily_volume -v
      - name: Validate live official closing-volume schemas (no secret)
        run: |
          python - <<'PY'
          from research.mcr_daily_volume import fetch, parse_market, _date, _field, KEYS
          for market in ("TWSE","TPEx"):
              data=fetch(market)
              dated=_date(_field(data[0],KEYS[market]["date"]))
              rows=parse_market(data,market,dated)
              print("VOLUME_SCHEMA_VERIFIED",market,dated,len(rows),"unit=shares")
          PY
      - name: Fetch official TWSE two-session source (research only)
        id: source
        continue-on-error: true
        run: python -m research.mcr_official_margin_proxy
      - name: Publish truthful source audit
        if: always()
        run: |
          python - <<'PY'
          import json,os
          p="research_output/mcr_official_proxy.json"
          if not os.path.exists(p):
              print("NO_OUTPUT: collector did not execute")
          else:
              d=json.load(open(p,encoding="utf-8"))
              print("SOURCE_DATA_QUALITY:", d.get("data_quality"))
              print("SOURCE_COVERAGE:", d.get("coverage","unavailable"))
              print("OBSERVED_ROWS:",d.get("total"))
              print("ERROR_REASON:",d.get("reason","none"))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcr-official-proxy-audit-${{ github.run_id }}
          path: research_output/mcr_official_proxy.json
          if-no-files-found: warn
      - name: Require actual source verification for live publish eligibility
        run: |
          python - <<'PY'
          import json
          with open("research_output/mcr_official_proxy.json",encoding="utf-8") as f: d=json.load(f)
          assert d.get("data_quality")=="TWSE_PASSED_TPEX_NOT_CHECKED", d.get("reason")
          assert d.get("mode")=="RESEARCH_PROXY_ONLY"
          assert d.get("maintenance_below_130_verified") is False
          assert d.get("total") is not None
          print("TWSE historical source verified; still NOT full TWSE+TPEx or trade validated.")
          PY

      - name: Publish verified proxy feed to public repository for read-only mobile viewer
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          python - <<'PY'
          import json,pathlib,shutil
          s=pathlib.Path("research_output/mcr_official_proxy.json")
          d=json.loads(s.read_text(encoding="utf-8"))
          assert d["data_quality"]=="TWSE_PASSED_TPEX_NOT_CHECKED"
          assert d["mode"]=="RESEARCH_PROXY_ONLY" and d["maintenance_below_130_verified"] is False
          assert d["total"]==len(d["rows"])
          assert d["total"]>0
          pathlib.Path("research_output").mkdir(exist_ok=True)
          shutil.copyfile(s,"research_output/mcr_official_proxy_latest.json")
          print("Publish TWSE proxy as of",d["margin_data_date"],"rows",d["total"])
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research_output/mcr_official_proxy_latest.json
          git diff --cached --quiet || (git commit -m "data(research): update TWSE financing proxy snapshot [skip ci]" && git push)

      - name: Fetch official TPEx source, fail closed
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: python -m research.mcr_tpex_margin_proxy
      - name: Merge matching-session TWSE + TPEx proxy evidence
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: python -m research.mcr_merged_proxy
      - name: Join same-session official daily share volume (missing is null)
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: python -m research.mcr_daily_volume
      - name: Record immutable date-specific research observations (no trade outcomes)
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: python -m research.mcr_proxy_event_ledger
      - name: Publish combined market snapshot after all verification gates
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Force-add only these two audited public research artifacts.
          # research_output/ is otherwise deliberately ignored.
          git add -f research_output/mcr_official_proxy_combined_latest.json research_output/mcr_event_ledger/*.json
          git diff --cached --quiet || (git commit -m "data(research): TWSE TPEx verified financing snapshot [skip ci]" && git pull --rebase && git push)
