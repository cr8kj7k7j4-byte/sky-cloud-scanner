name: GCS Evidence Post-Upload Read-only Audit
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/gcs_post_upload_integrity_audit.py'
      - 'tests/test_gcs_post_upload_integrity_audit.py'
      - '.github/workflows/gcs-post-upload-integrity-audit.yml'
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test GCS read-only evidence integrity audit
        run: python -m unittest discover -s tests -p test_gcs_post_upload_integrity_audit.py -v
  inspect:
    if: github.event_name == 'workflow_dispatch'
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      DISCLOSURE_GCS_BUCKET: ${{ vars.DISCLOSURE_GCS_BUCKET }}
      WIF_PROVIDER: ${{ secrets.DISCLOSURE_GCP_WIF_PROVIDER }}
      WIF_SERVICE_ACCOUNT: ${{ secrets.DISCLOSURE_GCP_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check repository cloud identity config
        run: |
          if [ -z "$DISCLOSURE_GCS_BUCKET" ] || [ -z "$WIF_PROVIDER" ] || [ -z "$WIF_SERVICE_ACCOUNT" ]; then
            echo "MISSING_CLOUD_IDENTITY_CONFIG"; exit 1
          fi
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}
      - run: python -m pip install 'google-cloud-storage>=2.16,<4'
      - name: Re-read latest GCS evidence and check source hashes
        run: python -m research.gcs_post_upload_integrity_audit --out research_output/gcs_post_upload_integrity_audit.json
      - name: Save bounded integrity and policy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcs-post-upload-integrity-audit
          path: research_output/gcs_post_upload_integrity_audit.json
          retention-days: 30
          if-no-files-found: warn
