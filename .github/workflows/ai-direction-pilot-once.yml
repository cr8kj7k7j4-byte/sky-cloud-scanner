name: AI Direction 2026 One-shot Historical Pilot (Research Only)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ai-direction-pilot-once.yml"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: sky-fugle-paid-global-research-v1-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}-${{ inputs.symbol || inputs.symbols || 'all' }}-${{ inputs.from_date || inputs.start_date || 'start' }}-${{ inputs.end_date || inputs.to_date || 'end' }}
  cancel-in-progress: false
jobs:
  sky_paid_reservation:
    # Fail closed on repository merge and PR; explicit manual permission for paid research only.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reserve paid API request safely
        id: reservation
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m research.sky_paid_fugle_api_guard --workflow-scope
      - name: Upload sanitized reservation before paid access
        if: steps.reservation.outputs.allowed == 'true'
        id: claim
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.reservation.outputs.claim_name }}
          path: output/fugle_api_guard/claim.json
          if-no-files-found: error
          retention-days: 2
      - name: Independent reservation readback, fail closed
        if: steps.reservation.outputs.allowed == 'true' && steps.claim.outcome == 'success'
        id: verify_claim
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m research.sky_paid_fugle_api_guard --workflow-scope --verify
      - name: Fail job when claim is rejected or not verified
        run: |
          test "${{ steps.reservation.outputs.allowed }}" = "true"
          test "${{ steps.claim.outcome }}" = "success"
          test "${{ steps.verify_claim.outcome }}" = "success"
  run:
    needs: sky_paid_reservation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout fixed research commit (not Production)
        uses: actions/checkout@v4
        with:
          ref: 0118121142a0fb9ca9d09d43689427075eade5a1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install isolated research dependencies
        run: python -m pip install "numpy>=1.26,<3" "pandas>=2,<3" "scikit-learn>=1.4,<2" "xgboost>=2,<4" "lightgbm>=4,<5"
      - name: Execute expanded ten-symbol 2026 historical research audit
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$FUGLE_API_KEY" ]; then
            echo "::error::Fugle historical access secret is not configured"
            exit 1
          fi
          python -m research.ai_direction_2026_pilot \
            --start 2026-01-01 --end 2026-11-07 \
            --symbols 1101,8088,2330,2317,2303,2603,2882,1301,2002,2454 \
            --out research_output/ai_direction_2026_pilot_summary.json
      - name: Save only sanitized research metrics
        uses: actions/upload-artifact@v4
        with:
          name: sky-ai-direction-2026-cohort10-pilot-${{ github.run_id }}
          path: research_output/ai_direction_2026_pilot_summary.json
          if-no-files-found: error
          retention-days: 14
      - name: Record failed pilot run in Issue 375
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            const marker='<!-- sky-ai-direction-one-shot:'+context.runId+' -->';
            const body=marker+'\n2026/1/1～11/7 真實富果十檔歷史研究試跑未成功；'
              +'執行紀錄：https://github.com/'+owner+'/'+repo+'/actions/runs/'+context.runId
              +'\n勿將未取得的 Brier/ECE 或機率當成已驗證。未改動 Production。';
            const comments=await github.paginate(github.rest.issues.listComments,
              {owner,repo,issue_number:375,per_page:100});
            if(!comments.some(x=>String(x.body||'').includes(marker)))
              await github.rest.issues.createComment({owner,repo,issue_number:375,body});
