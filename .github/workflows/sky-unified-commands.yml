name: Sky Unified Commands
on:
  push:
    branches: [main]
    paths:
      - 'scan_requests/unified/latest.json'
  # PAUSED on 2026-11-10 by user request: formerly scheduled trigger.
  # schedule:
  # # 09:10 / 09:20 Asia/Taipei on weekdays; trading-calendar gate in runner.
  # - cron: '10,20 1 * * 1-5'
  workflow_dispatch:
    inputs:
      command:
        description: Unified command
        required: true
        type: choice
        options:
          - all_market
          - system_health
          - model_validation
permissions:
  contents: write
  actions: read
concurrency:
  group: sky-fugle-paid-global-research-v1
  cancel-in-progress: false
jobs:
  unified:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest PyYAML
      - name: Reserve shared Fugle paid API window
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m research.sky_paid_fugle_api_guard
      - name: Upload paid reservation before provider call
        id: claim
        if: steps.guard.outputs.allowed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.guard.outputs.claim_name }}
          path: output/fugle_api_guard/claim.json
          if-no-files-found: error
          retention-days: 2
      - name: Verify reservation via GitHub API
        id: verify_claim
        if: steps.guard.outputs.allowed == 'true' && steps.claim.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m research.sky_paid_fugle_api_guard --verify
      - name: Execute unified mode
        if: steps.guard.outputs.allowed == 'true' && steps.verify_claim.outcome == 'success'
        id: scan
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          MAX_PRICE: "100"
          PYTHONPATH: .
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            COMMAND=$(python -c 'import json; print(json.load(open("scan_requests/unified/latest.json"))["command"])')
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            COMMAND="all_market"
          else
            COMMAND="${{ inputs.command }}"
          fi
          python -m src.sky_unified_commands --mode "$COMMAND"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-unified-${{ github.run_id }}
          path: |
            output/unified/
            output/swing_live/latest_swing5d.json
            output/swing_live/latest_swing5d.txt
            output/swing_live/snapshot_observations_swing5d.json
          if-no-files-found: warn
          retention-days: 30
      - name: Publish sanitized execution verification
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
          COMMAND_INPUT: ${{ inputs.command }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          command = os.environ.get("COMMAND_INPUT") or ""
          if not command:
              try:
                  command = json.loads(Path("scan_requests/unified/latest.json").read_text())["command"]
              except (OSError, ValueError, KeyError):
                  command = "UNKNOWN"
          payload = {}
          report_file = Path("output/unified") / f"{command}.json"
          if report_file.is_file():
              try:
                  payload = json.loads(report_file.read_text())
              except (OSError, ValueError):
                  pass
          result = payload.get("result", {})
          reports = result.get("reports", {})
          safe_reports = {
              name: {key: report.get(key) for key in
                     ("available", "data_timestamp", "operational_full_market_scan",
                      "quote_coverage_pct", "candidate_count", "research_only",
                      "observation_mode", "trade_decision", "observed_sample_count",
                      "market_data_gate", "candidate_preview", "warnings",
                      "unverified_snapshot_observation_count", "unverified_snapshot_preview",
                      "snapshot_coverage_pct", "snapshot_exchange_counts",
                      "snapshot_observations_full_artifact",
                      "snapshot_individual_verified_count", "snapshot_individual_confirmation",
                      "snapshot_observation_warning", "information_columns_13col",
                      "information_count_13col", "information_preview_13col")}
              for name, report in reports.items() if isinstance(report, dict)
          }
          safe = {
              "schema": "SKY_UNIFIED_EXECUTION_VERIFICATION_V1",
              "published_at_utc": datetime.now(timezone.utc).isoformat(),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "run_url": "https://github.com/{}/actions/runs/{}".format(
                  os.environ.get("GITHUB_REPOSITORY"), os.environ.get("GITHUB_RUN_ID")),
              "head_sha": os.environ.get("GITHUB_SHA"),
              "command": command,
              "scan_step_outcome": os.environ.get("SCAN_OUTCOME"),
              "report_exists": bool(payload),
              "report_generated_at_utc": payload.get("utc_generated_at"),
              "decision": result.get("decision", "REPORT_MISSING_OR_INVALID"),
              "calendar_exit_code": result.get("calendar", {}).get("exit_code"),
              "strategy_exit_codes": {
                  name: item.get("exit_code") for name, item in
                  result.get("strategies", {}).items() if isinstance(item, dict)},
              "reports": safe_reports,
              "evidence": result.get("evidence", {}),
              "no_order_or_production_promotion": True
          }
          Path("/tmp/sky_unified_status.json").write_text(
              json.dumps(safe, ensure_ascii=False, indent=2) + chr(10))
          PY
          TARGET="repos/${GITHUB_REPOSITORY}/contents/docs/SKY_UNIFIED_LATEST_$(python -c 'import json; print(json.load(open("/tmp/sky_unified_status.json"))["command"].upper())').json"
          CONTENT=$(base64 -w0 /tmp/sky_unified_status.json)
          for ATTEMPT in 1 2 3; do
            SHA=$(gh api "$TARGET" --jq '.sha' 2>/dev/null || true)
            if [ -n "$SHA" ]; then
              gh api --method PUT "$TARGET" -f message="ops: publish sanitized scan status [skip ci]" -f content="$CONTENT" -f sha="$SHA" -f branch=main >/dev/null && break
            else
              gh api --method PUT "$TARGET" -f message="ops: publish sanitized scan status [skip ci]" -f content="$CONTENT" -f branch=main >/dev/null && break
            fi
            if [ "$ATTEMPT" = 3 ]; then exit 1; fi
            sleep 2
          done
