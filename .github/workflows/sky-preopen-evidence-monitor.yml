name: Sky Preopen Recovery Evidence Monitor (5min temporary)
# Read-only monitor. Does not restart paid APIs, modify Production, or place orders.
on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read
  actions: write # Self-disable after time-limited emergency window only.
  issues: write # Single first-schedule proof in existing W0 issue #363.

concurrency:
  group: sky-preopen-evidence-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      DEADLINE_UTC: "2026-11-10T02:30:00Z" # 2026-11-10 10:30 Asia/Taipei
    steps:
      - name: Inspect latest scanner and research PRs (no mutation)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovery-reports
          python - <<'PY'
          import json, os, pathlib, subprocess
          from datetime import datetime, timezone
          now = datetime.now(timezone.utc)
          deadline = datetime.fromisoformat(os.environ["DEADLINE_UTC"].replace("Z","+00:00"))
          repo = os.environ["GITHUB_REPOSITORY"]
          def gh(path):
              p = subprocess.run(["gh","api",path], text=True, capture_output=True, timeout=30)
              if p.returncode:
                  return {"error": p.stderr.strip()[:400], "status": "API_ERROR"}
              try:
                  return json.loads(p.stdout)
              except json.JSONDecodeError:
                  return {"error": "INVALID_JSON", "status": "API_ERROR"}
          active = now <= deadline
          runs = gh(f"repos/{repo}/actions/workflows/scan.yml/runs?per_page=8")
          items = runs.get("workflow_runs",[]) if isinstance(runs,dict) else []
          latest = [{k: x.get(k) for k in ("id","event","status","conclusion","created_at","run_started_at","updated_at","html_url","head_sha")} for x in items[:8]]
          artifacts = {}
          if latest and latest[0].get("id"):
              rid = latest[0]["id"]
              data = gh(f"repos/{repo}/actions/runs/{rid}/artifacts?per_page=30")
              artifacts = {"run_id":rid,"names":[x.get("name") for x in data.get("artifacts",[])] if isinstance(data,dict) else [],"error":data.get("error") if isinstance(data,dict) else None}
          prs={}
          for number in (421,430,383):
              x=gh(f"repos/{repo}/pulls/{number}")
              prs[str(number)]={k:x.get(k) for k in ("state","draft","merged","mergeable","updated_at","html_url")} if isinstance(x,dict) else {"error":"BAD_RESPONSE"}
          # This monitor checks evidence only. A failed market-data coverage gate is
          # a genuine operational blocker, not permission to skip the gate.
          outcome = "INSUFFICIENT_DATA"
          if isinstance(runs,dict) and "error" in runs:
              outcome = "GITHUB_API_ERROR"
          elif not latest:
              outcome = "NO_SCAN_RUN"
          elif latest[0].get("conclusion") == "failure":
              outcome = "SCAN_RUN_FAILED_CHECK_LOGS"
          elif latest[0].get("status") != "completed":
              outcome = "SCAN_RUNNING"
          else:
              outcome = "SCAN_COMPLETED_CHECK_ARTIFACT"
          report={"schema":"SKY_PREOPEN_EVIDENCE_MONITOR_V1","checked_at_utc":now.isoformat(),"deadline_utc":deadline.isoformat(),"within_emergency_window":active,"monitor_event":os.environ.get("GITHUB_EVENT_NAME"),"scan_run_checks":latest,"latest_artifacts":artifacts,"research_prs":prs,"status":outcome,"trading_permission":"NO_TRADE_UNTIL_INDEPENDENT_P0_R_AND_DATA_GATES_PASS","note":"Green monitor is NOT live data, strategy expectancy, user-visible mobile deployment, or production readiness. No API retry or code auto-fix is performed."}
          pathlib.Path("recovery-reports/preopen-latest.json").write_text(json.dumps(report,ensure_ascii=False,indent=2)+"\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write(f"### Sky preopen evidence monitor\nChecked UTC: {now.isoformat()}\nStatus: **{outcome}**\nLatest scan: {latest[0].get('html_url','none') if latest else 'none'}\nArtifacts: {artifacts.get('names',[])}\nNo automatic repairs or trades.\n")
          print(json.dumps({"status":outcome,"latest_run_id":latest[0].get("id") if latest else None,"within_emergency_window":active},ensure_ascii=False))
          PY
      - name: Upload read-only status artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-preopen-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: recovery-reports/preopen-latest.json
          if-no-files-found: warn
          retention-days: 7
      - name: Record first schedule proof in W0 issue once
        if: ${{ github.event_name == 'schedule' }}
        shell: bash
        run: |
          set -euo pipefail
          MARKER="SKY_PREOPEN_MONITOR_FIRST_SCHEDULE_V1"
          COMMENTS="$(gh api "repos/${GITHUB_REPOSITORY}/issues/363/comments?per_page=100" --paginate --jq '.[].body')"
          if grep -Fq "$MARKER" <<< "$COMMENTS"; then exit 0; fi
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/363/comments" -f body="$MARKER
          2026-11-09 preopen five-minute monitor real schedule observed.
          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          Artifact: sky-preopen-evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}
          Evidence-only; does not fix code, retry paid data, deploy Cloud Run or override NO_TRADE."
      - name: Disable temporary monitor after 2026-11-10 10:30 TPE
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import datetime,os,subprocess
          if datetime.datetime.now(datetime.timezone.utc) <= datetime.datetime.fromisoformat(os.environ["DEADLINE_UTC"].replace("Z","+00:00")):
              raise SystemExit(0)
          cmd=["gh","api","-X","PUT",f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/workflows/sky-preopen-evidence-monitor.yml/disable"]
          p=subprocess.run(cmd,text=True,capture_output=True)
          print("Self disable:", "SUCCESS" if p.returncode==0 else p.stderr[:300])
          raise SystemExit(p.returncode)
          PY
