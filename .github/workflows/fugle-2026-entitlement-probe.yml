name: Fugle 2026 Historical Entitlement Probe (research only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/fugle_2026_entitlement_probe.py'
      - 'research/historical_5m_quality.py'
      - 'tests/test_fugle_2026_entitlement_probe.py'
      - 'tests/test_historical_5m_quality.py'
      - '.github/workflows/fugle-2026-entitlement-probe.yml'
  pull_request:
    branches: [main]
    paths:
      - 'research/fugle_2026_entitlement_probe.py'
      - 'research/historical_5m_quality.py'
      - 'tests/test_fugle_2026_entitlement_probe.py'
      - 'tests/test_historical_5m_quality.py'
      - '.github/workflows/fugle-2026-entitlement-probe.yml'
permissions:
  contents: write
concurrency:
  group: sky-fugle-paid-global-research-v1
  cancel-in-progress: false
jobs:
  sky_paid_reservation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reserve paid API request safely
        id: reservation
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m research.sky_paid_fugle_api_guard --workflow-scope
      - name: Upload sanitized reservation before paid access
        if: steps.reservation.outputs.allowed == 'true'
        id: claim
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.reservation.outputs.claim_name }}
          path: output/fugle_api_guard/claim.json
          if-no-files-found: error
          retention-days: 2
      - name: Independent reservation readback, fail closed
        if: steps.reservation.outputs.allowed == 'true' && steps.claim.outcome == 'success'
        id: verify_claim
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m research.sky_paid_fugle_api_guard --workflow-scope --verify
      - name: Fail job when claim is rejected or not verified
        run: |
          test "${{ steps.reservation.outputs.allowed }}" = "true"
          test "${{ steps.claim.outcome }}" = "success"
          test "${{ steps.verify_claim.outcome }}" = "success"
  probe:
    needs: sky_paid_reservation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests without live credentials
        run: python -m unittest tests/test_fugle_2026_entitlement_probe.py tests/test_historical_5m_quality.py -v
      - name: Install HTTP dependency
        if: github.event_name != 'pull_request'
        run: pip install requests
      - name: Live two-symbol historical API capability check
        if: github.event_name != 'pull_request'
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
        run: python -m research.fugle_2026_entitlement_probe --out research_output/fugle_2026_entitlement_probe.json
      - name: Upload sanitized result
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: fugle-2026-entitlement-probe-${{ github.run_id }}
          path: research_output/fugle_2026_entitlement_probe.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish sanitized readback for mobile GitHub review
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TARGET="repos/${GITHUB_REPOSITORY}/contents/docs/SKY_FUGLE_2026_HISTORY_PROBE_LATEST.json"
          CONTENT="$(base64 -w0 research_output/fugle_2026_entitlement_probe.json)"
          for ATTEMPT in 1 2 3; do
            SHA="$(gh api "$TARGET" --jq '.sha' 2>/dev/null || true)"
            if [ -n "$SHA" ]; then
              gh api --method PUT "$TARGET" -f message="evidence: update sanitized Fugle 2026 probe [skip ci]" -f content="$CONTENT" -f sha="$SHA" -f branch=main >/dev/null && exit 0
            else
              gh api --method PUT "$TARGET" -f message="evidence: publish sanitized Fugle 2026 probe [skip ci]" -f content="$CONTENT" -f branch=main >/dev/null && exit 0
            fi
            sleep 2
          done
          exit 1
