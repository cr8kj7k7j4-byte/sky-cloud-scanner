name: Sky overnight readiness watch 2026-11-09 (read-only)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sky-overnight-readiness-watch-20261109.yml'
  schedule:
    # Every 15 minutes; bounded by Asia/Taipei gate below. Not a guaranteed clock.
    - cron: '*/15 * * * *'
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect latest scanner, output provenance and 13-column readiness
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/overnight_readiness
          python - <<'PY'
          import base64, datetime as dt, json, os, subprocess
          from pathlib import Path
          from zoneinfo import ZoneInfo

          now = dt.datetime.now(ZoneInfo("Asia/Taipei"))
          # Deliberately expire after tomorrow's market open; avoid permanent duplicate schedules.
          active = ((now.date() == dt.date(2026, 11, 9) and now.hour >= 14)
                    or (now.date() == dt.date(2026, 11, 10) and now.hour < 9))
          def api(path):
              p = subprocess.run(["gh", "api", path], capture_output=True, text=True, timeout=30)
              if p.returncode:
                  return None, p.stderr[-500:]
              try:
                  return json.loads(p.stdout), None
              except json.JSONDecodeError:
                  return None, "INVALID_GITHUB_JSON"
          def file_text(path):
              v, err = api(f"repos/{os.environ['GH_REPO']}/contents/{path}")
              if not v:
                  return None, err
              try:
                  return base64.b64decode(v.get("content", "")).decode(), None
              except (ValueError, UnicodeDecodeError) as exc:
                  return None, type(exc).__name__
          report = {
              "schema": "SKY_OVERNIGHT_READINESS_WATCH_V1",
              "checked_at_tpe": now.isoformat(),
              "time_window_active": active,
              "monitor_only_no_auto_repair": True,
              "production_modified": False,
              "status": "EXPIRED_OUTSIDE_WINDOW" if not active else "INSUFFICIENT_DATA",
          }
          if active:
              body, error = file_text("docs/SKY_MCR_INTRADAY_HEALTH_LATEST.json")
              if body:
                  try:
                      health = json.loads(body)
                      report["scan_run_id"] = health.get("run_id")
                      report["scan_run_url"] = health.get("run_url")
                      report["quote_observed_at"] = health.get("quote_observed_at")
                      report["official_universe"] = health.get("all_market_universe_count")
                      report["observed_price_count"] = health.get("all_market_observed_price_count")
                      report["verified_fugle_bulk_execution_count"] = health.get("all_market_fresh_executed_count")
                      report["exchange_coverage"] = health.get("by_exchange")
                      report["trade_eligible"] = False
                  except json.JSONDecodeError:
                      error = "INVALID_HEALTH_JSON"
              if error:
                  report["health_error"] = error
              script, script_err = file_text("research/sky_full_universe_information.py")
              report["main_has_13col_header"] = bool(script and all(
                  s in script for s in ("股票代碼", "股票名稱", "即時價", "加碼價格", "停利價格")))
              if script_err:
                  report["format_check_error"] = script_err
              runs, run_err = api(f"repos/{os.environ['GH_REPO']}/actions/workflows/scan.yml/runs?per_page=5")
              if runs:
                  report["recent_scan_runs"] = [{
                      "id": r.get("id"), "event": r.get("event"),
                      "status": r.get("status"), "conclusion": r.get("conclusion"),
                      "created_at": r.get("created_at"), "html_url": r.get("html_url")
                  } for r in runs.get("workflow_runs", [])]
              if run_err:
                  report["runs_error"] = run_err
              report["status"] = "OBSERVATION_ONLY_NO_TRADE"
              if error or run_err or script_err:
                  report["status"] = "MONITOR_DATA_ERROR"
          target = Path("output/overnight_readiness/report.json")
          target.write_text(json.dumps(report, ensure_ascii=False, indent=2) + "\n")
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a") as out:
              out.write("## Sky 夜間準備度（唯讀）\n\n")
              out.write(f"檢查時間：{now.isoformat()}；狀態：{report['status']}\n\n")
              out.write(f"掃描 Run：{report.get('scan_run_id', '待確認')}；觀察價格：{report.get('observed_price_count', '待確認')}；13欄程式檢查：{report.get('main_has_13col_header', '待確認')}\n\n")
              out.write("不代表正式交易或手機 Cloud Run E2E 通過；不自動修改程式。\n")
          print(json.dumps(report, ensure_ascii=False))
          if report["status"] == "MONITOR_DATA_ERROR":
              raise SystemExit("Overnight monitoring source unavailable; evidence retained")
          PY
      - name: Retain diagnostic artifact even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-overnight-readiness-${{ github.run_id }}
          path: output/overnight_readiness/report.json
          retention-days: 7
          if-no-files-found: warn
