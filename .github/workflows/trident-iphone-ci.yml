name: TRIDENT Mobile Static Checks
on:
  push:
    branches: [feat/trident-iphone-workstation-20261107]
    paths:
      - 'trident-mobile/**'
      - '.github/workflows/trident-iphone-ci.yml'
  pull_request:
    paths:
      - 'trident-mobile/**'
      - '.github/workflows/trident-iphone-ci.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate document and JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          html=Path('trident-mobile/index.html').read_text(encoding='utf-8')
          assert '<html lang="zh-Hant">' in html
          assert '<meta name="viewport"' in html
          assert 'rel="manifest"' in html
          assert 'NO TRADE' in html
          assert '5000' in html
          assert '<script>' in html and '</script>' in html
          assert 'Nova API 密碼' in html
          manifest=json.loads(Path('trident-mobile/manifest.webmanifest').read_text(encoding='utf-8'))
          assert manifest['display']=='standalone'
          script=re.search(r'<script>(.*?)</script>',html,re.S)
          assert script
          Path('/tmp/trident-inline.js').write_text(script.group(1),encoding='utf-8')
          print('HTML / manifest static checks passed')
          PY
          node --check /tmp/trident-inline.js
          node trident-mobile/smoke-test.cjs
      - name: Behavioral smoke tests (risk and import rejection)
        run: node trident-mobile/test-mobile.cjs
      - name: Verify no automated orders or embedded credentials
        run: |
          ! grep -REni '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|api[_-]?secret[[:space:]]*[:=]|access[_-]?token[[:space:]]*[:=])' trident-mobile --exclude=README.md
      - name: Install headless mobile-browser test runtime
        if: success()
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: iPhone simulated browser end-to-end tests
        if: success()
        run: node trident-mobile/browser-e2e.cjs
      - name: Preserve browser screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trident-iphone-e2e-screenshot
          path: trident-iphone-e2e.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Build isolated GitHub Pages release package
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/trident-release/.github/workflows
          cp trident-mobile/index.html trident-mobile/manifest.webmanifest /tmp/trident-release/
          cp trident-mobile/standalone-pages.yml /tmp/trident-release/.github/workflows/pages.yml
          cp trident-mobile/standalone-README.md /tmp/trident-release/README.md
          grep -q "github.repository != 'cr8kj7k7j4-byte/sky-cloud-scanner'" /tmp/trident-release/.github/workflows/pages.yml
          test -s /tmp/trident-release/index.html
          test -s /tmp/trident-release/manifest.webmanifest
          cd /tmp/trident-release
          zip -q -r "${GITHUB_WORKSPACE}/trident-standalone-site.zip" .
          unzip -l "${GITHUB_WORKSPACE}/trident-standalone-site.zip" | grep -q '.github/workflows/pages.yml'
      - name: Upload isolated deploy package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: trident-standalone-site
          path: trident-standalone-site.zip
          if-no-files-found: error
          retention-days: 7
      - name: Package iPhone offline fallback
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: trident-iphone-offline-preview
          path: |
            trident-mobile/index.html
            trident-mobile/manifest.webmanifest
            trident-mobile/README.md
          if-no-files-found: error
          retention-days: 7
