name: Sky Research Visibility Contract Tests
on:
  pull_request:
    paths:
      - 'src/research_visibility.py'
      - 'src/sky_command_router.py'
      - 'src/main.py'
      - 'tests/test_research_visibility.py'
      - 'tests/test_sky_command_router.py'
      - '.github/workflows/research-visibility-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: PYTHONPATH=. python -m pytest -q tests/test_research_visibility.py tests/test_sky_command_router.py
