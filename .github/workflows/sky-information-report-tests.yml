name: Sky Information-First Report Contract Tests

on:
  pull_request:
    paths:
      - 'src/sky_information_report.py'
      - 'src/sky_command_router.py'
      - 'tests/test_sky_information_report.py'
      - '.github/workflows/sky-information-report-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  information-report-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install offline test dependencies
        run: python -m pip install pytest
      - name: Validate non-executable information report and routes
        run: python -m pytest -q tests/test_sky_information_report.py tests/test_sky_command_router.py
