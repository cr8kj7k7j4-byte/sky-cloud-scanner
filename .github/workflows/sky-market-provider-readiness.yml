name: Sky Market Provider Entitlement Preflight

on:
  workflow_dispatch:
  # PAUSED on 2026-11-10 by user request: formerly scheduled trigger.
  # schedule:
  # # Taiwan 09:20 and 10:30 (UTC+8), weekdays. GitHub runner can start late.
  # # Read-only permission/freshness evidence, NEVER a trade or full-market certification.
  # - cron: "20 1 * * 1-5"
  # - cron: "30 2 * * 1-5"
  push:
    branches: [main]
    paths:
      - "research/sky_provider_readiness.py"
      - "research/fugle_snapshot_coverage_audit.py"
      - "tests/test_fugle_snapshot_coverage_audit.py"
      - "tests/test_sky_provider_readiness.py"
      - ".github/workflows/sky-market-provider-readiness.yml"
  pull_request:
    paths:
      - "research/sky_provider_readiness.py"
      - "research/fugle_snapshot_coverage_audit.py"
      - "tests/test_fugle_snapshot_coverage_audit.py"
      - "tests/test_sky_provider_readiness.py"
      - ".github/workflows/sky-market-provider-readiness.yml"

permissions:
  contents: read

concurrency:
  group: sky-fugle-paid-global-research-v1-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}-${{ inputs.symbol || inputs.symbols || 'all' }}-${{ inputs.from_date || inputs.start_date || 'start' }}-${{ inputs.end_date || inputs.to_date || 'end' }}
  cancel-in-progress: false
jobs:
  sky_paid_reservation:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reserve paid API request safely
        id: reservation
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m research.sky_paid_fugle_api_guard --workflow-scope
      - name: Upload sanitized reservation before paid access
        if: steps.reservation.outputs.allowed == 'true'
        id: claim
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.reservation.outputs.claim_name }}
          path: output/fugle_api_guard/claim.json
          if-no-files-found: error
          retention-days: 2
      - name: Independent reservation readback, fail closed
        if: steps.reservation.outputs.allowed == 'true' && steps.claim.outcome == 'success'
        id: verify_claim
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m research.sky_paid_fugle_api_guard --workflow-scope --verify
      - name: Fail job when claim is rejected or not verified
        run: |
          test "${{ steps.reservation.outputs.allowed }}" = "true"
          test "${{ steps.claim.outcome }}" = "success"
          test "${{ steps.verify_claim.outcome }}" = "success"
  check-provider:
    needs: sky_paid_reservation
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tests and runtime
        run: pip install -r requirements.txt pytest
      - name: Preflight unit tests
        run: PYTHONPATH=. python -m pytest -q tests/test_sky_provider_readiness.py tests/test_realtime_market_contract.py tests/test_full_market_executed_quote_gate.py tests/test_fugle_snapshot_coverage_audit.py
      - name: Read-only market-provider entitlement probe
        if: github.event_name != 'pull_request'
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
        run: PYTHONPATH=. python -m research.sky_provider_readiness
      - name: Compare paid Fugle snapshot symbol membership against official universe
        if: github.event_name != 'pull_request'
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
        run: PYTHONPATH=. python -m research.fugle_snapshot_coverage_audit
      - name: Publish mobile-readable symbol coverage audit
        if: always() && github.event_name != 'pull_request'
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path("output/provider_readiness/fugle_snapshot_coverage.json")
          lines = ["## Fugle 上市／上櫃快照代號涵蓋率", "",
                   "**注意：代號涵蓋率不等於盤中有效成交價涵蓋率，也不是交易訊號。**", ""]
          if not path.is_file():
              lines += ["稽核資料：未產生（待確認），不能宣稱 PASS。", ""]
          else:
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
                  lines += [f"檢查時間：{data.get('checked_at_tpe','待確認')}",
                            f"代號涵蓋率門檻：{data.get('symbol_coverage_gate','待確認')}（不是即時成交價驗收）",
                            f"稽核狀態：{data.get('status','待確認')}", "",
                            "| 市場 | 官方母池 | 符合代號 | 代號涵蓋率 | 快照狀態 |",
                            "|---|---:|---:|---:|---|"]
                  for code, label in (("TSE", "上市"), ("OTC", "上櫃")):
                      row = data.get("markets", {}).get(code, {})
                      lines.append(f"| {label} | {row.get('expected','—')} | {row.get('matched','—')} | "
                                   f"{row.get('symbol_coverage_pct','—')}% | {row.get('status','待確認')} |")
              except (ValueError, TypeError):
                  lines += ["JSON 稽核資料無法解析，不能宣稱 PASS。"]
          lines += ["", "**正式交易閘門：維持 NO_TRADE；需另驗證逐檔成交時間與風控。**", ""]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("\n".join(lines) + "\n")
          print("Mobile Fugle coverage summary published")
          PY
      - name: Publish result summary
        if: always()
        run: |
          if [ -f output/provider_readiness/summary.md ]; then
            cat output/provider_readiness/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload sanitized evidence
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: sky-provider-readiness-${{ github.run_id }}
          path: output/provider_readiness
          if-no-files-found: warn
          retention-days: 30
