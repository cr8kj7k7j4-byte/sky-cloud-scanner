name: Sky Monthly Revenue History Export

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/export-monthly-revenue-history.yml'

permissions:
  contents: read

jobs:
  export:
    strategy:
      fail-fast: false
      matrix:
        include:
          - year: 2023
            market: TWSE
            end_month: 12
          - year: 2023
            market: TPEx
            end_month: 12
          - year: 2024
            market: TWSE
            end_month: 12
          - year: 2024
            market: TPEx
            end_month: 12
          - year: 2025
            market: TWSE
            end_month: 12
          - year: 2025
            market: TPEx
            end_month: 12
          - year: 2026
            market: TWSE
            end_month: 9
          - year: 2026
            market: TPEx
            end_month: 9
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas lxml html5lib beautifulsoup4

      - name: Export monthly revenue shard
        run: |
          python research/export_monthly_revenue_history.py             --year ${{ matrix.year }}             --market ${{ matrix.market }}             --end-month ${{ matrix.end_month }}             --out "revenue_shard_${{ matrix.year }}_${{ matrix.market }}"

      - name: Upload shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revenue-${{ matrix.year }}-${{ matrix.market }}
          path: revenue_shard_${{ matrix.year }}_${{ matrix.market }}
          if-no-files-found: warn
          retention-days: 14

# rerun-after-parser-fix
