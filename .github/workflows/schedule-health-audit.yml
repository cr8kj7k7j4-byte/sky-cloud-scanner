name: Sky Schedule Health Audit

on:
  pull_request:
    paths:
      - "research/schedule_health.py"
      - "tests/test_schedule_health.py"
      - "tests/test_full_market_cadence_audit.py"
      - "research/sky_w0_shared_blocker_audit.py"
      - "research/sky_w0_dedup_inventory.py"
      - "tests/test_sky_w0_dedup_inventory.py"
      - "tests/test_sky_w0_shared_blocker_audit.py"
      - ".github/workflows/schedule-health-audit.yml"
  workflow_dispatch:
  # PAUSED on 2026-11-10 by user request: formerly scheduled trigger.
  # schedule:
  # - cron: "15 18 * * 1-5"
  # timezone: "Asia/Taipei"
  # 
permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install YAML parser
        run: pip install "PyYAML>=6,<7"
      - name: Test audit failure handling
        run: python -m unittest discover -s tests -p test_schedule_health.py -v
      - name: Test five-minute full-market dispatcher and private snapshot audit
        run: python -m unittest discover -s tests -p test_full_market_cadence_audit.py -v
      - name: Read workflow status and scheduled runs
        run: python research/schedule_health.py
      - name: W0 shared market Paper and duplicate cadence acceptance (read-only)
        run: |
          python -m unittest discover -s tests -p test_sky_w0_shared_blocker_audit.py -v
          PYTHONPATH=. python -m research.sky_w0_shared_blocker_audit
      - name: W0 inventory every workflow and open PR without triggering paid scans
        run: |
          PYTHONPATH=. python -m unittest discover -s tests -p test_sky_w0_dedup_inventory.py -v
          PYTHONPATH=. python -m research.sky_w0_dedup_inventory
      - name: Upload schedule health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schedule-health-${{ github.run_id }}
          path: |
            output/schedule_health/
            output/w0_shared_blocker_audit/
            output/w0_repo_dedup/
          if-no-files-found: error
          retention-days: 90
