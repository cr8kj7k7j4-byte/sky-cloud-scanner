name: Sky P0-OPS Market Data Permission Preflight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/p0ops-provider-preflight.yml"
      - "research/p0ops_provider_capability.py"
      - "tests/test_p0ops_provider_capability.py"
  # PAUSED on 2026-11-10 by user request: formerly scheduled trigger.
  # schedule:
  # # 08:55 Asia/Taipei weekdays; permission probe only, NOT a live coverage certification.
  # - cron: "55 0 * * 1-5"
  # 
permissions:
  contents: read

concurrency:
  group: sky-fugle-paid-global-research-v1
  cancel-in-progress: false

jobs:
  sky_paid_reservation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reserve paid API request safely
        id: reservation
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m research.sky_paid_fugle_api_guard --workflow-scope
      - name: Upload sanitized reservation before paid access
        if: steps.reservation.outputs.allowed == 'true'
        id: claim
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.reservation.outputs.claim_name }}
          path: output/fugle_api_guard/claim.json
          if-no-files-found: error
          retention-days: 2
      - name: Independent reservation readback, fail closed
        if: steps.reservation.outputs.allowed == 'true' && steps.claim.outcome == 'success'
        id: verify_claim
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m research.sky_paid_fugle_api_guard --workflow-scope --verify
      - name: Fail job when claim is rejected or not verified
        run: |
          test "${{ steps.reservation.outputs.allowed }}" = "true"
          test "${{ steps.claim.outcome }}" = "success"
          test "${{ steps.verify_claim.outcome }}" = "success"
  probe:
    needs: sky_paid_reservation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate preflight classification
        run: python -m unittest discover -s tests -p test_p0ops_provider_capability.py -v
      - name: Check runner market data permissions and official universe
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
        run: python -m research.p0ops_provider_capability
      - name: Upload sanitized permissions report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0ops-provider-capability-${{ github.run_id }}
          path: output/p0ops/provider_capability.json
          if-no-files-found: error
          retention-days: 30
