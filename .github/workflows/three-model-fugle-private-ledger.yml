name: Three Model Fugle Historical Private Ledger (Research Only)
# Only workflow_dispatch authenticates existing GCP WIF; the separate
# scheduled launcher dispatches this workflow on main after W0 review.
on:
  workflow_dispatch:
    inputs:
      symbols:
        description: 'Comma-separated 4 or 5 digit research symbols; max 10'
        required: true
        default: '1101,8088'
      end_date:
        description: 'Latest completed historical date (YYYY-MM-DD; avoid today before 16:30 Taipei)'
        required: true
        default: '2026-11-06'
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: sky-fugle-paid-global-research-v1-history-three-model-${{ inputs.symbols || 'default' }}-${{ inputs.end_date || 'latest' }}
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline contracts before accessing paid API
        run: python -m pip install pytest && PYTHONPATH=. python -m pytest -q tests/test_three_model_evidence_gate.py tests/test_three_model_research_signals.py tests/test_three_model_fugle_pipeline.py
      - name: Verify credentials are configured without revealing values
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
          GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          SKY_RESEARCH_GCS_BUCKET: ${{ vars.SKY_RESEARCH_GCS_BUCKET }}
        run: |
          python - <<'PY'
          import os,sys
          names=("FUGLE_API_KEY","GCP_WIF_PROVIDER","GCP_SERVICE_ACCOUNT","SKY_RESEARCH_GCS_BUCKET")
          missing=[x for x in names if not os.getenv(x)]
          print("Private Fugle/GCS prerequisites:", "READY" if not missing else "MISSING_CONFIGURATION:"+",".join(missing))
          sys.exit(1 if missing else 0)
          PY
      - name: Authenticate GCP with Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: Install private GCS client
        run: python -m pip install google-cloud-storage
      - name: Reserve cross-workflow paid API slot
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          SKY_PAID_SCOPE: "sky:history:three-model:${{ inputs.symbols || '1101,8088' }}:${{ inputs.end_date || 'latest' }}"
        run: python -m research.sky_paid_fugle_api_guard --scope "$SKY_PAID_SCOPE"
      - name: Publish reservation before paid request
        id: claim
        if: steps.guard.outputs.allowed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.guard.outputs.claim_name }}
          path: output/fugle_api_guard/claim.json
          if-no-files-found: error
          retention-days: 2
      - name: Read back own paid API reservation
        id: verify_claim
        if: steps.guard.outputs.allowed == 'true' && steps.claim.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          SKY_PAID_SCOPE: "sky:history:three-model:${{ inputs.symbols || '1101,8088' }}:${{ inputs.end_date || 'latest' }}"
        run: python -m research.sky_paid_fugle_api_guard --scope "$SKY_PAID_SCOPE" --verify
      - name: Query actual paid Fugle candles and write create-only private ledger
        if: steps.guard.outputs.allowed == 'true' && steps.verify_claim.outcome == 'success'
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
          SKY_RESEARCH_GCS_BUCKET: ${{ vars.SKY_RESEARCH_GCS_BUCKET }}
          INPUT_SYMBOLS: ${{ inputs.symbols || '1101,8088' }}
          INPUT_END_DATE: ${{ inputs.end_date || '' }}
        shell: bash
        run: |
          if [ -z "$INPUT_END_DATE" ]; then
            INPUT_END_DATE="$(TZ=Asia/Taipei date +%F)"
          fi
          echo "Research request: 2-symbol bounded cohort; date=$INPUT_END_DATE; no orders"
          PYTHONPATH=. python -m research.three_model_fugle_pipeline --symbols "$INPUT_SYMBOLS" --end "$INPUT_END_DATE"
      - name: Publish sanitized research audit only
        if: always()
        shell: bash
        run: |
          if [ -f output/three_model_fugle_evidence_summary.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          r=json.loads(Path("output/three_model_fugle_evidence_summary.json").read_text())
          print("## Three-Model Fugle Historical Research Audit")
          print("Research audit status:", r.get("status","UNKNOWN"))
          print("Written/readback records:",r["saved_records"])
          print("Created objects:",sum(x["status"]=="CREATED" for x in r.get("storage_statuses",[])))
          print("Identical existing objects:",sum(x["status"]=="ALREADY_EXISTS_IDENTICAL" for x in r.get("storage_statuses",[])))
          print("Data-sufficiency notes:",r.get("coverage_gaps",[]))
          print("Historical only; trained AI: NO; production trades: NO; mobile deployment: NOT VERIFIED")
          PY
          fi
      - name: Upload sanitized audit, never raw paid market data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: three-model-fugle-sanitized-audit-${{ github.run_id }}
          path: output/three_model_fugle_evidence_summary.json
          retention-days: 30
          if-no-files-found: warn
