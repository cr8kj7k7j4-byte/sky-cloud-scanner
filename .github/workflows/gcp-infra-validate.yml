name: GCP Infrastructure Validate

on:
  pull_request:
    branches: [ main ]
    paths:
      - "infra/gcp/**"
      - ".github/workflows/gcp-infra-validate.yml"
  push:
    branches:
      - feature/gcp-cloud-run-job
    paths:
      - "infra/gcp/**"
      - ".github/workflows/gcp-infra-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
      - name: Terraform fmt
        run: terraform -chdir=infra/gcp fmt -check
      - name: Terraform init
        run: terraform -chdir=infra/gcp init -backend=false
      - name: Terraform validate
        run: terraform -chdir=infra/gcp validate
