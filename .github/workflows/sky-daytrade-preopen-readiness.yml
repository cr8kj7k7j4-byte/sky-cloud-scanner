name: Sky Fugle Daytrade Preopen Repeated Readiness

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sky-daytrade-preopen-readiness.yml'
  # PAUSED on 2026-11-10 by user request: formerly scheduled trigger.
  # schedule:
  # # Taipei UTC+8. Four independent pre-open checks on Taiwan weekdays.
  # # Does not claim schedule punctuality or trading-day completion.
  # - cron: '15,30,45,55 0 * * 1-5'
  # 
permissions:
  contents: read
  actions: read

concurrency:
  group: sky-fugle-paid-global-research-v1-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}-${{ inputs.symbol || inputs.symbols || 'all' }}-${{ inputs.from_date || inputs.start_date || 'start' }}-${{ inputs.end_date || inputs.to_date || 'end' }}
  cancel-in-progress: false

jobs:
  sky_paid_reservation:
    # Fail closed on repository merge and PR; explicit manual permission for paid research only.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reserve paid API request safely
        id: reservation
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m research.sky_paid_fugle_api_guard --workflow-scope
      - name: Upload sanitized reservation before paid access
        if: steps.reservation.outputs.allowed == 'true'
        id: claim
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.reservation.outputs.claim_name }}
          path: output/fugle_api_guard/claim.json
          if-no-files-found: error
          retention-days: 2
      - name: Independent reservation readback, fail closed
        if: steps.reservation.outputs.allowed == 'true' && steps.claim.outcome == 'success'
        id: verify_claim
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m research.sky_paid_fugle_api_guard --workflow-scope --verify
      - name: Fail job when claim is rejected or not verified
        run: |
          test "${{ steps.reservation.outputs.allowed }}" = "true"
          test "${{ steps.claim.outcome }}" = "success"
          test "${{ steps.verify_claim.outcome }}" = "success"
  preopen:
    needs: sky_paid_reservation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
      SKY_FUGLE_ONLY_MARKETDATA: "1"
      ALLOW_MIS_OTC_FALLBACK: "0"
      FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies and pytest
        run: |
          pip install -r requirements.txt
          pip install pytest
      - name: Test main-market quote and reporting contracts
        run: |
          python -m compileall -q src research
          pytest -q \
            tests/test_fugle_only_daytrade.py \
            tests/test_sky_13col_report.py \
            tests/test_sky_13col_artifact_integrity.py \
            tests/test_fugle_individual_execution_probe.py \
            tests/test_fugle_paid_otc_candidate_routing.py \
            tests/test_sky_daytrade_preopen_readiness.py
      - name: Verify trading calendar before paid calls
        id: calendar
        run: |
          set -euo pipefail
          python -m src.trading_calendar --out trading_calendar_status.json
          python - <<'PY'
          import json, os
          x = json.load(open('trading_calendar_status.json', encoding='utf-8'))
          # Preopen API diagnostics may run on a weekday fallback even when
          # the official calendar is unavailable. This NEVER authorizes trades.
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write('should_check=' + ('true' if x.get('should_scan') is True else 'false') + '\n')
          PY
      - name: Probe paid Fugle all-market and individual permissions (up to 3 tries)
        if: steps.calendar.outputs.should_check == 'true'
        run: |
          set -euo pipefail
          ok=0
          for attempt in 1 2 3; do
            echo "Fugle preopen attempt $attempt/3" | tee -a preopen_retry_attempts.log
            if python -m src.diagnose_sources > source-diagnostics.json &&
               python -m research.sky_daytrade_preopen_readiness \
                 --diagnostics source-diagnostics.json \
                 --output preopen_readiness.json; then
              ok=1
              echo "attempt $attempt: PASS" >> preopen_retry_attempts.log
              break
            fi
            echo "attempt $attempt: FAILED" >> preopen_retry_attempts.log
            if [ "$attempt" -lt 3 ]; then sleep 10; fi
          done
          test "$ok" -eq 1
      - name: Verify last completed scanner Artifact contains every stock and 13 columns
        if: steps.calendar.outputs.should_check == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LAST_RUN=""
          for attempt in 1 2 3; do
            LAST_RUN="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/scan.yml/runs?per_page=20" \
              --jq '[.workflow_runs[] | select(.status == "completed")][0].id // empty')" && test -n "$LAST_RUN" && break
            echo "find scanner run attempt $attempt/3 FAILED" >> preopen_retry_attempts.log
            if [ "$attempt" -lt 3 ]; then sleep 10; fi
          done
          test -n "$LAST_RUN"
          ok=0
          for attempt in 1 2 3; do
            rm -rf previous-scan
            mkdir -p previous-scan
            if gh run download "$LAST_RUN" --repo "$GITHUB_REPOSITORY" \
              --name "sky-scan-$LAST_RUN" --dir previous-scan; then
              ok=1
              echo "Artifact download attempt $attempt: PASS" >> preopen_retry_attempts.log
              break
            fi
            echo "Artifact download attempt $attempt: FAILED" >> preopen_retry_attempts.log
            if [ "$attempt" -lt 3 ]; then sleep 10; fi
          done
          test "$ok" -eq 1
          python -m research.verify_13col_artifact \
            --source previous-scan/output/sky_quickscan_information/full_universe.json \
            --json previous-scan/output/sky_quickscan_information/latest_13col.json \
            --markdown previous-scan/output/sky_quickscan_information/latest_13col.md
          echo "最近已完成掃描 Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/$LAST_RUN" >> "$GITHUB_STEP_SUMMARY"
          echo "歷史掃描完整性通過不代表明日即時成交已驗證。" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish source and evidence summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          output = Path(os.environ['GITHUB_STEP_SUMMARY'])
          with output.open('a', encoding='utf-8') as f:
              f.write('# Sky 當沖盤前重複檢查\n\n')
              f.write('GitHub runner UTC: ' + datetime.now(timezone.utc).isoformat() + '\n\n')
              f.write('時段：台灣 08:15／08:30／08:45／08:55（週一至週五，須通過交易日曆）。\n\n')
              p=Path('preopen_readiness.json')
              if p.exists():
                  d=json.loads(p.read_text(encoding='utf-8'))
                  f.write('富果付費 API: **' + d['api_readiness'] + '**；盤前成交即時性：**' +
                          d['execution_freshness'] + '**；正式交易資格：**否**。\n')
                  for name,passed in d['provider_and_permission_checks'].items():
                      f.write('- ' + name + ': ' + ('PASS' if passed else 'BLOCKED') + '\n')
              else:
                  f.write('本次無有效富果盤前檢查結果；請查看交易日曆與 API 日誌。\n')
          PY
      - name: Upload preopen audit (even when blocked)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-daytrade-preopen-${{ github.run_id }}
          path: |
            preopen_readiness.json
            source-diagnostics.json
            trading_calendar_status.json
            preopen_retry_attempts.log
          if-no-files-found: warn
          retention-days: 14
