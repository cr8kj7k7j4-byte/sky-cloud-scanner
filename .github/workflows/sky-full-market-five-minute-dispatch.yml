name: Sky Paid Full Market Research Dispatcher Every 5 Minutes
on:
  workflow_dispatch:
  # PAUSED on 2026-11-10 by user request: formerly scheduled trigger.
  # schedule:
  # - cron: '*/5 1 * * 1-5'
  # - cron: '*/5 2-4 * * 1-5'
  # - cron: '0-30/5 5 * * 1-5'
permissions:
  contents: read
  actions: write
concurrency:
  group: sky-paid-fullmarket-research-dispatch
  cancel-in-progress: false
jobs:
  dispatch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require official TWSE open session and local clock
        id: market
        run: |
          python -m pip install requests
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime
          import sys
          from zoneinfo import ZoneInfo
          from src.trading_calendar import check_trading_day
          now=datetime.datetime.now(ZoneInfo("Asia/Taipei"))
          s=check_trading_day(now.date())
          inside=(9*60 <= now.hour*60+now.minute <= 13*60+30)
          allowed=(s["source_status"]=="PASS" and s["should_scan"] is True and inside)
          print("allowed=" + ("true" if allowed else "false"))
          print("Market readiness:",s["status"],now.isoformat(),file=sys.stderr)
          PY
      - name: Dispatch private GCS research snapshot only
        if: steps.market.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh workflow run sky-full-market-private.yml --repo "$GH_REPO" --ref main
          echo "Dispatched private research. Never implies verified executable market quotes."
