name: Sky TSE OTC Selected Quote Viewer
on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "1–20 comma-separated codes e.g. 2330,6488"
        required: true
        default: "2330,6488"
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: sky-fugle-paid-global-research-v1-quote-${{ inputs.symbols || 'default' }}
  cancel-in-progress: false
jobs:
  atomic_quote_claim:
    # Isolate the only Git ref write to this preflight job. No Fugle secret.
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Atomically claim all selected endpoints before paid job (NO FUGLE)
        env:
          GH_TOKEN: ${{ github.token }}
          SKY_SELECTED_SYMBOLS: ${{ inputs.symbols }}
        run: python -m research.sky_fugle_selected_quote_atomic_claim
      - name: Upload per-endpoint atomic receipt before paid job
        uses: actions/upload-artifact@v4
        with:
          name: sky-selected-atomic-${{ github.run_id }}
          path: output/fugle_api_guard/selected_quote_atomic.json
          if-no-files-found: error
          retention-days: 14

  quote:
    needs: atomic_quote_claim
    if: needs.atomic_quote_claim.result == 'success'
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and unit test
        run: |
          pip install -r requirements.txt
          python -m unittest tests.test_sky_market_quote_view -v
      - name: Download exact atomic claim receipt from privileged preflight
        uses: actions/download-artifact@v4
        with:
          name: sky-selected-atomic-${{ github.run_id }}
          path: output/fugle_api_guard/
      - name: Verify same SHA, current 5m slot, and all selected endpoint claims
        env:
          SKY_SELECTED_SYMBOLS: ${{ inputs.symbols }}
        run: python -m research.sky_fugle_selected_quote_atomic_claim --verify
      - name: Reserve cross-workflow paid API slot
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          SKY_PAID_SCOPE: "sky:quote:${{ inputs.symbols || '2330,6488' }}"
        run: python -m research.sky_paid_fugle_api_guard --scope "$SKY_PAID_SCOPE"
      - name: Publish reservation before paid request
        id: claim
        if: steps.guard.outputs.allowed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.guard.outputs.claim_name }}
          path: output/fugle_api_guard/claim.json
          if-no-files-found: error
          retention-days: 2
      - name: Read back own paid API reservation
        id: verify_claim
        if: steps.guard.outputs.allowed == 'true' && steps.claim.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          SKY_PAID_SCOPE: "sky:quote:${{ inputs.symbols || '2330,6488' }}"
        run: python -m research.sky_paid_fugle_api_guard --scope "$SKY_PAID_SCOPE" --verify
      - name: Retrieve selected executed trade quotes (no orders)
        if: steps.guard.outputs.allowed == 'true' && steps.verify_claim.outcome == 'success'
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
          INPUT_SYMBOLS: ${{ inputs.symbols }}
        run: python -m src.sky_market_quote_view --symbols "$INPUT_SYMBOLS"
      - name: Upload evidence even if quotes unavailable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-selected-quotes-${{ github.run_id }}
          path: output/market_quote_view/
          if-no-files-found: warn
          retention-days: 30
