name: Sky TSE OTC Selected Quote Viewer
on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "1–20 comma-separated codes e.g. 2330,6488"
        required: true
        default: "2330,6488"
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: sky-fugle-paid-global-research-v1
  cancel-in-progress: false
jobs:
  quote:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and unit test
        run: |
          pip install -r requirements.txt
          python -m unittest tests.test_sky_market_quote_view -v
      - name: Reserve cross-workflow paid API slot
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          SKY_PAID_SCOPE: "sky:quote:selected:${{ inputs.symbols || '2330,6488' }}"
        run: python -m research.sky_paid_fugle_api_guard --scope "$SKY_PAID_SCOPE"
      - name: Publish reservation before paid request
        id: claim
        if: steps.guard.outputs.allowed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.guard.outputs.claim_name }}
          path: output/fugle_api_guard/claim.json
          if-no-files-found: error
          retention-days: 2
      - name: Read back own paid API reservation
        id: verify_claim
        if: steps.guard.outputs.allowed == 'true' && steps.claim.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          SKY_PAID_SCOPE: "sky:quote:selected:${{ inputs.symbols || '2330,6488' }}"
        run: python -m research.sky_paid_fugle_api_guard --scope "$SKY_PAID_SCOPE" --verify
      - name: Retrieve selected executed trade quotes (no orders)
        if: steps.guard.outputs.allowed == 'true' && steps.verify_claim.outcome == 'success'
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
          INPUT_SYMBOLS: ${{ inputs.symbols }}
        run: python -m src.sky_market_quote_view --symbols "$INPUT_SYMBOLS"
      - name: Upload evidence even if quotes unavailable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-selected-quotes-${{ github.run_id }}
          path: output/market_quote_view/
          if-no-files-found: warn
          retention-days: 30
