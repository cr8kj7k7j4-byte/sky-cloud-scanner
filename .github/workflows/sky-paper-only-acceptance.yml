name: Sky PAPER_ONLY Research Acceptance (NO_LIVE_TRADING)
on:
  pull_request:
    paths:
      - "research/sky_paper_only_acceptance.py"
      - "research/sky_w0_shared_blocker_audit.py"
      - "tests/test_sky_w0_shared_blocker_audit.py"
      - "tests/test_sky_paper_only_acceptance.py"
      - "research/sky_paper_trade_trace.py"
      - "research/sky_p0r_paper_ledger_readback.py"
      - "tests/test_sky_p0r_paper_ledger_readback.py"
      - "research/sky_brokerless_contract_audit.py"
      - "tests/test_sky_brokerless_contract_audit.py"
      - "research/sky_candidate_e2e_chain.py"
      - "src/sky_chat_bridge.py"
      - "docs/SKY_NO_BROKER_ACCOUNT_RESEARCH_POLICY_V1.md"
      - "tests/test_sky_paper_trade_trace.py"
      - ".github/workflows/sky-paper-only-acceptance.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paper-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install import dependencies for read-only scanner contract tests
        run: python -m pip install requests
      - name: Paper-only risk and provenance regression tests
        run: python -m unittest discover -s tests -p test_sky_paper_only_acceptance.py -v
      - name: Trace hypothetical paper entries and fail missing cost evidence
        run: python -m unittest discover -s tests -p test_sky_paper_trade_trace.py -v
      - name: Validate real paper-ledger readback contract without inventing events
        run: python -m unittest discover -s tests -p test_sky_p0r_paper_ledger_readback.py -v
      - name: Read back existing simulator evidence or produce explicit HOLD
        run: python -m research.sky_p0r_paper_ledger_readback
      - name: Enforce broker-free research contracts across commands and stages
        run: python -m unittest discover -s tests -p test_sky_brokerless_contract_audit.py -v
      - name: Inventory all tracked models commands rules and workflows
        run: python -m research.sky_brokerless_contract_audit
      - name: Test unified W0 market Paper and overlapping schedule audit
        run: python -m unittest discover -s tests -p test_sky_w0_shared_blocker_audit.py -v
      - name: Read current GitHub scheduled evidence without paid provider requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m research.sky_w0_shared_blocker_audit
      - name: Read actual latest scan metadata and publish honest HOLD verdict
        run: python -m research.sky_paper_only_acceptance
      - name: Upload paper research acceptance audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-paper-only-acceptance-${{ github.run_id }}
          path: |
            output/sky_paper_only_acceptance/
            output/sky_p0r_paper_ledger_readback/
            output/sky_brokerless_contract/
            output/w0_shared_blocker_audit/
          if-no-files-found: error
          retention-days: 30
