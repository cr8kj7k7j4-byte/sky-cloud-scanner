name: Sky PAPER_ONLY Research Acceptance (NO_LIVE_TRADING)
on:
  pull_request:
    paths:
      - "research/sky_paper_only_acceptance.py"
      - "research/sky_w0_shared_blocker_audit.py"
      - "tests/test_sky_w0_shared_blocker_audit.py"
      - "tests/test_sky_paper_only_acceptance.py"
      - "research/sky_paper_trade_trace.py"
      - "research/sky_p0r_paper_ledger_readback.py"
      - "research/sky_p0r_paper_event_replay.py"
      - "research/sky_p0r_order_gate.py"
      - "research/sky_p0r_market_event_producer.py"
      - "research/sky_p0r_512_source_adapter.py"
      - "research/sky_p0r_signal_bridge.py"
      - "research/sky_p0r_external_signal_source.py"
      - "tests/test_sky_p0r_external_signal_source.py"
      - "tests/test_sky_p0r_signal_bridge.py"
      - "tests/test_sky_p0r_512_source_adapter.py"
      - "tests/test_sky_p0r_market_event_producer.py"
      - "tests/test_sky_p0r_paper_event_replay.py"
      - "tests/test_sky_p0r_paper_ledger_readback.py"
      - "research/sky_brokerless_contract_audit.py"
      - "tests/test_sky_brokerless_contract_audit.py"
      - "research/sky_candidate_e2e_chain.py"
      - "src/sky_chat_bridge.py"
      - "docs/SKY_NO_BROKER_ACCOUNT_RESEARCH_POLICY_V1.md"
      - "tests/test_sky_paper_trade_trace.py"
      - ".github/workflows/sky-paper-only-acceptance.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  paper-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install import dependencies for read-only scanner contract tests
        run: python -m pip install requests
      - name: Paper-only risk and provenance regression tests
        run: python -m unittest discover -s tests -p test_sky_paper_only_acceptance.py -v
      - name: Trace hypothetical paper entries and fail missing cost evidence
        run: python -m unittest discover -s tests -p test_sky_paper_trade_trace.py -v
      - name: Validate real paper-ledger readback contract without inventing events
        run: python -m unittest discover -s tests -p test_sky_p0r_paper_ledger_readback.py -v
      - name: Validate event-to-ledger simulation without inventing fills
        run: python -m unittest discover -s tests -p test_sky_p0r_paper_event_replay.py -v
      - name: Test completed market bars to paper events to ledger
        run: python -m unittest discover -s tests -p test_sky_p0r_market_event_producer.py -v
      - name: Test independently verified source bars without manufacturing signals
        run: python -m unittest tests.test_sky_p0r_512_source_adapter -v
      - name: Read GitHub-verified #512 completed bars (historical pin or future run)
        # No precommitted signal => zero valid paper events. Avoid exhausted
        # GitHub installation API and retain explicit downstream HOLD.
        if: ${{ vars.SKY_P0R_SIGNAL_RUN_ID != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SKY_P0R_BAR_RUN_ID: ${{ vars.SKY_P0R_BAR_RUN_ID }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess

          repo = os.environ["GITHUB_REPOSITORY"]
          pinned = "42950211804"
          pinned_sha = "b9e2f57b02b6c22b0f45d3fb7ae21e2a1cca0ac0"
          pinned_artifact_id = "13824108931"
          chosen = os.environ.get("SKY_P0R_BAR_RUN_ID", "").strip() or pinned
          if not chosen.isdigit():
              raise SystemExit("INVALID_BAR_RUN_ID")
          class InstallationRateLimit(Exception):
              pass
          def api(endpoint):
              import time
              for attempt in range(3):
                  result = subprocess.run(["gh", "api", endpoint],
                                          capture_output=True,
                                          text=True, timeout=30)
                  if result.returncode == 0:
                      return json.loads(result.stdout)
                  details = (result.stderr or "").strip().replace(
                      os.environ.get("GH_TOKEN", "__NO_TOKEN__"), "[redacted]")
                  if "API rate limit exceeded for installation" in details:
                      # Do not hammer an exhausted installation token.
                      raise InstallationRateLimit from None
                  print(f"GitHub readback attempt {attempt + 1}/3 failed "
                        f"(exit {result.returncode}): {details[:500]}", flush=True)
                  if attempt != 2:
                      time.sleep(attempt + 1)
              raise SystemExit("GITHUB_BAR_PROVENANCE_API_UNAVAILABLE")

          try:
              baseline = api(f"repos/{repo}/actions/runs/{pinned}")
              run = api(f"repos/{repo}/actions/runs/{chosen}")
              artifacts = api(f"repos/{repo}/actions/runs/{chosen}/artifacts").get("artifacts", [])
          except InstallationRateLimit:
              folder = Path("output/sky_p0r_paper_ledger_readback")
              folder.mkdir(parents=True, exist_ok=True)
              (folder / "market_bar_source_error.json").write_text(
                  json.dumps({
                      "schema": "SKY_P0R_GITHUB_SOURCE_ERROR_V1",
                      "verdict": "INSUFFICIENT_DATA",
                      "reason": "GITHUB_INSTALLATION_RATE_LIMIT",
                      "bar_run_id": chosen,
                      "source_artifact_verified": False,
                      "paper_fill_count": 0,
                      "production_eligible": False,
                      "automatic_order": False
                  }, indent=2), encoding="utf-8")
              print("::warning title=GitHub provider source HOLD::"
                    "Installation API rate limit (HTTP 403); no bars admitted, no simulated fills")
              raise SystemExit(0)
          if (str(run.get("id")) != chosen
                  or run.get("repository", {}).get("full_name") != repo
                  or run.get("status") != "completed"
                  or run.get("conclusion") != "success"
                  or run.get("workflow_id") != baseline.get("workflow_id")
                  or not isinstance(run.get("head_sha"), str)
                  or len(run["head_sha"]) != 40):
              raise SystemExit("UNTRUSTED_FUTURE_BAR_WORKFLOW_RUN")
          name = f"sky-512-5m-evidence-{chosen}"
          matches = [a for a in artifacts if a.get("name") == name
                     and a.get("expired") is False
                     and str(a.get("workflow_run", {}).get("id")) == chosen]
          if len(matches) != 1:
              raise SystemExit("BAR_ARTIFACT_NOT_UNIQUE_OR_MISSING")
          artifact = matches[0]
          if chosen == pinned and (
                  run.get("head_sha") != pinned_sha
                  or str(artifact.get("id")) != pinned_artifact_id):
              raise SystemExit("HISTORICAL_BAR_PIN_MISMATCH")
          path = Path("/tmp/sky-512-pr508-source")
          path.mkdir(parents=True, exist_ok=True)
          subprocess.run(["gh", "run", "download", chosen, "--repo", repo,
                          "--name", name, "--dir", str(path)],
                         check=True, timeout=60)
          src = path / "v14_ticker_5m_evidence.json"
          if not src.is_file():
              raise SystemExit("BAR_EVIDENCE_MISSING")
          command = ["python", "-m", "research.sky_p0r_512_source_adapter",
                     "--input", str(src),
                     "--run-id", chosen,
                     "--head-sha", run["head_sha"],
                     "--artifact-id", str(artifact["id"]),
                     "--output", "output/sky_p0r_paper_ledger_readback/verified_512_completed_bars.json"]
          if chosen != pinned:
              # Generated only after independent GitHub API readback.
              proof = {"github_run_verified": True, "successful_completed_run": True,
                       "unique_artifact_verified": True,
                       "source_workflow_matches_accepted": True,
                       "production_eligible": False,
                       "run_id": chosen, "head_sha": run["head_sha"],
                       "artifact_id": str(artifact["id"]),
                       "github_artifact_created_at": artifact.get("created_at")}
              out = Path("output/sky_p0r_paper_ledger_readback/future_bar_github_receipt.json")
              out.parent.mkdir(parents=True, exist_ok=True)
              out.write_text(json.dumps(proof, indent=2), encoding="utf-8")
              command.extend(["--verified-future-source", str(out)])
          subprocess.run(command, check=True, timeout=40)
          PY
      - name: Validate precommitted signal versus accepted market candles (no manufactured fills)
        run: python -m unittest tests.test_sky_p0r_signal_bridge -v
      - name: Verify GitHub precommitted signal artifact provenance (no fabricated receipts)
        run: python -m unittest tests.test_sky_p0r_external_signal_source -v
      - name: Import an independently verified paper signal or record explicit HOLD
        env:
          GH_TOKEN: ${{ github.token }}
          SKY_P0R_SIGNAL_RUN_ID: ${{ vars.SKY_P0R_SIGNAL_RUN_ID }}
        run: python -m research.sky_p0r_external_signal_source
      - name: Generate paper-only events only when completed market evidence exists
        run: python -m research.sky_p0r_market_event_producer
      - name: Replay real simulator events if available, otherwise explicit HOLD
        run: python -m research.sky_p0r_paper_event_replay
      - name: Read back existing simulator evidence or produce explicit HOLD
        run: python -m research.sky_p0r_paper_ledger_readback
      - name: Enforce broker-free research contracts across commands and stages
        run: python -m unittest discover -s tests -p test_sky_brokerless_contract_audit.py -v
      - name: Inventory all tracked models commands rules and workflows
        run: python -m research.sky_brokerless_contract_audit
      - name: Test unified W0 market Paper and overlapping schedule audit
        run: python -m unittest discover -s tests -p test_sky_w0_shared_blocker_audit.py -v
      - name: Read current GitHub scheduled evidence without paid provider requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m research.sky_w0_shared_blocker_audit
      - name: Read actual latest scan metadata and publish honest HOLD verdict
        run: python -m research.sky_paper_only_acceptance
      - name: Distinguish green engineering tests from PAPER_ONLY E2E acceptance
        if: always()
        env:
          SKY_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          output = Path("output/sky_p0r_paper_ledger_readback")
          output.mkdir(parents=True, exist_ok=True)
          def read(name):
              try:
                  value = json.loads(Path(name).read_text(encoding="utf-8"))
                  return value if isinstance(value, dict) else {}
              except (OSError, ValueError):
                  return {}

          signal = read(output / "external_signal_source_status.json")
          bar_failure = read(output / "market_bar_source_error.json")
          ledger = read(output / "latest.json")
          paper = read("output/sky_paper_only_acceptance/latest.json")
          accepted = (
              signal.get("reconciled") is True
              and ledger.get("reconciled") is True
              and ledger.get("paper_cost_arithmetic_reconciled") is True
              and ledger.get("paper_fill_count", 0) > 0
              and paper.get("paper_after_cost_performance_verified") is True
          )
          result = {
              "schema": "SKY_P0R_EXPLICIT_E2E_GATE_V1",
              "head_sha": os.getenv("SKY_PR_HEAD_SHA"),
              "workflow_run_id": os.getenv("GITHUB_RUN_ID"),
              "engineering_tests_are_not_e2e_acceptance": True,
              "paper_e2e_verdict": "PASS_RESEARCH_ONLY" if accepted else "INSUFFICIENT_DATA",
              "signal_reason": signal.get("reason"),
              "bar_source_reason": bar_failure.get("reason"),
              "signal_verdict": signal.get("verdict"),
              "ledger_verdict": ledger.get("verdict"),
              "paper_performance_verdict": paper.get("paper_performance_verdict"),
              "paper_fill_count": ledger.get("paper_fill_count"),
              "production_eligible": False,
              "automatic_order": False,
              "trade_action": "禁止交易",
          }
          (output / "explicit_e2e_gate.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          summary = (
              "### P0-R PAPER_ONLY validation (research only)\n"
              f"- E2E gate: **{result['paper_e2e_verdict']}**\n"
              f"- Signal: {result['signal_verdict']} / {result['signal_reason']}\n"
              f"- Ledger: {result['ledger_verdict']}, fills: {result['paper_fill_count']}\n"
              "- Green CI tests alone **do not** close #508 or enable Production.\n"
              "- Trading remains disabled.\n"
          )
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as file:
              file.write(summary)
          if not accepted:
              print("::warning title=PAPER_ONLY E2E HOLD::Research CI may be green, but actual paper trade ledger/cost acceptance is incomplete")
          PY
      - name: Upload paper research acceptance audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-paper-only-acceptance-${{ github.run_id }}
          path: |
            output/sky_paper_only_acceptance/
            output/sky_p0r_paper_ledger_readback/
            output/sky_brokerless_contract/
            output/w0_shared_blocker_audit/
          if-no-files-found: error
          retention-days: 30
