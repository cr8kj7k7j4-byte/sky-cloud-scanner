name: W2 Five Minute Recovery Health (Research Only)
# UTC Nov 8-9 window covers 2026-11-08 10:38 ~ 2026-11-09 10:38 TPE.
# No Production writes, API secrets, paid Fugle calls, GCS or auto-reruns.
# GitHub schedule can be delayed; approval/merge to main required to activate.
on:
  pull_request:
    paths:
      - '.github/workflows/w2-rapid-recovery-monitor.yml'
      - 'research/w2_rapid_recovery_monitor.py'
      - 'tests/test_w2_rapid_recovery_monitor.py'
  workflow_dispatch:
  schedule:
    # UTC Nov 8 02:40-23:55, Nov 9 00:00-02:35 (TPE deadline 10:38).
    - cron: '*/5 2-23 8 11 *'
    - cron: '*/5 0-1 9 11 *'
    - cron: '0-35/5 2 9 11 *'
permissions:
  contents: read
concurrency:
  group: w2-rapid-recovery-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pure deterministic no-network recovery contracts
        run: |
          python -m pip install pytest
          PYTHONPATH=. python -m pytest -q tests/test_w2_rapid_recovery_monitor.py

  monitor:
    needs: offline-contract
    # PRs cannot write issues or call GitHub monitoring with elevated identity.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read W2 PR Actions and update W2 issue idempotently
        run: PYTHONPATH=. python -m research.w2_rapid_recovery_monitor
