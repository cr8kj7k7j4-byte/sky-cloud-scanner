name: Sky GCS CAS Two-Runner Research Acceptance (NO FUGLE)
on:
  # A single explicit research request is required. No cron or paid scan trigger.
  push:
    branches: [research/w0-repair-progress-existing-watchdog-20261110]
    paths:
      - 'research/sky_paid_api_gcs_cas_probe_request.json'
permissions:
  contents: read
  id-token: write
concurrency:
  group: sky-gcs-cas-two-runner-research-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contender:
    name: GCS contender ${{ matrix.slot }} (independent runner)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        slot: [A, B]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check existing GCS research credentials (no values logged)
        env:
          GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          SKY_RESEARCH_GCS_BUCKET: ${{ vars.SKY_RESEARCH_GCS_BUCKET }}
        shell: bash
        run: |
          set -euo pipefail
          for KEY in GCP_WIF_PROVIDER GCP_SERVICE_ACCOUNT SKY_RESEARCH_GCS_BUCKET; do
            if [ -z "${!KEY:-}" ]; then
              echo "RESEARCH_GCS_EXISTING_CONFIGURATION_MISSING:$KEY"
              exit 1
            fi
          done
      - name: Authenticate existing Google Cloud research identity
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: Install GCS client only (NO FUGLE)
        run: python -m pip install 'google-cloud-storage>=2.18.0'
      - name: Compete for one remote generation-CAS synthetic request
        env:
          SKY_RESEARCH_GCS_BUCKET: ${{ vars.SKY_RESEARCH_GCS_BUCKET }}
          CAS_SLOT: ${{ matrix.slot }}
        run: python -m research.sky_paid_api_gcs_probe --mode contender --slot "$CAS_SLOT"
      - name: Upload contender evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-gcs-cas-research-${{ github.run_id }}-${{ matrix.slot }}
          path: output/gcs_paid_api_cas_acceptance/
          if-no-files-found: warn
          retention-days: 14

  verify:
    name: Verify two independent runner receipts and remote READY bytes
    needs: [contender]
    if: ${{ needs.contender.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Authenticate existing Google Cloud research identity
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: Install GCS client only (NO FUGLE)
        run: python -m pip install 'google-cloud-storage>=2.18.0'
      - name: Read both independent runner receipts and validate durable result hash
        env:
          SKY_RESEARCH_GCS_BUCKET: ${{ vars.SKY_RESEARCH_GCS_BUCKET }}
        run: python -m research.sky_paid_api_gcs_probe --mode verify
      - name: Upload fail-closed cross-runner acceptance receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-gcs-cas-two-runner-verification-${{ github.run_id }}
          path: output/gcs_paid_api_cas_acceptance/
          if-no-files-found: warn
          retention-days: 14
