name: Sky Swing Live Whole-Market Scan

on:
  push:
    branches: [main]
    paths:
      - "scan_requests/swing5d/**"
  # Authorized ChatGPT GitHub issue-comment request; no new Workflow or paid endpoint.
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      mode:
        description: "swing = 波段快掃；swing5d = Swing 5D 快掃"
        required: true
        default: "swing5d"
        type: choice
        options:
          - swing5d
          - swing
      top_n:
        description: "Broad-market candidate output count"
        required: true
        default: "20"
      deep_n:
        description: "Fugle single-stock verification count"
        required: true
        default: "8"

permissions:
  contents: write
  actions: read

concurrency:
  # Same paid whole-market lane as canonical scan.yml and sky-chat-bridge.yml.
  group: sky-fugle-paid-global-research-v1-live-wholemarket
  cancel-in-progress: false

jobs:
  scan:
    env:
      GH_TOKEN: ${{ github.token }}
      SKY_PAID_ATOMIC_ENFORCE: "1"
    # A cleanup push that only deletes consumed request files must never launch
    # another whole-market scan. Manual workflow_dispatch remains available.
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 363 &&
       github.event.comment.user.login == github.repository_owner &&
       github.event.comment.author_association == 'OWNER' &&
       (github.event.comment.body == 'Sky Swing 5D 快掃' ||
       (github.event.comment.body == 'Sky 波段現在掃一次' || github.event.comment.body == 'Sky 波段快掃'))) ||
      (github.event_name == 'push' &&
       (contains(toJSON(github.event.commits.*.added), 'scan_requests/swing5d/') ||
        contains(toJSON(github.event.commits.*.modified), 'scan_requests/swing5d/')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Test MIS coverage recovery
        run: python -m pytest -q tests/test_official_mis_coverage.py tests/test_swing5d_publish_status.py tests/test_sky_command_router.py tests/test_swing_live_scanner.py tests/test_swing_two_track_acceptance.py
      - name: Reserve shared paid Fugle slot before any paid request
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m research.sky_paid_fugle_api_guard --scope 'sky:live:wholemarket'
      - name: Publish shared reservation evidence
        id: claim
        if: steps.guard.outputs.allowed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.guard.outputs.claim_name }}
          path: output/fugle_api_guard/claim.json
          if-no-files-found: error
          retention-days: 2
      - name: Verify own paid reservation independently before scanning
        id: verify_claim
        if: steps.guard.outputs.allowed == 'true' && steps.claim.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m research.sky_paid_fugle_api_guard --scope 'sky:live:wholemarket' --verify
      - name: Run whole-market live swing scan
        id: scan
        if: steps.guard.outputs.allowed == 'true' && steps.verify_claim.outcome == 'success'
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          MAX_PRICE: "100"
          MIN_VOLUME: "500"
          MIN_TRADE_VALUE: "10000000"
          SCAN_MODE: ${{ github.event_name == 'push' && 'swing5d' || (github.event_name == 'issue_comment' && (github.event.comment.body == 'Sky 波段現在掃一次' || github.event.comment.body == 'Sky 波段快掃') && 'swing') || (github.event_name == 'issue_comment' && github.event.comment.body == 'Sky Swing 5D 快掃' && 'swing5d') || inputs.mode || 'swing5d' }}
          TOP_N: ${{ inputs.top_n || '20' }}
          DEEP_N: ${{ inputs.deep_n || '8' }}
        run: |
          python -m src.swing_live_scanner \
            --mode "$SCAN_MODE" \
            --top-n "$TOP_N" \
            --deep-n "$DEEP_N"
      - name: Verify scan output and publish summary
        if: steps.guard.outputs.allowed == 'true' && steps.verify_claim.outcome == 'success' && success()
        env:
          SCAN_MODE: ${{ github.event_name == 'push' && 'swing5d' || (github.event_name == 'issue_comment' && (github.event.comment.body == 'Sky 波段現在掃一次' || github.event.comment.body == 'Sky 波段快掃') && 'swing') || (github.event_name == 'issue_comment' && github.event.comment.body == 'Sky Swing 5D 快掃' && 'swing5d') || inputs.mode || 'swing5d' }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          mode = os.environ['SCAN_MODE']
          p = Path(f'output/swing_live/latest_{mode}.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          print('SCAN_RUN_ID:', os.environ['GITHUB_RUN_ID'])
          print('SCAN_GENERATED_AT:', data.get('generated_at'))
          print('FULL_MARKET_OPERATIONAL:', data.get('operational_full_market_scan'))
          print('QUOTE_COVERAGE_PCT:', data.get('quote_coverage_pct'))
          print('UNIVERSE_COUNT:', data.get('universe_count'))
          print('QUOTE_COUNT:', data.get('quote_count'))
          print('CANDIDATES:', data.get('candidate_count'))
          print('RESEARCH_ONLY:', data.get('strategy_status'))
          print('SOURCE_WARNINGS:', data.get('warnings'))
          gate = data.get('live_market_evidence') or {}
          print('EXCHANGE_LIVE_EVIDENCE:', gate.get('by_exchange'))
          print('MARKET_DATA_GATE:', data.get('market_data_gate'))
          # Two independent evidence gates: research snapshot observation is
          # not the old executed full-market gate and is never a trade signal.
          from src.swing_two_track_acceptance import assess
          snapshot_path = Path(f'output/swing_live/snapshot_observations_{mode}.json')
          snapshot = json.loads(snapshot_path.read_text(encoding='utf-8'))
          two_track = assess(data, snapshot)
          two_track_path = Path('output/swing_live/two_track_acceptance.json')
          two_track_path.write_text(
              json.dumps(two_track, ensure_ascii=False, indent=2) + '\\n',
              encoding='utf-8'
          )
          print('SNAPSHOT_SCREEN_STATUS:', two_track['snapshot_screen_status'])
          print('CANDIDATE_EXECUTION_STATUS:', two_track['candidate_execution_status'])
          print('CANDIDATE_TRADE_GATE:', two_track['candidate_trade_gate'])
          print('FULL_MARKET_EXECUTION_CERTIFICATION:',
                two_track['full_market_execution_certification_status'])
          # Existing canonical market-quality flags remain untouched. Fail
          # only the observation gate when the snapshot itself is inadequate.
          if two_track['snapshot_screen_status'] != 'PASS_SNAPSHOT_OBSERVATION_ONLY':
              raise SystemExit('HOLD_SNAPSHOT_EVIDENCE_NO_TRADE')
          summary = Path(os.environ['GITHUB_STEP_SUMMARY'])
          with summary.open('a', encoding='utf-8') as out:
              out.write(
                  f"## {data.get('display_name')}｜Snapshot 研究觀察驗收通過\\n"
                  f"資料時間：{data.get('generated_at')}\\n\\n"
                  f"快照觀察覆蓋：{data.get('snapshot_coverage_pct')}%\\n\\n"
                  f"逐股成交候選：{two_track['candidate_execution_status']}\\n\\n"
                  f"原全市場成交認證：{two_track['full_market_execution_certification_status']}\\n\\n"
                  f"成本／風控／策略核准：{two_track['candidate_trade_gate']}\\n\\n"
                  "研究用途限定；禁止交易，沒有正式買進訊號。\\n"
              )
          PY
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-swing-live-${{ github.run_id }}
          path: output/swing_live/
          if-no-files-found: warn
          retention-days: 30
      - name: Download and independently verify same-run Swing artifact (read-only)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PAID_ALLOWED: ${{ steps.guard.outputs.allowed }}
          CLAIM_OUTCOME: ${{ steps.claim.outcome }}
          VERIFIED_OUTCOME: ${{ steps.verify_claim.outcome }}
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
          SCAN_MODE: ${{ github.event_name == 'push' && 'swing5d' || (github.event_name == 'issue_comment' && (github.event.comment.body == 'Sky 波段現在掃一次' || github.event.comment.body == 'Sky 波段快掃') && 'swing') || (github.event_name == 'issue_comment' && github.event.comment.body == 'Sky Swing 5D 快掃' && 'swing5d') || inputs.mode || 'swing5d' }}
          REQUEST_ID: ${{ github.event.comment.id }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          from datetime import datetime
          run_id = os.environ["GITHUB_RUN_ID"]
          repo = os.environ["GITHUB_REPOSITORY"]
          mode = os.environ.get("SCAN_MODE") or "UNKNOWN"
          receipt = {
              "schema": "SKY_SWING_SAME_RUN_READBACK_V1",
              "status": "HOLD",
              "run_id": run_id,
              "head_sha": os.environ.get("GITHUB_SHA"),
              "request_id": os.environ.get("REQUEST_ID") or None,
              "mode": mode,
              "production_baseline": "Sky Swing V1.0",
              "v1_exact_rule_status": "BLOCKED_EXACT_RULE_SPEC",
              "v1_1_status": "RESEARCH_ONLY",
              "production_eligible": False,
              "automatic_order": False,
          }
          try:
              if (os.environ.get("PAID_ALLOWED") != "true"
                  or os.environ.get("CLAIM_OUTCOME") != "success"
                  or os.environ.get("VERIFIED_OUTCOME") != "success"):
                  raise ValueError("PAID_RESERVATION_NOT_VERIFIED")
              if os.environ.get("SCAN_OUTCOME") != "success":
                  raise ValueError("SWING_SCAN_STEP_NOT_SUCCESS")
              target = Path("/tmp/sky-swing-same-run")
              target.mkdir(parents=True, exist_ok=True)
              subprocess.run(
                  ["gh", "run", "download", run_id, "--repo", repo,
                   "--name", f"sky-swing-live-{run_id}", "--dir", str(target)],
                  check=True, capture_output=True, text=True, timeout=90,
              )
              raw = subprocess.run(
                  ["gh", "api", f"repos/{repo}/actions/runs/{run_id}/artifacts"],
                  check=True, capture_output=True, text=True, timeout=30,
              ).stdout
              artifacts = json.loads(raw).get("artifacts", [])
              artifact_name = f"sky-swing-live-{run_id}"
              matches = [a for a in artifacts if a.get("name") == artifact_name and not a.get("expired")]
              if len(matches) != 1:
                  raise ValueError("SAME_RUN_ARTIFACT_ID_NOT_UNIQUE")
              report_path = target / "latest_swing.json"
              if mode == "swing5d":
                  report_path = target / "latest_swing5d.json"
              report = json.loads(report_path.read_text(encoding="utf-8"))
              if report.get("mode") != mode:
                  raise ValueError("ARTIFACT_MODE_MISMATCH")
              if mode == "swing" and report.get("production_strategy") != "Sky Swing V1.0":
                  raise ValueError("PRODUCTION_BASELINE_IDENTITY_MISMATCH")
              generated = report.get("generated_at")
              parsed = datetime.fromisoformat(generated)
              universe_count = report.get("universe_count")
              quote_count = report.get("quote_count")
              candidate_count = report.get("candidate_count")
              candidates = report.get("candidates") or []
              if not all(isinstance(v, int) and not isinstance(v, bool) and v >= 0
                         for v in (universe_count, quote_count, candidate_count)):
                  raise ValueError("INVALID_COVERAGE_COUNTS")
              if quote_count > universe_count or candidate_count != len(candidates):
                  raise ValueError("COVERAGE_OR_CANDIDATE_COUNT_MISMATCH")
              if report.get("observations_are_trade_signals") is not False:
                  raise ValueError("OBSERVATION_SIGNAL_POLICY_MISSING")
              if any(row.get("strategy_signal") is not False for row in candidates):
                  raise ValueError("CANDIDATE_SIGNAL_NOT_FAIL_CLOSED")
              if "禁止新進場" not in str(report.get("trade_decision", "")):
                  raise ValueError("NO_TRADE_GUARD_MISSING")
              two_track = json.loads((target / "two_track_acceptance.json").read_text(encoding="utf-8"))
              if (two_track.get("schema") != "SKY_SWING_TWO_TRACK_ACCEPTANCE_V1"
                  or two_track.get("snapshot_screen_status") != "PASS_SNAPSHOT_OBSERVATION_ONLY"
                  or two_track.get("production_eligible") is not False
                  or two_track.get("automatic_order") is not False
                  or two_track.get("trade_action") != "禁止交易"
                  or not str(two_track.get("candidate_trade_gate", "")).startswith("HOLD")):
                  raise ValueError("TWO_TRACK_RESEARCH_SAFETY_GATE_FAILED")
              if (report.get("operational_full_market_scan") is False
                  and two_track.get("full_market_execution_certification_status")
                      != "HOLD_FULL_MARKET_EXECUTED_TRADE_TIME"):
                  raise ValueError("PARTIAL_EXECUTION_IMPROPERLY_PROMOTED_TO_FULL_MARKET")
              receipt.update({
                  "status": "PASS_ARTIFACT_INTEGRITY_RESEARCH_ONLY",
                  "artifact_id": matches[0]["id"],
                  "artifact_name": artifact_name,
                  "data_timestamp": generated,
                  "data_timezone": str(parsed.tzinfo),
                  "universe_count": universe_count,
                  "verified_quote_count": quote_count,
                  "quote_coverage_pct": report.get("quote_coverage_pct"),
                  "snapshot_coverage_pct": report.get("snapshot_coverage_pct"),
                  "candidate_count": candidate_count,
                  "market_data_gate": report.get("market_data_gate"),
                  "operational_full_market_scan": report.get("operational_full_market_scan"),
                  "strategy_status": report.get("strategy_status"),
                  "snapshot_screen_status": two_track["snapshot_screen_status"],
                  "candidate_execution_status": two_track["candidate_execution_status"],
                  "candidate_trade_gate": two_track["candidate_trade_gate"],
                  "full_market_execution_certification_status": two_track["full_market_execution_certification_status"],
                  "observations_are_trade_signals": False,
              })
          except Exception as exc:
              receipt["status"] = "HOLD_READBACK_FAILED"
              receipt["reason"] = f"{type(exc).__name__}:{str(exc)[:180]}"
          out = Path("output/swing_live_readback/receipt.json")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(receipt, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(receipt, ensure_ascii=False))
          if receipt["status"] != "PASS_ARTIFACT_INTEGRITY_RESEARCH_ONLY":
              raise SystemExit("SWING_SAME_RUN_ARTIFACT_READBACK_NOT_VERIFIED")
          PY
      - name: Upload independent same-run Swing readback receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-swing-readback-${{ github.run_id }}
          path: output/swing_live_readback/receipt.json
          if-no-files-found: error
          retention-days: 90
      - name: Publish mobile-readable Swing result and safety status
        if: always()
        env:
          SCAN_MODE: ${{ github.event_name == 'push' && 'swing5d' || (github.event_name == 'issue_comment' && (github.event.comment.body == 'Sky 波段現在掃一次' || github.event.comment.body == 'Sky 波段快掃') && 'swing') || (github.event_name == 'issue_comment' && github.event.comment.body == 'Sky Swing 5D 快掃' && 'swing5d') || inputs.mode || 'swing5d' }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          mode = os.environ.get("SCAN_MODE") or "UNKNOWN"
          report_path = Path(f"output/swing_live/latest_{mode}.json")
          receipt_path = Path("output/swing_live_readback/receipt.json")
          try:
              report = json.loads(report_path.read_text(encoding="utf-8"))
          except (OSError, ValueError, TypeError):
              report = {}
          try:
              receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
          except (OSError, ValueError, TypeError):
              receipt = {}
          gate = report.get("market_data_gate", "UNKNOWN")
          readback = receipt.get("status", "HOLD")
          operational = report.get("operational_full_market_scan") is True
          verdict = ("研究資料與同次 Artifact 讀回完成；全市場行情閘門通過，但非正式交易訊號"
                     if readback == "PASS_ARTIFACT_INTEGRITY_RESEARCH_ONLY" and operational
                     else "HOLD：資料／讀回／全市場驗證未完整通過，禁止新進場")
          lines = [
              f"## Sky 波段現在掃一次｜{verdict}", "",
              f"- Run ID：`{os.environ.get('GITHUB_RUN_ID')}`",
              f"- Commit：`{os.environ.get('GITHUB_SHA')}`",
              f"- 模型基準：{report.get('production_strategy') or 'Research only'}",
              f"- V1.0 規格狀態：{report.get('strategy_status', 'UNKNOWN')}",
              f"- V1.1：Research only；不得升版",
              f"- 資料時間（台北）：{report.get('generated_at', '待確認')}",
              f"- 母池／有效報價：{report.get('universe_count', 'UNKNOWN')}／{report.get('quote_count', 'UNKNOWN')}",
              f"- 快照觀察覆蓋率：{report.get('snapshot_coverage_pct', 'UNKNOWN')}%",
              f"- 候選數：{report.get('candidate_count', 'UNKNOWN')}",
              f"- 全市場資料閘門：{gate}",
              f"- 同次 Artifact：{readback}",
              f"- Artifact ID：{receipt.get('artifact_id', '待確認')}",
              "- 交易資格：禁止新進場；觀察候選不是 V1.0 買進訊號",
              "- 自動下單：停用",
              "",
              "| 股票 | 名稱 | 可驗證成交價 | 資料狀態 | 動作 |",
              "|---|---|---:|---|---|",
          ]
          for row in (report.get("deep_candidates") or [])[:8]:
              price = row.get("fugle_close") if row.get("data_status") == "VERIFIED_EXECUTED_TRADE" else "待確認"
              lines.append(f"| {row.get('symbol','')} | {row.get('name','')} | {price} | {row.get('data_status','UNKNOWN')} | {row.get('candidate_action','觀察')} |")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("\n".join(lines) + "\n")
          PY
      - name: Generate connector-readable Swing 5D status without main push
        if: always() && (github.event_name == 'push' || github.event.comment.body == 'Sky Swing 5D 快掃' || inputs.mode == 'swing5d')
        run: python -m src.swing5d_publish_status --run-id "$GITHUB_RUN_ID"
      - name: Upload connector-readable same-run status artifact
        if: always() && (github.event_name == 'push' || github.event.comment.body == 'Sky Swing 5D 快掃' || inputs.mode == 'swing5d')
        uses: actions/upload-artifact@v4
        with:
          name: sky-swing5d-status-${{ github.run_id }}
          path: docs/SKY_SWING5D_LATEST_STATUS.json
          if-no-files-found: error
          retention-days: 30
      - name: Fail closed when a paid reservation is unavailable
        if: always()
        env:
          PAID_ALLOWED: ${{ steps.guard.outputs.allowed }}
          CLAIM_OUTCOME: ${{ steps.claim.outcome }}
          VERIFIED_OUTCOME: ${{ steps.verify_claim.outcome }}
        run: |
          if [ "$PAID_ALLOWED" != "true" ] || [ "$CLAIM_OUTCOME" != "success" ] || [ "$VERIFIED_OUTCOME" != "success" ]; then
            echo "BLOCKED_PAID_FUGLE_RESERVATION_NO_TRADE"
            exit 1
          fi
