name: Sky Swing Live Whole-Market Scan

on:
  push:
    branches: [main]
    paths:
      - "scan_requests/swing5d/**"
  workflow_dispatch:
    inputs:
      mode:
        description: "swing = 波段快掃；swing5d = Swing 5D 快掃"
        required: true
        default: "swing5d"
        type: choice
        options:
          - swing5d
          - swing
      top_n:
        description: "Broad-market candidate output count"
        required: true
        default: "20"
      deep_n:
        description: "Fugle single-stock verification count"
        required: true
        default: "8"

permissions:
  contents: write
  actions: read

concurrency:
  group: sky-fugle-paid-global-research-v1
  cancel-in-progress: false

jobs:
  scan:
    # A cleanup push that only deletes consumed request files must never launch
    # another whole-market scan. Manual workflow_dispatch remains available.
    if: >-
      github.event_name != 'push' ||
      contains(toJSON(github.event.commits.*.added), 'scan_requests/swing5d/') ||
      contains(toJSON(github.event.commits.*.modified), 'scan_requests/swing5d/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Test MIS coverage recovery
        run: python -m pytest -q tests/test_official_mis_coverage.py tests/test_swing5d_publish_status.py
      - name: Reserve shared Fugle paid API window
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m research.sky_paid_fugle_api_guard --scope 'sky:live:wholemarket'
      - name: Upload paid reservation before provider call
        id: claim
        if: steps.guard.outputs.allowed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.guard.outputs.claim_name }}
          path: output/fugle_api_guard/claim.json
          if-no-files-found: error
          retention-days: 2
      - name: Verify reservation via GitHub API
        id: verify_claim
        if: steps.guard.outputs.allowed == 'true' && steps.claim.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m research.sky_paid_fugle_api_guard --scope 'sky:live:wholemarket' --verify
      - name: Run whole-market live swing scan
        if: steps.guard.outputs.allowed == 'true' && steps.verify_claim.outcome == 'success'
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
          MAX_PRICE: "100"
          MIN_VOLUME: "500"
          MIN_TRADE_VALUE: "10000000"
          SCAN_MODE: ${{ github.event_name == 'push' && 'swing5d' || inputs.mode || 'swing5d' }}
          TOP_N: ${{ inputs.top_n || '20' }}
          DEEP_N: ${{ inputs.deep_n || '8' }}
        run: |
          python -m src.swing_live_scanner \
            --mode "$SCAN_MODE" \
            --top-n "$TOP_N" \
            --deep-n "$DEEP_N"
      - name: Verify scan output and publish summary
        if: success()
        env:
          SCAN_MODE: ${{ github.event_name == 'push' && 'swing5d' || inputs.mode || 'swing5d' }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          mode = os.environ['SCAN_MODE']
          p = Path(f'output/swing_live/latest_{mode}.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          print('SCAN_RUN_ID:', os.environ['GITHUB_RUN_ID'])
          print('SCAN_GENERATED_AT:', data.get('generated_at'))
          print('FULL_MARKET_OPERATIONAL:', data.get('operational_full_market_scan'))
          print('QUOTE_COVERAGE_PCT:', data.get('quote_coverage_pct'))
          print('UNIVERSE_COUNT:', data.get('universe_count'))
          print('QUOTE_COUNT:', data.get('quote_count'))
          print('CANDIDATES:', data.get('candidate_count'))
          print('RESEARCH_ONLY:', data.get('strategy_status'))
          print('SOURCE_WARNINGS:', data.get('warnings'))
          gate = data.get('live_market_evidence') or {}
          print('EXCHANGE_LIVE_EVIDENCE:', gate.get('by_exchange'))
          print('MARKET_DATA_GATE:', data.get('market_data_gate'))
          if (not data.get('operational_full_market_scan')
              or gate.get('valid_whole_market_operational') is not True
              or data.get('quote_scope') != 'WHOLE_MARKET_EXECUTED_LIVE'
              or data.get('market_data_gate') != 'PASS_OPERATIONAL_WHOLE_MARKET_LIVE_RESEARCH_ONLY'):
              raise SystemExit('BLOCKED_EXTERNAL_DATA: no valid full-market live executed quotes, no trade candidate signal')
          summary = Path(os.environ['GITHUB_STEP_SUMMARY'])
          summary.write_text(
              f"## {data.get('display_name')}\n"
              f"資料時間：{data.get('generated_at')}\n\n"
              f"全市場覆蓋：{data.get('quote_coverage_pct')}% "
              f"({data.get('quote_count')}/{data.get('universe_count')})\n\n"
              f"實務全市場掃描：{data.get('operational_full_market_scan')}\n\n"
              f"研究狀態：{data.get('strategy_status')}；不是正式買進訊號。\n",
              encoding='utf-8'
          )
          PY
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-swing-live-${{ github.run_id }}
          path: output/swing_live/
          if-no-files-found: warn
          retention-days: 30
      - name: Publish connector-readable Swing 5D status
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m src.swing5d_publish_status --run-id "$GITHUB_RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/SKY_SWING5D_LATEST_STATUS.json
          if git diff --cached --quiet; then
            echo "Swing 5D status unchanged"
            exit 0
          fi
          git commit -m "ops: publish Swing 5D chat status [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo "SWING5D_STATUS_PUBLISHED"
              exit 0
            fi
            sleep 2
          done
          echo "SWING5D_STATUS_PUBLISH_FAILED"
          exit 1
