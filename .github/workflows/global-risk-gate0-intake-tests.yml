name: Global Risk Gate0 intake tests
on:
  pull_request:
    paths:
      - 'research/global_risk_gate0/**'
      - 'tests/test_global_risk_gate0_intake.py'
      - '.github/workflows/global-risk-gate0-intake-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_global_risk_gate0_intake.py' -v
