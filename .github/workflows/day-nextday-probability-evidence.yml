name: Day and Next-day Probability Evidence Gate (Research Only)
on:
  pull_request:
    paths:
      - 'research/day_nextday_probability_evidence_gate.py'
      - 'tests/test_day_nextday_probability_evidence_gate.py'
      - '.github/workflows/day-nextday-probability-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probability-evidence-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify both horizon evidence contracts
        run: python -m unittest tests.test_day_nextday_probability_evidence_gate -v
      - name: Publish truthful default readiness state
        run: python -m research.day_nextday_probability_evidence_gate
      - uses: actions/upload-artifact@v4
        with:
          name: day-nextday-probability-gate-${{ github.run_id }}
          path: research_output/probability_evidence_gate.json
          if-no-files-found: error
          retention-days: 30
