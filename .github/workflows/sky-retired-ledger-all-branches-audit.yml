name: Sky Retired Ledger All Branches Audit
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/sky_all_branches_retired_ledger_audit.py'
      - '.github/workflows/sky-retired-ledger-all-branches-audit.yml'
      - 'tests/test_sky_all_branches_retired_ledger_audit.py'
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Unit-test fail-closed four-gate classifications
        run: python -m pytest -q tests/test_sky_all_branches_retired_ledger_audit.py
      - name: Fetch remote branch tips for complete inventory
        run: git fetch --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Classify branch cleanup gates (read-only, no deletion)
        run: python research/sky_all_branches_retired_ledger_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sky-retired-ledger-all-branches
          path: |
            retired-ledger-all-branches.json
            retired-ledger-all-branches.md
          if-no-files-found: warn
