name: Core Engine Tests

on:
  pull_request:
    branches: [ main ]
  push:
    branches:
      - main
      - feature/p0-a-monitor-engine
  workflow_dispatch:

jobs:
  test-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile source
        run: python -m compileall -q src tests

      - name: Run core engine tests
        run: |
          pytest -q             tests/test_monitor_engine.py             tests/test_state_store.py             tests/test_strategy_builder.py             tests/test_risk_engine.py
