name: test-w3a-pit-universe-download

on:
  pull_request:
    paths:
      - "research/download_pit_universe_intraday.py"
      - "tests/test_pit_universe_intraday_download.py"
      - ".github/workflows/test-w3a-pit-universe-download.yml"
      - ".github/workflows/w3a-whole-universe-intraday-history.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests pytest
      - name: Run PIT-universe download tests
        run: python -m pytest -q tests/test_pit_universe_intraday_download.py
