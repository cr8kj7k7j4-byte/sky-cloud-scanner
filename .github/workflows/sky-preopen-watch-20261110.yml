name: Sky 11-10 Overnight Preopen Readiness Watch
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sky-preopen-watch-20261110.yml'
      - 'ops/preopen_readiness_watch.py'
      - 'tests/test_preopen_readiness_watch.py'
  schedule:
    - cron: '0,30 * * * *'
    - cron: '5,20,35,50 0 * * 1-5'
permissions:
  contents: read
  actions: write
concurrency:
  group: sky-preopen-watch-20261110
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test monitor retry and expiry logic
        run: python -m unittest discover -s tests -p 'test_preopen_readiness_watch.py' -v
      - name: Check current health and optionally retry report once
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python ops/preopen_readiness_watch.py
      - name: Preserve monitoring evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-preopen-watch-${{ github.run_id }}
          path: output/preopen_watch/
          if-no-files-found: warn
          retention-days: 7
