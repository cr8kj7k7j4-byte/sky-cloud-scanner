name: Revenue Historical PIT Coverage Audit

on:
  workflow_dispatch:
  schedule:
    # Recompute after the main monthly-revenue filing window.
    - cron: '30 3 16 * *'
  push:
    branches:
      - 'governance/revenue-pit-coverage-gate'
    paths:
      - 'research/audit_revenue_pit_coverage.py'
      - 'tests/test_revenue_pit_coverage.py'
      - '.github/workflows/revenue-pit-coverage-audit.yml'

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest
      - run: python -m pytest -q tests/test_revenue_pit_coverage.py

  export:
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        include:
          - year: 2023
            market: TWSE
            end_month: 12
          - year: 2023
            market: TPEx
            end_month: 12
          - year: 2024
            market: TWSE
            end_month: 12
          - year: 2024
            market: TPEx
            end_month: 12
          - year: 2025
            market: TWSE
            end_month: 12
          - year: 2025
            market: TPEx
            end_month: 12
          - year: 2026
            market: TWSE
            end_month: 9
          - year: 2026
            market: TPEx
            end_month: 9
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install export dependencies
        run: pip install pandas lxml html5lib beautifulsoup4
      - name: Export historical monthly revenue
        run: |
          python research/export_monthly_revenue_history.py             --year ${{ matrix.year }}             --market ${{ matrix.market }}             --end-month ${{ matrix.end_month }}             --out "revenue_shard_${{ matrix.year }}_${{ matrix.market }}"
      - uses: actions/upload-artifact@v4
        with:
          name: pit-revenue-${{ matrix.year }}-${{ matrix.market }}
          path: revenue_shard_${{ matrix.year }}_${{ matrix.market }}
          retention-days: 14

  audit:
    needs: export
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: pit-revenue-*
          path: history_artifacts
      - name: Run PIT coverage audit
        run: |
          python research/audit_revenue_pit_coverage.py             --revenue-root history_artifacts             --pit-ledger data/revenue_pit/mops_revenue_filing_times.jsonl             --min-coverage-pct 100             --out output/revenue_pit_coverage
      - name: Publish audit summary
        run: cat output/revenue_pit_coverage/coverage.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: revenue-pit-coverage-${{ github.run_id }}
          path: output/revenue_pit_coverage/
          retention-days: 90
