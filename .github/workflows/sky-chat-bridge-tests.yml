name: Sky Chat Bridge Unit Checks
on:
  pull_request:
    paths:
      - 'src/sky_chat_bridge.py'
      - 'src/sky_mcp_contract.py'
      - 'tests/test_sky_chat_bridge.py'
      - 'tests/test_sky_mcp_contract.py'
      - '.github/workflows/sky-chat-bridge*.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax-check bridge files
        run: python -m py_compile src/sky_chat_bridge.py src/sky_mcp_contract.py
      - name: Run isolated contracts without paid credentials
        run: python -m unittest tests.test_sky_chat_bridge tests.test_sky_mcp_contract -v
