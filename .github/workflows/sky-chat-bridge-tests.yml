name: Sky Chat Bridge Unit Checks
on:
  pull_request:
    paths:
      - 'src/sky_chat_bridge.py'
      - 'src/fugle.py'
      - 'research/three_model_fugle_pipeline.py'
      - 'research/fugle_market_quality_audit.py'
      - 'tests/test_fugle_atomic_transport.py'
      - 'research/fugle_2026_entitlement_probe.py'
      - '.github/workflows/three-model-fugle-private-ledger.yml'
      - '.github/workflows/three-model-next-session-markout.yml'
      - '.github/workflows/sky-market-provider-readiness.yml'
      - '.github/workflows/sky-limited-candidate-research.yml'
      - '.github/workflows/fugle-2026-entitlement-probe.yml'
      - '.github/workflows/fugle-paid-api-acceptance.yml'
      - '.github/workflows/swing-postmarket-research.yml'
      - '.github/workflows/swing-split-scope-research.yml'
      - '.github/workflows/sky-daytrade-preopen-readiness.yml'
      - 'research/sky_paid_fugle_api_guard.py'
      - 'research/sky_fugle_request_identity.py'
      - 'tests/test_sky_paid_fugle_api_guard.py'
      - 'tests/test_sky_fugle_atomic_ref_claim.py'
      - 'tests/test_sky_fugle_http_atomic_guard.py'
      - 'research/sky_fugle_atomic_ref_claim.py'
      - 'tests/test_sky_fugle_request_identity.py'
      - 'tests/test_sky_chat_paid_reservation_workflow.py'
      - 'src/sky_scan_readback.py'
      - 'scripts/sky_chat_artifact_readback.py'
      - 'tests/test_sky_chat_artifact_readback.py'
      - 'tests/test_sky_scan_readback.py'
      - 'research/sky_candidate_e2e_chain.py'
      - 'research/sky_stage5_vwap_cost_evidence.py'
      - 'research/sky_stage5_breakout_antichase_evidence.py'
      - 'tests/test_sky_stage5_breakout_antichase_evidence.py'
      - 'tests/test_sky_stage5_vwap_cost_evidence.py'
      - 'tests/test_sky_candidate_e2e_chain.py'
      - 'src/sky_stage2_candidate_quotes.py'
      - 'src/sky_stage2_deep_quality.py'
      - 'src/sky_v14_ticker_candles_probe.py'
      - 'tests/test_sky_v14_ticker_candles_probe.py'
      - 'tests/test_sky_stage2_deep_quality.py'
      - 'tests/test_sky_stage2_candidate_quotes.py'
      - 'src/sky_mcp_contract.py'
      - 'tests/test_sky_chat_bridge.py'
      - 'research/sky_snapshot_candidates.py'
      - 'research/sky_full_universe_information.py'
      - 'tests/test_sky_snapshot_candidates.py'
      - 'tests/test_sky_snapshot_integrity_research.py'
      - 'research/sky_alert_reader.py'
      - 'tests/test_sky_alert_reader.py'
      - 'src/sky_command_router.py'
      - 'tests/test_sky_mcp_contract.py'
      - 'scripts/sky_governed_auto_repair.py'
      - 'research/sky_governed_auto_repair_smoke_fixture.txt'
      - 'tests/test_sky_governed_auto_repair.py'
      - '.github/workflows/sky-chat-bridge*.yml'
      - '.github/workflows/sky-single-stock-realtime.yml'
      - '.github/workflows/swing-live-scan.yml'
      - '.github/workflows/swing-v11-live-scan.yml'
      - '.github/workflows/three-model-fugle-api-smoke.yml'
      - '.github/workflows/fugle-market-quality-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tested runtime HTTP dependency
        run: pip install requests
      - name: Syntax-check bridge files
        run: python -m py_compile scripts/sky_chat_artifact_readback.py src/sky_scan_readback.py src/sky_chat_bridge.py src/fugle.py research/sky_fugle_atomic_ref_claim.py research/three_model_fugle_pipeline.py research/fugle_market_quality_audit.py research/fugle_2026_entitlement_probe.py src/sky_mcp_contract.py research/sky_snapshot_candidates.py src/sky_stage2_candidate_quotes.py src/sky_stage2_deep_quality.py src/sky_v14_ticker_candles_probe.py research/sky_candidate_e2e_chain.py research/sky_stage5_vwap_cost_evidence.py research/sky_stage5_breakout_antichase_evidence.py
      - name: Run isolated contracts without paid credentials
        run: python -m unittest tests.test_fugle_atomic_transport tests.test_sky_fugle_atomic_ref_claim tests.test_sky_fugle_http_atomic_guard tests.test_sky_paid_fugle_api_guard tests.test_sky_fugle_request_identity tests.test_sky_chat_paid_reservation_workflow tests.test_sky_scan_readback tests.test_sky_chat_artifact_readback tests.test_sky_chat_bridge tests.test_sky_mcp_contract tests.test_sky_snapshot_candidates tests.test_sky_snapshot_integrity_research tests.test_sky_alert_reader tests.test_sky_stage2_candidate_quotes tests.test_sky_stage2_deep_quality tests.test_sky_v14_ticker_candles_probe tests.test_sky_candidate_e2e_chain tests.test_sky_stage5_vwap_cost_evidence tests.test_sky_stage5_breakout_antichase_evidence tests.test_sky_governed_auto_repair -v
      - name: Check isolated no-market repair smoke fixture when present
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("research/sky_governed_auto_repair_smoke_fixture.txt")
          if p.exists():
              expected = "SKY_GOVERNED_SMOKE_FIXED_V1\n"
              assert p.read_text(encoding="utf-8") == expected, "ISOLATED_SMOKE_FIXTURE_REQUIRES_APPROVED_PATCH"
          PY
