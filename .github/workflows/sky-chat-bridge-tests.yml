name: Sky Chat Bridge Unit Checks
on:
  pull_request:
    paths:
      - 'src/sky_chat_bridge.py'
      - 'research/sky_candidate_e2e_chain.py'
      - 'research/sky_stage5_vwap_cost_evidence.py'
      - 'research/sky_stage5_breakout_antichase_evidence.py'
      - 'tests/test_sky_stage5_breakout_antichase_evidence.py'
      - 'tests/test_sky_stage5_vwap_cost_evidence.py'
      - 'tests/test_sky_candidate_e2e_chain.py'
      - 'src/sky_stage2_candidate_quotes.py'
      - 'src/sky_stage2_deep_quality.py'
      - 'src/sky_v14_ticker_candles_probe.py'
      - 'tests/test_sky_v14_ticker_candles_probe.py'
      - 'tests/test_sky_stage2_deep_quality.py'
      - 'tests/test_sky_stage2_candidate_quotes.py'
      - 'src/sky_mcp_contract.py'
      - 'tests/test_sky_chat_bridge.py'
      - 'research/sky_snapshot_candidates.py'
      - 'research/sky_full_universe_information.py'
      - 'tests/test_sky_snapshot_candidates.py'
      - 'tests/test_sky_mcp_contract.py'
      - 'scripts/sky_governed_auto_repair.py'
      - 'research/sky_governed_auto_repair_smoke_fixture.txt'
      - 'tests/test_sky_governed_auto_repair.py'
      - '.github/workflows/sky-chat-bridge*.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tested runtime HTTP dependency
        run: pip install requests
      - name: Syntax-check bridge files
        run: python -m py_compile src/sky_chat_bridge.py src/sky_mcp_contract.py research/sky_snapshot_candidates.py src/sky_stage2_candidate_quotes.py src/sky_stage2_deep_quality.py src/sky_v14_ticker_candles_probe.py research/sky_candidate_e2e_chain.py research/sky_stage5_vwap_cost_evidence.py research/sky_stage5_breakout_antichase_evidence.py
      - name: Run isolated contracts without paid credentials
        run: python -m unittest tests.test_sky_chat_bridge tests.test_sky_mcp_contract tests.test_sky_snapshot_candidates tests.test_sky_stage2_candidate_quotes tests.test_sky_stage2_deep_quality tests.test_sky_v14_ticker_candles_probe tests.test_sky_candidate_e2e_chain tests.test_sky_stage5_vwap_cost_evidence tests.test_sky_stage5_breakout_antichase_evidence tests.test_sky_governed_auto_repair -v
      - name: Check isolated no-market repair smoke fixture when present
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("research/sky_governed_auto_repair_smoke_fixture.txt")
          if p.exists():
              expected = "SKY_GOVERNED_SMOKE_FIXED_V1\n"
              assert p.read_text(encoding="utf-8") == expected, "ISOLATED_SMOKE_FIXTURE_REQUIRES_APPROVED_PATCH"
          PY

      - name: Generate isolated #534 same-head research evidence receipt
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 534
        env:
          REPAIR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ACTION_RUN_ID: ${{ github.run_id }}
          ACTION_RUN_ATTEMPT: ${{ github.run_attempt }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          expected = "SKY_GOVERNED_SMOKE_FIXED_V1\n"
          assert Path("research/sky_governed_auto_repair_smoke_fixture.txt").read_text(encoding="utf-8") == expected
          receipt = {
              "schema": "SKY_GOVERNED_REPAIR_PR534_CI_RECEIPT_V1",
              "scope": "ISOLATED_RESEARCH_FIXTURE_ONLY",
              "source_failure_run_id": 42941970391,
              "source_sha": "498c5cbd0b6a85258ed24b601f2a5562d246ebe3",
              "controller_run_id": 42942007304,
              "controller_artifact_id": 13820404560,
              "controller_sha": "3f084c2d20bf17edfaa6ca1d3f91931b77fe19dd",
              "repair_pr_number": 534,
              "original_auto_repair_sha": "d8a6e1ad038fb5065124843f6f70f254047d8f40",
              "head_sha_under_test": os.environ["REPAIR_HEAD_SHA"],
              "previous_downstream_ci_run_id": 42942033824,
              "previous_native_pr_ci_run_id": 42942037713,
              "current_native_pr_ci_run_id": int(os.environ["ACTION_RUN_ID"]),
              "current_native_pr_ci_attempt": int(os.environ["ACTION_RUN_ATTEMPT"]),
              "current_native_pr_ci_conclusion": "RUNNING_AT_RECEIPT_GENERATION",
              "fixture_contract": "PASSED_BEFORE_RECEIPT_STEP",
              "artifact_readback_verified": False,
              "artifact_readback_status": "MUST_VERIFY_AFTER_UPLOAD",
              "paid_api_calls": 0,
              "research_only": True,
              "production_eligible": False,
              "automatic_order": False,
              "automatic_merge": False,
              "self_review_is_rule_based_not_llm": True
          }
          dest=Path("output/sky_534_evidence/latest.json")
          dest.parent.mkdir(parents=True, exist_ok=True)
          dest.write_text(json.dumps(receipt, ensure_ascii=False, indent=2)+"\n", encoding="utf-8")
          print(json.dumps(receipt, ensure_ascii=False))
          PY
      - name: Upload isolated #534 evidence receipt for independent readback
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 534
        uses: actions/upload-artifact@v4
        with:
          name: sky-pr534-repair-head-receipt-${{ github.run_id }}
          path: output/sky_534_evidence/latest.json
          if-no-files-found: error
          retention-days: 21
