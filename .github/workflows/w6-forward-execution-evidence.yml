name: W6 Forward Execution Evidence

on:
  workflow_dispatch:
  schedule:
    - cron: "50 14 * * 1-5"
      timezone: "Asia/Taipei"
  push:
    branches: [main]
    paths:
      - "src/feature_engine.py"
      - "src/paper_trading.py"
      - "research/w6_execution_baseline.py"
      - "research/w6_execution_evidence.py"
      - "research/w6_collect_forward_l1.py"
      - "research/w6_p1_report.py"
      - "tests/test_w6_execution_research.py"
      - ".github/workflows/w6-forward-execution-evidence.yml"

permissions:
  contents: read
  actions: read

jobs:
  collect-and-report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Compile
        run: python -m compileall -q src research tests

      - name: W6 unit tests
        run: PYTHONPATH=. pytest -q tests/test_w6_execution_research.py

      - name: Download forward scan artifacts
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p shadow_history
          gh run list \
            --workflow scan.yml \
            --status success \
            --limit 500 \
            --json databaseId,createdAt \
            --jq '.[] | select(.createdAt >= "2026-10-25T12:00:00Z") | .databaseId' \
            > /tmp/w6_scan_run_ids.txt

          while read -r run_id; do
            [ -z "$run_id" ] && continue
            dest="shadow_history/$run_id"
            mkdir -p "$dest"
            gh run download "$run_id" \
              -n "sky-scan-$run_id" \
              -D "$dest" || true
          done < /tmp/w6_scan_run_ids.txt

          find shadow_history -type f -path '*/output/paper/*.json' | sort || true

      - name: Download previous W6 report for transition detection
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p previous/w6
          run_id="$(gh run list \
            --workflow w6-forward-execution-evidence.yml \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')"
          if [ -n "$run_id" ]; then
            gh run download "$run_id" \
              -n w6-forward-execution-evidence \
              -D previous/w6 || true
          fi

      - name: Build W6 forward L1 evidence
        run: |
          PYTHONPATH=. python research/w6_collect_forward_l1.py \
            --paper-root shadow_history \
            --evidence-out research_output/w6_execution_evidence.jsonl

      - name: Build W6 P1 report
        run: |
          PYTHONPATH=. python research/w6_p1_report.py \
            --input research_output/w6_execution_evidence.jsonl \
            --output research_output/w6_p1_report.json

      - name: Telegram W6 milestone notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
        run: |
          PYTHONPATH=. python research/notify_governance_event.py \
            --kind w6 \
            --input research_output/w6_p1_report.json \
            --previous-input previous/w6/w6_p1_report.json

      - name: Telegram W6 failure notification
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          PYTHONPATH=. python research/notify_governance_event.py \
            --kind failure \
            --workflow "W6 Forward Execution Evidence" \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Upload W6 evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: w6-forward-execution-evidence
          path: |
            research_output/w6_execution_evidence.jsonl
            research_output/w6_p1_report.json
          if-no-files-found: error
          retention-days: 90
