name: W3B Operational Quote Coverage Fail-Closed Tests

on:
  push:
    branches: [engineering/w3b-failclosed-market-coverage-20261104]
  pull_request:
    paths:
      - src/market_coverage_gate.py
      - src/main.py
      - tests/test_market_coverage_gate.py
      - .github/workflows/w3b-market-coverage-gate.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: |
          python -m pip install pytest
          PYTHONPATH=. python -m pytest -q tests/test_market_coverage_gate.py
      - name: Compile modified modules
        run: |
          python -m py_compile src/market_coverage_gate.py src/main.py
