name: MCR V1 Research Tests
on:
  push:
    branches:
      - research/margin-rebound-watch-20261108
    paths:
      - 'research/mcr_v1_decision.py'
      - 'research/margin_rebound_watch.py'
      - 'tests/test_mcr_v1_decision.py'
      - 'tests/test_margin_rebound_watch.py'
      - '.github/workflows/mcr-research-tests.yml'
  pull_request:
    paths:
      - 'research/mcr_v1_decision.py'
      - 'research/margin_rebound_watch.py'
      - 'tests/test_mcr_v1_decision.py'
      - 'tests/test_margin_rebound_watch.py'
      - '.github/workflows/mcr-research-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test research signals without credentials or network
        run: python -m unittest tests.test_margin_rebound_watch tests.test_mcr_v1_decision -v
