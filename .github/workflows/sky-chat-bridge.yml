name: Sky Chat On-Demand Scan Bridge
on:
  push:
    branches: [main]
    paths:
      - 'scan_requests/chat/latest.json'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
  actions: read
concurrency:
  group: sky-chat-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run read-only paid Fugle observations (market or after-market)
        id: bridge
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
          SKY_FUGLE_ONLY_MARKETDATA: '1'
        run: python -m src.sky_chat_bridge
      - name: Verify status and preserve a failed-run diagnostic
        if: always()
        env:
          BRIDGE_OUTCOME: ${{ steps.bridge.outcome }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          p = Path("output/chat_bridge/latest.json")
          failure = {
              "schema": "SKY_CHAT_SCAN_STATUS_V1",
              "status": "FAILED_NO_VALID_STATUS",
              "scan_id": os.getenv("GITHUB_RUN_ID"),
              "production_eligible": False,
              "automatic_order": False,
              "block_reason": "BRIDGE_STATUS_MISSING_OR_INVALID",
          }
          valid = False
          if p.exists():
              try:
                  data = json.loads(p.read_text(encoding="utf-8"))
                  valid = (
                      isinstance(data, dict)
                      and data.get("schema") == "SKY_CHAT_SCAN_STATUS_V1"
                      and data.get("scan_id") == os.getenv("GITHUB_RUN_ID")
                      and data.get("production_eligible") is False
                      and data.get("automatic_order") is False
                      and data.get("status") == "REPORT_READY_RESEARCH_ONLY"
                      and isinstance(data.get("row_count"), int)
                      and data["row_count"] > 0
                      and isinstance(data.get("observed_price_count"), int)
                      and data["observed_price_count"] > 0
                      and isinstance(data.get("data_timestamp"), str)
                      and bool(data.get("data_timestamp"))
                      and data.get("source") == "FUGLE_PAID_SNAPSHOT"
                  )
              except (OSError, ValueError, TypeError):
                  data = failure
              if not isinstance(data, dict):
                  data = failure
          else:
              data = failure
          if not valid:
              # Preserve an explicit diagnostic even when the bridge crashed
              # before writing one; do not attach old successful scan files.
              if isinstance(data, dict) and data.get("status") == "REPORT_READY_RESEARCH_ONLY":
                  data = failure
              data["production_eligible"] = False
              data["automatic_order"] = False
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          if not valid or os.getenv("BRIDGE_OUTCOME") != "success":
              raise SystemExit("SCAN_VALIDATION_FAILED")
          PY
      - name: Upload complete 13-column report and status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-chat-${{ github.run_id }}
          path: |
            output/chat_bridge/latest.json
            output/sky_quickscan_information/latest_13col.json
            output/sky_quickscan_information/latest_13col.md
            output/sky_quickscan_information/full_universe.json
            output/sky_quickscan_information/stage1_candidates.json
            output/sky_quickscan_information/stage2_quote_evidence.json
            output/sky_quickscan_information/v14_ticker_5m_evidence.json
            output/sky_quickscan_information/candidate_e2e_chain.json
            output/sky_quickscan_information/candidate_e2e_chain.md
          if-no-files-found: error
          retention-days: 14
      - name: Independently download and validate same-run GitHub Artifact
        id: readback
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/sky-artifact-readback
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "sky-chat-$GITHUB_RUN_ID" --dir /tmp/sky-artifact-readback
          ACTUAL_SHA=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.head_sha')
          test "$ACTUAL_SHA" = "$GITHUB_SHA" || { echo "ARTIFACT_RUN_SHA_MISMATCH"; exit 1; }
          python - <<'PY'
          import json, os
          from pathlib import Path
          from src.sky_scan_readback import validate_scan_readback
          from src.sky_chat_bridge import validate_report
          root = Path("/tmp/sky-artifact-readback")
          status = json.loads((root / "chat_bridge/latest.json").read_text(encoding="utf-8"))
          report = json.loads((root / "sky_quickscan_information/latest_13col.json").read_text(encoding="utf-8"))
          request = json.loads(Path("scan_requests/chat/latest.json").read_text(encoding="utf-8"))
          receipt = validate_scan_readback(
              status, expected_run_id=os.environ["GITHUB_RUN_ID"],
              expected_request_id=request["request_id"])
          rows = validate_report(report)
          if report.get("row_count") != status.get("row_count") or len(rows) != status["row_count"]:
              raise SystemExit("ARTIFACT_ROW_COUNT_MISMATCH")
          symbols = [row["股票代碼"] for row in rows]
          if len(symbols) != len(set(symbols)):
              raise SystemExit("ARTIFACT_DUPLICATE_SYMBOLS")
          if receipt["production_eligible"] or receipt["automatic_order"]:
              raise SystemExit("ARTIFACT_UNSAFE_TRADING_STATUS")
          proof = {
              "schema": "SKY_EXTERNAL_ARTIFACT_READBACK_V1",
              "run_id": os.environ["GITHUB_RUN_ID"],
              "head_sha": os.environ["GITHUB_SHA"],
              "request_id": request["request_id"],
              "source_artifact_name": "sky-chat-" + os.environ["GITHUB_RUN_ID"],
              "downloaded_files_verified": ["chat_bridge/latest.json", "sky_quickscan_information/latest_13col.json"],
              "row_count": len(rows),
              "snapshot_is_executed_trade_time": False,
              "production_eligible": False,
              "automatic_order": False,
              "status": "PASS_RESEARCH_READBACK_ONLY",
          }
          Path("output/chat_bridge/external_artifact_readback.json").write_text(json.dumps(proof, ensure_ascii=False, indent=2)+"\\n", encoding="utf-8")
          print(json.dumps(proof, ensure_ascii=False))
          PY
      - name: Upload independent Artifact readback receipt
        if: ${{ steps.readback.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: sky-chat-readback-${{ github.run_id }}
          path: output/chat_bridge/external_artifact_readback.json
          if-no-files-found: error
          retention-days: 14
      - name: Download the same-run Artifact and independently verify its contents
        id: external_readback
        if: ${{ steps.bridge.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/sky-chat-downloaded output/chat_bridge_readback
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "sky-chat-$GITHUB_RUN_ID" --dir /tmp/sky-chat-downloaded
          HEAD_SHA=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.head_sha')
          ARTIFACT_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[] | select(.name == "sky-chat-" + (env.GITHUB_RUN_ID)) | .id' | head -1)
          REQUEST_ID=$(python -c 'import json;print(json.load(open("scan_requests/chat/latest.json", encoding="utf-8"))["request_id"])')
          python -m scripts.sky_chat_artifact_readback \
            --directory /tmp/sky-chat-downloaded \
            --run-id "$GITHUB_RUN_ID" --request-id "$REQUEST_ID" \
            --head-sha "$HEAD_SHA" --expected-sha "$GITHUB_SHA" \
            --artifact-id "$ARTIFACT_ID" \
            --receipt output/chat_bridge_readback/external_receipt.json
      - name: Upload independent readback receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-chat-external-readback-${{ github.run_id }}
          path: output/chat_bridge_readback/external_receipt.json
          if-no-files-found: warn
          retention-days: 14
      - name: Publish sanitized summary for ChatGPT GitHub connector
        # Research-branch dispatches only upload artifacts; never overwrite main status.
        if: ${{ always() && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("output/chat_bridge/latest.json")
          if p.exists():
              data = json.loads(p.read_text(encoding="utf-8"))
          else:
              data = {"schema":"SKY_CHAT_SCAN_STATUS_V1","status":"FAILED_NO_STATUS",
                      "scan_id":__import__("os").environ.get("GITHUB_RUN_ID"),
                      "production_eligible":False,"automatic_order":False}
          Path("/tmp/sky-chat-status.json").write_text(
              json.dumps(data,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
          TARGET="repos/${GITHUB_REPOSITORY}/contents/docs/SKY_CHAT_LATEST_STATUS.json"
          CONTENT=$(base64 -w0 /tmp/sky-chat-status.json)
          for ATTEMPT in 1 2 3; do
            SHA=$(gh api "$TARGET" --jq '.sha' 2>/dev/null || true)
            if [ -n "$SHA" ]; then
              gh api --method PUT "$TARGET" -f message="ops: publish Sky chat scan status [skip ci]" -f content="$CONTENT" -f sha="$SHA" -f branch=main >/dev/null && break
            else
              gh api --method PUT "$TARGET" -f message="ops: publish Sky chat scan status [skip ci]" -f content="$CONTENT" -f branch=main >/dev/null && break
            fi
            if [ "$ATTEMPT" = 3 ]; then exit 1; fi
            sleep 2
          done
