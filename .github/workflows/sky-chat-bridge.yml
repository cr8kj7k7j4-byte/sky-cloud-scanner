name: Sky Chat On-Demand Scan Bridge
on:
  push:
    branches: [main]
    paths:
      - 'scan_requests/chat/latest.json'
  # Reuse existing bridge for an explicitly authorized #363 ChatGPT command.
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      w0_comment_id:
        description: "Read-only W0 issue comment ID"
        required: false
        type: string
      w0_start:
        description: "UTC window start ISO 8601"
        required: false
        type: string
      w0_end:
        description: "UTC window end ISO 8601"
        required: false
        type: string
permissions:
  contents: write
  actions: read
concurrency:
  # Exact Sky 警戒 is a read-only artifact consumer; it must not queue against paid scans.
  # All other requests retain the existing shared paid API concurrency guard.
  group: "${{ (github.event_name == 'issue_comment' && !(github.event.issue.number == 363 && github.event.comment.user.login == github.repository_owner && github.event.comment.author_association == 'OWNER' && (github.event.comment.body == 'Sky 快掃' || github.event.comment.body == 'Sky 當沖快掃' || github.event.comment.body == 'Sky 快掃更新' || github.event.comment.body == 'Sky 當沖現在掃一次' || github.event.comment.body == 'Sky v1.4 Dynamic Capital Rotation 掃一下' || github.event.comment.body == 'Sky 警戒' || github.event.comment.body == 'Sky #363｜查詢最近一次掃描報告' || github.event.comment.body == 'Sky #363 保全查核')) && format('sky-chat-ignored-{0}', github.run_id)) || (github.event_name == 'issue_comment' && (github.event.comment.body == 'Sky 警戒' || github.event.comment.body == 'Sky #363｜查詢最近一次掃描報告') && format('sky-alert-readonly-{0}', github.event.comment.id)) || (github.event_name == 'issue_comment' && github.event.comment.body == 'Sky #363 保全查核' && format('sky-w0-readonly-{0}', github.event.comment.id)) || (github.event_name == 'issue_comment' && github.event.comment.body == 'SKY維持率' && github.event.issue.number == 363 && github.event.comment.user.login == github.repository_owner && github.event.comment.author_association == 'OWNER' && format('sky-margin-readonly-{0}', github.event.comment.id)) || (github.event_name == 'workflow_dispatch' && inputs.w0_comment_id != '' && format('sky-w0-discovery-{0}', github.run_id)) || 'sky-fugle-paid-global-research-v1-live-wholemarket' }}"
  cancel-in-progress: false
jobs:
  scan:
    # Only the repository owner may request exactly Sky 快掃 on #363.
    if: >-
      (github.event_name != 'issue_comment' ||
      (github.event.issue.number == 363 &&
       github.event.comment.user.login == github.repository_owner &&
       github.event.comment.author_association == 'OWNER' &&
       (github.event.comment.body == 'Sky 快掃' ||
        github.event.comment.body == 'Sky 當沖快掃' ||
        github.event.comment.body == 'Sky 快掃更新' ||
        github.event.comment.body == 'Sky 當沖現在掃一次' ||
        github.event.comment.body == 'Sky v1.4 Dynamic Capital Rotation 掃一下'))) &&
      github.event.comment.body != 'Sky 警戒' &&
      (github.event_name != 'workflow_dispatch' || inputs.w0_comment_id == '')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Assign a unique request ID to each authorized on-demand research scan
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'issue_comment'
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from src.sky_chat_bridge import bind_issue_comment_command, validate_request
          p = Path("scan_requests/chat/latest.json")
          payload = json.loads(p.read_text(encoding="utf-8"))
          # For an issue-comment trigger, bind the exact authorized command to
          # this run before validation; never trust the shared file's stale alias.
          if os.environ.get("GITHUB_EVENT_NAME") == "issue_comment":
              event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
              payload = bind_issue_comment_command(payload, event)
          # Validate the event-bound command and the read-only policy before reserving paid API.
          validate_request(payload)
          run_id = os.environ["GITHUB_RUN_ID"]
          attempt = os.environ["GITHUB_RUN_ATTEMPT"]
          if not run_id.isdecimal() or not attempt.isdecimal():
              raise SystemExit("INVALID_MANUAL_RUN_IDENTITY")
          payload["request_id"] = f"manual-sky-{run_id}-{attempt}"
          payload["reason"] = "Manual GitHub Actions research-only scan; no orders"
          p.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print("MANUAL_RESEARCH_REQUEST_ID:" + payload["request_id"])
          PY
      - name: Verify paid reservation contracts without Fugle
        run: python -m unittest tests.test_sky_fugle_request_identity tests.test_sky_paid_fugle_api_guard -v
      - name: Reserve shared Fugle paid API slot (fail closed)
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m research.sky_paid_fugle_api_guard --scope 'sky:live:wholemarket' --monthly-rate-limited
      - name: Publish reservation before any paid request
        id: claim
        if: steps.guard.outputs.allowed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.guard.outputs.claim_name }}
          path: output/fugle_api_guard/claim.json
          if-no-files-found: error
          retention-days: 2
      - name: Verify reservation ZIP independently (fail closed)
        id: verify_claim
        if: steps.guard.outputs.allowed == 'true' && steps.claim.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m research.sky_paid_fugle_api_guard --scope 'sky:live:wholemarket' --monthly-rate-limited --verify
      - name: Run read-only paid Fugle observations (market or after-market)
        id: bridge
        if: steps.guard.outputs.allowed == 'true' && steps.verify_claim.outcome == 'success'
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
          SKY_FUGLE_ONLY_MARKETDATA: '1'
          SKY_FUGLE_MONTHLY_RATE_CONTROL: '1'
          GH_TOKEN: ${{ github.token }}
        run: python -m src.sky_chat_bridge
      - name: Preserve denied reservation as NO_TRADE status
        if: always()
        env:
          GUARD_ALLOWED: ${{ steps.guard.outputs.allowed }}
          GUARD_OUTCOME: ${{ steps.guard.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify_claim.outcome }}
          BRIDGE_OUTCOME: ${{ steps.bridge.outcome }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from src.sky_chat_bridge import validate_request
          request_id = None
          try:
              payload=json.loads(Path("scan_requests/chat/latest.json").read_text(encoding="utf-8"))
              request_id=validate_request(payload)
          except (OSError, ValueError, TypeError, KeyError):
              pass
          p=Path("output/chat_bridge/latest.json")
          if not p.exists():
              p.parent.mkdir(parents=True,exist_ok=True)
              # Preserve the exact reservation decision for diagnosis; never
              # turn a duplicate/denied request into a successful scan.
              guard_receipt=Path("output/fugle_api_guard/claim.json")
              guard={}
              try:
                  loaded=json.loads(guard_receipt.read_text(encoding="utf-8"))
                  if isinstance(loaded,dict) and loaded.get("schema")=="SKY_PAID_FUGLE_RESERVATION_V1":
                      guard=loaded
              except (OSError,ValueError,TypeError):
                  pass
              reason=(guard.get("reason") if os.getenv("GUARD_OUTCOME")=="success"
                      and os.getenv("GUARD_ALLOWED")!="true"
                      and guard.get("status")=="DUPLICATE_BLOCKED"
                      and guard.get("reason") in ("RECENT_RESERVATION",)
                      else "RESERVATION_OR_SCAN_NOT_VERIFIED")
              p.write_text(json.dumps({
                  "schema":"SKY_CHAT_SCAN_STATUS_V1",
                  "status":"FAILED_CLOSED",
                  "scan_id":os.getenv("GITHUB_RUN_ID"),
                  "request_id":request_id,
                  "head_sha":os.getenv("GITHUB_SHA"),
                  "block_reason":reason,
                  "production_eligible":False,
                  "automatic_order":False,
                  "trade_action":"禁止交易",
              },ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
      - name: Upload complete 13-column report and status
        id: upload_report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-chat-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            output/chat_bridge/latest.json
            output/sky_quickscan_information/latest_13col.json
            output/sky_quickscan_information/latest_13col.md
            output/sky_quickscan_information/full_universe.json
            output/sky_quickscan_information/stage1_candidates.json
            output/sky_quickscan_information/stage2_quote_evidence.json
            output/sky_quickscan_information/v14_ticker_5m_evidence.json
            output/sky_quickscan_information/candidate_e2e_chain.json
            output/sky_quickscan_information/candidate_e2e_chain.md
          if-no-files-found: warn
          retention-days: 90
      - name: Download and independently verify same-run Artifact (read-only)
        if: ${{ steps.bridge.outcome == 'success' }}
        id: external_readback
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/sky-chat-readback output/chat_bridge_readback
          for DELAY in 1 4 5 5 5 0; do
            if gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "sky-chat-$GITHUB_RUN_ID-attempt-$GITHUB_RUN_ATTEMPT" --dir /tmp/sky-chat-readback; then
              break
            fi
            if [ "$DELAY" = 0 ]; then
              echo "SAME_RUN_ARTIFACT_NOT_READABLE" >&2
              exit 1
            fi
            sleep "$DELAY"
          done
          HEAD_SHA=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.head_sha')
          ARTIFACT_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" | python -c 'import json,os,sys; a=json.load(sys.stdin)["artifacts"]; n="sky-chat-"+os.environ["GITHUB_RUN_ID"]+"-attempt-"+os.environ["GITHUB_RUN_ATTEMPT"]; print(next((x["id"] for x in a if x["name"]==n), ""))')
          REQUEST_ID=$(python -c 'import json; print(json.load(open("scan_requests/chat/latest.json",encoding="utf-8"))["request_id"])')
          python -m scripts.sky_chat_artifact_readback \
            --directory /tmp/sky-chat-readback \
            --run-id "$GITHUB_RUN_ID" --request-id "$REQUEST_ID" \
            --head-sha "$HEAD_SHA" --expected-sha "$GITHUB_SHA" \
            --artifact-id "$ARTIFACT_ID" \
            --receipt output/chat_bridge_readback/external_receipt.json
      - name: Preserve external readback failure as NO_TRADE diagnostic
        if: always()
        env:
          READBACK_OUTCOME: ${{ steps.external_readback.outcome }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path("output/chat_bridge_readback/external_receipt.json")
          p.parent.mkdir(parents=True,exist_ok=True)
          if os.environ.get("READBACK_OUTCOME")!="success":
              p.write_text(json.dumps({"schema":"SKY_CHAT_EXTERNAL_ARTIFACT_READBACK_V1","status":"FAILED_CLOSED","reason":"EXTERNAL_ARTIFACT_READBACK_NOT_VERIFIED","run_id":os.getenv("GITHUB_RUN_ID"),"head_sha":os.getenv("GITHUB_SHA"),"production_eligible":False,"automatic_order":False,"trade_action":"禁止交易"},ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
      - name: Upload independent same-run readback receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-chat-external-readback-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: output/chat_bridge_readback/external_receipt.json
          if-no-files-found: error
          retention-days: 90
      - name: Enforce complete research-readback run status (fail closed)
        if: always()
        env:
          GUARD_ALLOWED: ${{ steps.guard.outputs.allowed }}
          CLAIM_OUTCOME: ${{ steps.claim.outcome }}
          VERIFIED_CLAIM_OUTCOME: ${{ steps.verify_claim.outcome }}
          BRIDGE_OUTCOME: ${{ steps.bridge.outcome }}
          READBACK_OUTCOME: ${{ steps.external_readback.outcome }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path("output/chat_bridge_readback/external_receipt.json")
          try:
              receipt=json.loads(p.read_text(encoding="utf-8"))
          except (OSError,ValueError,TypeError):
              receipt={}
          request_path=Path("scan_requests/chat/latest.json")
          try:
              request=json.loads(request_path.read_text(encoding="utf-8"))
              expected_request_id=request.get("request_id")
          except (OSError,ValueError,TypeError,AttributeError):
              expected_request_id=None
          ok=(os.getenv("GUARD_ALLOWED")=="true"
              and os.getenv("CLAIM_OUTCOME")=="success"
              and os.getenv("VERIFIED_CLAIM_OUTCOME")=="success"
              and os.getenv("BRIDGE_OUTCOME")=="success"
              and os.getenv("READBACK_OUTCOME")=="success"
              and isinstance(receipt,dict)
              and receipt.get("schema")=="SKY_CHAT_EXTERNAL_ARTIFACT_READBACK_V1"
              and receipt.get("status")=="PASS_RESEARCH_ONLY"
              and isinstance(expected_request_id,str)
              and receipt.get("request_id")==expected_request_id
              and str(receipt.get("artifact_id","")).isdecimal()
              and int(receipt.get("artifact_id",0))>0
              and isinstance(receipt.get("row_count"),int)
              and receipt.get("row_count")>0
              and str(receipt.get("run_id"))==os.getenv("GITHUB_RUN_ID")
              and receipt.get("head_sha")==os.getenv("GITHUB_SHA")
              and receipt.get("production_eligible") is False
              and receipt.get("automatic_order") is False)
          if not ok:
              raise SystemExit("RESEARCH_READBACK_NOT_VERIFIED_NO_TRADE")
          print("RESEARCH_READBACK_VERIFIED_NO_ORDERS")
          PY
      - name: Show safe mobile-readable research result in GitHub Actions summary
        if: always()
        env:
          REPORT_ARTIFACT_URL: ${{ steps.upload_report.outputs.artifact-url }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          def load(path):
              try:
                  value=json.loads(Path(path).read_text(encoding="utf-8"))
                  return value if isinstance(value,dict) else {}
              except (OSError,ValueError,TypeError):
                  return {}
          status=load("output/chat_bridge/latest.json")
          receipt=load("output/chat_bridge_readback/external_receipt.json")
          request=load("scan_requests/chat/latest.json")
          run=os.environ["GITHUB_RUN_ID"]
          sha=os.environ["GITHUB_SHA"]
          rid=request.get("request_id")
          verified=(status.get("scan_id")==run
                    and status.get("head_sha")==sha
                    and status.get("request_id")==rid
                    and status.get("status")=="REPORT_READY_RESEARCH_ONLY"
                    and receipt.get("schema")=="SKY_CHAT_EXTERNAL_ARTIFACT_READBACK_V1"
                    and receipt.get("status")=="PASS_RESEARCH_ONLY"
                    and receipt.get("run_id")==run
                    and receipt.get("head_sha")==sha
                    and receipt.get("request_id")==rid
                    and receipt.get("production_eligible") is False
                    and receipt.get("automatic_order") is False)
          blocked=receipt.get("status")=="FAILED_CLOSED"
          outcome=("研究報告已獨立讀回" if verified else
                   "安全阻擋，未產生可驗收報告" if blocked else
                   "未通過完整讀回驗收")
          lines=["## Sky 快掃｜手機可讀研究結果","",outcome,"",
                 f"- Run ID: `{run}`",
                 f"- Request ID: `{rid if isinstance(rid,str) and rid.isascii() else '未取得'}`",
                 f"- 資料筆數：`{receipt.get('row_count',0) if verified else 0}`",
                 f"- 阻擋原因：`{status.get('block_reason')}`" if not verified and status.get("block_reason") else "- 驗收：僅研究用途",
                 "- 交易資格：禁止交易",
                 "- 自動下單：停用"]
          url=os.environ.get("REPORT_ARTIFACT_URL","")
          if verified and url.startswith("https://github.com/"):
              lines.append(f"- [同次研究報告]({url})")
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as out:
              out.write("\n".join(lines)+"\n")
          PY
      # The protected main branch cannot be written directly from a workflow.
      # The uploaded per-run artifact above is the immutable status/readback source.

  alert_readonly:
    # Existing workflow, isolated read-only job. No Fugle secrets, no reservation.
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 363 &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.author_association == 'OWNER' &&
      (github.event.comment.body == 'Sky 警戒' ||
       github.event.comment.body == 'Sky #363｜查詢最近一次掃描報告')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing project requirements (no market API)
        run: pip install -r requirements.txt
      - name: Read-only alert tests
        run: python -m unittest tests.test_sky_alert_reader tests.test_sky_alert_chat_readback -v
      - name: Read existing scan Artifact, never request Fugle
        id: alert_source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m scripts.sky_alert_chat_readback \
            --output output/sky_alert_chat/receipt.json \
            --markdown output/sky_alert_chat/receipt.md
      - name: Preserve failures as NO_TRADE receipt
        if: always()
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path("output/sky_alert_chat/receipt.json")
          if not p.is_file():
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_text(json.dumps({
                 "schema":"SKY_ALERT_CHAT_RECEIPT_V1",
                 "run_id":os.environ["GITHUB_RUN_ID"],"head_sha":os.environ["GITHUB_SHA"],
                 "status":"FAILED_CLOSED","reason":"SOURCE_OR_READBACK_NOT_VERIFIED",
                 "production_eligible":False,"automatic_order":False,
                 "trade_action":"禁止交易"},ensure_ascii=False)+"\n",encoding="utf-8")
          PY
      - name: Upload existing-data alert evidence
        id: alert_upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-alert-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: output/sky_alert_chat/
          if-no-files-found: error
          retention-days: 90
      - name: Verify independent same-run alert receipt
        if: always() && steps.alert_upload.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/sky-alert-external output/sky_alert_chat_external
          for N in 1 2 3 4 5; do
            if gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "sky-alert-$GITHUB_RUN_ID-attempt-$GITHUB_RUN_ATTEMPT" --dir /tmp/sky-alert-external; then break; fi
            if [ "$N" = 5 ]; then exit 1; fi
            sleep 5
          done
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          original=Path("output/sky_alert_chat/receipt.json").read_bytes()
          downloaded=Path("/tmp/sky-alert-external/receipt.json").read_bytes()
          if hashlib.sha256(original).digest()!=hashlib.sha256(downloaded).digest():
              raise SystemExit("ALERT_SAME_RUN_HASH_MISMATCH")
          obj=json.loads(downloaded)
          if (obj.get("schema")!="SKY_ALERT_CHAT_RECEIPT_V1"
              or obj.get("run_id")!=os.environ["GITHUB_RUN_ID"]
              or obj.get("head_sha")!=os.environ["GITHUB_SHA"]
              or obj.get("production_eligible") is not False
              or obj.get("automatic_order") is not False
              or obj.get("trade_action")!="禁止交易"):
              raise SystemExit("ALERT_SAME_RUN_INVARIANT_FAILED")
          status="PASS_RESEARCH_ONLY" if obj.get("source") and obj.get("freshness_status") else "HOLD_FAIL_CLOSED"
          receipt={"schema":"SKY_ALERT_CHAT_EXTERNAL_READBACK_V1","status":status,
                   "run_id":obj["run_id"],"head_sha":obj["head_sha"],
                   "source":obj.get("source"),"freshness_status":obj.get("freshness_status"),
                   "production_eligible":False,"automatic_order":False,"trade_action":"禁止交易"}
          Path("output/sky_alert_chat_external/receipt.json").write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print("SKY_ALERT_INDEPENDENT_READBACK",status)
          PY
      - name: Upload independent alert receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-alert-external-readback-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: output/sky_alert_chat_external/receipt.json
          if-no-files-found: warn
          retention-days: 90
      - name: Mobile-safe alert summary
        if: always()
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          try: r=json.loads(Path("output/sky_alert_chat/receipt.json").read_text(encoding="utf-8"))
          except (OSError,ValueError): r={}
          src=r.get("source") or {}
          lines=["## Sky 既有掃描報告｜唯讀 Artifact",
                 "Run ID: "+os.environ["GITHUB_RUN_ID"],
                 "來源 Run: "+str(src.get("source_run_id","未確認")),
                 "來源 Artifact: "+str(src.get("source_artifact_id","未確認")),
                 "來源時間: "+str(r.get("source_checked_at_tpe","待確認")),
                 "讀取狀態: "+str(r.get("freshness_status","HOLD_FAIL_CLOSED")),
                 "🔴 禁止交易。歷史觀察不等於即時成交；零付費 API。"]
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as f:
              f.write("\n".join(lines)+"\n")
          PY


  margin_readonly_command:
    # This job records a real command receipt only; it NEVER runs a margin scan.
    # Owner + W0 issue + exact command are mandatory.
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 363 &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.author_association == 'OWNER' &&
      github.event.comment.body == 'SKY維持率'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test margin owner-only trigger and readback security
        run: python -m unittest tests.test_sky_margin_trigger_receipt -v
      - name: Create authenticated no-trade HOLD receipt (no market API)
        env:
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          set -euo pipefail
          python -m src.sky_margin_trigger_receipt \
            --event "$GITHUB_EVENT_PATH" --repo "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --sha "$GITHUB_SHA" \
            --output output/sky_margin_command/hold_receipt.json
      - name: Read most recent existing full-market A1 prices (no Fugle API)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m scripts.sky_margin_priceonly_readback \\
            --output output/sky_margin_command/priceonly_observation.json
      - name: Upload same-run margin HOLD receipt
        id: margin_upload
        uses: actions/upload-artifact@v4
        with:
          name: sky-margin-hold-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: output/sky_margin_command/hold_receipt.json
          if-no-files-found: error
          retention-days: 90
      - name: Independently download and verify exact same-run artifact
        if: steps.margin_upload.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/sky-margin-hold-readback output/sky_margin_command_external
          for N in 1 2 3 4 5; do
            if gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name "sky-margin-hold-$GITHUB_RUN_ID-attempt-$GITHUB_RUN_ATTEMPT" \
              --dir /tmp/sky-margin-hold-readback; then break; fi
            if [ "$N" = 5 ]; then exit 1; fi
            sleep 5
          done
          ARTIFACT_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" | python -c 'import json,os,sys; a=json.load(sys.stdin)["artifacts"]; n="sky-margin-hold-"+os.environ["GITHUB_RUN_ID"]+"-attempt-"+os.environ["GITHUB_RUN_ATTEMPT"]; hits=[x["id"] for x in a if x["name"]==n]; assert len(hits)==1, "MARGIN_ARTIFACT_ID_AMBIGUOUS"; print(hits[0])')
          export ARTIFACT_ID
          python -m src.sky_margin_trigger_receipt \
            --verify-original output/sky_margin_command/hold_receipt.json \
            --verify-downloaded /tmp/sky-margin-hold-readback/hold_receipt.json \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --sha "$GITHUB_SHA" --comment-id "$COMMENT_ID" \
            --output output/sky_margin_command_external/readback_receipt.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path("output/sky_margin_command_external/readback_receipt.json")
          obj=json.loads(p.read_text(encoding="utf-8"))
          obj["artifact_id"]=int(os.environ["ARTIFACT_ID"])
          p.write_text(json.dumps(obj,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print("SKY_MARGIN_HOLD_RECEIPT_INDEPENDENT_READBACK",obj["status"])
          PY
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          first=Path("output/sky_margin_command/priceonly_observation.json").read_bytes()
          second=Path("/tmp/sky-margin-hold-readback/priceonly_observation.json").read_bytes()
          if hashlib.sha256(first).digest()!=hashlib.sha256(second).digest():
              raise SystemExit("MARGIN_PRICEONLY_SAME_RUN_HASH_MISMATCH")
          obj=json.loads(second)
          if (obj.get("schema")!="SKY_MARGIN_EXISTING_A1_PRICE_OBSERVATION_V1"
              or obj.get("command")!="SKY維持率"
              or obj.get("run_id")!=os.environ["GITHUB_RUN_ID"]
              or obj.get("run_attempt")!=os.environ["GITHUB_RUN_ATTEMPT"]
              or obj.get("head_sha")!=os.environ["GITHUB_SHA"]
              or obj.get("real_margin_scan_verified") is not False
              or obj.get("production_eligible") is not False
              or obj.get("automatic_order") is not False
              or obj.get("trade_action")!="禁止交易"):
              raise SystemExit("MARGIN_PRICEONLY_READBACK_GUARD")
          if obj.get("status")=="DATED_A1_PRICE_RESEARCH_ONLY":
              rows=obj.get("preview")
              if (not isinstance(rows,list) or len(rows)>10
                  or any(not isinstance(r,dict)
                         or r.get("executed_trade_verified") is not False
                         or r.get("margin_maintenance_ratio_verified") is not False
                         or r.get("production_eligible") is not False
                         or r.get("action")!="觀察" for r in rows)):
                  raise SystemExit("MARGIN_PRICEONLY_PREVIEW_GUARD")
          receipt=Path("output/sky_margin_command_external/readback_receipt.json")
          body=json.loads(receipt.read_text(encoding="utf-8"))
          body["priceonly_readback_status"]=obj["status"]
          body["priceonly_sha256"]=hashlib.sha256(second).hexdigest()
          body["priceonly_observed_count"]=obj.get("price_below_100_observation_count")
          body["priceonly_source_run_id"]=obj.get("source_run_id")
          body["priceonly_source_artifact_id"]=obj.get("source_artifact_id")
          body["priceonly_source_freshness_status"]=obj.get("source_freshness_status")
          body["priceonly_trade_eligible"]=False
          receipt.write_text(json.dumps(body,ensure_ascii=False,indent=2)+"\\n",encoding="utf-8")
          print("SKY_MARGIN_PRICEONLY_INDEPENDENT_READBACK",obj["status"])
          PY
      - name: Upload independent readback receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-margin-hold-readback-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: output/sky_margin_command_external/readback_receipt.json
          if-no-files-found: warn
          retention-days: 90


      - name: Publish sanitized independently verified HOLD receipt to #363
        # Readback is a separate verified result; never disclose user holdings,
        # raw API responses, secrets, or quote payloads in this public repository.
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path("output/sky_margin_command_external/readback_receipt.json")
          r=json.loads(p.read_text(encoding="utf-8"))
          if (r.get("status")!="PASS_HOLD_RECEIPT_INTEGRITY_ONLY"
              or r.get("run_id")!=os.environ["GITHUB_RUN_ID"]
              or r.get("head_sha")!=os.environ["GITHUB_SHA"]
              or r.get("attempt")!=os.environ["GITHUB_RUN_ATTEMPT"]
              or r.get("real_margin_scan_verified") is not False
              or r.get("production_eligible") is not False
              or r.get("trade_action")!="禁止交易"
              or not isinstance(r.get("artifact_id"),int) or r["artifact_id"]<=0):
              raise SystemExit("MARGIN_PUBLIC_RECEIPT_VALIDATION_FAILED")
          lines=[
              "## SKY維持率｜授權 GitHub 觸發及獨立讀回（非選股）",
              "- 驗收：`PASS_HOLD_RECEIPT_INTEGRITY_ONLY`",
              "- Run ID："+r["run_id"]+"／attempt："+r["attempt"],
              "- HEAD SHA："+r["head_sha"],
              "- 來源指令留言 ID："+str(r["trigger_comment_id"]),
              "- Artifact ID："+str(r["artifact_id"]),
              "- 收據 SHA256："+r["sha256"],
              "- 真實全市場維持率資料／候選排名：`HOLD_PRICE_ONLY_REAL_SOURCE`",
              "- 盤中／盤後最近既有 A1 價格研究讀回："+str(r.get("priceonly_readback_status","HOLD")),
              "- 價格研究來源 Run："+str(r.get("priceonly_source_run_id") or "待確認"),
              "- 價格研究觀察數："+str(r.get("priceonly_observed_count") if r.get("priceonly_observed_count") is not None else "待確認"),
              "- 觀察價格非 A2 成交認證、不是真實融資維持率／可買推薦。",
              "- ChatGPT 原生自動直連：`HOLD_CHATGPT_NATIVE_ROUTING`",
              "- 交易：`NO_TRADE`；未取得認證行情、沒有可買進標的或張數。",
          ]
          Path("/tmp/sky-margin-public-receipt.md").write_text("\n".join(lines)+"\n",encoding="utf-8")
          PY
          gh issue comment 363 --repo "$GITHUB_REPOSITORY" --body-file /tmp/sky-margin-public-receipt.md
  w0_run_discovery:
    # W0-only read-only reconciliation; never calls Fugle or starts scan job.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.w0_comment_id != '') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 363 &&
       github.event.comment.user.login == github.repository_owner &&
       github.event.comment.author_association == 'OWNER' &&
       github.event.comment.body == 'Sky #363 保全查核')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
      issues: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline read-only discovery tests
        run: python -m unittest tests.test_sky_w0_run_discovery -v
      - name: Discover runs and artifacts (no market API)
        id: discovery
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_COMMENT_ID: ${{ github.event_name == 'issue_comment' && github.event.comment.id || inputs.w0_comment_id || '' }}
          COMMENT_EVENT_TIME: ${{ github.event_name == 'issue_comment' && github.event.comment.created_at || '' }}
          WINDOW_START: ${{ inputs.w0_start || '2026-11-23T05:20:00Z' }}
          WINDOW_END: ${{ inputs.w0_end || '2026-11-23T05:30:00Z' }}
        run: |
          set -euo pipefail
          # Missing identity must fail closed; never borrow an unrelated historical comment.
          test -n "$TARGET_COMMENT_ID" || { echo "W0_COMMENT_ID_REQUIRED" >&2; exit 1; }
          # Issue comments use their own identity and a bounded, past-only time window.
          # Historical preservation remains available through explicit dispatch inputs.
          if [ -n "$COMMENT_EVENT_TIME" ]; then
            WINDOW_START="$(python -c 'import datetime,os; t=datetime.datetime.fromisoformat(os.environ["COMMENT_EVENT_TIME"].replace("Z","+00:00")); print((t-datetime.timedelta(minutes=10)).isoformat())')"
            # Include runs started after the issue comment, but never search into the future.
            WINDOW_END="$(python -c 'import datetime; print(datetime.datetime.now(datetime.timezone.utc).isoformat())')"
          fi
          python -m scripts.sky_w0_run_discovery \
            --comment-id "$TARGET_COMMENT_ID" --start "$WINDOW_START" \
            --end "$WINDOW_END" --output output/w0_evidence/run_discovery.json
      - name: Preserve failed discovery as no-trade evidence
        if: always()
        env:
          DISCOVERY_OUTCOME: ${{ steps.discovery.outcome }}
          TARGET_COMMENT_ID: ${{ github.event_name == 'issue_comment' && github.event.comment.id || inputs.w0_comment_id || '' }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path("output/w0_evidence/run_discovery.json")
          if not p.is_file():
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(json.dumps({
                  "schema": "SKY_W0_RUN_DISCOVERY_V1",
                  "status": "HOLD_DISCOVERY_FAILED",
                  "error_type": "DISCOVERY_STEP_" + os.getenv("DISCOVERY_OUTCOME", "unknown").upper(),
                  "target_comment_id": os.getenv("TARGET_COMMENT_ID") or None,
                  "comment_to_run_status": "HOLD_UNCORRELATED",
                  "market_capture_status": "HOLD_UNVERIFIED",
                  "discovery_run_id": os.getenv("GITHUB_RUN_ID"),
                  "discovery_head_sha": os.getenv("GITHUB_SHA"),
                  "production_eligible": False,
                  "automatic_order": False,
                  "trade_action": "禁止交易",
              }, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Upload discovery artifact
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-w0-discovery-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: output/w0_evidence/run_discovery.json
          if-no-files-found: error
          retention-days: 90
      - name: Independent same-run identity and SHA256 readback
        if: steps.upload.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/sky-w0-readback output/w0_evidence_external
          for DELAY in 1 4 5 5 5 0; do
            if gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name "sky-w0-discovery-$GITHUB_RUN_ID-attempt-$GITHUB_RUN_ATTEMPT" \
              --dir /tmp/sky-w0-readback; then break; fi
            if [ "$DELAY" = 0 ]; then exit 1; fi
            sleep "$DELAY"
          done
          ARTIFACT_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" | python -c 'import json,os,sys; a=json.load(sys.stdin)["artifacts"]; name="sky-w0-discovery-"+os.environ["GITHUB_RUN_ID"]+"-attempt-"+os.environ["GITHUB_RUN_ATTEMPT"]; hits=[x["id"] for x in a if x["name"]==name]; assert len(hits)==1, "DISCOVERY_ARTIFACT_AMBIGUOUS"; print(hits[0])')
          test -n "$ARTIFACT_ID"
          export ARTIFACT_ID
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          original=Path("output/w0_evidence/run_discovery.json").read_bytes()
          readback=Path("/tmp/sky-w0-readback/run_discovery.json").read_bytes()
          if hashlib.sha256(original).digest()!=hashlib.sha256(readback).digest():
              raise SystemExit("W0_DISCOVERY_SHA256_MISMATCH")
          obj=json.loads(readback)
          if (obj.get("schema")!="SKY_W0_RUN_DISCOVERY_V1"
              or obj.get("discovery_run_id")!=os.environ["GITHUB_RUN_ID"]
              or obj.get("discovery_head_sha")!=os.environ["GITHUB_SHA"]
              or obj.get("production_eligible") is not False
              or obj.get("automatic_order") is not False
              or obj.get("trade_action")!="禁止交易"):
              raise SystemExit("W0_DISCOVERY_RUN_IDENTITY_INVALID")
          attestation=obj.get("trigger_event_attestation")
          if not isinstance(attestation,dict):
              raise SystemExit("W0_DISCOVERY_TRIGGER_ATTESTATION_MISSING")
          if os.environ.get("GITHUB_EVENT_NAME")=="issue_comment":
              event=json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
              comment=event.get("comment") or {}
              issue=event.get("issue") or {}
              repository=event.get("repository") or {}
              if (attestation.get("status")!="PASS_THIS_RUN_TRIGGER_EVENT_ATTESTED_RESEARCH_ONLY"
                  or attestation.get("trigger_comment_id")!=comment.get("id")
                  or attestation.get("trigger_comment_id")!=obj.get("target_comment_id")
                  or attestation.get("trigger_run_id")!=int(os.environ["GITHUB_RUN_ID"])
                  or attestation.get("trigger_head_sha")!=os.environ["GITHUB_SHA"]
                  or comment.get("body")!="Sky #363 保全查核"
                  or comment.get("author_association")!="OWNER"
                  or (comment.get("user") or {}).get("login")!=os.environ["GITHUB_REPOSITORY"].split("/")[0]
                  or issue.get("number")!=363
                  or repository.get("full_name")!=os.environ["GITHUB_REPOSITORY"]):
                  raise SystemExit("W0_DISCOVERY_TRIGGER_ATTESTATION_MISMATCH")
          elif attestation.get("status")!="HOLD_TRIGGER_EVENT_UNATTESTED":
              raise SystemExit("W0_DISCOVERY_TRIGGER_EVENT_UNEXPECTED_PASS")
          receipt={"schema":"SKY_W0_DISCOVERY_EXTERNAL_READBACK_V1",
                   "status":"PASS_ARTIFACT_INTEGRITY_RESEARCH_ONLY",
                   "run_id":os.environ["GITHUB_RUN_ID"],"head_sha":os.environ["GITHUB_SHA"],
                   "artifact_id":int(os.environ["ARTIFACT_ID"]),
                   "sha256":hashlib.sha256(readback).hexdigest(),
                   "market_capture_status":obj.get("market_capture_status"),
                   "comment_to_run_status":obj.get("comment_to_run_status"),
                   "trigger_event_attestation_status":attestation.get("status"),
                   "trigger_comment_id":attestation.get("trigger_comment_id"),
                   "production_eligible":False,"automatic_order":False,"trade_action":"禁止交易"}
          Path("output/w0_evidence_external/receipt.json").write_text(
              json.dumps(receipt,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print("W0_DISCOVERY_INDEPENDENT_READBACK",receipt["status"])
          PY
      - name: Upload independent readback receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-w0-discovery-readback-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: output/w0_evidence_external/receipt.json
          if-no-files-found: warn
          retention-days: 90
