name: Sky Chat On-Demand Scan Bridge
on:
  push:
    branches: [main]
    paths:
      - 'scan_requests/chat/latest.json'
  workflow_dispatch:
    inputs:
      command:
        description: 'Read-only Sky command; use_saved_request keeps the checked-in request'
        required: false
        default: 'use_saved_request'
        type: choice
        options:
          - 'use_saved_request'
          - 'Sky 快掃'
          - 'Sky 快掃更新'
          - 'Sky 當沖現在掃一次'
          - 'Sky 當沖快掃'
          - 'Sky v1.4 Dynamic Capital Rotation 掃一下'
      request_id:
        description: 'Optional unique request ID; blank generates chat-dispatch-RUN_ID'
        required: false
        type: string
permissions:
  contents: write
  actions: read
concurrency:
  group: sky-fugle-paid-global-research-v1-live-wholemarket
  cancel-in-progress: false
jobs:
  scan:
    # The research acceptance branch requires a fresh, explicit command.
    if: >-
      ${{ github.ref != 'refs/heads/research/sky-mobile-paper-integration' ||
          (github.event_name == 'workflow_dispatch' &&
           inputs.command != '' && inputs.command != 'use_saved_request') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Apply safe optional dispatch alias to existing request (no repository write)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.command != '' && inputs.command != 'use_saved_request' }}
        env:
          SKY_DISPATCH_COMMAND: ${{ inputs.command }}
          SKY_DISPATCH_REQUEST_ID: ${{ inputs.request_id }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from src.sky_chat_bridge import validate_request
          request_id = os.getenv("SKY_DISPATCH_REQUEST_ID") or ("chat-dispatch-" + os.environ["GITHUB_RUN_ID"])
          payload = {
              "command": os.environ["SKY_DISPATCH_COMMAND"],
              "request_id": request_id,
              "read_only_no_orders": True,
              "reason": "Explicit workflow_dispatch request; research only, no orders",
          }
          validate_request(payload)
          Path("scan_requests/chat/latest.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps({"request_id": request_id, "command": payload["command"],
                            "read_only_no_orders": True}, ensure_ascii=False))
          PY
      - name: Verify paid API guard safety contracts (offline)
        run: python -m unittest tests.test_sky_paid_fugle_api_guard -v
      - name: Reserve shared Fugle paid API slot (fail closed)
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Paid API quota is not inferred from the monthly subscription price.
          # Record a conservative per-run budget without claiming official limits.
          mkdir -p output/fugle_api_guard
          python - <<'PY'
          import json
          from pathlib import Path
          Path("output/fugle_api_guard/subscription_policy.json").write_text(
              json.dumps({
                  "schema": "SKY_FUGLE_SUBSCRIPTION_POLICY_V1",
                  "billing_model": "MONTHLY_SUBSCRIPTION",
                  "provider_request_limit_verified": False,
                  "provider_request_limit": None,
                  "quota_enforcement": "PROVIDER_LIMIT_UNKNOWN_FAIL_CLOSED",
                  "dedup_scope": "sky:live:wholemarket",
                  "cross_workflow_data_reuse_verified": False,
                  "automatic_order": False,
                  "production_eligible": False
              }, indent=2) + "\n", encoding="utf-8")
          PY
          # A subscription is not an unlimited rate-limit grant. Recheck only
          # GitHub reservation metadata while another paid observation is recent.
          # Never issue a Fugle call or upload a claim until a fresh slot is clear.
          for attempt in {1..7}; do
            python -m research.sky_paid_fugle_api_guard --scope 'sky:live:wholemarket'
            result=$(python -c 'import json; from pathlib import Path; p=Path("output/fugle_api_guard/claim.json"); print(json.loads(p.read_text())["status"] if p.exists() else "MISSING")')
            if [[ "$result" == "CLAIM_REQUIRED_BEFORE_PAID_API" ]]; then
              echo "FUGLE_RESERVATION_READY_AFTER_ATTEMPT=$attempt"
              exit 0
            fi
            reason=$(python -c 'import json; from pathlib import Path; print(json.loads(Path("output/fugle_api_guard/claim.json").read_text()).get("reason","UNKNOWN"))')
            if [[ "$result" != "DUPLICATE_BLOCKED" || "$reason" != "RECENT_RESERVATION" ]]; then
              echo "FUGLE_RESERVATION_FAIL_CLOSED:$result:$reason"
              exit 1
            fi
            if [[ "$attempt" == 7 ]]; then
              echo "FUGLE_RESERVATION_WAIT_EXHAUSTED_NO_PAID_CALL"
              exit 1
            fi
            echo "FUGLE_RECENT_RESERVATION_WAITING_60_SECONDS_ATTEMPT=$attempt"
            sleep 60
          done
      - name: Publish reservation before any paid call
        id: claim
        if: steps.guard.outputs.allowed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.guard.outputs.claim_name }}
          path: output/fugle_api_guard/claim.json
          if-no-files-found: error
          retention-days: 2
      - name: Verify reservation ZIP content independently (fail closed)
        id: verify_claim
        if: steps.guard.outputs.allowed == 'true' && steps.claim.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m research.sky_paid_fugle_api_guard --scope 'sky:live:wholemarket' --verify
      - name: Run read-only paid Fugle observations (market or after-market)
        if: steps.guard.outputs.allowed == 'true' && steps.verify_claim.outcome == 'success'
        id: bridge
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          SKY_PAID_ATOMIC_ENFORCE: '1'
          SKY_FUGLE_ONLY_MARKETDATA: '1'
        run: python -m src.sky_chat_bridge
      - name: Verify status and preserve a failed-run diagnostic
        if: always()
        env:
          BRIDGE_OUTCOME: ${{ steps.bridge.outcome }}
          GUARD_OUTCOME: ${{ steps.guard.outcome }}
          GUARD_ALLOWED: ${{ steps.guard.outputs.allowed }}
          CLAIM_OUTCOME: ${{ steps.claim.outcome }}
          VERIFY_CLAIM_OUTCOME: ${{ steps.verify_claim.outcome }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          p = Path("output/chat_bridge/latest.json")
          bridge_outcome = os.getenv("BRIDGE_OUTCOME", "unknown")
          guard_outcome = os.getenv("GUARD_OUTCOME", "unknown")
          guard_allowed = os.getenv("GUARD_ALLOWED", "")
          claim_outcome = os.getenv("CLAIM_OUTCOME", "unknown")
          verify_claim_outcome = os.getenv("VERIFY_CLAIM_OUTCOME", "unknown")
          status, reason = "FAILED_NO_VALID_STATUS", "BRIDGE_STATUS_MISSING_OR_INVALID"
          if bridge_outcome == "cancelled":
              status, reason = "DATA_BLOCKED_BRIDGE_CANCELLED", "BRIDGE_JOB_CANCELLED"
          elif bridge_outcome != "success" and guard_outcome == "failure":
              status, reason = "DATA_BLOCKED_PAID_API_GUARD", "PAID_API_GUARD_ERROR"
          elif bridge_outcome != "success" and guard_outcome == "success" and guard_allowed != "true":
              status, reason = "DATA_BLOCKED_PAID_API_RESERVATION", "PAID_API_RESERVATION_DENIED"
          elif bridge_outcome != "success" and claim_outcome == "failure":
              status, reason = "DATA_BLOCKED_PAID_API_RESERVATION", "PAID_API_RESERVATION_UPLOAD_FAILED"
          elif bridge_outcome != "success" and verify_claim_outcome == "failure":
              status, reason = "DATA_BLOCKED_PAID_API_RESERVATION", "PAID_API_RESERVATION_READBACK_FAILED"
          try:
              request = json.loads(Path("scan_requests/chat/latest.json").read_text(encoding="utf-8"))
              from src.sky_chat_bridge import validate_request
              request_id = validate_request(request)
          except (OSError, ValueError, TypeError, KeyError, SystemExit):
              request_id = None
          failure = {
              "schema": "SKY_CHAT_SCAN_STATUS_V1",
              "status": status,
              "scan_id": os.getenv("GITHUB_RUN_ID"),
              "request_id": request_id,
              "head_sha": os.getenv("GITHUB_SHA"),
              "bridge_step_outcome": bridge_outcome,
              "production_eligible": False,
              "automatic_order": False,
              "block_reason": reason,
          }
          valid = False
          if p.exists():
              try:
                  data = json.loads(p.read_text(encoding="utf-8"))
                  valid = (
                      isinstance(data, dict)
                      and data.get("schema") == "SKY_CHAT_SCAN_STATUS_V1"
                      and data.get("scan_id") == os.getenv("GITHUB_RUN_ID")
                      and data.get("production_eligible") is False
                      and data.get("automatic_order") is False
                      and data.get("status") == "REPORT_READY_RESEARCH_ONLY"
                      and isinstance(data.get("row_count"), int)
                      and data["row_count"] > 0
                      and isinstance(data.get("observed_price_count"), int)
                      and data["observed_price_count"] > 0
                      and isinstance(data.get("data_timestamp"), str)
                      and bool(data.get("data_timestamp"))
                      and data.get("source") == "FUGLE_PAID_SNAPSHOT"
                  )
              except (OSError, ValueError, TypeError):
                  data = failure
              if not isinstance(data, dict):
                  data = failure
          else:
              data = failure
          if not valid or bridge_outcome != "success":
              # A cancelled bridge must not reuse a partial/old success status.
              # Even if the runner executes always() cleanup, report NO_TRADE.
              if bridge_outcome == "cancelled":
                  data = failure
              elif isinstance(data, dict) and data.get("status") == "REPORT_READY_RESEARCH_ONLY":
                  data = failure
              data["bridge_step_outcome"] = bridge_outcome
              data["production_eligible"] = False
              data["automatic_order"] = False
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          if not valid or os.getenv("BRIDGE_OUTCOME") != "success":
              raise SystemExit("SCAN_VALIDATION_FAILED")
          PY
      - name: Upload complete 13-column report and status
        id: scan_artifact_upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-chat-${{ github.run_id }}
          path: |
            output/chat_bridge/latest.json
            output/sky_quickscan_information/latest_13col.json
            output/sky_quickscan_information/latest_13col.md
            output/sky_quickscan_information/full_universe.json
            output/sky_quickscan_information/stage1_candidates.json
            output/sky_quickscan_information/stage2_quote_evidence.json
            output/sky_quickscan_information/v14_ticker_5m_evidence.json
            output/sky_quickscan_information/candidate_e2e_chain.json
            output/sky_quickscan_information/candidate_e2e_chain.md
          if-no-files-found: error
          retention-days: 14
      - name: Download the same-run Artifact and independently verify its contents
        id: external_readback
        if: ${{ !cancelled() && steps.scan_artifact_upload.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/sky-chat-downloaded output/chat_bridge_readback
          for attempt in {1..10}; do
            if gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "sky-chat-$GITHUB_RUN_ID" --dir /tmp/sky-chat-downloaded 2>/tmp/sky-chat-download-error; then
              break
            fi
            # GitHub's artifact index may lag upload completion. Retry only
            # bounded read-only lookups; never rerun the paid Fugle scan.
            if [[ "$attempt" == 10 ]] || ! grep -Eq 'HTTP 404: Not Found|no artifact matches any of the names or patterns provided' /tmp/sky-chat-download-error; then
              cat /tmp/sky-chat-download-error >&2
              exit 1
            fi
            sleep 3
          done
          HEAD_SHA=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.head_sha')
          ARTIFACT_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" | python -c 'import json,os,sys; a=json.load(sys.stdin)["artifacts"]; n="sky-chat-"+os.environ["GITHUB_RUN_ID"]; print(next((x["id"] for x in a if x["name"]==n), ""))')
          # Use the effective dispatch request ID recorded by this run, not the
          # checked-in request template (which differs for manual commands).
          REQUEST_ID=$(python -c 'import json;print(json.load(open("output/chat_bridge/latest.json", encoding="utf-8"))["request_id"])')
          python -m scripts.sky_chat_artifact_readback \
            --directory /tmp/sky-chat-downloaded \
            --run-id "$GITHUB_RUN_ID" --request-id "$REQUEST_ID" \
            --head-sha "$HEAD_SHA" --expected-sha "$GITHUB_SHA" \
            --artifact-id "$ARTIFACT_ID" \
            --receipt output/chat_bridge_readback/external_receipt.json
      - name: Ensure external readback failure always has a diagnostic receipt
        if: ${{ always() }}
        env:
          EXTERNAL_READBACK_OUTCOME: ${{ steps.external_readback.outcome }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          p = Path("output/chat_bridge_readback/external_receipt.json")
          p.parent.mkdir(parents=True, exist_ok=True)
          try:
              data = json.loads(p.read_text(encoding="utf-8"))
          except (OSError, ValueError, TypeError):
              data = {}
          if not isinstance(data, dict):
              data = {}
          if (os.environ.get("EXTERNAL_READBACK_OUTCOME") != "success"
                  and data.get("status") != "FAILED_CLOSED"):
              data = {
                  "schema": "SKY_CHAT_EXTERNAL_ARTIFACT_READBACK_V1",
                  "status": "FAILED_CLOSED",
                  "reason": "EXTERNAL_DOWNLOAD_OR_VERIFY_NOT_SUCCESSFUL",
                  "external_readback_step_outcome": os.environ.get("EXTERNAL_READBACK_OUTCOME"),
                  "run_id": os.getenv("GITHUB_RUN_ID"),
                  "head_sha": os.getenv("GITHUB_SHA"),
                  "request_id": None,
                  "verified_at_utc": datetime.now(timezone.utc).isoformat(),
                  "production_eligible": False,
                  "automatic_order": False,
                  "trade_action": "禁止交易",
              }
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Upload independent readback receipt
        id: external_receipt_upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-chat-external-readback-${{ github.run_id }}
          path: output/chat_bridge_readback/external_receipt.json
          if-no-files-found: error
          retention-days: 14
      - name: Show same-run research result on mobile
        if: ${{ !cancelled() && github.ref == 'refs/heads/research/sky-mobile-paper-integration' }}
        env:
          REPORT_ARTIFACT_URL: ${{ steps.scan_artifact_upload.outputs.artifact-url }}
          RECEIPT_ARTIFACT_URL: ${{ steps.external_receipt_upload.outputs.artifact-url }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          def load_json(path):
              try:
                  data = Path(path).read_text(encoding="utf-8")
                  value = json.loads(data)
              except (OSError, ValueError):
                  return {}
              return value if isinstance(value, dict) else {}

          status = load_json("output/chat_bridge/latest.json")
          receipt = load_json("output/chat_bridge_readback/external_receipt.json")
          run_id = os.environ["GITHUB_RUN_ID"]
          sha = os.environ["GITHUB_SHA"]
          request_id = status.get("request_id")
          report_url = os.environ.get("REPORT_ARTIFACT_URL")
          receipt_url = os.environ.get("RECEIPT_ARTIFACT_URL")
          verified = (
              report_url and receipt_url and request_id
              and status.get("scan_id") == run_id
              and status.get("head_sha") == sha
              and status.get("status") == "REPORT_READY_RESEARCH_ONLY"
              and receipt.get("status") == "PASS_RESEARCH_ONLY"
              and receipt.get("run_id") == run_id
              and receipt.get("head_sha") == sha
              and receipt.get("request_id") == request_id
          )
          blocked = status.get("status") in {
              "DATA_BLOCKED_PAID_API_GUARD", "DATA_BLOCKED_PAID_API_RESERVATION"
          }
          result = ("研究報告已獨立讀回" if verified else
                    "付費 API 防護已阻擋本次掃描（未重新查詢富果）" if blocked else
                    "等待驗收，請查看診斷收據")
          lines = [
              "## Sky 手機掃描",
              "",
              result,
              "",
              f"- Run ID: `{run_id}`",
              f"- SHA: `{sha}`",
              f"- Request ID: `{request_id or '未取得'}`",
              f"- 狀態：`{status.get('status', 'UNKNOWN')}`",
              f"- 阻擋原因：`{status.get('block_reason') or receipt.get('reason') or '無'}`",
              "- 交易資格：禁止交易",
          ]
          for title, url in (("同次報告／診斷", report_url), ("獨立讀回收據", receipt_url)):
              if url:
                  lines.append(f"- [{title}]({url})")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n".join(lines) + "\n")
          PY
      - name: Publish sanitized summary for ChatGPT GitHub connector
        # Publish a run-scoped status in the Actions summary; never write protected main.
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          EXTERNAL_READBACK_OUTCOME: ${{ steps.external_readback.outcome }}
          EXTERNAL_RECEIPT_UPLOAD_OUTCOME: ${{ steps.external_receipt_upload.outcome }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          p = Path("output/chat_bridge/latest.json")
          receipt_path = Path("output/chat_bridge_readback/external_receipt.json")
          if p.exists():
              try:
                  data = json.loads(p.read_text(encoding="utf-8"))
              except (OSError, ValueError, TypeError):
                  data = {}
          else:
              data = {}
          if not isinstance(data, dict):
              data = {}
          try:
              receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
          except (OSError, ValueError, TypeError):
              receipt = {}
          valid_external = (
              os.environ.get("EXTERNAL_READBACK_OUTCOME") == "success"
              and os.environ.get("EXTERNAL_RECEIPT_UPLOAD_OUTCOME") == "success"
              and isinstance(receipt, dict)
              and receipt.get("status") == "PASS_RESEARCH_ONLY"
              and str(receipt.get("run_id")) == os.environ.get("GITHUB_RUN_ID")
              and receipt.get("head_sha") == os.environ.get("GITHUB_SHA")
              and receipt.get("request_id") == data.get("request_id")
              and data.get("status") == "REPORT_READY_RESEARCH_ONLY"
          )
          data["external_readback_verified"] = bool(valid_external)
          if not valid_external:
              current_guard_block = (
                  data.get("status") in {"DATA_BLOCKED_PAID_API_GUARD", "DATA_BLOCKED_PAID_API_RESERVATION"}
                  and data.get("scan_id") == os.getenv("GITHUB_RUN_ID")
                  and data.get("head_sha") == os.getenv("GITHUB_SHA")
                  and bool(data.get("request_id"))
              )
              if not current_guard_block:
                  data["status"] = "DATA_BLOCKED_EXTERNAL_READBACK"
                  data["block_reason"] = "EXTERNAL_ARTIFACT_READBACK_NOT_VERIFIED"
              data["readback"] = {"status": "HOLD", "trade_action": "禁止交易",
                                  "production_eligible": False, "automatic_order": False}
          data["production_eligible"] = False
          data["automatic_order"] = False
          data.setdefault("schema", "SKY_CHAT_SCAN_STATUS_V1")
          data.setdefault("scan_id", os.getenv("GITHUB_RUN_ID"))
          Path("/tmp/sky-chat-status.json").write_text(
              json.dumps(data,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
          # Immutable run-scoped evidence is retained by the existing upload-artifact step.
          # Do not write to protected main via the Contents API.
          echo "### Sky chat bridge — run-scoped status" >> "$GITHUB_STEP_SUMMARY"
          echo "- Run: $GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Result: see this run's sky-chat artifact and external readback receipt" >> "$GITHUB_STEP_SUMMARY"
          echo "- Production: HOLD / NO_TRADE" >> "$GITHUB_STEP_SUMMARY"
      - name: Enforce successful same-run external readback before declaring research scan green
        if: ${{ !cancelled() && github.ref == 'refs/heads/research/sky-mobile-paper-integration' }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          status = json.loads(Path("output/chat_bridge/latest.json").read_text(encoding="utf-8"))
          receipt = json.loads(Path("output/chat_bridge_readback/external_receipt.json").read_text(encoding="utf-8"))
          run_id = os.environ["GITHUB_RUN_ID"]
          sha = os.environ["GITHUB_SHA"]
          request_id = status.get("request_id")
          checks = {
              "report_ready": status.get("status") == "REPORT_READY_RESEARCH_ONLY",
              "scan_same_run": str(status.get("scan_id")) == run_id,
              "scan_same_sha": status.get("head_sha") == sha,
              "request_present": bool(request_id),
              "receipt_pass": receipt.get("status") == "PASS_RESEARCH_ONLY",
              "receipt_same_run": str(receipt.get("run_id")) == run_id,
              "receipt_same_sha": receipt.get("head_sha") == sha,
              "receipt_same_request": receipt.get("request_id") == request_id,
              "no_auto_order": status.get("automatic_order") is False and receipt.get("automatic_order") is False,
          }
          for key, passed in checks.items():
              print(f"{key}: {'PASS' if passed else 'FAIL'}")
          if not all(checks.values()):
              raise SystemExit("RESEARCH_MOBILE_SAME_RUN_READBACK_NOT_VERIFIED")
          print("RESEARCH_MOBILE_SAME_RUN_READBACK_PASS")
          PY
