name: Sky Chat On-Demand Scan Bridge
on:
  push:
    branches: [main]
    paths:
      - 'scan_requests/chat/latest.json'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: sky-fugle-paid-global-research-v1-live-wholemarket
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Assign a unique request ID to each manual research scan
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from src.sky_chat_bridge import validate_request
          p = Path("scan_requests/chat/latest.json")
          payload = json.loads(p.read_text(encoding="utf-8"))
          # Validate the original read-only command before changing identity.
          validate_request(payload)
          run_id = os.environ["GITHUB_RUN_ID"]
          attempt = os.environ["GITHUB_RUN_ATTEMPT"]
          if not run_id.isdecimal() or not attempt.isdecimal():
              raise SystemExit("INVALID_MANUAL_RUN_IDENTITY")
          payload["request_id"] = f"manual-sky-{run_id}-{attempt}"
          payload["reason"] = "Manual GitHub Actions research-only scan; no orders"
          p.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print("MANUAL_RESEARCH_REQUEST_ID:" + payload["request_id"])
          PY
      - name: Verify paid reservation contracts without Fugle
        run: python -m unittest tests.test_sky_fugle_request_identity tests.test_sky_paid_fugle_api_guard -v
      - name: Reserve shared Fugle paid API slot (fail closed)
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m research.sky_paid_fugle_api_guard --scope 'sky:live:wholemarket'
      - name: Publish reservation before any paid request
        id: claim
        if: steps.guard.outputs.allowed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.guard.outputs.claim_name }}
          path: output/fugle_api_guard/claim.json
          if-no-files-found: error
          retention-days: 2
      - name: Verify reservation ZIP independently (fail closed)
        id: verify_claim
        if: steps.guard.outputs.allowed == 'true' && steps.claim.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m research.sky_paid_fugle_api_guard --scope 'sky:live:wholemarket' --verify
      - name: Run read-only paid Fugle observations (market or after-market)
        id: bridge
        if: steps.guard.outputs.allowed == 'true' && steps.verify_claim.outcome == 'success'
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
          SKY_FUGLE_ONLY_MARKETDATA: '1'
          SKY_PAID_ATOMIC_ENFORCE: '1'
          GH_TOKEN: ${{ github.token }}
        run: python -m src.sky_chat_bridge
      - name: Preserve denied reservation as NO_TRADE status
        if: always()
        env:
          GUARD_ALLOWED: ${{ steps.guard.outputs.allowed }}
          GUARD_OUTCOME: ${{ steps.guard.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify_claim.outcome }}
          BRIDGE_OUTCOME: ${{ steps.bridge.outcome }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from src.sky_chat_bridge import validate_request
          request_id = None
          try:
              payload=json.loads(Path("scan_requests/chat/latest.json").read_text(encoding="utf-8"))
              request_id=validate_request(payload)
          except (OSError, ValueError, TypeError, KeyError):
              pass
          p=Path("output/chat_bridge/latest.json")
          if not p.exists():
              p.parent.mkdir(parents=True,exist_ok=True)
              reason=("RESERVATION_DENIED" if os.getenv("GUARD_OUTCOME")=="success" and os.getenv("GUARD_ALLOWED")!="true"
                      else "RESERVATION_OR_SCAN_NOT_VERIFIED")
              p.write_text(json.dumps({
                  "schema":"SKY_CHAT_SCAN_STATUS_V1",
                  "status":"FAILED_CLOSED",
                  "scan_id":os.getenv("GITHUB_RUN_ID"),
                  "request_id":request_id,
                  "head_sha":os.getenv("GITHUB_SHA"),
                  "block_reason":reason,
                  "production_eligible":False,
                  "automatic_order":False,
                  "trade_action":"禁止交易",
              },ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
      - name: Upload complete 13-column report and status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-chat-${{ github.run_id }}
          path: |
            output/chat_bridge/latest.json
            output/sky_quickscan_information/latest_13col.json
            output/sky_quickscan_information/latest_13col.md
            output/sky_quickscan_information/full_universe.json
            output/sky_quickscan_information/stage1_candidates.json
            output/sky_quickscan_information/stage2_quote_evidence.json
            output/sky_quickscan_information/v14_ticker_5m_evidence.json
            output/sky_quickscan_information/candidate_e2e_chain.json
            output/sky_quickscan_information/candidate_e2e_chain.md
          if-no-files-found: warn
          retention-days: 90
      - name: Download and independently verify same-run Artifact (read-only)
        if: ${{ steps.bridge.outcome == 'success' }}
        id: external_readback
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/sky-chat-readback output/chat_bridge_readback
          for ATTEMPT in 1 2 3 4 5; do
            if gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "sky-chat-$GITHUB_RUN_ID" --dir /tmp/sky-chat-readback; then
              break
            fi
            if [ "$ATTEMPT" = 5 ]; then
              echo "SAME_RUN_ARTIFACT_NOT_READABLE" >&2
              exit 1
            fi
            sleep 5
          done
          HEAD_SHA=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.head_sha')
          ARTIFACT_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" | python -c 'import json,os,sys; a=json.load(sys.stdin)["artifacts"]; n="sky-chat-"+os.environ["GITHUB_RUN_ID"]; print(next((x["id"] for x in a if x["name"]==n), ""))')
          REQUEST_ID=$(python -c 'import json; print(json.load(open("scan_requests/chat/latest.json",encoding="utf-8"))["request_id"])')
          python -m scripts.sky_chat_artifact_readback \
            --directory /tmp/sky-chat-readback \
            --run-id "$GITHUB_RUN_ID" --request-id "$REQUEST_ID" \
            --head-sha "$HEAD_SHA" --expected-sha "$GITHUB_SHA" \
            --artifact-id "$ARTIFACT_ID" \
            --receipt output/chat_bridge_readback/external_receipt.json
      - name: Preserve external readback failure as NO_TRADE diagnostic
        if: always()
        env:
          READBACK_OUTCOME: ${{ steps.external_readback.outcome }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path("output/chat_bridge_readback/external_receipt.json")
          p.parent.mkdir(parents=True,exist_ok=True)
          if os.environ.get("READBACK_OUTCOME")!="success":
              p.write_text(json.dumps({"schema":"SKY_CHAT_EXTERNAL_ARTIFACT_READBACK_V1","status":"FAILED_CLOSED","reason":"EXTERNAL_ARTIFACT_READBACK_NOT_VERIFIED","run_id":os.getenv("GITHUB_RUN_ID"),"head_sha":os.getenv("GITHUB_SHA"),"production_eligible":False,"automatic_order":False,"trade_action":"禁止交易"},ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
      - name: Upload independent same-run readback receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-chat-external-readback-${{ github.run_id }}
          path: output/chat_bridge_readback/external_receipt.json
          if-no-files-found: error
          retention-days: 90
      - name: Enforce complete research-readback run status (fail closed)
        if: always()
        env:
          GUARD_ALLOWED: ${{ steps.guard.outputs.allowed }}
          CLAIM_OUTCOME: ${{ steps.claim.outcome }}
          VERIFIED_CLAIM_OUTCOME: ${{ steps.verify_claim.outcome }}
          BRIDGE_OUTCOME: ${{ steps.bridge.outcome }}
          READBACK_OUTCOME: ${{ steps.external_readback.outcome }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path("output/chat_bridge_readback/external_receipt.json")
          try:
              receipt=json.loads(p.read_text(encoding="utf-8"))
          except (OSError,ValueError,TypeError):
              receipt={}
          request_path=Path("scan_requests/chat/latest.json")
          try:
              request=json.loads(request_path.read_text(encoding="utf-8"))
              expected_request_id=request.get("request_id")
          except (OSError,ValueError,TypeError,AttributeError):
              expected_request_id=None
          ok=(os.getenv("GUARD_ALLOWED")=="true"
              and os.getenv("CLAIM_OUTCOME")=="success"
              and os.getenv("VERIFIED_CLAIM_OUTCOME")=="success"
              and os.getenv("BRIDGE_OUTCOME")=="success"
              and os.getenv("READBACK_OUTCOME")=="success"
              and isinstance(receipt,dict)
              and receipt.get("schema")=="SKY_CHAT_EXTERNAL_ARTIFACT_READBACK_V1"
              and receipt.get("status")=="PASS_RESEARCH_ONLY"
              and isinstance(expected_request_id,str)
              and receipt.get("request_id")==expected_request_id
              and str(receipt.get("artifact_id","")).isdecimal()
              and int(receipt.get("artifact_id",0))>0
              and isinstance(receipt.get("row_count"),int)
              and receipt.get("row_count")>0
              and str(receipt.get("run_id"))==os.getenv("GITHUB_RUN_ID")
              and receipt.get("head_sha")==os.getenv("GITHUB_SHA")
              and receipt.get("production_eligible") is False
              and receipt.get("automatic_order") is False)
          if not ok:
              raise SystemExit("RESEARCH_READBACK_NOT_VERIFIED_NO_TRADE")
          print("RESEARCH_READBACK_VERIFIED_NO_ORDERS")
          PY
      # The protected main branch cannot be written directly from a workflow.
      # The uploaded per-run artifact above is the immutable status/readback source.
