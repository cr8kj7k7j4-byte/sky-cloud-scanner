name: Sky Swing V1.1 Live Whole-Market Scan

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/swing-v11-live-scan.yml"
      - "src/swing_v11_live_scanner.py"
      - "src/swing_split_scope_scanner.py"
      - "src/swing_observation_report.py"
      - "research/verify_swing_v11_live_output.py"
      - "src/sky_command_router.py"
      - "research/SKY_SWING_V11_INTRADAY_EXECUTION_OVERLAY_V1.md"
  pull_request:
    paths:
      - "src/swing_v11_live_scanner.py"
      - "tests/test_swing_v11_freshness.py"
      - "tests/test_verify_swing_v11_live_output.py"
      - "tests/test_swing_observation_report.py"
      - ".github/workflows/swing-v11-live-scan.yml"
  workflow_dispatch:
    inputs:
      top_n:
        description: "V1.1 candidate output count"
        required: true
        default: "20"
  # PAUSED on 2026-11-10 by user request: formerly scheduled trigger.
  # schedule:
  # # Taiwan market hours 09:00-13:30 (UTC+8), every 5 minutes.
  # - cron: "*/5 1-4 * * 1-5"
  # - cron: "0,5,10,15,20,25,30 5 * * 1-5"
  # 
permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('sky-fugle-pr-{0}-{1}', github.workflow, github.event.pull_request.number) || 'sky-fugle-paid-global-research-v1' }}
  cancel-in-progress: false
jobs:
  sky_paid_reservation:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reserve paid API request safely
        id: reservation
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m research.sky_paid_fugle_api_guard --workflow-scope
      - name: Upload sanitized reservation before paid access
        if: steps.reservation.outputs.allowed == 'true'
        id: claim
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.reservation.outputs.claim_name }}
          path: output/fugle_api_guard/claim.json
          if-no-files-found: error
          retention-days: 2
      - name: Independent reservation readback, fail closed
        if: steps.reservation.outputs.allowed == 'true' && steps.claim.outcome == 'success'
        id: verify_claim
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m research.sky_paid_fugle_api_guard --workflow-scope --verify
      - name: Fail job when claim is rejected or not verified
        run: |
          test "${{ steps.reservation.outputs.allowed }}" = "true"
          test "${{ steps.claim.outcome }}" = "success"
          test "${{ steps.verify_claim.outcome }}" = "success"
  validate-freshness:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - run: PYTHONPATH=. pytest -q tests/test_swing_v11_freshness.py tests/test_swing_v11_live_scanner.py tests/test_verify_swing_v11_live_output.py tests/test_swing_observation_report.py tests/test_swing_split_scope_scanner.py

  live-scan:
    needs: sky_paid_reservation
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download canonical Swing daily history
        uses: dawidd6/action-download-artifact@v11
        with:
          run_id: 40252311345
          name: w3-swing-canonical-daily-history-repaired-40252311345
          path: _canonical
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Locate canonical history
        id: data
        shell: bash
        run: |
          set -euo pipefail
          HIST_DIR=$(find _canonical -type f -name '*_D.json' -printf '%h\n' | sort -u | head -1)
          test -n "$HIST_DIR"
          echo "history_dir=$HIST_DIR" >> "$GITHUB_OUTPUT"
          echo "daily_files=$(find "$HIST_DIR" -name '*_D.json' | wc -l)"

      - name: Run V1.1 whole-market live scan
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
        run: |
          python -m src.swing_v11_live_scanner \
            --history-dir "${{ steps.data.outputs.history_dir }}" \
            --top-n "${{ inputs.top_n || '20' }}"

      # Observation is independent from V1.1 qualification. It does not repair
      # stale historical OHLC, permit trading, or certify whole-market live quotes.
      - name: Collect current TWSE TPEx daily market and Fugle candidate observations
        if: always()
        continue-on-error: true
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
        run: |
          python -m src.swing_split_scope_scanner --deep-n 8

      - name: Publish complete thirteen-column research observations
        if: always()
        run: |
          python -m src.swing_observation_report --input output/swing_split_scope/latest.json

      - name: Enforce fresh canonical D-close signal
        if: always()
        run: |
          PYTHONPATH=. python research/verify_swing_v11_live_output.py \
            --input output/swing_v11_live/latest.json \
            --report output/swing_v11_live/freshness_gate.json

      - name: Publish summary
        if: always()
        run: |
          if [ -f output/swing_v11_live/latest.txt ]; then
            cat output/swing_v11_live/latest.txt >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-swing-v11-live-${{ github.run_id }}
          path: |
            output/swing_v11_live/
            output/swing_split_scope/
          if-no-files-found: error
          retention-days: 30
