name: Sky Swing V1.1 Live Whole-Market Scan

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/swing-v11-live-scan.yml"
      - "src/swing_v11_live_scanner.py"
      - "research/verify_swing_v11_live_output.py"
      - "src/sky_command_router.py"
      - "research/SKY_SWING_V11_INTRADAY_EXECUTION_OVERLAY_V1.md"
  pull_request:
    paths:
      - "src/swing_v11_live_scanner.py"
      - "tests/test_swing_v11_freshness.py"
      - "tests/test_verify_swing_v11_live_output.py"
      - ".github/workflows/swing-v11-live-scan.yml"
  workflow_dispatch:
    inputs:
      top_n:
        description: "V1.1 candidate output count"
        required: true
        default: "20"
  schedule:
    # Taiwan market hours 09:00-13:30 (UTC+8), every 5 minutes.
    - cron: "*/5 1-4 * * 1-5"
    - cron: "0,5,10,15,20,25,30 5 * * 1-5"

permissions:
  actions: read
  contents: read

jobs:
  validate-freshness:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - run: PYTHONPATH=. pytest -q tests/test_swing_v11_freshness.py tests/test_swing_v11_live_scanner.py tests/test_verify_swing_v11_live_output.py

  live-scan:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download canonical Swing daily history
        uses: dawidd6/action-download-artifact@v11
        with:
          run_id: 40252311345
          name: w3-swing-canonical-daily-history-repaired-40252311345
          path: _canonical
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Locate canonical history
        id: data
        shell: bash
        run: |
          set -euo pipefail
          HIST_DIR=$(find _canonical -type f -name '*_D.json' -printf '%h\n' | sort -u | head -1)
          test -n "$HIST_DIR"
          echo "history_dir=$HIST_DIR" >> "$GITHUB_OUTPUT"
          echo "daily_files=$(find "$HIST_DIR" -name '*_D.json' | wc -l)"

      - name: Run V1.1 whole-market live scan
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
        run: |
          python -m src.swing_v11_live_scanner \
            --history-dir "${{ steps.data.outputs.history_dir }}" \
            --top-n "${{ inputs.top_n || '20' }}"

      # Observation is independent from V1.1 qualification. It does not repair
      # stale historical OHLC, permit trading, or certify whole-market live quotes.
      - name: Collect current TWSE TPEx daily market and Fugle candidate observations
        if: always()
        continue-on-error: true
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
        run: |
          python -m src.swing_split_scope_scanner --deep-n 8

      - name: Publish research observations even when V1.1 freshness fails
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('output/swing_split_scope/latest.json')
          lines = ['## Sky 波段：研究觀察（非正式交易訊號）', '']
          if not p.is_file():
              lines += ['分範圍觀察資料未產生；不得以過期訊號填補。']
          else:
              d = json.loads(p.read_text(encoding='utf-8'))
              lines += [
                  f"產生時間：{d.get('generated_at')}；前日官方收盤日期：{d.get('official_daily_signal_date')}",
                  f"上市與上櫃日線：{d.get('official_daily_count')}/{d.get('universe_count')}（{d.get('official_daily_coverage_pct')}%）",
                  f"富果當日成交候選：{d.get('live_quote_available')}/{d.get('live_quote_requested')}；全市場盤中成交價覆蓋率：未驗證",
                  f"資料狀態：{d.get('daily_scope_status')}；策略狀態：RESEARCH_ONLY_NOT_PRODUCTION",
                  "🔴 正式進場資格未通過仍展示觀察，不表示可買、不表示預測機率。",
                  '',
                  '| 股票 | 前日收盤 | 當日已驗證成交價 | 報價時間 | 報價狀態 | 現在動作 |',
                  '|---|---:|---:|---|---|---|',
              ]
              for c in d.get('candidates', []):
                  def fmt(v):
                      return '—' if v is None else str(v).replace('|', '/')
                  lines.append(
                      f"| {fmt(c.get('symbol'))} | {fmt(c.get('close'))} | "
                      f"{fmt(c.get('current_price'))} | {fmt(c.get('current_price_updated_at'))} | "
                      f"{fmt(c.get('live_quote_status'))} | 觀察 |"
                  )
              if not d.get('candidates'):
                  lines.append('| 無可呈現候選 | — | — | — | — | 觀察 |')
              lines += ['', '註：候選來源為前一日官方日線篩選，只對少數候選取得富果當日成交價；不是全市場即時成交報價。']
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as out:
              out.write('\n'.join(lines) + '\n')
          print('\n'.join(lines))
          PY

      - name: Enforce fresh canonical D-close signal
        if: always()
        run: |
          PYTHONPATH=. python research/verify_swing_v11_live_output.py \
            --input output/swing_v11_live/latest.json \
            --report output/swing_v11_live/freshness_gate.json

      - name: Publish summary
        if: always()
        run: |
          if [ -f output/swing_v11_live/latest.txt ]; then
            cat output/swing_v11_live/latest.txt >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-swing-v11-live-${{ github.run_id }}
          path: |
            output/swing_v11_live/
            output/swing_split_scope/
          if-no-files-found: error
          retention-days: 30
