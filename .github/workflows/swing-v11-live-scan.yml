name: Sky Swing V1.1 Live Whole-Market Scan

on:
  # Do not launch any market-data scan automatically on main push.
  # Explicit workflow_dispatch remains available for approved research.
  pull_request:
    paths:
      - "src/swing_v11_live_scanner.py"
      - "tests/test_swing_v11_freshness.py"
      - "tests/test_verify_swing_v11_live_output.py"
      - "research/verify_swing_v11_live_output.py"
      - "tests/test_swing_observation_report.py"
      - ".github/workflows/swing-v11-live-scan.yml"
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      top_n:
        description: "V1.1 candidate output count"
        required: true
        default: "20"
      source_run_id:
        description: "Verified W3 canonical daily history source Run ID (required for manual dispatch)"
        required: false
        type: string
      artifact_name:
        description: "Exact W3 canonical daily artifact name"
        required: false
        type: string
  # PAUSED on 2026-11-10 by user request: formerly scheduled trigger.
  # schedule:
  # # Taiwan market hours 09:00-13:30 (UTC+8), every 5 minutes.
  # - cron: "*/5 1-4 * * 1-5"
  # - cron: "0,5,10,15,20,25,30 5 * * 1-5"
  # 
permissions:
  actions: read
  contents: write

# Share the same paid whole-market lane with canonical and Swing scanners.
concurrency:
  # Nonmatching comment events have no paid work and must not evict
  # pending authorized scans in GitHub's workflow-level concurrency queue.
  group: ${{ (github.event_name == 'issue_comment' && !(github.event.issue.number == 363 && github.event.comment.user.login == github.repository_owner && github.event.comment.author_association == 'OWNER' && (github.event.comment.body == 'Sky Swing V1.1｜現在掃一次' || github.event.comment.body == 'Sky 波段快掃' || github.event.comment.body == 'Sky 波段現在掃一次')) && format('sky-swing-v11-ignored-{0}', github.run_id)) || 'sky-fugle-paid-global-research-v1-live-wholemarket' }}
  cancel-in-progress: false

jobs:
  validate-freshness:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - run: PYTHONPATH=. pytest -q tests/test_swing_v11_freshness.py tests/test_swing_v11_live_scanner.py tests/test_verify_swing_v11_live_output.py tests/test_swing_observation_report.py tests/test_swing_split_scope_scanner.py

  live-scan:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 363 &&
       github.event.comment.user.login == github.repository_owner &&
       github.event.comment.author_association == 'OWNER' &&
       (github.event.comment.body == 'Sky Swing V1.1｜現在掃一次' || github.event.comment.body == 'Sky 波段快掃' || github.event.comment.body == 'Sky 波段現在掃一次'))
    env:
      GH_TOKEN: ${{ github.token }}
      SKY_PAID_ATOMIC_ENFORCE: "1"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate governed canonical daily source identity before download
        id: daily_source
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id || vars.SKY_SWING_CANONICAL_DAILY_RUN_ID }}
          SOURCE_ARTIFACT: ${{ inputs.artifact_name || vars.SKY_SWING_CANONICAL_DAILY_ARTIFACT_NAME }}
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          source_id = os.getenv("SOURCE_RUN_ID", "").strip()
          artifact = os.getenv("SOURCE_ARTIFACT", "").strip()
          ok = bool(re.fullmatch(r"[1-9][0-9]{5,19}", source_id)) and bool(re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9_.-]{0,180}", artifact))
          reason = "SOURCE_IDENTITY_CONFIGURED_NOT_FRESHNESS_CERTIFIED" if ok else "BLOCKED_UNVERIFIED_CANONICAL_SOURCE_IDENTITY"
          output = Path("output/swing_v11_live/source_gate.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps({"schema":"SKY_V11_DAILY_SOURCE_GATE_V1","status":reason,"source_run_id":source_id if ok else None,"source_artifact_name":artifact if ok else None,"production_eligible":False,"automatic_order":False,"trade_action":"禁止交易"},ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          if not ok:
              raise SystemExit(reason)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write("run_id="+source_id+"\n")
              handle.write("artifact_name="+artifact+"\n")
          PY

      - name: Download canonical Swing daily history
        if: steps.daily_source.outcome == 'success'
        uses: dawidd6/action-download-artifact@v11
        with:
          run_id: ${{ steps.daily_source.outputs.run_id }}
          name: ${{ steps.daily_source.outputs.artifact_name }}
          path: _canonical
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Locate canonical history
        if: steps.daily_source.outcome == 'success'
        id: data
        shell: bash
        run: |
          set -euo pipefail
          HIST_DIR=$(find _canonical -type f -name '*_D.json' -printf '%h\n' | sort -u | head -1)
          test -n "$HIST_DIR"
          echo "history_dir=$HIST_DIR" >> "$GITHUB_OUTPUT"
          echo "daily_files=$(find "$HIST_DIR" -name '*_D.json' | wc -l)"

      - name: Reject stale or unverifiable canonical daily signal before paid requests
        id: daily_guard
        shell: bash
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          from src.swing_v11_live_scanner import load_daily_history, choose_signal_date, load_signal_date_guard
          path = Path("${{ steps.data.outputs.history_dir }}")
          signal_date, cross_section = choose_signal_date(load_daily_history(str(path)))
          status = load_signal_date_guard(signal_date, datetime.now(ZoneInfo("Asia/Taipei")).date()) if signal_date else {"status": "MISSING_DAILY_HISTORY", "fresh": False}
          output = Path("output/swing_v11_live/preflight_gate.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps({"schema":"SKY_V11_PREFLIGHT_V1","signal_date":signal_date,"cross_section":cross_section,"guard":status,"production_eligible":False,"automatic_order":False,"trade_action":"禁止交易"}, ensure_ascii=False, indent=2)+"\n",encoding="utf-8")
          if status.get("status") != "PASS":
              raise SystemExit("BLOCKED_STALE_OR_UNVERIFIED_CANONICAL_DAILY_NO_PAID_API")
          PY

      - name: Reserve shared Fugle paid API slot (fail closed)
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m research.sky_paid_fugle_api_guard --scope 'sky:live:wholemarket'
      - name: Publish reservation before paid API call
        id: claim
        if: steps.guard.outputs.allowed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.guard.outputs.claim_name }}
          path: output/fugle_api_guard/claim.json
          if-no-files-found: error
          retention-days: 2
      - name: Verify reservation claim independently
        id: verify_claim
        if: steps.guard.outputs.allowed == 'true' && steps.claim.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m research.sky_paid_fugle_api_guard --scope 'sky:live:wholemarket' --verify

      - name: Run V1.1 whole-market live scan
        if: steps.verify_claim.outcome == 'success'
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
        run: |
          python -m src.swing_v11_live_scanner \
            --history-dir "${{ steps.data.outputs.history_dir }}" \
            --top-n "${{ inputs.top_n || '20' }}"

      # Observation is independent from V1.1 qualification. It does not repair
      # stale historical OHLC, permit trading, or certify whole-market live quotes.
      - name: Collect current TWSE TPEx daily market and Fugle candidate observations
        if: steps.verify_claim.outcome == 'success'
        continue-on-error: true
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
        run: |
          python -m src.swing_split_scope_scanner --deep-n 8

      - name: Publish complete thirteen-column research observations
        if: always()
        run: |
          python -m src.swing_observation_report --input output/swing_split_scope/latest.json

      - name: Enforce fresh canonical D-close signal
        if: always()
        run: |
          PYTHONPATH=. python research/verify_swing_v11_live_output.py \
            --input output/swing_v11_live/latest.json \
            --report output/swing_v11_live/freshness_gate.json

      - name: Publish summary
        if: always()
        run: |
          if [ -f output/swing_v11_live/latest.txt ]; then
            cat output/swing_v11_live/latest.txt >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload result
        id: result_upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-swing-v11-live-${{ github.run_id }}
          path: |
            output/swing_v11_live/
            output/swing_split_scope/
          if-no-files-found: error
          retention-days: 30

      # Independent byte integrity only. Never certify stale signals or trades.
      - name: Independently read back same-run V1.1 research Artifact
        if: always() && steps.result_upload.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/sky-v11-readback output/swing_v11_readback
          for delay in 1 3 5 0; do
            if gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name "sky-swing-v11-live-$GITHUB_RUN_ID" \
              --dir /tmp/sky-v11-readback; then break; fi
            if [ "$delay" = 0 ]; then exit 1; fi
            sleep "$delay"
          done
          ARTIFACT_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" | python -c 'import json,os,sys; a=json.load(sys.stdin)["artifacts"]; n="sky-swing-v11-live-"+os.environ["GITHUB_RUN_ID"]; x=[e["id"] for e in a if e["name"]==n and not e.get("expired")]; assert len(x)==1,"V11_ARTIFACT_AMBIGUOUS"; print(x[0])')
          export ARTIFACT_ID
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path("/tmp/sky-v11-readback")
          src = Path("output")
          dirs = ("swing_v11_live", "swing_split_scope")
          originals = sorted(p for name in dirs for p in (src/name).rglob("*") if p.is_file())
          if not originals:
              raise SystemExit("V11_EMPTY_SOURCE_ARTIFACT")
          evidence = []
          for p in originals:
              rel = p.relative_to(src)
              downloaded = root / rel
              if p.is_symlink() or not downloaded.is_file() or downloaded.is_symlink():
                  raise SystemExit("V11_FILE_MISSING")
              digest = hashlib.sha256(downloaded.read_bytes()).hexdigest()
              if hashlib.sha256(p.read_bytes()).hexdigest()!=digest:
                  raise SystemExit("V11_SHA256_MISMATCH")
              evidence.append({"path":str(rel),"sha256":digest})
          actual = sorted(str(p.relative_to(root)) for p in root.rglob("*") if p.is_file())
          if actual != [x["path"] for x in evidence]:
              raise SystemExit("V11_ARTIFACT_INVENTORY_MISMATCH")
          report = root/"swing_v11_live/latest.json"
          if report.is_file():
              obj = json.loads(report.read_text(encoding="utf-8"))
              if obj.get("production_eligible") is not False:
                  raise SystemExit("V11_UNSAFE_PRODUCTION_ELIGIBILITY")
          result = {"schema":"SKY_V11_SAME_RUN_READBACK_V1",
                    "status":("PASS_ARTIFACT_INTEGRITY_RESEARCH_ONLY" if report.is_file()
                              else "PASS_HOLD_RECEIPT_INTEGRITY_ONLY"),
                    "run_id":os.environ["GITHUB_RUN_ID"],
                    "attempt":os.environ["GITHUB_RUN_ATTEMPT"],
                    "head_sha":os.environ["GITHUB_SHA"],
                    "event":os.environ["GITHUB_EVENT_NAME"],
                    "artifact_id":int(os.environ["ARTIFACT_ID"]),
                    "files":evidence,"report_present":report.is_file(),
                    "strategy_validated":False,"production_eligible":False,
                    "automatic_order":False,"trade_action":"禁止交易"}
          Path("output/swing_v11_readback/receipt.json").write_text(
              json.dumps(result,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print("SKY_V11_INDEPENDENT_READBACK",result["status"])
          PY

      - name: Upload independent same-run V1.1 receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-swing-v11-readback-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: output/swing_v11_readback/receipt.json
          if-no-files-found: warn
          retention-days: 30
