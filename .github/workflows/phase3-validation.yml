name: Sky 100 Phase 3 Validation Tests

on:
  push:
    branches:
      - feat/sky-100-phase3-validation
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile sources
        run: python -m compileall -q src research tests
      - name: Validation engine tests
        run: python tests/test_validation_engine.py
      - name: Feature Store / Model Arena tests
        run: python tests/test_feature_model_arena.py
      - name: Risk engine tests
        run: python tests/test_risk_engine.py
