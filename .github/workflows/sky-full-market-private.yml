name: Sky Private Full Market Fugle Snapshot Research
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: sky-fugle-paid-global-research-v1
  cancel-in-progress: false
jobs:
  private-snapshot:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate snapshot contract without paid data
        run: |
          python -m pip install pytest
          PYTHONPATH=. python -m pytest -q tests/test_full_market_snapshot_private.py
      - name: Check private configuration without exposing values
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
          GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          SKY_RESEARCH_GCS_BUCKET: ${{ vars.SKY_RESEARCH_GCS_BUCKET }}
        run: |
          python - <<'PY'
          import os
          required=("FUGLE_API_KEY","GCP_WIF_PROVIDER","GCP_SERVICE_ACCOUNT","SKY_RESEARCH_GCS_BUCKET")
          missing=[k for k in required if not os.environ.get(k)]
          if missing: raise SystemExit("MISSING_PRIVATE_CONFIG:"+",".join(missing))
          print("PRIVATE_CONFIGURATION_PRESENT")
          PY
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: Verify guard unit contracts (no paid data)
        run: python -m unittest tests.test_sky_paid_fugle_api_guard -v
      - name: Reserve shared Fugle paid API slot (fail closed)
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m research.sky_paid_fugle_api_guard --scope 'sky:live:wholemarket'
      - name: Publish global reservation before any paid call
        id: claim
        if: steps.guard.outputs.allowed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.guard.outputs.claim_name }}
          path: output/fugle_api_guard/claim.json
          if-no-files-found: error
          retention-days: 2
      - name: Verify GitHub reservation readback (fail closed)
        id: verify_claim
        if: steps.guard.outputs.allowed == 'true' && steps.claim.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m research.sky_paid_fugle_api_guard --scope 'sky:live:wholemarket' --verify
      - name: Run paid Fugle market snapshots into private immutable GCS
        if: steps.guard.outputs.allowed == 'true' && steps.verify_claim.outcome == 'success'
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
          SKY_RESEARCH_GCS_BUCKET: ${{ vars.SKY_RESEARCH_GCS_BUCKET }}
        run: |
          python -m pip install google-cloud-storage
          PYTHONPATH=. python -m research.full_market_snapshot_private
      - name: Publish sanitized audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-full-market-private-summary-${{ github.run_id }}
          path: output/full_market_private/sanitized_summary.json
          if-no-files-found: warn
          retention-days: 30
