name: Sky Private Full Market Fugle Snapshot Research
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  private-snapshot:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate snapshot contract without paid data
        run: |
          python -m pip install pytest
          PYTHONPATH=. python -m pytest -q tests/test_full_market_snapshot_private.py
      - name: Check private configuration without exposing values
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
          GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          SKY_RESEARCH_GCS_BUCKET: ${{ vars.SKY_RESEARCH_GCS_BUCKET }}
        run: |
          python - <<'PY'
          import os
          required=("FUGLE_API_KEY","GCP_WIF_PROVIDER","GCP_SERVICE_ACCOUNT","SKY_RESEARCH_GCS_BUCKET")
          missing=[k for k in required if not os.environ.get(k)]
          if missing: raise SystemExit("MISSING_PRIVATE_CONFIG:"+",".join(missing))
          print("PRIVATE_CONFIGURATION_PRESENT")
          PY
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: Run paid Fugle market snapshots into private immutable GCS
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
          SKY_RESEARCH_GCS_BUCKET: ${{ vars.SKY_RESEARCH_GCS_BUCKET }}
        run: |
          python -m pip install google-cloud-storage
          PYTHONPATH=. python -m research.full_market_snapshot_private
      - name: Publish sanitized audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-full-market-private-summary-${{ github.run_id }}
          path: output/full_market_private/sanitized_summary.json
          if-no-files-found: warn
          retention-days: 30
