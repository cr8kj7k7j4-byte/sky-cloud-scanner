name: Sky 24h Research CI Watchdog (5min)

on:
  pull_request:
    paths:
      - "ops/recovery/**"
      - ".github/workflows/sky-research-ci-watchdog.yml"
  # The 24-hour schedule expired. Keep PR tests and manual dispatch.
  workflow_dispatch:

permissions:
  contents: read
  actions: write # Only rerun failed jobs for the code-level allowlisted PR unit test.
  issues: write # One-time schedule proof in existing W0 issue #363.

concurrency:
  group: sky-research-ci-watchdog
  cancel-in-progress: false

jobs:
  contract-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Contract and negative tests
        run: python -m unittest discover -s ops/recovery -p 'test_*.py' -v

  five-minute-watchdog:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      SKY_RECOVERY_END_UTC: "2026-11-10T04:00:00Z"
      # Only test-only PR CI may be retried. No Fugle, scanner, GCS, Cloud Run,
      # research ledger, Production, workflow dispatch or trading retries.
      SKY_RECOVERY_RETRY_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bounded fail-closed research-CI check
        id: watchdog_check
        run: python ops/recovery/sky_research_watchdog.py
      - name: Audit intraday readiness and latest artifact (read-only)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python ops/recovery/sky_intraday_readiness.py
      - name: Upload independent audit report (even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-watchdog-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            recovery-reports/latest.json
            recovery-reports/intraday_readiness.json
          if-no-files-found: warn
          retention-days: 7
      - name: Record first real schedule execution in W0 issue (once only)
        if: ${{ always() && github.event_name == 'schedule' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_OUTCOME: ${{ steps.watchdog_check.outcome }}
        run: |
          set -euo pipefail
          MARKER="SKY_WATCHDOG_FIRST_SCHEDULE_RUN_V1"
          # Never repost on subsequent 5-minute runs. Issue #363 is the W0 log.
          COMMENTS="$(gh api "repos/${GITHUB_REPOSITORY}/issues/363/comments?per_page=100" --paginate --jq '.[].body')"
          if grep -Fq "$MARKER" <<< "$COMMENTS"; then
            echo "Schedule proof already recorded"
            exit 0
          fi
          RUN_LINK="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          BODY="$MARKER
          W0/P0-OPS real schedule event observed (not PR CI).
          GitHub event: ${GITHUB_EVENT_NAME}
          Run: ${RUN_LINK}
          Watchdog check outcome: ${CHECK_OUTCOME}
          JSON artifact: sky-watchdog-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}
          A schedule event proves invocation, not recovery success or real-market data. Verify the artifact and retry details before closing the gate."
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/363/comments" -f body="$BODY"
