name: Publish Sky External Status Snapshot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-external-status-snapshot.yml"
  schedule:
    - cron: "45 16 * * 1-5"
      timezone: "Asia/Taipei"

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download latest Shadow promotion dashboard artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p latest_dashboard
          RUN_ID="$(gh run list --workflow shadow-promotion-dashboard.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$RUN_ID"
          gh run download "$RUN_ID" -n shadow-promotion-dashboard -D latest_dashboard
          echo "DASHBOARD_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"

      - name: Preserve previous status for material-change detection
        shell: bash
        run: |
          set -euo pipefail
          if [ -f docs/SKY_EXTERNAL_LATEST_STATUS.json ]; then
            cp docs/SKY_EXTERNAL_LATEST_STATUS.json /tmp/sky_previous_status.json
          else
            echo '{}' > /tmp/sky_previous_status.json
          fi

      - name: Build stable latest-status snapshot
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path("latest_dashboard")
          dash = json.loads((root / "shadow_promotion_dashboard.json").read_text(encoding="utf-8"))
          elig_path = root / "w4_scan_eligibility.json"
          elig = json.loads(elig_path.read_text(encoding="utf-8")) if elig_path.exists() else {}

          snapshot = {
              "schema_version": "SKY_EXTERNAL_STATUS_SNAPSHOT_V1_0",
              "generated_at_utc": datetime.now(timezone.utc).isoformat(),
              "source": {
                  "dashboard_workflow_run_id": os.environ.get("DASHBOARD_RUN_ID"),
                  "repository": os.environ.get("GITHUB_REPOSITORY"),
              },
              "production_baseline": {
                  "day_trading": "Sky Day Trading v1.4 Dynamic Capital Rotation / P0-C MVP",
                  "system": "Sky V2.1",
                  "production_changed": False,
              },
              "w4_dashboard": dash,
              "scan_eligibility": elig,
              "usage": {
                  "monitoring_owner": "GitHub Actions / external infrastructure",
                  "chatgpt_role": "on-demand reader and analyst only",
                  "instruction": "When user asks for Sky latest result, read this file first and then fetch linked evidence if needed.",
              },
          }

          out = Path("docs")
          out.mkdir(exist_ok=True)
          (out / "SKY_EXTERNAL_LATEST_STATUS.json").write_text(
              json.dumps(snapshot, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          obs = dash.get("observed") or dash.get("sample_progress") or {}
          status = dash.get("status") or dash.get("promotion_status") or "UNKNOWN"
          eligible_runs = elig.get("eligible_run_count")
          eligible_records = elig.get("eligible_record_count")

          lines = [
              "# Sky External Latest Status",
              "",
              f"- Generated (UTC): {snapshot['generated_at_utc']}",
              f"- Dashboard workflow run: {os.environ.get('DASHBOARD_RUN_ID')}",
              f"- W4 status: **{status}**",
              f"- Eligible scan runs: {eligible_runs}",
              f"- Eligible records: {eligible_records}",
              "- Monitoring owner: **GitHub Actions / external infrastructure**",
              "- ChatGPT role: **on-demand reader / analysis only; no monitoring schedule required**",
              "",
              "## Canonical source",
              "",
              "Machine-readable detail: `docs/SKY_EXTERNAL_LATEST_STATUS.json`.",
              "",
              "Production remains unchanged unless W0/P0-G records a formal promotion decision.",
          ]
          (out / "SKY_EXTERNAL_LATEST_STATUS.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Detect material status change
        id: material
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          def load(path):
              try:
                  return json.loads(Path(path).read_text(encoding="utf-8"))
              except Exception:
                  return {}

          old=load("/tmp/sky_previous_status.json")
          new=load("docs/SKY_EXTERNAL_LATEST_STATUS.json")

          od=old.get("w4_dashboard") or {}
          nd=new.get("w4_dashboard") or {}

          old_stage=od.get("stage")
          new_stage=nd.get("stage")
          old_pipe=(od.get("pipeline_readiness") or {}).get("status")
          new_pipe=(nd.get("pipeline_readiness") or {}).get("status")
          old_prom=(od.get("promotion_scorecard") or {}).get("promotable_to_governance_review")
          new_prom=(nd.get("promotion_scorecard") or {}).get("promotable_to_governance_review")
          old_suff=(od.get("sample_sufficiency") or {}).get("sufficient")
          new_suff=(nd.get("sample_sufficiency") or {}).get("sufficient")
          old_samples=((od.get("sample_sufficiency") or {}).get("observed") or {}).get("samples",0)
          new_samples=((nd.get("sample_sufficiency") or {}).get("observed") or {}).get("samples",0)

          unhealthy={"PIPELINE_ARTIFACT_MISSING","PIPELINE_RECORDS_MISSING","EVIDENCE_INCOMPLETE","FAILED"}
          reasons=[]
          if old_stage != new_stage and old_stage is not None:
              reasons.append(f"W4 stage: {old_stage} -> {new_stage}")
          if old_pipe != new_pipe and (new_pipe in unhealthy or old_pipe in unhealthy):
              reasons.append(f"Pipeline: {old_pipe} -> {new_pipe}")
          if old_prom is not True and new_prom is True:
              reasons.append("Promotion governance review gate reached")
          if old_suff is not True and new_suff is True:
              reasons.append("W4 sample sufficiency gate reached")

          material=bool(reasons)
          Path("/tmp/sky_material_message.txt").write_text(
              "Sky 外部監控重大更新\n"
              + ("\n".join(f"- {x}" for x in reasons) if reasons else "No material change")
              + f"\n- Samples: {old_samples} -> {new_samples}"
              + "\n- Source: docs/SKY_EXTERNAL_LATEST_STATUS.json",
              encoding="utf-8"
          )
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as fh:
              fh.write(f"material={'true' if material else 'false'}\n")
          print({"material":material,"reasons":reasons,"samples":new_samples})
          PY

      - name: Telegram major-change notification
        if: steps.material.outputs.material == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "Telegram secrets not configured; material status remains recorded in GitHub."
            exit 0
          fi
          MSG="$(cat /tmp/sky_material_message.txt)"
          curl --fail --silent --show-error             --retry 3             -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"             -H "Content-Type: application/json"             --data "$(python -c 'import json,os; print(json.dumps({"chat_id":os.environ["TELEGRAM_CHAT_ID"],"text":open("/tmp/sky_material_message.txt",encoding="utf-8").read(),"disable_web_page_preview":True},ensure_ascii=False))')"

      - name: Commit snapshot when changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "sky-evidence-bot"
          git config user.email "sky-evidence-bot@users.noreply.github.com"
          git add docs/SKY_EXTERNAL_LATEST_STATUS.json docs/SKY_EXTERNAL_LATEST_STATUS.md
          if git diff --cached --quiet; then
            echo "No status change to commit."
            exit 0
          fi
          git commit -m "W4: publish external latest status snapshot [skip ci]"
          git push origin HEAD:main
