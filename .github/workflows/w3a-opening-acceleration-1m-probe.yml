name: W3A Opening Acceleration 1m Data Probe

on:
  push:
    branches:
      - w5/opening-acceleration-baseline-c-20261026
      - w5/opening-acceleration-4tick-entry-20261026
    paths:
      - "research/download_pit_universe_intraday.py"
      - "tests/test_pit_intraday_timeframe.py"
      - ".github/workflows/w3a-opening-acceleration-1m-probe.yml"
      - "research/w5/OPENING_ACCELERATION_BASELINE_C_PREREGISTRATION_20261026.md"
      - "research/download_opening_acceleration_1m.py"
      - "research/backtest_opening_acceleration_baseline_c.py"
      - "tests/test_opening_acceleration_baseline_c.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sky-fugle-paid-global-research-v1
  cancel-in-progress: false
jobs:
  sky_paid_reservation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reserve paid API request safely
        id: reservation
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m research.sky_paid_fugle_api_guard --workflow-scope
      - name: Upload sanitized reservation before paid access
        if: steps.reservation.outputs.allowed == 'true'
        id: claim
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.reservation.outputs.claim_name }}
          path: output/fugle_api_guard/claim.json
          if-no-files-found: error
          retention-days: 2
      - name: Independent reservation readback, fail closed
        if: steps.reservation.outputs.allowed == 'true' && steps.claim.outcome == 'success'
        id: verify_claim
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m research.sky_paid_fugle_api_guard --workflow-scope --verify
      - name: Fail job when claim is rejected or not verified
        run: |
          test "${{ steps.reservation.outputs.allowed }}" = "true"
          test "${{ steps.claim.outcome }}" = "success"
          test "${{ steps.verify_claim.outcome }}" = "success"
  probe:
    needs: sky_paid_reservation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
      FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 pytest
      - name: Unit test timeframe support
        run: python tests/test_pit_intraday_timeframe.py
      - name: Unit test Opening Acceleration compact/backtest
        run: python tests/test_opening_acceleration_baseline_c.py
      - name: Build governed PIT universe
        run: python research/audit_historical_universe.py --out output/historical_universe_audit
      - name: Probe 1m historical endpoint on 20 PIT symbols
        run: |
          python research/download_pit_universe_intraday.py \
            --pit-intervals output/historical_universe_audit/pit_intervals.json \
            --from-date "2026-10-01" \
            --to-date "2026-10-22" \
            --timeframe "1" \
            --limit "20" \
            --out research_data/opening_accel_1m_probe
      - name: Require useful 1m probe
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("research_data/opening_accel_1m_probe/download_summary.json")
          x=json.loads(p.read_text(encoding="utf-8"))
          print(json.dumps({k:v for k,v in x.items() if k!="summary"},ensure_ascii=False,indent=2))
          if x.get("symbols_with_data",0) < 18:
              raise SystemExit("1m probe coverage below 90%")
          if x.get("total_bars",0) <= 0:
              raise SystemExit("1m probe returned zero bars")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opening-acceleration-1m-probe-${{ github.run_id }}
          path: |
            research_data/opening_accel_1m_probe/download_summary.json
            research_data/opening_accel_1m_probe/pit_universe_manifest.json
          if-no-files-found: warn
          retention-days: 14
