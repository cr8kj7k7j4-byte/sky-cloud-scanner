name: W3B Production Hardening

on:
  pull_request:
    branches: [ main ]
    paths:
      - "Dockerfile"
      - "requirements.txt"
      - "src/**"
      - "tests/**"
      - "infra/gcp/**"
      - ".github/workflows/w3b-production-hardening.yml"
      - "PRODUCTION_E2E_ACCEPTANCE.md"
      - "docs/W3B_**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: w3b-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile production code
        run: python -m compileall -q src
      - name: Unit and integration regression
        run: |
          pytest -q \
            tests/test_state_store.py \
            tests/test_notifier.py \
            tests/test_structured_log.py \
            tests/test_p0r.py \
            tests/test_p0l_canonical_ledger.py \
            tests/test_pms_canonical_position_manager.py
      - name: Production E2E
        run: pytest -q tests/test_production_e2e_acceptance.py

  container-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build container
        run: docker build --pull -t sky-cloud-scanner:w3b .
      - name: Container import smoke test
        run: docker run --rm --entrypoint python sky-cloud-scanner:w3b -c "import src.main; print('container-import-ok')"
      - name: Verify non-root runtime
        run: |
          uid="$(docker run --rm --entrypoint id sky-cloud-scanner:w3b -u)"
          test "$uid" != "0"

  terraform-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
      - name: Terraform fmt
        run: terraform -chdir=infra/gcp fmt -check
      - name: Terraform init
        run: terraform -chdir=infra/gcp init -backend=false
      - name: Terraform validate
        run: terraform -chdir=infra/gcp validate
