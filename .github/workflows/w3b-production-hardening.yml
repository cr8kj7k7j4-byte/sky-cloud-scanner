name: W3B Production Hardening

on:
  pull_request:
    branches: [ main ]
    paths:
      - "Dockerfile"
      - "requirements.txt"
      - "src/**"
      - "tests/**"
      - "infra/gcp/**"
      - ".github/workflows/w3b-production-hardening.yml"
      - ".github/workflows/scan.yml"
      - ".github/workflows/publish-external-status-snapshot.yml"
      - "PRODUCTION_E2E_ACCEPTANCE.md"
      - "docs/W3B_**"
  workflow_dispatch:
  # PAUSED on 2026-11-10 by user request: formerly scheduled trigger.
  # schedule:
  # - cron: "10 17 * * 1-5"
  # timezone: "Asia/Taipei"
  # 
permissions:
  contents: read

concurrency:
  group: w3b-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile production code
        run: python -m compileall -q src
      - name: Unit and integration regression
        run: |
          pytest -q \
            tests/test_state_store.py \
            tests/test_notifier.py \
            tests/test_structured_log.py \
            tests/test_risk_engine.py \
            tests/test_p0r_loss_streak_source_guard.py \
            tests/test_schedule_health.py \
            tests/test_sky_postmarket_observation.py \
            tests/test_p0l_canonical_ledger.py \
            tests/test_position_manager.py \
            tests/test_w3a_fugle_probe_windows.py \
            tests/test_official_mis_coverage.py \
            tests/test_swing_live_coverage_notice.py \
            tests/test_external_status_stage_contract.py \
            tests/test_ops_cleanup_notification_scope.py \
            tests/test_mops_revenue_pit_collector.py \
            tests/test_mops_workflow_source_smoke.py \
            tests/test_sky_13col_report.py \
            tests/test_sky_13col_artifact_integrity.py \
            tests/test_fugle_individual_execution_probe.py \
            tests/test_full_market_executed_quote_gate.py \
            tests/test_fugle_paid_otc_candidate_routing.py \
            tests/test_sky_daytrade_preopen_readiness.py
      - name: Historical paid atomic download fail-closed regression (zero Fugle calls)
        run: |
          python -m pytest -q tests/test_download_expanded.py tests/test_history_paid_atomic_gate.py tests/test_download_pit_history_failclosed.py
      # Exact-HEAD Plan A tests must actually execute; generic CI green is insufficient.
      # Local fixtures only: no Fugle API, no new scan or trade action.
      - name: Plan A target contract and 5m regression
        run: |
          python -m pytest -q tests/test_swing_two_track_acceptance.py tests/test_sky_snapshot_candidates.py tests/test_sky_v14_ticker_candles_probe.py tests/test_sky_intraday_plan_a_two_track_acceptance.py
      # Retain the exact-SHA Stage 5 source-audit CI from merged PR #690.
      # Offline fixtures only; never call Fugle or certify live VWAP.
      - name: Fugle Stage 5 trade-page source audit regression (zero paid API)
        run: python -m pytest -q tests/test_sky_stage5_vwap_cost_evidence.py
      - name: Production E2E
        run: pytest -q tests/test_production_e2e_acceptance.py

  container-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build container
        run: docker build --pull -t sky-cloud-scanner:w3b .
      - name: Container import smoke test
        run: docker run --rm --entrypoint python sky-cloud-scanner:w3b -c "import src.main; print('container-import-ok')"
      - name: Verify non-root runtime
        run: |
          uid="$(docker run --rm --entrypoint id sky-cloud-scanner:w3b -u)"
          test "$uid" != "0"

  terraform-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
      - name: Terraform fmt
        run: terraform -chdir=infra/gcp fmt -check
      - name: Terraform init
        run: terraform -chdir=infra/gcp init -backend=false
      - name: Terraform validate
        run: terraform -chdir=infra/gcp validate

  notify-failure:
    if: failure()
    needs: [python-validation, container-validation, terraform-validation]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install notifier dependency
        run: pip install requests
      - name: Telegram W3B failure notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          PYTHONPATH=. python research/notify_governance_event.py \
            --kind failure \
            --workflow "W3B Production Hardening" \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  w0-cross-workflow-atomic-claim-proof:
    # Same PR HEAD + canonical synthetic endpoint as governance-e2e; no Fugle calls.
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 689 && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Compete for GitHub atomic ref (real GitHub, no Fugle API)
        env:
          GH_TOKEN: ${{ github.token }}
        run: PYTHONPATH=. python scripts/sky_w0_cross_workflow_claim_evidence.py
      - name: Upload immutable same-run Claim attempt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-w0-claim-race-${{ github.run_id }}
          path: output/w0_claim_race/claim_result.json
          if-no-files-found: error
          retention-days: 30
