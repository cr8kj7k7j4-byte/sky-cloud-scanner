name: Sky MOPS Revenue Parser Probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe-mops-revenue-parser.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas lxml html5lib beautifulsoup4
      - name: Probe MOPS columns
        run: |
          python - <<'PY'
          import io, urllib.request, pandas as pd
          url='https://mopsov.twse.com.tw/nas/t21/sii/t21sc03_115_9_0.html'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          raw=urllib.request.urlopen(req,timeout=20).read()
          print('bytes',len(raw))
          txt=raw.decode('big5',errors='ignore')
          tabs=pd.read_html(io.StringIO(txt))
          print('tables',len(tabs))
          for i,t in enumerate(tabs[:8]):
              print('\nTABLE',i,'shape',t.shape)
              print('columns repr=',repr(t.columns.tolist()))
              print(t.head(5).to_string())
          PY
