name: W1 Swing Challenger V1.1 Canonical Replay

on:
  push:
    branches: [main]
    paths:
      - "research/SKY_SWING_CHALLENGER_V1_1_PREREGISTRATION.md"
      - "research/backtest_swing_challenger_v1_1.py"
      - ".github/workflows/w1-swing-challenger-v1-1.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Locate latest canonical Swing daily artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          repo=os.environ["GITHUB_REPOSITORY"]
          token=os.environ["GH_TOKEN"]
          url=f"https://api.github.com/repos/{repo}/actions/artifacts?per_page=100"
          req=urllib.request.Request(url,headers={"Authorization":f"Bearer {token}","Accept":"application/vnd.github+json"})
          data=json.load(urllib.request.urlopen(req))
          xs=[a for a in data.get("artifacts",[]) if (not a.get("expired")) and str(a.get("name","")).startswith("w3-swing-canonical-daily-history")]
          if not xs:
              raise SystemExit("No non-expired canonical Swing daily artifact found")
          xs.sort(key=lambda a:a.get("created_at",""), reverse=True)
          a=xs[0]
          print("artifact",a["id"],a["name"],a.get("created_at"))
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as fh:
              fh.write(f"id={a['id']}\n")
              fh.write(f"name={a['name']}\n")
          PY

      - name: Download canonical artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _canonical
          python - <<'PY'
          import os, urllib.request
          aid=os.environ["ARTIFACT_ID"]
          repo=os.environ["GITHUB_REPOSITORY"]
          token=os.environ["GH_TOKEN"]
          url=f"https://api.github.com/repos/{repo}/actions/artifacts/{aid}/zip"
          req=urllib.request.Request(url,headers={"Authorization":f"Bearer {token}","Accept":"application/vnd.github+json"})
          with urllib.request.urlopen(req) as r, open("_canonical/artifact.zip","wb") as f:
              f.write(r.read())
          PY
          cd _canonical
          unzip -q artifact.zip
          echo "daily files: $(find . -name '*_D.json' | wc -l)"
          test "$(find . -name '*_D.json' | wc -l)" -gt 0
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.id }}

      - name: Locate history directory
        id: data
        shell: bash
        run: |
          HIST_DIR=$(find _canonical -type f -name '*_D.json' -printf '%h\n' | sort -u | head -1)
          test -n "$HIST_DIR"
          echo "history_dir=$HIST_DIR" >> "$GITHUB_OUTPUT"

      - name: Run preregistered canonical replay
        run: |
          python research/backtest_swing_challenger_v1_1.py \
            --history-dir "${{ steps.data.outputs.history_dir }}" \
            --out research_output_swing_v11

      - name: Publish summary
        if: always()
        run: |
          if [ -f research_output_swing_v11/swing_v11_summary.md ]; then
            cat research_output_swing_v11/swing_v11_summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w1-swing-v11-canonical-replay-${{ github.run_id }}
          path: research_output_swing_v11/
          retention-days: 90
          if-no-files-found: warn
