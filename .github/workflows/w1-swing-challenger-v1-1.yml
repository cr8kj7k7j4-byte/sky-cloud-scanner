name: W1 Swing Challenger V1.1 Canonical Replay

on:
  push:
    branches: [main]
    paths:
      - "research/SKY_SWING_CHALLENGER_V1_1_PREREGISTRATION.md"
      - "research/backtest_swing_challenger_v1_1.py"
      - ".github/workflows/w1-swing-challenger-v1-1.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download verified canonical Swing daily artifact
        uses: dawidd6/action-download-artifact@v11
        with:
          run_id: 40252311345
          name: w3-swing-canonical-daily-history-repaired-40252311345
          path: _canonical
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify canonical artifact
        shell: bash
        run: |
          set -euo pipefail
          echo "daily files: $(find _canonical -name '*_D.json' | wc -l)"
          test "$(find _canonical -name '*_D.json' | wc -l)" -gt 0

      - name: Locate history directory
        id: data
        shell: bash
        run: |
          HIST_DIR=$(find _canonical -type f -name '*_D.json' -printf '%h\n' | sort -u | head -1)
          test -n "$HIST_DIR"
          echo "history_dir=$HIST_DIR" >> "$GITHUB_OUTPUT"

      - name: Run preregistered canonical replay
        run: |
          python research/backtest_swing_challenger_v1_1.py \
            --history-dir "${{ steps.data.outputs.history_dir }}" \
            --out research_output_swing_v11

      - name: Publish summary
        if: always()
        run: |
          if [ -f research_output_swing_v11/swing_v11_summary.md ]; then
            cat research_output_swing_v11/swing_v11_summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w1-swing-v11-canonical-replay-${{ github.run_id }}
          path: research_output_swing_v11/
          retention-days: 90
          if-no-files-found: warn
