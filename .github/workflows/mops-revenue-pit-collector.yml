name: MOPS Revenue PIT Collector

on:
  workflow_dispatch:
  schedule:
    - cron: '5 0-12 * * *'
  push:
    branches:
      - 'feature/mops-revenue-pit-collector'
    paths:
      - 'research/collect_mops_revenue_pit.py'
      - 'tests/test_mops_revenue_pit_collector.py'
      - '.github/workflows/mops-revenue-pit-collector.yml'

permissions:
  contents: write

concurrency:
  group: mops-revenue-pit-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'main' || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependency
        run: pip install pytest

      - name: Validate collector
        run: python -m pytest -q tests/test_mops_revenue_pit_collector.py tests/test_revenue_pit.py

      - name: Collect official MOPS revenue publish timestamps
        run: python research/collect_mops_revenue_pit.py

      - name: Upload observation snapshot and raw page
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mops-revenue-pit-${{ github.run_id }}
          path: |
            output/mops_revenue_pit_snapshot.json
            output/mops_home_raw.html
            output/mops_asset_*
            output/mops_t51sb10_raw.json
          if-no-files-found: warn
          retention-days: 90

      - name: Persist PIT ledger on main scheduled/manual runs
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref_name == 'main')
        run: |
          if git diff --quiet -- data/revenue_pit/mops_revenue_filing_times.jsonl; then
            echo "No new MOPS revenue filing timestamps."
            exit 0
          fi
          git config user.name "sky-pit-bot"
          git config user.email "sky-pit-bot@users.noreply.github.com"
          git add data/revenue_pit/mops_revenue_filing_times.jsonl
          git commit -m "data: append MOPS revenue PIT timestamps"
          git push origin HEAD:main
