name: Three Model Fugle Real API Read-Only Research Acceptance
# Research-only push test. No GCP credentials, no trading, no production merge.
on:
  push:
    branches:
      - research/three-model-evidence-gate-20261108
    paths:
      - research/three_model_fugle_api_smoke.py
      - research/three_model_fugle_pipeline.py
      - .github/workflows/three-model-fugle-api-smoke.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sky-fugle-paid-global-research-v1-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}-${{ inputs.symbol || inputs.symbols || 'all' }}-${{ inputs.from_date || inputs.start_date || 'start' }}-${{ inputs.end_date || inputs.to_date || 'end' }}
  cancel-in-progress: false
jobs:
  sky_paid_reservation:
    # Fail closed on repository merge and PR; explicit manual permission for paid research only.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reserve paid API request safely
        id: reservation
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m research.sky_paid_fugle_api_guard --workflow-scope
      - name: Upload sanitized reservation before paid access
        if: steps.reservation.outputs.allowed == 'true'
        id: claim
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.reservation.outputs.claim_name }}
          path: output/fugle_api_guard/claim.json
          if-no-files-found: error
          retention-days: 2
      - name: Independent reservation readback, fail closed
        if: steps.reservation.outputs.allowed == 'true' && steps.claim.outcome == 'success'
        id: verify_claim
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m research.sky_paid_fugle_api_guard --workflow-scope --verify
      - name: Fail job when claim is rejected or not verified
        run: |
          test "${{ steps.reservation.outputs.allowed }}" = "true"
          test "${{ steps.claim.outcome }}" = "success"
          test "${{ steps.verify_claim.outcome }}" = "success"
  real-api-readonly:
    needs: sky_paid_reservation
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate real paid Fugle history without publishing candles
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
          RESEARCH_END_DATE: "2026-11-06"
        run: |
          PYTHONPATH=. python -m research.three_model_fugle_api_smoke
      - name: Attach sanitized acceptance status
        if: always()
        run: |
          if [ -f output/three_model_fugle_api_smoke_summary.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          d=json.loads(Path("output/three_model_fugle_api_smoke_summary.json").read_text())
          print("### 富果歷史行情唯讀驗收（研究）")
          print("- 結果:", d["status"])
          print("- 歷史截止:",d["end_date_requested"])
          for row in d["results"]:
              print("- 股票",row["symbol"],"週期",row["timeframe"],"結果",row["status"],"筆數",row.get("rows","N/A"))
          print("- 無原始付費行情附件、無GCS寫入、無下單、無Production升版")
          PY
          fi
      - name: Save sanitized check only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: three-model-fugle-readonly-sanitized-${{ github.run_id }}
          path: output/three_model_fugle_api_smoke_summary.json
          if-no-files-found: warn
          retention-days: 14
