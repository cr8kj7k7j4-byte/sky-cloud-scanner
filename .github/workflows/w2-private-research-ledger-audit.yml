name: W2 Private Research Ledger Read-only Audit
# No scheduled execution; no paid Fugle calls or GCS writes.
# Pull requests run local mock contracts without cloud credentials.
on:
  pull_request:
    paths:
      - '.github/workflows/w2-private-research-ledger-audit.yml'
      - 'research/three_model_private_ledger_audit.py'
      - 'tests/test_w2_private_ledger_audit.py'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline fail-closed integrity contracts
        run: |
          python -m pip install pytest
          PYTHONPATH=. python -m pytest -q tests/test_w2_private_ledger_audit.py tests/test_three_model_next_session_markout.py
      - name: Check authenticated read-only audit prerequisites
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          SKY_RESEARCH_GCS_BUCKET: ${{ vars.SKY_RESEARCH_GCS_BUCKET }}
        run: |
          python - <<'PY'
          import os
          names=("GCP_WIF_PROVIDER","GCP_SERVICE_ACCOUNT","SKY_RESEARCH_GCS_BUCKET")
          missing=[k for k in names if not os.getenv(k)]
          if missing:
              raise RuntimeError("MISSING_PRIVATE_AUDIT_CONFIGURATION:"+",".join(missing))
          print("PRIVATE_READ_ONLY_AUDIT_CONFIGURATION_PRESENT")
          PY
      - name: Authenticate GCP WIF only for authorized main dispatch
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: Install storage client only for authorized main dispatch
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        run: python -m pip install google-cloud-storage
      - name: Read existing private GCS research objects without writing
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          SKY_RESEARCH_GCS_BUCKET: ${{ vars.SKY_RESEARCH_GCS_BUCKET }}
        run: PYTHONPATH=. python -m research.three_model_private_ledger_audit
      - name: Publish sanitized read-only proof
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        run: |
          if [ -f output/three_model_private_ledger_audit.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          r=json.loads(Path("output/three_model_private_ledger_audit.json").read_text())
          print("## W2 Private research ledger read-only audit")
          print("Observations:",r["observations_scanned"])
          print("Next-session markouts:",r["markouts_scanned"])
          print("Linked:",r["markouts_linked_to_original"])
          print("Pending:",r["pending_observations"])
          print("GCS writes: NONE; paid OHLCV exported: NO; trading: NO")
          PY
          fi
      - name: Retain sanitized audit artifact
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: w2-private-ledger-readonly-audit-${{ github.run_id }}
          path: output/three_model_private_ledger_audit.json
          retention-days: 30
          if-no-files-found: error
