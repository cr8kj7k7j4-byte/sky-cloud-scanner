name: Sky Monthly Revenue Merge Validation

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pandas
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Download monthly revenue shards
        uses: dawidd6/action-download-artifact@v11
        with:
          run_id: 40142272190
          name_is_regexp: true
          name: revenue-.*
          path: revenue_shards
          search_artifacts: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge and validate
        run: |
          python research/merge_validate_monthly_revenue.py             --input-root revenue_shards             --out research_output_revenue_merged

      - name: Publish summary
        if: always()
        run: |
          if [ -f research_output_revenue_merged/merge_validation_summary.md ]; then
            cat research_output_revenue_merged/merge_validation_summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload merged dataset
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-monthly-revenue-merged-${{ github.run_id }}
          path: research_output_revenue_merged
          if-no-files-found: warn
          retention-days: 14
