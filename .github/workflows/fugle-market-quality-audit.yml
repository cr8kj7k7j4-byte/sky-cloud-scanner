name: Fugle Paid Market Quality Audit (Read Only)
on:
  workflow_dispatch:

# Manual-only diagnostic fallback. Canonical scheduled evidence is
# .github/workflows/sky-market-provider-readiness.yml

permissions:
  contents: read

concurrency:
  group: sky-fugle-paid-global-research-v1
  cancel-in-progress: false

jobs:
  sky_paid_reservation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reserve paid API request safely
        id: reservation
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m research.sky_paid_fugle_api_guard --workflow-scope
      - name: Upload sanitized reservation before paid access
        if: steps.reservation.outputs.allowed == 'true'
        id: claim
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.reservation.outputs.claim_name }}
          path: output/fugle_api_guard/claim.json
          if-no-files-found: error
          retention-days: 2
      - name: Independent reservation readback, fail closed
        if: steps.reservation.outputs.allowed == 'true' && steps.claim.outcome == 'success'
        id: verify_claim
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m research.sky_paid_fugle_api_guard --workflow-scope --verify
      - name: Fail job when claim is rejected or not verified
        run: |
          test "${{ steps.reservation.outputs.allowed }}" = "true"
          test "${{ steps.claim.outcome }}" = "success"
          test "${{ steps.verify_claim.outcome }}" = "success"
  market-quality:
    needs: sky_paid_reservation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate audit parser offline
        run: python3 -m unittest tests/test_fugle_market_quality_audit.py tests/test_fugle_market_quality_integration.py
      - name: Collect paid Fugle coverage and intraday timestamp evidence
        run: python3 research/fugle_market_quality_audit.py
      - name: Upload dated audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fugle-market-quality-audit
          path: fugle_market_quality_audit.json
          retention-days: 30
          if-no-files-found: warn
