name: Sky Historical 5m Export

on:
  workflow_dispatch:
    inputs:
      from_date:
        description: "Start date"
        required: true
        default: "2023-05-23"
      to_date:
        description: "End date"
        required: true
        default: "2026-10-22"
      twse_n:
        description: "TWSE deterministic sample size"
        required: true
        default: "50"
      tpex_n:
        description: "TPEx deterministic sample size"
        required: true
        default: "50"

permissions:
  contents: read

concurrency:
  group: sky-fugle-paid-global-research-v1
  cancel-in-progress: false
jobs:
  sky_paid_reservation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reserve paid API request safely
        id: reservation
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m research.sky_paid_fugle_api_guard --workflow-scope
      - name: Upload sanitized reservation before paid access
        if: steps.reservation.outputs.allowed == 'true'
        id: claim
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.reservation.outputs.claim_name }}
          path: output/fugle_api_guard/claim.json
          if-no-files-found: error
          retention-days: 2
      - name: Independent reservation readback, fail closed
        if: steps.reservation.outputs.allowed == 'true' && steps.claim.outcome == 'success'
        id: verify_claim
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m research.sky_paid_fugle_api_guard --workflow-scope --verify
      - name: Fail job when claim is rejected or not verified
        run: |
          test "${{ steps.reservation.outputs.allowed }}" = "true"
          test "${{ steps.claim.outcome }}" = "success"
          test "${{ steps.verify_claim.outcome }}" = "success"
  export-history:
    needs: sky_paid_reservation
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: pip install requests

      - name: Unit tests
        run: python tests/test_history_export.py

      - name: Build deterministic official-universe sample
        run: |
          python research/build_universe_sample.py \
            --twse-n "${{ inputs.twse_n }}" \
            --tpex-n "${{ inputs.tpex_n }}" \
            --out research_data/universe_manifest.json

      - name: Download Fugle historical 5m data
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
        run: |
          python research/download_expanded.py \
            --manifest research_data/universe_manifest.json \
            --from-date "${{ inputs.from_date }}" \
            --to-date "${{ inputs.to_date }}" \
            --out research_data/history

      - name: Validate export
        run: |
          python research/validate_history_export.py \
            --history-dir research_data/history \
            --manifest research_data/universe_manifest.json \
            --download-summary research_data/download_summary.json \
            --out research_data/export_validation.json

      - name: Create archive
        run: |
          tar -czf sky-history-5m-${{ github.run_id }}.tar.gz research_data/

      - name: Publish summary
        if: always()
        run: |
          if [ -f research_data/export_validation.json ]; then
            echo "## Historical 5m Export" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat research_data/export_validation.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload historical data artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-history-5m-${{ github.run_id }}
          path: |
            sky-history-5m-${{ github.run_id }}.tar.gz
            research_data/universe_manifest.json
            research_data/download_summary.json
            research_data/export_validation.json
          if-no-files-found: error
          retention-days: 14
