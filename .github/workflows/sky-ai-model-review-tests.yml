name: Sky AI Model Review Contract Tests
on:
  pull_request:
    paths:
      - 'scripts/sky_ai_pr_review.py'
      - 'tests/test_sky_ai_pr_review_contract.py'
      - '.github/workflows/sky-ai-model-security-review.yml'
      - '.github/workflows/sky-ai-model-review-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # PR checkout is permitted only in this read-only, secret-free test workflow.
      - uses: actions/checkout@v4
      - name: Compile trusted-model reviewer code
        run: python3 -m py_compile scripts/sky_ai_pr_review.py tests/test_sky_ai_pr_review_contract.py
      - name: Run mocked negative-path contract tests (no external API)
        run: python3 -m unittest discover -s tests -p 'test_sky_ai_pr_review_contract.py' -v
