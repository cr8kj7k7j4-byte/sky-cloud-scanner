name: Sky Limited Candidate Research (Prior Close + Fugle Singles)
on:
  pull_request:
    paths:
      - "research/limited_candidate_scanner.py"
      - "tests/test_limited_candidate_scanner.py"
      - ".github/workflows/sky-limited-candidate-research.yml"
  push:
    branches: [main]
    paths:
      - "research/limited_candidate_scanner.py"
      - ".github/workflows/sky-limited-candidate-research.yml"
  workflow_dispatch:
  # PAUSED on 2026-11-10 by user request: formerly scheduled trigger.
  # schedule:
  # # 09:20 Asia/Taipei weekdays; independent read-only limited scope research.
  # # Actual GitHub schedule start time may be delayed.
  # - cron: "20 1 * * 1-5"
permissions:
  contents: read
concurrency:
  group: sky-fugle-paid-global-research-v1
  cancel-in-progress: true
jobs:
  sky_paid_reservation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reserve paid API request safely
        id: reservation
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m research.sky_paid_fugle_api_guard --workflow-scope
      - name: Upload sanitized reservation before paid access
        if: steps.reservation.outputs.allowed == 'true'
        id: claim
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.reservation.outputs.claim_name }}
          path: output/fugle_api_guard/claim.json
          if-no-files-found: error
          retention-days: 2
      - name: Independent reservation readback, fail closed
        if: steps.reservation.outputs.allowed == 'true' && steps.claim.outcome == 'success'
        id: verify_claim
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m research.sky_paid_fugle_api_guard --workflow-scope --verify
      - name: Fail job when claim is rejected or not verified
        run: |
          test "${{ steps.reservation.outputs.allowed }}" = "true"
          test "${{ steps.claim.outcome }}" = "success"
          test "${{ steps.verify_claim.outcome }}" = "success"
  test-and-collect:
    needs: sky_paid_reservation
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requirements
        run: pip install -r requirements.txt pytest
      - name: Validate fail-closed limited-candidate contracts
        run: PYTHONPATH=. python -m pytest -q tests/test_limited_candidate_scanner.py tests/test_sky_single_stock_realtime.py
      - name: Validate actual Taiwan trading calendar for research
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        id: calendar
        shell: bash
        run: |
          set -euo pipefail
          python -m src.trading_calendar --out output/limited_candidates/calendar.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          data=json.loads(Path("output/limited_candidates/calendar.json").read_text())
          if data.get("source_status") != "PASS":
              raise SystemExit("Research withheld: official calendar unavailable")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              print("open="+str(data.get("should_scan") is True).lower(), file=f)
          PY
      - name: Collect bounded candidate evidence (main only; no orders)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.calendar.outputs.open == 'true'
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
        run: PYTHONPATH=. python -m research.limited_candidate_scanner --max-candidates 12
      - name: Upload research evidence even if official sources unavailable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: limited-candidate-research-${{ github.run_id }}
          path: output/limited_candidates/
          if-no-files-found: warn
          retention-days: 30
