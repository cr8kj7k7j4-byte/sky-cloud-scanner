name: W3A Intraday PIT Field Provenance

on:
  pull_request:
    paths:
      - "research/INTRADAY_PIT_FIELD_PROVENANCE_REGISTRY.json"
      - "research/audit_intraday_pit_field_provenance.py"
      - "tests/test_intraday_pit_field_provenance.py"
      - ".github/workflows/w3a-intraday-pit-field-provenance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest -q tests/test_intraday_pit_field_provenance.py
      - run: |
          python research/audit_intraday_pit_field_provenance.py             --registry research/INTRADAY_PIT_FIELD_PROVENANCE_REGISTRY.json             --out research_output/intraday_pit_field_provenance_audit.json
      - if: always()
        run: cat research_output/intraday_pit_field_provenance_audit.json >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w3a-intraday-pit-field-provenance
          path: research_output/intraday_pit_field_provenance_audit.json
          if-no-files-found: error
          retention-days: 30
