name: Intraday failure alert tests
on:
  pull_request:
    paths:
      - "research/intraday_scan_failure_alert.py"
      - "tests/test_intraday_scan_failure_alert.py"
      - ".github/workflows/scan.yml"
      - ".github/workflows/intraday-failure-alert-test.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: PYTHONPATH=. python -m unittest discover -s tests -p "test_intraday_scan_failure_alert.py"
