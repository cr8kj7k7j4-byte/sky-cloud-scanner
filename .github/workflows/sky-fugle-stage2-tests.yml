name: Sky Fugle Stage2 Probe Checks
on:
  pull_request:
    paths:
      - 'src/sky_fugle_stage2_probe.py'
      - 'tests/test_sky_fugle_stage2_probe.py'
      - '.github/workflows/sky-fugle-stage2*.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python -m unittest tests.test_sky_fugle_stage2_probe -v
