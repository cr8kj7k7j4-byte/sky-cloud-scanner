name: Sky Governance E2E Validation

on:
  push:
    branches:
      - 'governance/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance-e2e:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile
        run: python -m compileall -q src tests research
      - name: W0 single-owner workflow de-duplication guard (no paid API)
        run: |
          python -m unittest tests.test_sky_workflow_dedup_audit -v
          python scripts/sky_workflow_dedup_audit.py
      - name: Upload read-only W0 workflow inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-w0-workflow-dedup-audit
          path: output/w0_workflow_dedup_audit.json
          if-no-files-found: warn
          retention-days: 14
      - name: Run governance and production E2E
        run: |
          pytest -q \
            tests/test_production_e2e_acceptance.py \
            tests/test_governance_pit_gate.py \
            tests/test_revenue_pit.py

  w0-cross-workflow-atomic-claim-proof:
    # Same-repository PR only. Grant write only to this zero-Fugle evidence job.
    if: ${{ github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'w0-363-claim-race-proof-') && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Compete for GitHub atomic ref (real GitHub, no Fugle API)
        env:
          GH_TOKEN: ${{ github.token }}
        run: PYTHONPATH=. python scripts/sky_w0_cross_workflow_claim_evidence.py
      - name: Upload immutable same-run Claim attempt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-w0-claim-race-${{ github.run_id }}
          path: output/w0_claim_race/claim_result.json
          if-no-files-found: error
          retention-days: 30
