name: Sky VNext Residual Label Audit

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/audit-residual-return-labels.yml'

permissions:
  actions: read
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Download historical 5m artifact
        uses: dawidd6/action-download-artifact@v11
        with:
          run_id: 39963770301
          name_is_regexp: true
          name: sky-history-5m-.*
          path: _hist
          search_artifacts: true
          github_token: ${{ secrets.GITHUB_TOKEN }}


      - name: Run residual return label audit
        run: |
          python research/audit_residual_return_labels.py \
            --history-dir "${{ steps.data.outputs.history_dir }}" \
            --out research_output_residual_label

      - name: Publish summary
        if: always()
        run: |
          if [ -f research_output_residual_label/residual_label_summary.md ]; then
            cat research_output_residual_label/residual_label_summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-residual-label-${{ github.run_id }}
          path: research_output_residual_label
          if-no-files-found: warn
          retention-days: 14
