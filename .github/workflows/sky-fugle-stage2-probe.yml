name: Sky Fugle Stage2 Limited Quote Entitlement Probe
on:
  push:
    branches: [main]
    paths:
      - 'scan_requests/fugle_stage2/latest.json'
  workflow_dispatch:
permissions:
  actions: read
  # Atomic endpoint claims create a research-only Git ref; no main writes.
  contents: write
concurrency:
  group: sky-fugle-paid-global-research-v1-live-wholemarket
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Run isolated safety tests
        run: python -m unittest tests.test_sky_fugle_stage2_probe -v
      - name: Verify paid reservation guard without Fugle
        run: python -m unittest tests.test_sky_paid_fugle_api_guard tests.test_sky_fugle_atomic_ref_claim -v
      - name: Reserve shared paid Fugle slot (fail closed)
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m research.sky_paid_fugle_api_guard --scope 'sky:live:wholemarket'
      - name: Publish reservation before any paid call
        id: claim
        if: steps.guard.outputs.allowed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.guard.outputs.claim_name }}
          path: output/fugle_api_guard/claim.json
          if-no-files-found: error
          retention-days: 2
      - name: Independently verify reservation (fail closed)
        id: verify_claim
        if: steps.guard.outputs.allowed == 'true' && steps.claim.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m research.sky_paid_fugle_api_guard --scope 'sky:live:wholemarket' --verify
      - name: Probe 2 market snapshots and 2 individual quotes
        if: steps.guard.outputs.allowed == 'true' && steps.verify_claim.outcome == 'success'
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
          SKY_PAID_ATOMIC_ENFORCE: '1'
          GH_TOKEN: ${{ github.token }}
        run: python -m src.sky_fugle_stage2_probe
      - name: Upload sanitized non-order evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-fugle-stage2-${{ github.run_id }}
          path: output/fugle_stage2_probe/latest.json
          if-no-files-found: warn
      # Protected main is read-only to Actions. Per-run immutable Artifact above
      # is the authoritative audit; never attempt a direct main branch write.
      - name: Record per-run probe audit location
        if: always()
        run: |
          echo "Stage2 evidence: sky-fugle-stage2-${GITHUB_RUN_ID}" >> "$GITHUB_STEP_SUMMARY"
          echo "Research-only; no production promotion or orders." >> "$GITHUB_STEP_SUMMARY"
