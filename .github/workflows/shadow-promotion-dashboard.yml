name: Shadow Promotion Dashboard

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/shadow-promotion-dashboard.yml"
      - "research/shadow_promotion_dashboard.py"
      - "src/model_registry.py"
      - "src/paper_trading.py"
      - "src/shadow_evidence.py"
      - "research/w4_scan_artifact_eligibility.py"
      - "tests/test_w4_scan_artifact_eligibility.py"
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "30 16 * * 1-5"
      timezone: "Asia/Taipei"

permissions:
  contents: read
  actions: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test/runtime dependencies
        run: pip install -r requirements.txt pytest

      - name: Compile
        run: python -m compileall -q src tests research

      - name: Dashboard tests
        run: >-
          PYTHONPATH=. pytest -q
          tests/test_shadow_promotion_dashboard.py
          tests/test_evidence_promotion_gates.py
          tests/test_shadow_evidence.py
          tests/test_w4_scan_artifact_eligibility.py

      - name: Download recent successful scan artifacts
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p shadow_history

          gh run list \
            --workflow scan.yml \
            --status success \
            --limit 100 \
            --json databaseId,createdAt \
            --jq '.[] | select(.createdAt >= "2026-10-24T23:28:08Z") | .databaseId' \
            > /tmp/scan_run_ids.txt

          while read -r run_id; do
            [ -z "$run_id" ] && continue
            dest="shadow_history/$run_id"
            mkdir -p "$dest"
            gh run download "$run_id" \
              -n "sky-scan-$run_id" \
              -D "$dest" || true
          done < /tmp/scan_run_ids.txt

          find shadow_history -type f -path '*/output/paper/*.json' | sort || true

      - name: Audit eligible Shadow scan artifacts
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python research/w4_scan_artifact_eligibility.py \
            --root shadow_history \
            --ledger-start "2026-10-24T23:28:08Z" \
            --out research_output/w4_scan_eligibility.json

          ELIGIBLE_RUNS="$(python - <<'PY'
          import json
          from pathlib import Path
          p=Path("research_output/w4_scan_eligibility.json")
          x=json.loads(p.read_text(encoding="utf-8"))
          print(int(x.get("eligible_run_count") or 0))
          PY
          )"
          echo "ELIGIBLE_SUCCESSFUL_SCAN_RUNS=$ELIGIBLE_RUNS" >> "$GITHUB_ENV"

      - name: Download enriched Shadow outcome artifacts
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outcome_history

          gh run list \
            --workflow shadow-outcome-backfill.yml \
            --status success \
            --limit 100 \
            --json databaseId,createdAt \
            --jq '.[].databaseId' \
            > /tmp/outcome_run_ids.txt

          while read -r run_id; do
            [ -z "$run_id" ] && continue
            dest="outcome_history/$run_id/output/paper"
            mkdir -p "$dest"
            gh run download "$run_id" \
              -n "shadow-outcomes-$run_id" \
              -D "$dest" || true
          done < /tmp/outcome_run_ids.txt

          if [ -d outcome_history ]; then
            cp -R outcome_history/. shadow_history/ || true
          fi

          find shadow_history -type f -name '*-outcomes.json' | sort || true

      - name: Build dashboard
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PAPER_ROOT="output/paper"
          else
            PAPER_ROOT="shadow_history"
          fi

          PYTHONPATH=. python research/shadow_promotion_dashboard.py \
            --paper-dir "$PAPER_ROOT" \
            --eligible-successful-scan-runs "${ELIGIBLE_SUCCESSFUL_SCAN_RUNS:-0}" \
            --out research_output/shadow_promotion_dashboard.json

      - name: Upload dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadow-promotion-dashboard
          path: |
            research_output/shadow_promotion_dashboard.json
            research_output/shadow_promotion_dashboard.md
            research_output/w4_scan_eligibility.json
          if-no-files-found: error
          retention-days: 30

      - name: Production E2E
        run: PYTHONPATH=. pytest -q tests/test_production_e2e_acceptance.py
