name: Fugle Paid API Acceptance (Manual Regression)
on:
  workflow_dispatch:
  # Initial six-endpoint acceptance already passed. Avoid 48 daily repeat runs;
  # market-hour ongoing diagnostics remain in sky-market-provider-readiness.yml.
  push:
    branches: [main]
    paths:
      - ".github/workflows/fugle-paid-api-acceptance.yml"

permissions:
  contents: read

concurrency:
  group: sky-fugle-paid-global-research-v1-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}-${{ inputs.symbol || inputs.symbols || 'all' }}-${{ inputs.from_date || inputs.start_date || 'start' }}-${{ inputs.end_date || inputs.to_date || 'end' }}
  cancel-in-progress: false

jobs:
  sky_paid_reservation:
    # Fail closed on repository merge and PR; explicit manual permission for paid research only.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reserve paid API request safely
        id: reservation
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m research.sky_paid_fugle_api_guard --workflow-scope
      - name: Upload sanitized reservation before paid access
        if: steps.reservation.outputs.allowed == 'true'
        id: claim
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.reservation.outputs.claim_name }}
          path: output/fugle_api_guard/claim.json
          if-no-files-found: error
          retention-days: 2
      - name: Independent reservation readback, fail closed
        if: steps.reservation.outputs.allowed == 'true' && steps.claim.outcome == 'success'
        id: verify_claim
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m research.sky_paid_fugle_api_guard --workflow-scope --verify
      - name: Fail job when claim is rejected or not verified
        run: |
          test "${{ steps.reservation.outputs.allowed }}" = "true"
          test "${{ steps.claim.outcome }}" = "success"
          test "${{ steps.verify_claim.outcome }}" = "success"
  validate:
    needs: sky_paid_reservation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
    steps:
      - name: Validate actual Fugle API access (never print credentials)
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error, datetime, time, sys
          from zoneinfo import ZoneInfo
          key = os.environ.get("FUGLE_API_KEY", "").strip()
          if not key:
              print("FAIL: FUGLE_API_KEY missing"); sys.exit(1)
          base="https://api.fugle.tw/marketdata/v1.0/stock"
          tests=[
              ("TSE_paid_snapshot", "/snapshot/quotes/TSE?type=COMMONSTOCK", "snapshot", "TSE"),
              ("OTC_paid_snapshot", "/snapshot/quotes/OTC?type=COMMONSTOCK", "snapshot", "OTC"),
              ("TSE_quote_2330", "/intraday/quote/2330", "quote", "2330"),
              ("OTC_quote_6488", "/intraday/quote/6488", "quote", "6488"),
              ("Daily_history_2330", "/historical/candles/2330?from=2026-10-01&to=2026-10-15&timeframe=D", "history", "D"),
              ("Minute_history_2330", "/historical/candles/2330?from=2026-11-06&to=2026-11-06&timeframe=1", "history", "1"),
          ]
          rows=[]
          for label,path,kind,expected in tests:
              code=None; data={}; reason=""; count=None; stamp=None
              try:
                  req=urllib.request.Request(base+path, headers={"X-API-KEY":key,"Accept":"application/json","User-Agent":"Sky-Fugle-Acceptance/1.0"})
                  with urllib.request.urlopen(req, timeout=18) as resp:
                      code=resp.status
                      data=json.load(resp)
                  if not isinstance(data,dict): data={}
                  if kind=="snapshot":
                      count=len(data.get("data",[])) if isinstance(data.get("data"),list) else 0
                      stamp=str(data.get("date",""))+" "+str(data.get("time",""))
                      valid=data.get("market")==expected and count>0 and any(isinstance(x,dict) and x.get("symbol") and (x.get("closePrice") is not None or x.get("lastPrice") is not None) for x in data.get("data",[]))
                  elif kind=="quote":
                      count=1 if data.get("symbol")==expected else 0
                      stamp=str(data.get("date",""))
                      valid=count==1 and (data.get("closePrice") is not None or data.get("lastPrice") is not None)
                  else:
                      count=len(data.get("data",[])) if isinstance(data.get("data"),list) else 0
                      stamp=str(data.get("data",[{}])[0].get("date","")) if count else ""
                      valid=data.get("timeframe")==expected and count>0 and any(isinstance(x,dict) and x.get("close") is not None and x.get("volume") is not None for x in data.get("data",[]))
                  reason="PASS" if valid else "INVALID_OR_EMPTY"
              except urllib.error.HTTPError as err:
                  code=err.code;reason="HTTP_ERROR"
              except Exception as err:
                  reason=type(err).__name__
              rows.append({"test":label,"status":reason,"http":code,"rows":count,"source_time":stamp})
              print(f"{label}: {reason}; HTTP={code}; rows={count}; data_date={stamp}")
              time.sleep(0.25)
          report={"checked_at_taipei":datetime.datetime.now(ZoneInfo("Asia/Taipei")).isoformat(),"source":"Fugle MarketData REST v1.0","tests":rows,"all_pass":all(x["status"]=="PASS" for x in rows),"note":"Weekend quote/snapshot may be stale; real-time timeliness requires market-hour test."}
          with open("fugle_api_acceptance.json","w") as f: json.dump(report,f,ensure_ascii=False,indent=2)
          if not report["all_pass"]: sys.exit(1)
          PY
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fugle-api-acceptance
          path: fugle_api_acceptance.json
          if-no-files-found: warn
          retention-days: 14
      - name: Publish paid entitlement acceptance summary (not live certification)
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p=Path("fugle_api_acceptance.json")
          lines=["## 富果付費 API 端點驗收", "",
                 "此流程檢驗端點授權與回應格式，**不驗證盤中逐筆成交時間、全市場有效成交價涵蓋率、正式交易訊號或獲利**。", ""]
          if not p.is_file():
              lines += ["API 驗收檔不存在；狀態：未通過。", ""]
          else:
              try:
                  x=json.loads(p.read_text(encoding="utf-8"))
                  lines += ["檢查時間（台灣）：" + str(x.get("checked_at_taipei")),
                            "端點整體結果：" + ("PASS_API_ENDPOINT_ONLY" if x.get("all_pass") else "FAIL_OR_PARTIAL"),
                            "", "| 端點 | 狀態 | HTTP | 筆數 | 來源日期 |",
                            "|---|---|---:|---:|---|"]
                  for row in x.get("tests",[]):
                      lines.append("| " + " | ".join(str(row.get(k) if row.get(k) is not None else "—")
                                   for k in ("test","status","http","rows","source_time")) + " |")
              except (ValueError, TypeError):
                  lines += ["驗收 JSON 無法解析；狀態：未通過。"]
          lines += ["", "正式交易資格：**NO_TRADE_UNTIL_SEPARATE_LIVE_MARKET_AND_GOVERNANCE_ACCEPTANCE**", ""]
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as out:
              out.write("\n".join(lines))
          PY
      - name: Notify Telegram when Fugle verification fails
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "Telegram unavailable; failed workflow and evidence artifact remain available."
            exit 0
          fi
          python3 - <<'PY'
          import json, os, urllib.request
          run_url = "https://github.com/" + os.environ["GITHUB_REPOSITORY"] + "/actions/runs/" + os.environ["GITHUB_RUN_ID"]
          msg = "Sky 富果 API 驗收未通過（不代表可交易）：\n" + run_url
          data = json.dumps({"chat_id": os.environ["TELEGRAM_CHAT_ID"], "text": msg, "disable_web_page_preview": True}).encode()
          req = urllib.request.Request("https://api.telegram.org/bot" + os.environ["TELEGRAM_BOT_TOKEN"] + "/sendMessage",
                                       data=data, headers={"Content-Type": "application/json"}, method="POST")
          try:
              with urllib.request.urlopen(req, timeout=15) as response:
                  print("telegram_send_status:", response.status)
          except Exception as e:
              print("telegram_notification_failed:", type(e).__name__)
          PY
