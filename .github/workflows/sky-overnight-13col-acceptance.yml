name: Sky Overnight 13-column Acceptance Watchdog
on:
  workflow_dispatch:
  schedule:
    # Approx. five minute GitHub scheduling, UTC. Guard to Taiwan 2026-11-10 09:00.
    - cron: '*/5 * * * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: sky-overnight-13col-acceptance
  cancel-in-progress: false
jobs:
  overnight-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read-only evidence and no unsupported claims
        shell: bash
        run: |
          mkdir -p output/overnight_acceptance
          python - <<'PY'
          import datetime, json, os, subprocess
          from pathlib import Path
          from zoneinfo import ZoneInfo
          now = datetime.datetime.now(ZoneInfo("Asia/Taipei"))
          cutoff = datetime.datetime(2026, 11, 10, 9, 0, tzinfo=ZoneInfo("Asia/Taipei"))
          repo = os.environ["GITHUB_REPOSITORY"]
          workflows = ["scan.yml", "swing-v11-live-scan.yml", "swing-postmarket-research.yml", "sky-full-market-private.yml"]
          report = {"schema": "SKY_OVERNIGHT_ACCEPTANCE_V1", "taipei_time": now.isoformat(),
                    "cutoff_taipei": cutoff.isoformat(), "within_window": now <= cutoff,
                    "no_order": True, "no_production_promotion": True, "workflows": {}}
          if now <= cutoff:
              for filename in workflows:
                  args = ["gh", "api", f"repos/{repo}/actions/workflows/{filename}/runs?per_page=1"]
                  p = subprocess.run(args, capture_output=True, text=True)
                  if p.returncode != 0:
                      report["workflows"][filename] = {"status": "QUERY_FAILED", "detail": p.stderr[-250:]}
                      continue
                  run = (json.loads(p.stdout).get("workflow_runs") or [{}])[0]
                  report["workflows"][filename] = {
                      "run_id": run.get("id"), "created_at": run.get("created_at"),
                      "status": run.get("status"), "conclusion": run.get("conclusion"),
                      "html_url": run.get("html_url")}
          report["ready_for_trading"] = False
          report["research_visibility_only"] = True
          path = Path("output/overnight_acceptance/latest.json")
          path.write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding="utf-8")
          print(json.dumps(report, ensure_ascii=False, indent=2))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("# Sky overnight read-only acceptance\n\n")
              f.write(f"Taipei: {now.isoformat()}\n\n")
              for name, r in report["workflows"].items():
                  f.write(f"- {name}: {r.get('conclusion') or r.get('status')} ({r.get('html_url','no link')})\n")
              f.write("\nResearch observation does not certify production eligibility.\n")
          PY
      - name: Preserve audit even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-overnight-acceptance-${{ github.run_id }}
          path: output/overnight_acceptance/
          if-no-files-found: warn
          retention-days: 7
