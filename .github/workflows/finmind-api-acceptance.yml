name: FinMind API entitlement acceptance

on:
  workflow_dispatch:
  push:
    branches:
      - integration/finmind-api-acceptance-20261108
    paths:
      - research/finmind_api_acceptance.py
      - .github/workflows/finmind-api-acceptance.yml
      - docs/FINMIND_API_ACCEPTANCE_20261108.md

permissions:
  contents: read

jobs:
  finmind-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Read-only API probes (token never logged)
        id: probe
        continue-on-error: true
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python research/finmind_api_acceptance.py
      - name: Publish sanitized report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finmind-entitlement-acceptance
          path: research_output/finmind_acceptance.json
          if-no-files-found: warn
          retention-days: 14
      - name: Fail job when acceptance fails
        if: steps.probe.outcome != 'success'
        run: |
          echo "FinMind acceptance did not pass; inspect the sanitized report artifact."
          exit 1
