name: Three Model GCS Identity Smoke Test (Manual Only)
# Isolated research infrastructure check: NO paid Fugle API, NO trades, NO deployment.
# This is intentionally on main because the established OIDC provider only trusts
# main + workflow_dispatch. Independent from draft PR #324.
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: three-model-gcs-identity-smoke
  cancel-in-progress: false
jobs:
  research-gcs-smoke:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check configured secret and variable presence without printing values
        env:
          GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          SKY_RESEARCH_GCS_BUCKET: ${{ vars.SKY_RESEARCH_GCS_BUCKET }}
        run: |
          python - <<'PY'
          import os,sys
          required=("GCP_WIF_PROVIDER","GCP_SERVICE_ACCOUNT","SKY_RESEARCH_GCS_BUCKET")
          missing=[key for key in required if not os.getenv(key)]
          print("Configuration present:" if not missing else "Missing names:", "YES" if not missing else ",".join(missing))
          sys.exit(bool(missing))
          PY
      - name: Authenticate through existing Google Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: Install GCS client
        run: python -m pip install --disable-pip-version-check google-cloud-storage
      - name: Write minimal non-market diagnostic object and verify readback
        env:
          SKY_RESEARCH_GCS_BUCKET: ${{ vars.SKY_RESEARCH_GCS_BUCKET }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import hashlib,json,os,re
          from google.cloud import storage
          bucket_name=os.environ["SKY_RESEARCH_GCS_BUCKET"]
          if not re.fullmatch(r"sky-three-model-research-[a-zA-Z0-9_-]+",bucket_name):
              raise RuntimeError("research_bucket_name_not_allowlisted")
          run_id=os.environ["GITHUB_RUN_ID"]
          attempt=os.environ["GITHUB_RUN_ATTEMPT"]
          object_key=f"three-model-research/v1/__preflight__/run-{run_id}-attempt-{attempt}.json"
          payload={"schema":"sky-gcs-identity-smoke-v1","workflow_run_id":run_id,
                   "workflow_attempt":attempt,"research_only":True,
                   "production_signal":False,"order_authorized":False,
                   "market_data_included":False}
          raw=json.dumps(payload,sort_keys=True,separators=(",",":")).encode("utf-8")
          blob=storage.Client().bucket(bucket_name).blob(object_key)
          blob.upload_from_string(raw,content_type="application/json",if_generation_match=0)
          if hashlib.sha256(blob.download_as_bytes()).digest()!=hashlib.sha256(raw).digest():
              raise RuntimeError("gcs_readback_sha256_mismatch")
          print("GCP_OIDC_AUTH: PASS")
          print("GCS_CREATE_ONLY_WRITE_AND_SHA256_READBACK: PASS")
          print("Diagnostic object key:",object_key)
          print("No Fugle call, no orders, no Cloud Run deployment")
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as summary:
              summary.write("### 三模型研究雲端身分與 GCS 實測\n")
              summary.write("- GitHub OIDC to GCP: PASS\n")
              summary.write("- Private research GCS create-only write + SHA256 readback: PASS\n")
              summary.write("- Market data, actual strategy PnL, production deployment: NOT TESTED\n")
          PY
