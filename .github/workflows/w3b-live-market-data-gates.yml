name: W3B End-to-End Live Market Evidence Gate

on:
  pull_request:
    paths:
      - "src/main.py"
      - "src/official.py"
      - "src/realtime_quote_evidence.py"
      - "src/swing_live_scanner.py"
      - "tests/test_full_market_executed_quote_gate.py"
      - "tests/test_swing_full_market_gate.py"
      - ".github/workflows/scan.yml"
      - ".github/workflows/swing-live-scan.yml"
      - ".github/workflows/w3b-live-market-data-gates.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  realtime-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install -r requirements.txt pytest
      - name: Run data and scanner safety regressions
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_full_market_executed_quote_gate.py \
            tests/test_swing_full_market_gate.py \
            tests/test_realtime_market_contract.py \
            tests/test_official_mis_coverage.py \
            tests/test_swing_live_scanner.py \
            tests/test_swing_live_coverage_notice.py \
            tests/test_sky_command_router.py \
            tests/test_sky_unified_commands.py \
            tests/test_swing_v11_live_scanner.py \
            tests/test_swing_v11_freshness.py
