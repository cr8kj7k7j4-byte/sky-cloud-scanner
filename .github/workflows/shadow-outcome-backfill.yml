name: Shadow Outcome Backfill

on:
  workflow_dispatch:
  schedule:
    - cron: "30 14 * * 1-5"
      timezone: "Asia/Taipei"

permissions:
  contents: read
  actions: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Compile
        run: python -m compileall -q src tests research
      - name: Outcome unit tests
        run: PYTHONPATH=. pytest -q tests/test_shadow_outcome_backfill.py
      - name: Download canonical post-ledger scan artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p shadow_history
          gh run list \
            --workflow scan.yml \
            --status success \
            --limit 500 \
            --json databaseId,createdAt \
            --jq '.[] |
              select(.createdAt >= "2026-10-24T23:28:08Z") |
              .databaseId' > /tmp/scan_run_ids.txt

          while read -r run_id; do
            [ -z "$run_id" ] && continue
            dest="shadow_history/$run_id"
            mkdir -p "$dest"
            gh run download "$run_id" \
              -n "sky-scan-$run_id" \
              -D "$dest" || true
          done < /tmp/scan_run_ids.txt

          find shadow_history -type f -path '*/output/paper/*.json' | sort || true
      - name: Backfill same-day Shadow outcomes
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
          EXEC_COST_PROFILE: ${{ vars.EXEC_COST_PROFILE || 'USER_CASH_DAYTRADE_20261022' }}
          EXEC_ENTRY_SLIPPAGE_BPS: ${{ vars.EXEC_ENTRY_SLIPPAGE_BPS }}
          EXEC_EXIT_SLIPPAGE_BPS: ${{ vars.EXEC_EXIT_SLIPPAGE_BPS }}
          EXEC_SPREAD_BPS: ${{ vars.EXEC_SPREAD_BPS }}
          EXEC_LIQUIDITY_PENALTY_BPS: ${{ vars.EXEC_LIQUIDITY_PENALTY_BPS }}
          EXEC_FINANCING_INTEREST_PER_SHARE: ${{ vars.EXEC_FINANCING_INTEREST_PER_SHARE }}
        run: |
          PYTHONPATH=. python research/shadow_outcome_backfill.py \
            --paper-root shadow_history \
            --out-dir output/paper
      - name: Upload enriched Shadow outcomes
        uses: actions/upload-artifact@v4
        with:
          name: shadow-outcomes-${{ github.run_id }}
          path: output/paper/*-outcomes.json
          if-no-files-found: error
          retention-days: 90
      - name: Production E2E
        run: PYTHONPATH=. pytest -q tests/test_production_e2e_acceptance.py
