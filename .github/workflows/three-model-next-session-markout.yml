name: Three Model Next Session Markout (Research Only)
# 10:30 UTC = 18:30 Asia/Taipei, weekdays, after the 17:30 ledger job.
# Only observational price changes; no fills, PnL, trades or promotion.
on:
  schedule:
    - cron: '30 10 * * 1-5'
  workflow_dispatch:
    inputs:
      end_date:
        description: 'Latest completed Taipei session date (YYYY-MM-DD)'
        required: true
        default: '2026-11-06'
  pull_request:
    paths:
      - '.github/workflows/three-model-next-session-markout.yml'
      - 'research/three_model_next_session_markout.py'
      - 'research/three_model_fugle_pipeline.py'
      - 'tests/test_three_model_next_session_markout.py'
      - 'tests/test_three_model_fugle_pipeline.py'
permissions:
  contents: read
  id-token: write
concurrency:
  group: three-model-next-session-markout
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify next-session causality, immutable output and no fake fills
        run: |
          python -m pip install pytest
          PYTHONPATH=. python -m pytest -q tests/test_three_model_next_session_markout.py tests/test_three_model_fugle_pipeline.py
      - name: Check cloud prerequisites by name only
        if: github.event_name != 'pull_request'
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
          GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          SKY_RESEARCH_GCS_BUCKET: ${{ vars.SKY_RESEARCH_GCS_BUCKET }}
        run: |
          python - <<'PY'
          import os
          names=("FUGLE_API_KEY","GCP_WIF_PROVIDER","GCP_SERVICE_ACCOUNT","SKY_RESEARCH_GCS_BUCKET")
          missing=[name for name in names if not os.getenv(name)]
          if missing:
              raise RuntimeError("MISSING_CONFIGURATION:"+",".join(missing))
          print("PRIVATE_RESEARCH_CONFIGURATION_PRESENT")
          PY
      - name: Authenticate workload identity
        if: github.event_name != 'pull_request'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: Install GCS SDK
        if: github.event_name != 'pull_request'
        run: python -m pip install google-cloud-storage
      - name: Immutable private next-session follow-up
        if: github.event_name != 'pull_request'
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
          SKY_RESEARCH_GCS_BUCKET: ${{ vars.SKY_RESEARCH_GCS_BUCKET }}
          REQUESTED_END_DATE: ${{ inputs.end_date || '' }}
        run: |
          if [ -z "$REQUESTED_END_DATE" ]; then
            REQUESTED_END_DATE="$(TZ=Asia/Taipei date +%F)"
          fi
          PYTHONPATH=. python -m research.three_model_next_session_markout --end "$REQUESTED_END_DATE"
      - name: Publish sanitized followup audit
        if: always() && github.event_name != 'pull_request'
        run: |
          if [ -f output/three_model_next_session_audit.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          r=json.loads(Path("output/three_model_next_session_audit.json").read_text())
          print("## Three-model observational next-session markout")
          print("Observations scanned:",r["observations_scanned"])
          print("Created:",r["new_outcomes"])
          print("Already identical:",r["already_exists_identical"])
          print("Pending:",r["pending_count"])
          print("Trading signals / actual fills / P&L: NONE")
          PY
          fi
      - name: Retain sanitized audit artifact
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: three-model-next-session-audit-${{ github.run_id }}
          path: output/three_model_next_session_audit.json
          retention-days: 30
          if-no-files-found: warn
