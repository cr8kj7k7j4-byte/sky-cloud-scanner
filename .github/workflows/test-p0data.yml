name: P0-DATA Contract Validation

on:
  push:
    branches: [main]
    paths:
      - "src/data_contract.py"
      - "tests/test_data_contract.py"
      - ".github/workflows/test-p0data.yml"
  pull_request:
    paths:
      - "src/data_contract.py"
      - "tests/test_data_contract.py"
      - ".github/workflows/test-p0data.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest
        run: pip install pytest
      - name: Run P0-DATA contract tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_data_contract.py
