name: P0-S 5m OOS Validation

on:
  push:
    branches: [ main ]
    paths:
      - "src/strategy_builder.py"
      - "research/backtest_p0s_breakout_oos.py"
      - ".github/workflows/p0s-oos-validation.yml"
  workflow_dispatch:
    inputs:
      from_date:
        description: "Historical start date"
        required: true
        default: "2023-05-23"
      to_date:
        description: "Historical end date"
        required: true
        default: "2026-10-24"
      cutoff:
        description: "First OOS date"
        required: true
        default: "2026-01-01"
      twse_n:
        description: "TWSE deterministic sample size"
        required: true
        default: "50"
      tpex_n:
        description: "TPEx deterministic sample size"
        required: true
        default: "50"
      cost_pct:
        description: "Round-trip cost stress assumption (%)"
        required: true
        default: "0.45"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest
      - name: Unit tests
        run: pytest -q tests/test_strategy_builder.py tests/test_p0s_oos.py tests/test_p0s_oos_diagnostics.py tests/test_download_expanded.py
      - name: Build deterministic universe sample
        run: |
          python research/build_universe_sample.py \
            --twse-n "${{ inputs.twse_n || '50' }}" \
            --tpex-n "${{ inputs.tpex_n || '50' }}" \
            --out research_data/universe_manifest.json
      - name: Download historical 5m data
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
        run: |
          python research/download_expanded.py \
            --manifest research_data/universe_manifest.json \
            --from-date "${{ inputs.from_date || '2023-05-23' }}" \
            --to-date "${{ inputs.to_date || '2026-10-24' }}" \
            --out research_data/history
      - name: Validate historical export
        run: |
          python research/validate_history_export.py \
            --history-dir research_data/history \
            --manifest research_data/universe_manifest.json \
            --download-summary research_data/download_summary.json \
            --out research_data/export_validation.json
      - name: Run P0-S OOS validation
        run: |
          python research/backtest_p0s_breakout_oos.py \
            --data-dir research_data/history \
            --cutoff "${{ inputs.cutoff || '2026-01-01' }}" \
            --cost-pct "${{ inputs.cost_pct || '0.45' }}" \
            --out research_output_p0s_oos
      - name: Publish summary
        if: always()
        run: |
          if [ -f research_output_p0s_oos/p0s_oos_summary.md ]; then
            cat research_output_p0s_oos/p0s_oos_summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0s-oos-${{ github.run_id }}
          path: |
            research_output_p0s_oos/
            research_data/universe_manifest.json
            research_data/download_summary.json
            research_data/export_validation.json
          if-no-files-found: warn
          retention-days: 14

