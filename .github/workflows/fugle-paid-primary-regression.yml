name: Fugle Paid Primary Live Data Regression
on:
  pull_request:
    paths:
      - 'src/main.py'
      - 'src/official.py'
      - 'src/fugle_snapshot_evidence.py'
      - 'src/swing_live_scanner.py'
      - 'src/swing_v11_live_scanner.py'
      - 'tests/test_fugle_primary_route.py'
      - 'tests/test_fugle_snapshot_evidence.py'
      - '.github/workflows/fugle-paid-primary-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - name: Validate Fugle primary routing and screening-only safety
        run: |
          python -m pytest -q \
            tests/test_fugle_primary_route.py \
            tests/test_fugle_snapshot_evidence.py \
            tests/test_realtime_market_contract.py \
            tests/test_swing_full_market_gate.py \
            tests/test_swing_live_coverage_notice.py
