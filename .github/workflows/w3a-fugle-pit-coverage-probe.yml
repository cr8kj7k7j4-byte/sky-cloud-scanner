name: W3A Fugle PIT Coverage Probe

on:
  push:
    branches: [main]
    paths:
      - "research/probe_fugle_pit_intraday_coverage.py"
      - ".github/workflows/w3a-fugle-pit-coverage-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sky-fugle-paid-global-research-v1-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}-${{ inputs.symbol || inputs.symbols || 'all' }}-${{ inputs.from_date || inputs.start_date || 'start' }}-${{ inputs.end_date || inputs.to_date || 'end' }}
  cancel-in-progress: false
jobs:
  sky_paid_reservation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reserve paid API request safely
        id: reservation
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m research.sky_paid_fugle_api_guard --workflow-scope
      - name: Upload sanitized reservation before paid access
        if: steps.reservation.outputs.allowed == 'true'
        id: claim
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.reservation.outputs.claim_name }}
          path: output/fugle_api_guard/claim.json
          if-no-files-found: error
          retention-days: 2
      - name: Independent reservation readback, fail closed
        if: steps.reservation.outputs.allowed == 'true' && steps.claim.outcome == 'success'
        id: verify_claim
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m research.sky_paid_fugle_api_guard --workflow-scope --verify
      - name: Fail job when claim is rejected or not verified
        run: |
          test "${{ steps.reservation.outputs.allowed }}" = "true"
          test "${{ steps.claim.outcome }}" = "success"
          test "${{ steps.verify_claim.outcome }}" = "success"
  probe:
    needs: sky_paid_reservation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Build current official PIT universe snapshot
        env:
          PYTHONPATH: .
        run: |
          python research/build_official_pit_universe.py \
            --out research_output_pit/official_universe_snapshot.json
      - name: Probe Fugle historical 5m coverage
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
        run: |
          python research/probe_fugle_pit_intraday_coverage.py \
            --pit-snapshot research_output_pit/official_universe_snapshot.json \
            --as-of 2026-09-30 \
            --audit-dates "2023-12-31,2024-12-31,2025-12-31,2026-09-30" \
            --from-date 2026-09-01 \
            --to-date 2026-09-30 \
            --per-exchange 30 \
            --historical-closed-n 40 \
            --out research_output_pit/fugle_pit_coverage_probe.json
      - name: Publish summary
        if: always()
        run: |
          if [ -f research_output_pit/fugle_pit_coverage_probe.json ]; then
            python - <<'PY'
          import json
          p=json.load(open("research_output_pit/fugle_pit_coverage_probe.json",encoding="utf-8"))
          print("## W3A Fugle PIT Coverage Probe")
          print(f"- Contract: {p['probe_contract']}")
          print(f"- Sample: {p['sample_n']}")
          print(f"- Overall OK share: {p['overall_ok_share']:.1%}")
          hc = p.get('historical_closed_ok_share')
          print(f"- Historical-closed OK share: {hc:.1%}" if hc is not None else "- Historical-closed OK share: n/a")
          for d, row in p.get('by_audit_date', {}).items():
              print(f"- {d}: {row['ok_n']}/{row['sample_n']} = {row['ok_share']:.1%}")
              for exch, ex in row.get('by_exchange', {}).items():
                  if ex.get('sample_n'):
                      print(f"  - {exch}: {ex['ok_n']}/{ex['sample_n']} = {ex['ok_share']:.1%}")
          print(f"- Status counts: {p['status_counts']}")
          print("- Stratified feasibility/stress probe only; not yet formal whole-universe coverage evidence.")
          PY
          fi
      - name: Upload probe artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w3a-fugle-pit-coverage-probe
          path: research_output_pit/
          if-no-files-found: warn
          retention-days: 14
