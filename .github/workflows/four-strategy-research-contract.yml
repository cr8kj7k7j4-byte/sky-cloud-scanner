name: Four Strategy Research Contract Tests

on:
  pull_request:
    paths:
      - "research/four_strategy/**"
      - ".github/workflows/four-strategy-research-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run research-only gate tests (fixtures only)
        run: python -m unittest discover -s research/four_strategy -p 'test_*.py' -v
