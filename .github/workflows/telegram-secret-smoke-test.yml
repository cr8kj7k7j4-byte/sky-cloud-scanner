name: Telegram Secret Smoke Test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/telegram-secret-smoke-test.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send Telegram smoke test
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${TELEGRAM_BOT_TOKEN:-}"
          test -n "${TELEGRAM_CHAT_ID:-}"
          python - <<'PY'
          import json, os, urllib.request
          token=os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id=os.environ["TELEGRAM_CHAT_ID"]
          payload=json.dumps({
              "chat_id": chat_id,
              "text": "Sky Telegram 測試成功：GitHub Actions 已可正常發送重大通知。",
              "disable_web_page_preview": True,
          }, ensure_ascii=False).encode("utf-8")
          req=urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=payload,
              headers={"Content-Type":"application/json"},
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=20) as r:
              body=json.loads(r.read().decode("utf-8"))
          assert body.get("ok") is True, body
          print("telegram_smoke_test=PASS")
          PY
