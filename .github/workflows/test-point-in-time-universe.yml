name: Point-in-Time Universe Validation

on:
  push:
    branches: [main]
    paths:
      - "src/point_in_time_universe.py"
      - "tests/test_point_in_time_universe.py"
      - "POINT_IN_TIME_UNIVERSE.md"
      - ".github/workflows/test-point-in-time-universe.yml"
  pull_request:
    paths:
      - "src/point_in_time_universe.py"
      - "tests/test_point_in_time_universe.py"
      - "POINT_IN_TIME_UNIVERSE.md"
      - ".github/workflows/test-point-in-time-universe.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest
        run: pip install pytest
      - name: Validate point-in-time universe engine
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_point_in_time_universe.py
