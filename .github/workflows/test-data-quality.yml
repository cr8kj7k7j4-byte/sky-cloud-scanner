name: P0-DATA Quality Validation

on:
  push:
    branches: [main]
    paths:
      - "src/data_quality.py"
      - "tests/test_data_quality.py"
      - ".github/workflows/test-data-quality.yml"
  pull_request:
    paths:
      - "src/data_quality.py"
      - "tests/test_data_quality.py"
      - ".github/workflows/test-data-quality.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pytest pandas
      - name: Validate dataset DQ contract
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_data_quality.py
