name: Sky Cloud Scanner v0.5 + P0-R

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'intraday: live-window scan; postmarket_observation: research-only full market snapshot'
        required: true
        default: intraday
        type: choice
        options:
          - intraday
          - postmarket_observation
  push:
    branches: [main]
    paths:
      - 'scan_requests/mcr/now.json'
      - 'scan_requests/quickscan/latest.json'
      - 'scan_requests/postmarket/now.json'
  # W0 #363 (2026-11-26): formal automatic intraday scan cron retired by user request.
  # Manual workflow_dispatch and existing push requests remain available.
  # Official calendar, paid API Claim and fail-closed NO_TRADE gates remain intact.

permissions:
  contents: write
  actions: read

concurrency:
  group: sky-fugle-paid-global-research-v1-live-wholemarket
  cancel-in-progress: false
jobs:
  scan:
    if: >-
      (github.event_name != 'workflow_dispatch' || inputs.mode != 'postmarket_observation') &&
      (github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'W0 #363: request postmarket full-universe observation'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Record the exact scheduled cron and runner start evidence
        shell: bash
        run: |
          mkdir -p output
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          event_path = Path(os.environ["GITHUB_EVENT_PATH"])
          payload = json.loads(event_path.read_text(encoding="utf-8"))
          now = datetime.now(timezone.utc)
          record = {
              "schema": "SKY_INTRADAY_SCHEDULE_EVIDENCE_V1",
              "event_name": os.environ["GITHUB_EVENT_NAME"],
              "event_schedule_cron_utc": payload.get("schedule"),
              "job_started_at_utc": now.isoformat(),
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "source": "GitHub event payload and runner clock",
              "cron_utc": [
                  "5,15,30,50 1 * * 1-5",
                  "15 2 * * 1-5"
              ],
              "note": "Run/job start may be delayed; cron proves schedule rule identity, not punctuality. A cron entry contains multiple local slots; compare run times with expected Asia/Taipei schedule and check missed slots separately."
          }
          path = Path("output/schedule_trigger.json")
          path.write_text(json.dumps(record, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(record, ensure_ascii=False))
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Restore P0-A monitor state cache
        uses: actions/cache/restore@v4
        with:
          path: output/monitor_state.json
          key: sky-monitor-state-${{ github.run_id }}
          restore-keys: |
            sky-monitor-state-
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify delayed schedule guard offline (zero paid API)
        run: python -m unittest tests.test_schedule_health -v
      - name: Check TWSE trading calendar
        id: calendar
        shell: bash
        run: |
          set -euo pipefail
          python -m src.trading_calendar --out output/trading_calendar_status.json
          SHOULD_SCAN="$(python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("output/trading_calendar_status.json").read_text(encoding="utf-8"))
          import os
          from datetime import datetime, timezone
          from src.trading_calendar import scheduled_scan_window
          gate = scheduled_scan_window(os.environ.get("GITHUB_EVENT_NAME",""),
                                       datetime.now(timezone.utc))
          x["scheduled_time_gate"] = gate
          if gate["allowed"] is not True:
              x["should_scan"] = False
          Path("output/trading_calendar_status.json").write_text(
              json.dumps(x, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          if gate["allowed"] is not True:
              raise SystemExit("Scheduled scan outside canonical live window; paid API withheld.")
          if x.get("source_status") != "PASS":
              raise SystemExit("Official trading calendar unavailable; scan withheld.")
          print("true" if x.get("should_scan") is True else "false")
          PY
          )"
          echo "should_scan=$SHOULD_SCAN" >> "$GITHUB_OUTPUT"

      - name: Verify existing paid reservation contracts without Fugle
        if: steps.calendar.outputs.should_scan == 'true'
        run: python -m unittest tests.test_sky_paid_fugle_api_guard -v
      - name: Reserve shared paid Fugle slot before any paid observations
        id: guard
        if: steps.calendar.outputs.should_scan == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m research.sky_paid_fugle_api_guard --scope 'sky:live:wholemarket'
      - name: Publish shared reservation
        id: claim
        if: steps.calendar.outputs.should_scan == 'true' && steps.guard.outputs.allowed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.guard.outputs.claim_name }}
          path: output/fugle_api_guard/claim.json
          if-no-files-found: error
          retention-days: 2
      - name: Independently verify paid reservation
        id: verify_claim
        if: steps.calendar.outputs.should_scan == 'true' && steps.guard.outputs.allowed == 'true' && steps.claim.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m research.sky_paid_fugle_api_guard --scope 'sky:live:wholemarket' --verify
      - name: Run scanner
        if: steps.calendar.outputs.should_scan == 'true' && steps.guard.outputs.allowed == 'true' && steps.verify_claim.outcome == 'success'
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
          SKY_PAID_ATOMIC_ENFORCE: '1'
          GH_TOKEN: ${{ github.token }}
          MAX_PRICE: "100"
          TOP_N: "100"
          DEEP_DIVE_N: "12"
          MIN_VOLUME: "500"
          MIN_TRADE_VALUE: "10000000"
          STRICT_OFFICIAL_MODE: "1"
          ALLOW_MIS_OTC_FALLBACK: "0"
          SKY_FUGLE_ONLY_MARKETDATA: "1"
          # P0-R/P0-X: missing slippage, spread, liquidity or RR must fail closed.
          # Keep the default research engine unchanged; enforce on canonical live scan.
          EXEC_ENFORCE_GATE: "1"
          ACCOUNT_EQUITY: ${{ vars.ACCOUNT_EQUITY || '500000' }}
          RISK_PER_TRADE_PCT: ${{ vars.RISK_PER_TRADE_PCT || '0.01' }}
          DAILY_LOSS_LIMIT_PCT: ${{ vars.DAILY_LOSS_LIMIT_PCT || '0.02' }}
          MAX_PORTFOLIO_HEAT_PCT: ${{ vars.MAX_PORTFOLIO_HEAT_PCT || '0.03' }}
          MAX_POSITION_PCT: ${{ vars.MAX_POSITION_PCT || '0.20' }}
          CORRELATION_LIMIT_PCT: ${{ vars.CORRELATION_LIMIT_PCT || '0.02' }}
          MAX_CONCURRENT_POSITIONS: ${{ vars.MAX_CONCURRENT_POSITIONS || '3' }}
          CAUTION_LOSS_STREAK: ${{ vars.CAUTION_LOSS_STREAK || '3' }}
          DEFENSIVE_LOSS_STREAK: ${{ vars.DEFENSIVE_LOSS_STREAK || '5' }}
          LOCKDOWN_DRAWDOWN_PCT: ${{ vars.LOCKDOWN_DRAWDOWN_PCT || '0.06' }}
          LOT_SIZE: ${{ vars.LOT_SIZE || '1000' }}
          DAILY_PNL: ${{ vars.DAILY_PNL || '' }}
          OPEN_RISK: ${{ vars.OPEN_RISK || '' }}
          CONCURRENT_POSITIONS: ${{ vars.CONCURRENT_POSITIONS || '' }}
          CORRELATED_OPEN_RISK: ${{ vars.CORRELATED_OPEN_RISK || '' }}
          ACCOUNT_DRAWDOWN_PCT: ${{ vars.ACCOUNT_DRAWDOWN_PCT || '' }}
          CONSECUTIVE_LOSSES: ${{ vars.CONSECUTIVE_LOSSES || '' }}
          MONITOR_STATE_BACKEND: ${{ vars.MONITOR_STATE_BACKEND || 'file' }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          MONITOR_STATE_REDIS_KEY: ${{ vars.MONITOR_STATE_REDIS_KEY || 'sky:p0a:monitor_state' }}
        run: |
          # Keep the verified, process-local Fugle response cache shared across readers.
          python - <<'PY'
          import os
          from contextlib import redirect_stdout
          from pathlib import Path

          from research.sky_full_universe_information import main as publish_information
          from src.diagnose_sources import run as diagnose_sources
          from src.main import run as scan

          try:
              with Path("source-diagnostics.json").open("w", encoding="utf-8") as report:
                  with redirect_stdout(report):
                      diagnose_sources()
          except Exception as exc:
              print(f"::warning::Source diagnostics failed ({type(exc).__name__})")

          try:
              scan()
          finally:
              try:
                  publish_information()
                  with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
                      summary.write(Path("output/sky_quickscan_information/latest.md").read_text(encoding="utf-8"))
              except (Exception, SystemExit) as exc:
                  print(f"::warning::Informational scan failed ({type(exc).__name__})")
          PY
      - name: Publish all MCR research observations even when live scan is blocked
        if: always()
        run: |
          python -m unittest tests.test_mcr_observation_report -v
          python -m research.mcr_observation_report
      - name: Verify bounded paid Fugle individual last-trades (research-only)
        if: always() && steps.calendar.outputs.should_scan == 'true' && steps.guard.outputs.allowed == 'true' && steps.verify_claim.outcome == 'success'
        continue-on-error: true
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
          SKY_FUGLE_ONLY_MARKETDATA: "1"
          SKY_PAID_ATOMIC_ENFORCE: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m research.sky_fugle_individual_execution_probe --limit 8
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("output/sky_quickscan_information/fugle_execution_samples.json")
          x = json.loads(p.read_text(encoding="utf-8"))
          print("Fugle individual last-trade sample:", x["requested_count"],
                "fresh:", x["verified_fresh_executed_count"],
                "production_eligible:", x["production_eligible"])
          assert x["full_market_executed_certified"] is False
          assert x["production_eligible"] is False
          PY
      - name: Join MCR research observations to available all-market information
        if: always()
        continue-on-error: true
        run: |
          python -m unittest tests.test_mcr_intraday_information -v
          python -m research.mcr_intraday_information
          cat output/mcr_intraday_information_latest.md >> "$GITHUB_STEP_SUMMARY"
      - name: Build and verify full 13-column Fugle research artifact (even when trading gate blocks)
        if: always() && steps.calendar.outputs.should_scan == 'true' && steps.guard.outputs.allowed == 'true' && steps.verify_claim.outcome == 'success'
        run: |
          set -euo pipefail
          test -s output/sky_quickscan_information/full_universe.json
          python -m research.sky_13col_report \
            --input output/sky_quickscan_information/full_universe.json \
            --scanner-input output/latest.json \
            --output output/sky_quickscan_information/latest_13col.md \
            --json-output output/sky_quickscan_information/latest_13col.json
          python -m research.verify_13col_artifact \
            --source output/sky_quickscan_information/full_universe.json \
            --json output/sky_quickscan_information/latest_13col.json \
            --markdown output/sky_quickscan_information/latest_13col.md
          echo '13欄完整研究報告已放入本次掃描 Artifact；資料／正式交易驗證分開判定。' >> "$GITHUB_STEP_SUMMARY"
      - name: Include sanitized MCR scan receipt in the same-run artifact
        if: always() && github.ref == 'refs/heads/main'
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          def get(path):
              try: return json.loads(Path(path).read_text(encoding='utf-8'))
              except (OSError, ValueError): return {}
          mcr=get('output/mcr_intraday_information_latest.json')
          observed=get('output/sky_quickscan_information/full_universe.json')
          status={
            'schema':'SKY_MCR_INTRADAY_HEALTH_V1',
            'published_at_utc':datetime.now(timezone.utc).isoformat(),
            'run_id':os.getenv('GITHUB_RUN_ID'),
            'run_url':'https://github.com/'+os.getenv('GITHUB_REPOSITORY','')+'/actions/runs/'+os.getenv('GITHUB_RUN_ID',''),
            'financing_source_date':mcr.get('margin_source_date'),
            'quote_observed_at':mcr.get('quote_observed_at'),
            'mcr_observation_count':mcr.get('candidate_count'),
            'mcr_with_observed_price':mcr.get('with_observed_price'),
            'mcr_fresh_executed_count':mcr.get('fresh_executed_count'),
            'mcr_independent_accepted_executed_count':mcr.get('independent_accepted_executed_count'),
            'all_market_universe_count':observed.get('universe_count'),
            'all_market_observed_price_count':observed.get('observed_price_count'),
            'all_market_fresh_executed_count':observed.get('fresh_executed_count'),
            'by_exchange':observed.get('by_exchange'),
            'mcr_quote_status_counts':mcr.get('quote_status_counts'),
            'data_blockers':mcr.get('data_blockers'),
            'action':'禁止交易',
            'trade_eligible':False,
            'notice':'Research only. No new trading approval; never substitute financing balance for margin maintenance.'
          }
          receipt=Path('output/mcr_intraday_health.json')
          receipt.parent.mkdir(parents=True, exist_ok=True)
          receipt.write_text(json.dumps(status,ensure_ascii=False,indent=2)+chr(10))
          print('MCR_RECEIPT',status['mcr_observation_count'],status['mcr_with_observed_price'],status['mcr_fresh_executed_count'])
          PY
      - name: Record separate Plan A A1 snapshot and A2 candidate acceptance (zero paid API)
        if: always()
        run: |
          python -m research.sky_intraday_plan_a_two_track_acceptance
          cat output/sky_quickscan_information/intraday_plan_a_two_track_acceptance.json >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve same-run raw-source availability manifest (zero paid API)
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          # This inventory is provenance diagnostics only, not a source
          # certification, a live-trading gate, or evidence of an API call.
          root = Path("output/sky_quickscan_information")
          root.mkdir(parents=True, exist_ok=True)
          sources = {
              "operational_snapshot_gate": Path("output/latest.json"),
              "full_market_reference": root / "full_universe.json",
              "individual_executed_trade_samples": root / "fugle_execution_samples.json",
              "five_minute_candle_probe": root / "v14_ticker_5m_evidence.json",
              "independent_tick_trades_vwap_receipt": root / "independent_trades_vwap_evidence.json",
          }
          results = {}
          for category, path in sources.items():
              item = {"path":path.as_posix(), "status":"HOLD_SOURCE_NOT_CAPTURED",
                      "raw_provider_source_certified":False}
              if path.is_file():
                  data = path.read_bytes()
                  item.update({"byte_count":len(data),
                               "sha256":hashlib.sha256(data).hexdigest()})
                  try:
                      parsed = json.loads(data)
                      if not isinstance(parsed, (dict, list)):
                          raise ValueError("JSON_ROOT_NOT_OBJECT_OR_ARRAY")
                      item["status"]="FILE_PRESENT_NOT_SOURCE_CERTIFIED"
                      if isinstance(parsed,dict):
                          for key in ("data_time","observed_at","quote_observed_at",
                                      "captured_at","candles_received_at_tpe"):
                              if isinstance(parsed.get(key),str):
                                  item[key]=parsed[key]
                  except (ValueError,UnicodeDecodeError):
                      item["status"]="HOLD_INVALID_JSON"
              results[category]=item
          receipt={
              "schema":"SKY_W0_SAME_RUN_SOURCE_INVENTORY_V1",
              "run_id":os.environ.get("GITHUB_RUN_ID"),
              "run_attempt":os.environ.get("GITHUB_RUN_ATTEMPT"),
              "head_sha":os.environ.get("GITHUB_SHA"),
              "event_name":os.environ.get("GITHUB_EVENT_NAME"),
              "generated_at_utc":datetime.now(timezone.utc).isoformat(),
              "source_inventory":results,
              "live_five_minute_requests":"DISABLED_V5_4",
              "independent_tick_vwap_requests":"DISABLED_V5_4",
              "five_minute_pit_certified":False,
              "volume_units_certified":False,
              "independent_tick_vwap_certified":False,
              "production_eligible":False,
              "trade_action":"禁止交易",
              "note":"Presence and hashes do not prove source semantics, freshness, 5m PIT, units or VWAP. Missing evidence remains HOLD."
          }
          target=root / "same_run_source_inventory.json"
          target.write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print("W0_SOURCE_INVENTORY_WRITTEN:",target)
          for name,item in results.items():
              print(name,item["status"])
          PY
      - name: Verify operational market coverage
        if: steps.calendar.outputs.should_scan == 'true' && steps.guard.outputs.allowed == 'true' && steps.verify_claim.outcome == 'success'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("output/latest.json")
          if not path.is_file():
              raise SystemExit("Scan result missing; cannot verify market coverage.")
          data = json.loads(path.read_text(encoding="utf-8"))
          print("Operational full market:", data.get("operational_full_market_scan"))
          print("Quote coverage percent:", data.get("quote_coverage_pct"))
          gate = data.get("live_market_evidence") or {}
          print("Verified live market evidence:", {k:v for k,v in gate.items() if k != "accepted_rows"})
          print("Market decision gate:", data.get("market_data_gate"))
          if (data.get("operational_full_market_scan") is not True
              or gate.get("valid_whole_market_operational") is not True
              or data.get("quote_scope") != "WHOLE_MARKET_EXECUTED_LIVE"
              or data.get("market_data_gate") != "PASS_FULL_MARKET_LIVE"):
              raise SystemExit("BLOCKED_EXTERNAL_DATA: full-market actual executed quotes not verified; no trades.")
          PY
      - name: Report paid reservation denial
        if: always() && steps.calendar.outputs.should_scan == 'true' && steps.guard.outcome == 'success' && steps.guard.outputs.allowed == 'false'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          receipt = Path("output/fugle_api_guard/claim.json")
          claim = json.loads(receipt.read_text(encoding="utf-8"))
          raise SystemExit(
              f"NO_TRADE: Fugle reservation blocked ({claim['status']}: {claim['reason']})."
          )
          PY
      - name: Save P0-A monitor state cache
        if: steps.calendar.outputs.should_scan == 'true' && success()
        uses: actions/cache/save@v4
        with:
          path: output/monitor_state.json
          key: sky-monitor-state-${{ github.run_id }}
      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-scan-${{ github.run_id }}
          path: |
            output/
            source-diagnostics.json
            output/trading_calendar_status.json
          if-no-files-found: warn
          retention-days: 90
      # P0 daytrade-only: user paused intraday Telegram alerts by default.
      # Set SKY_DAYTRADE_TELEGRAM_ALERTS=true to explicitly opt in again.
      - name: Notify Telegram when intraday scan fails
        if: failure() && vars.SKY_DAYTRADE_TELEGRAM_ALERTS == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: PYTHONPATH=. python research/intraday_scan_failure_alert.py

  postmarket:
    name: Fugle postmarket full-universe observation (NO_TRADE)
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'postmarket_observation') ||
      (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'W0 #363: request postmarket full-universe observation'))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate explicit postmarket push request before paid claim
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x = json.loads(Path('scan_requests/postmarket/now.json').read_text(encoding='utf-8'))
          assert isinstance(x, dict) and x.get('schema') == 'SKY_POSTMARKET_REQUEST_V1'
          assert x.get('mode') == 'postmarket_observation' and x.get('trade_action') == '禁止交易'
          assert isinstance(x.get('requested_at_tpe'), str) and x['requested_at_tpe']
          print('POSTMARKET_RESEARCH_REQUEST_VALIDATED')
          PY
      - name: Verify postmarket and paid-claim safety contracts offline
        run: |
          python -m unittest tests.test_sky_postmarket_observation tests.test_sky_paid_fugle_api_guard -v
      - name: Reserve existing cross-workflow Fugle claim
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m research.sky_paid_fugle_api_guard --scope 'sky:live:wholemarket'
      - name: Publish existing paid reservation
        id: claim
        if: steps.guard.outputs.allowed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.guard.outputs.claim_name }}
          path: output/fugle_api_guard/claim.json
          if-no-files-found: error
          retention-days: 2
      - name: Verify uploaded paid reservation
        id: verify_claim
        if: steps.guard.outputs.allowed == 'true' && steps.claim.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m research.sky_paid_fugle_api_guard --scope 'sky:live:wholemarket' --verify
      - name: Observe all listed TWSE and TPEx shares (postmarket, no live trade signals)
        if: steps.guard.outputs.allowed == 'true' && steps.verify_claim.outcome == 'success'
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          SKY_PAID_ATOMIC_ENFORCE: '1'
          SKY_FUGLE_ONLY_MARKETDATA: '1'
        run: |
          python -m research.sky_postmarket_observation
          cat output/sky_quickscan_information/latest.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve research-only source receipts even if the observation is incomplete
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-postmarket-observation-${{ github.run_id }}
          path: |
            output/sky_quickscan_information/full_universe.json
            output/sky_quickscan_information/latest.md
            output/sky_quickscan_information/postmarket_receipt.json
          if-no-files-found: warn
          retention-days: 14
      - name: Fail closed if no verified claim was acquired
        if: always() && (steps.guard.outputs.allowed != 'true' || steps.verify_claim.outcome != 'success')
        run: |
          echo 'HOLD_POSTMARKET_CLAIM_NOT_VERIFIED'
          exit 1
