name: Sky Cloud Scanner v0.5 + P0-R

on:
  push:
    branches: [debug/mis-http-status-20261103]
    paths: ['.github/workflows/scan.yml']
  workflow_dispatch:
  schedule:
    - cron: "5,15,30,50 9 * * 1-5"
      timezone: "Asia/Taipei"
    - cron: "15 10 * * 1-5"
      timezone: "Asia/Taipei"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore P0-A monitor state cache
        uses: actions/cache/restore@v4
        with:
          path: output/monitor_state.json
          key: sky-monitor-state-${{ github.run_id }}
          restore-keys: |
            sky-monitor-state-
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check diagnostic syntax
        run: python -m py_compile src/official.py
      - name: Check TWSE trading calendar
        id: calendar
        shell: bash
        run: |
          set -euo pipefail
          python -m src.trading_calendar --out output/trading_calendar_status.json
          SHOULD_SCAN="$(python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("output/trading_calendar_status.json").read_text(encoding="utf-8"))
          if x.get("source_status") != "PASS":
              raise SystemExit("Official trading calendar unavailable; scan withheld.")
          print("true" if x.get("should_scan") is True else "false")
          PY
          )"
          echo "should_scan=$SHOULD_SCAN" >> "$GITHUB_OUTPUT"

      - name: Diagnose data sources
        if: steps.calendar.outputs.should_scan == 'true'
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
        run: python -m src.diagnose_sources | tee source-diagnostics.json
        continue-on-error: true
      - name: Run scanner
        if: steps.calendar.outputs.should_scan == 'true'
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
          MAX_PRICE: "100"
          TOP_N: "100"
          DEEP_DIVE_N: "12"
          MIN_VOLUME: "500"
          MIN_TRADE_VALUE: "10000000"
          STRICT_OFFICIAL_MODE: "1"
          ALLOW_MIS_OTC_FALLBACK: "1"
          ACCOUNT_EQUITY: ${{ vars.ACCOUNT_EQUITY || '500000' }}
          RISK_PER_TRADE_PCT: ${{ vars.RISK_PER_TRADE_PCT || '0.01' }}
          DAILY_LOSS_LIMIT_PCT: ${{ vars.DAILY_LOSS_LIMIT_PCT || '0.02' }}
          MAX_PORTFOLIO_HEAT_PCT: ${{ vars.MAX_PORTFOLIO_HEAT_PCT || '0.03' }}
          MAX_POSITION_PCT: ${{ vars.MAX_POSITION_PCT || '0.20' }}
          CORRELATION_LIMIT_PCT: ${{ vars.CORRELATION_LIMIT_PCT || '0.02' }}
          MAX_CONCURRENT_POSITIONS: ${{ vars.MAX_CONCURRENT_POSITIONS || '3' }}
          CAUTION_LOSS_STREAK: ${{ vars.CAUTION_LOSS_STREAK || '3' }}
          DEFENSIVE_LOSS_STREAK: ${{ vars.DEFENSIVE_LOSS_STREAK || '5' }}
          LOCKDOWN_DRAWDOWN_PCT: ${{ vars.LOCKDOWN_DRAWDOWN_PCT || '0.06' }}
          LOT_SIZE: ${{ vars.LOT_SIZE || '1000' }}
          DAILY_PNL: ${{ vars.DAILY_PNL || '0' }}
          OPEN_RISK: ${{ vars.OPEN_RISK || '0' }}
          CONCURRENT_POSITIONS: ${{ vars.CONCURRENT_POSITIONS || '0' }}
          CORRELATED_OPEN_RISK: ${{ vars.CORRELATED_OPEN_RISK || '0' }}
          ACCOUNT_DRAWDOWN_PCT: ${{ vars.ACCOUNT_DRAWDOWN_PCT || '0' }}
          CONSECUTIVE_LOSSES: ${{ vars.CONSECUTIVE_LOSSES || '0' }}
          PAPER_TRADING_MODE: "shadow"
          MONITOR_STATE_BACKEND: ${{ vars.MONITOR_STATE_BACKEND || 'file' }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          MONITOR_STATE_REDIS_KEY: ${{ vars.MONITOR_STATE_REDIS_KEY || 'sky:p0a:monitor_state' }}
        run: |
          python - <<'PY'
          from src.official import load_official_universe, MIS_URL
          from src.http_utils import session
          u, st = load_official_universe()
          s = session()
          s.headers.update({"Referer":"https://mis.twse.com.tw/stock/index.jsp"})
          seed = s.get("https://mis.twse.com.tw/stock/index.jsp", timeout=15)
          print("seed_status", seed.status_code, flush=True)
          tw = [x for x in u if x["market"] == "TSE"]
          p = next(x for x in tw if x["symbol"] == "2330")
          for label,batch in [("single", [p]), ("batch10", tw[:10]), ("batch55", tw[:55])]:
              channels = "|".join(f'{x["mis_prefix"]}_{x["symbol"]}.tw' for x in batch)
              resp = s.get(MIS_URL, params={"ex_ch":channels,"json":"1","delay":"0"}, timeout=20)
              print(label, "status", resp.status_code, flush=True)
              if resp.ok:
                  data=resp.json()
                  rows=data.get("msgArray", [])
                  print(label, "requested", len(batch), "returned", len(rows), "valid_z", sum(q.get("z") not in (None,"","-","--","---") for q in rows), "first_items", [{k:q.get(k) for k in ("c","z","pz","y","d","t","tlong","v","tv")} for q in rows[:4]], "rtcode", data.get("rtcode"), flush=True)
          from src.fugle import get_quote, get_tickers, _get
          for market in ("TSE","OTC"):
              payload=get_tickers(market)
              print("ticker_probe",market,"keys",list(payload.keys()),"data_count",len(payload.get("data",[])), "examples",payload.get("data",[])[:2], flush=True)
          for path in ("/snapshot/movers/TSE", "/snapshot/movers/OTC", "/snapshot/actives/TSE", "/intraday/candles/2330", "/intraday/quote/5425"):
              try:
                  p = _get(path)
                  print("capability", path, "ok", True, "date", p.get("date"), "data_count",len(p.get("data",[])), "keys",list(p.keys()), flush=True)
              except Exception as exc:
                  print("capability", path, "ok", False, "error_type",type(exc).__name__, flush=True)
          quote = get_quote("2330")
          print("fugle_2330", {k:quote.get(k) for k in ("symbol","date","lastPrice","closePrice","closeTime","lastUpdated","total")}, flush=True)
          PY
      - name: Save P0-A monitor state cache
        if: steps.calendar.outputs.should_scan == 'true' && always()
        uses: actions/cache/save@v4
        with:
          path: output/monitor_state.json
          key: sky-monitor-state-${{ github.run_id }}
      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-scan-${{ github.run_id }}
          path: |
            output/
            source-diagnostics.json
            output/trading_calendar_status.json
          if-no-files-found: warn
          retention-days: 90
      - name: Notify Telegram when intraday scan fails
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: PYTHONPATH=. python research/intraday_scan_failure_alert.py
