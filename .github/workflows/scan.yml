name: Sky Cloud Scanner v0.5 + P0-R

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scan_requests/mcr/now.json'
      - 'scan_requests/quickscan/latest.json'
  # PAUSED on 2026-11-10 by user request: formerly scheduled trigger.
  # schedule:
  # # UTC; Asia/Taipei UTC+8. Weekdays; official trading-calendar gate below.
  # # Taipei 09:05, 09:15, 09:30, 09:50 and 10:15.
  # # GitHub scheduled jobs may be delayed or skipped; verify run artifacts.
  # - cron: "5,15,30,50 1 * * 1-5"
  # - cron: "15 2 * * 1-5"
  # 
permissions:
  contents: write

jobs:
  scan:
    outputs:
      should_scan: ${{ steps.calendar.outputs.should_scan }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Record the exact scheduled cron and runner start evidence
        shell: bash
        run: |
          mkdir -p output
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          event_path = Path(os.environ["GITHUB_EVENT_PATH"])
          payload = json.loads(event_path.read_text(encoding="utf-8"))
          now = datetime.now(timezone.utc)
          record = {
              "schema": "SKY_INTRADAY_SCHEDULE_EVIDENCE_V1",
              "event_name": os.environ["GITHUB_EVENT_NAME"],
              "event_schedule_cron_utc": payload.get("schedule"),
              "job_started_at_utc": now.isoformat(),
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "source": "GitHub event payload and runner clock",
              "cron_utc": [
                  "5,15,30,50 1 * * 1-5",
                  "15 2 * * 1-5"
              ],
              "note": "Run/job start may be delayed; cron proves schedule rule identity, not punctuality. A cron entry contains multiple local slots; compare run times with expected Asia/Taipei schedule and check missed slots separately."
          }
          path = Path("output/schedule_trigger.json")
          path.write_text(json.dumps(record, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(record, ensure_ascii=False))
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Restore P0-A monitor state cache
        uses: actions/cache/restore@v4
        with:
          path: output/monitor_state.json
          key: sky-monitor-state-${{ github.run_id }}
          restore-keys: |
            sky-monitor-state-
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check TWSE trading calendar
        id: calendar
        shell: bash
        run: |
          set -euo pipefail
          python -m src.trading_calendar --out output/trading_calendar_status.json
          SHOULD_SCAN="$(python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          x=json.loads(Path("output/trading_calendar_status.json").read_text(encoding="utf-8"))
          if x.get("source_status") != "PASS":
              raise SystemExit("Official trading calendar unavailable; scan withheld.")
          now=datetime.now(ZoneInfo("Asia/Taipei"))
          minute=now.hour*60+now.minute
          in_regular_session=(now.weekday()<5 and 9*60<=minute<13*60+30)
          same_date=(x.get("date")==now.date().isoformat())
          allowed=(x.get("should_scan") is True and same_date and in_regular_session)
          Path("output/scan_session_gate.json").write_text(json.dumps({
              "schema":"SKY_SCAN_TPE_REGULAR_SESSION_GATE_V1",
              "checked_at_tpe":now.isoformat(),
              "official_trading_date":x.get("date"),
              "official_calendar_status":x.get("source_status"),
              "is_regular_session":in_regular_session,
              "calendar_date_matches":same_date,
              "should_scan":allowed,
              "reason":"APPROVED_IN_SESSION" if allowed else "OUTSIDE_SESSION_OR_CALENDAR_BLOCKED",
              "automatic_order":False,
          },ensure_ascii=False,indent=2)+"\n",encoding="utf-8"))
          print("true" if allowed else "false")
          PY
          )"
          echo "should_scan=$SHOULD_SCAN" >> "$GITHUB_OUTPUT"

      - name: Diagnose data sources
        if: steps.calendar.outputs.should_scan == 'true'
        env:
          SKY_FUGLE_ONLY_MARKETDATA: "1"
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
        run: python -m src.diagnose_sources | tee source-diagnostics.json
        continue-on-error: true
      - name: Run scanner
        if: steps.calendar.outputs.should_scan == 'true'
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
          MAX_PRICE: "100"
          TOP_N: "100"
          DEEP_DIVE_N: "12"
          MIN_VOLUME: "500"
          MIN_TRADE_VALUE: "10000000"
          STRICT_OFFICIAL_MODE: "1"
          ALLOW_MIS_OTC_FALLBACK: "0"
          SKY_FUGLE_ONLY_MARKETDATA: "1"
          ACCOUNT_EQUITY: ${{ vars.ACCOUNT_EQUITY || '500000' }}
          RISK_PER_TRADE_PCT: ${{ vars.RISK_PER_TRADE_PCT || '0.01' }}
          DAILY_LOSS_LIMIT_PCT: ${{ vars.DAILY_LOSS_LIMIT_PCT || '0.02' }}
          MAX_PORTFOLIO_HEAT_PCT: ${{ vars.MAX_PORTFOLIO_HEAT_PCT || '0.03' }}
          MAX_POSITION_PCT: ${{ vars.MAX_POSITION_PCT || '0.20' }}
          CORRELATION_LIMIT_PCT: ${{ vars.CORRELATION_LIMIT_PCT || '0.02' }}
          MAX_CONCURRENT_POSITIONS: ${{ vars.MAX_CONCURRENT_POSITIONS || '3' }}
          CAUTION_LOSS_STREAK: ${{ vars.CAUTION_LOSS_STREAK || '3' }}
          DEFENSIVE_LOSS_STREAK: ${{ vars.DEFENSIVE_LOSS_STREAK || '5' }}
          LOCKDOWN_DRAWDOWN_PCT: ${{ vars.LOCKDOWN_DRAWDOWN_PCT || '0.06' }}
          LOT_SIZE: ${{ vars.LOT_SIZE || '1000' }}
          DAILY_PNL: ${{ vars.DAILY_PNL || '0' }}
          OPEN_RISK: ${{ vars.OPEN_RISK || '0' }}
          CONCURRENT_POSITIONS: ${{ vars.CONCURRENT_POSITIONS || '0' }}
          CORRELATED_OPEN_RISK: ${{ vars.CORRELATED_OPEN_RISK || '0' }}
          ACCOUNT_DRAWDOWN_PCT: ${{ vars.ACCOUNT_DRAWDOWN_PCT || '0' }}
          CONSECUTIVE_LOSSES: ${{ vars.CONSECUTIVE_LOSSES || '0' }}
          PAPER_TRADING_MODE: "shadow"
          MONITOR_STATE_BACKEND: ${{ vars.MONITOR_STATE_BACKEND || 'file' }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          MONITOR_STATE_REDIS_KEY: ${{ vars.MONITOR_STATE_REDIS_KEY || 'sky:p0a:monitor_state' }}
        run: python -m src.main
      - name: Publish all MCR research observations even when live scan is blocked
        if: always()
        run: |
          python -m unittest tests.test_mcr_observation_report -v
          python -m research.mcr_observation_report
      - name: Always publish all-market informational observations (non-trading)
        if: always() && steps.calendar.outputs.should_scan == 'true'
        continue-on-error: true
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
        run: |
          python -m research.sky_full_universe_information
          cat output/sky_quickscan_information/latest.md >> "$GITHUB_STEP_SUMMARY"
      - name: Verify bounded paid Fugle individual last-trades (research-only)
        if: always() && steps.calendar.outputs.should_scan == 'true'
        continue-on-error: true
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
          SKY_FUGLE_ONLY_MARKETDATA: "1"
        run: |
          set -euo pipefail
          python -m research.sky_fugle_individual_execution_probe --limit 8
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("output/sky_quickscan_information/fugle_execution_samples.json")
          x = json.loads(p.read_text(encoding="utf-8"))
          print("Fugle individual last-trade sample:", x["requested_count"],
                "fresh:", x["verified_fresh_executed_count"],
                "production_eligible:", x["production_eligible"])
          assert x["full_market_executed_certified"] is False
          assert x["production_eligible"] is False
          PY
      - name: Join MCR research observations to available all-market information
        if: always()
        continue-on-error: true
        run: |
          python -m unittest tests.test_mcr_intraday_information -v
          python -m research.mcr_intraday_information
          cat output/mcr_intraday_information_latest.md >> "$GITHUB_STEP_SUMMARY"
      - name: Build and verify full 13-column Fugle research artifact (even when trading gate blocks)
        if: always() && steps.calendar.outputs.should_scan == 'true'
        run: |
          set -euo pipefail
          test -s output/sky_quickscan_information/full_universe.json
          python -m research.sky_13col_report \
            --input output/sky_quickscan_information/full_universe.json \
            --scanner-input output/latest.json \
            --output output/sky_quickscan_information/latest_13col.md \
            --json-output output/sky_quickscan_information/latest_13col.json
          python -m research.verify_13col_artifact \
            --source output/sky_quickscan_information/full_universe.json \
            --json output/sky_quickscan_information/latest_13col.json \
            --markdown output/sky_quickscan_information/latest_13col.md
          echo '13欄完整研究報告已放入本次掃描 Artifact；資料／正式交易驗證分開判定。' >> "$GITHUB_STEP_SUMMARY"
      - name: Publish sanitized MCR scan receipt for mobile status and independent audit
        if: always() && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          def get(path):
              try: return json.loads(Path(path).read_text(encoding='utf-8'))
              except (OSError, ValueError): return {}
          mcr=get('output/mcr_intraday_information_latest.json')
          observed=get('output/sky_quickscan_information/full_universe.json')
          status={
            'schema':'SKY_MCR_INTRADAY_HEALTH_V1',
            'published_at_utc':datetime.now(timezone.utc).isoformat(),
            'run_id':os.getenv('GITHUB_RUN_ID'),
            'run_url':'https://github.com/'+os.getenv('GITHUB_REPOSITORY','')+'/actions/runs/'+os.getenv('GITHUB_RUN_ID',''),
            'financing_source_date':mcr.get('margin_source_date'),
            'quote_observed_at':mcr.get('quote_observed_at'),
            'mcr_observation_count':mcr.get('candidate_count'),
            'mcr_with_observed_price':mcr.get('with_observed_price'),
            'mcr_fresh_executed_count':mcr.get('fresh_executed_count'),
            'mcr_independent_accepted_executed_count':mcr.get('independent_accepted_executed_count'),
            'all_market_universe_count':observed.get('universe_count'),
            'all_market_observed_price_count':observed.get('observed_price_count'),
            'all_market_fresh_executed_count':observed.get('fresh_executed_count'),
            'by_exchange':observed.get('by_exchange'),
            'mcr_quote_status_counts':mcr.get('quote_status_counts'),
            'data_blockers':mcr.get('data_blockers'),
            'action':'禁止交易',
            'trade_eligible':False,
            'notice':'Research only. No new trading approval; never substitute financing balance for margin maintenance.'
          }
          Path('/tmp/sky_mcr_status.json').write_text(json.dumps(status,ensure_ascii=False,indent=2)+chr(10))
          print('MCR_RECEIPT',status['mcr_observation_count'],status['mcr_with_observed_price'],status['mcr_fresh_executed_count'])
          PY
          TARGET="repos/${GITHUB_REPOSITORY}/contents/docs/SKY_MCR_INTRADAY_HEALTH_LATEST.json"
          CONTENT=$(base64 -w0 /tmp/sky_mcr_status.json)
          for TRY in 1 2 3; do
            SHA=$(gh api "$TARGET" --jq '.sha' 2>/dev/null || true)
            if [ -n "$SHA" ]; then
              gh api --method PUT "$TARGET" -f message="ops: publish MCR scan health [skip ci]" -f content="$CONTENT" -f sha="$SHA" -f branch=main >/dev/null && break
            else
              gh api --method PUT "$TARGET" -f message="ops: publish MCR scan health [skip ci]" -f content="$CONTENT" -f branch=main >/dev/null && break
            fi
            if [ "$TRY" = 3 ]; then exit 1; fi
            sleep 2
          done
      - name: Verify operational market coverage
        if: steps.calendar.outputs.should_scan == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("output/latest.json")
          if not path.is_file():
              raise SystemExit("Scan result missing; cannot verify market coverage.")
          data = json.loads(path.read_text(encoding="utf-8"))
          print("Operational full market:", data.get("operational_full_market_scan"))
          print("Quote coverage percent:", data.get("quote_coverage_pct"))
          gate = data.get("live_market_evidence") or {}
          print("Verified live market evidence:", {k:v for k,v in gate.items() if k != "accepted_rows"})
          print("Market decision gate:", data.get("market_data_gate"))
          if (data.get("operational_full_market_scan") is not True
              or gate.get("valid_whole_market_operational") is not True
              or data.get("quote_scope") != "WHOLE_MARKET_EXECUTED_LIVE"
              or data.get("market_data_gate") != "PASS_FULL_MARKET_LIVE"):
              raise SystemExit("BLOCKED_EXTERNAL_DATA: full-market actual executed quotes not verified; no trades.")
          PY
      - name: Save P0-A monitor state cache
        if: steps.calendar.outputs.should_scan == 'true' && success()
        uses: actions/cache/save@v4
        with:
          path: output/monitor_state.json
          key: sky-monitor-state-${{ github.run_id }}
      - name: Validate Sky alert artifact freshness (read only, no rescan)
        if: always() && steps.calendar.outputs.should_scan == 'true'
        shell: bash
        run: |
          # Unit tests belong in PR CI. Never prevent the runtime reader
          # from producing its fail-closed audit receipt first.
          python -m research.sky_alert_reader \
            --input output/sky_quickscan_information/full_universe.json \
            --json-output output/sky_alert/reader_receipt.json \
            --markdown-output output/sky_alert/latest.md
      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-scan-${{ github.run_id }}
          path: |
            output/
            source-diagnostics.json
            output/trading_calendar_status.json
          if-no-files-found: warn
          retention-days: 90
      # P0 daytrade-only: user paused intraday Telegram alerts by default.
      # Set SKY_DAYTRADE_TELEGRAM_ALERTS=true to explicitly opt in again.
      - name: Notify Telegram when intraday scan fails
        if: failure() && vars.SKY_DAYTRADE_TELEGRAM_ALERTS == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: PYTHONPATH=. python research/intraday_scan_failure_alert.py


  # External readback: run only AFTER the scan job has uploaded its ZIP.
  # This is distinct from reading a local file before upload.
  alert-artifact-readback:
    needs: scan
    # An intentionally skipped trading day must not generate a missing-artifact alarm.
    if: always() && needs.scan.outputs.should_scan == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install readback dependencies
        run: pip install -r requirements.txt
      - name: Download uploaded scan artifact from this same run
        id: artifact_download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: sky-scan-${{ github.run_id }}
          path: readback
      - name: Verify externally downloaded Sky alert input and regenerate receipt
        if: always()
        shell: bash
        env:
          ARTIFACT_DOWNLOAD_OUTCOME: ${{ steps.artifact_download.outcome }}
        run: |
          set -euo pipefail
          mkdir -p readback-verification
          # Reader is the runtime acceptance gate; unit tests run in PR CI.
          # A test harness failure must never suppress its fail-closed receipt.
          # Even a GitHub download error must yield a fail-closed receipt.
          if [ "$ARTIFACT_DOWNLOAD_OUTCOME" != "success" ]; then
            INPUT="readback/NO_DOWNLOADED_ARTIFACT.json"
          else
            INPUT="readback/output/sky_quickscan_information/full_universe.json"
          fi
          set +e
          python -m research.sky_alert_reader \
            --input "$INPUT" \
            --json-output readback-verification/reader_receipt.json \
            --markdown-output readback-verification/latest.md
          READER_EXIT=$?
          set -e
          # Seal provenance AFTER the downloaded file has been read, even if
          # the source was stale or blocked. This is an audit trail, not PASS.
          INPUT_PATH="$INPUT" READER_EXIT="$READER_EXIT" python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          path = Path(os.environ["INPUT_PATH"])
          receipt_path = Path("readback-verification/reader_receipt.json")
          receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
          origin = {
              "schema": "SKY_ALERT_EXTERNAL_READBACK_PROVENANCE_V1",
              "source_repo": os.environ["GITHUB_REPOSITORY"],
              "source_run_id": os.environ["GITHUB_RUN_ID"],
              "source_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "source_head_sha": os.environ["GITHUB_SHA"],
              "source_artifact": "sky-scan-" + os.environ["GITHUB_RUN_ID"],
              "download_outcome": os.environ["ARTIFACT_DOWNLOAD_OUTCOME"],
              "input_sha256": hashlib.sha256(path.read_bytes()).hexdigest() if path.is_file() else None,
              "reader_exit_code": int(os.environ["READER_EXIT"]),
              "production_eligible": False,
              "external_mobile_command_verified": False,
          }
          # Seal the exact JSON report the external command will later read.
          # Not a signature: independent provenance/Artifact identity is still required.
          if isinstance(receipt.get("report"), dict):
              from research.sky_alert_reader import receipt_report_sha256
              origin["receipt_report_sha256"] = receipt_report_sha256(receipt["report"])
          receipt["provenance"] = origin
          receipt["production_eligible"] = False
          receipt["action"] = "禁止交易"
          receipt_path.write_text(json.dumps(receipt, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          Path("readback-verification/provenance.json").write_text(
              json.dumps(origin, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(origin, ensure_ascii=False))
          PY
          exit "$READER_EXIT"
      - name: Upload external readback verdict (including blocked state)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-alert-readback-${{ github.run_id }}
          path: readback-verification/
          if-no-files-found: warn
          retention-days: 90
