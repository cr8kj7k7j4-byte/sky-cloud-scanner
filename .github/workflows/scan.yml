name: Sky Cloud Scanner v0.5 + P0-R

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scan_requests/mcr/now.json'
  push:
    branches: [main]
    paths:
      - 'scan_requests/quickscan/latest.json'
  schedule:
    # UTC, Asia/Taipei UTC+8. Weekdays; official trading-calendar gate below.
    # 09:00-09:55 every 5 minutes (12 slots); 09:00 initial data may fail closed.
    - cron: "*/5 1 * * 1-5"
    # 10:00-12:55 every 5 minutes (36 slots).
    - cron: "*/5 2-4 * * 1-5"
    # 13:00-13:30 every 5 minutes (7 slots); total 55.
    # GitHub scheduled jobs can be delayed or skipped; artifacts contain actual start time.
    - cron: "0-30/5 5 * * 1-5"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Record the exact scheduled cron and runner start evidence
        shell: bash
        run: |
          mkdir -p output
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          event_path = Path(os.environ["GITHUB_EVENT_PATH"])
          payload = json.loads(event_path.read_text(encoding="utf-8"))
          now = datetime.now(timezone.utc)
          record = {
              "schema": "SKY_INTRADAY_SCHEDULE_EVIDENCE_V1",
              "event_name": os.environ["GITHUB_EVENT_NAME"],
              "event_schedule_cron_utc": payload.get("schedule"),
              "job_started_at_utc": now.isoformat(),
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "source": "GitHub event payload and runner clock",
              "cron_utc": [
                  "*/5 1 * * 1-5",
                  "*/5 2-4 * * 1-5",
                  "0-30/5 5 * * 1-5"
              ],
              "note": "Run/job start may be delayed; cron proves schedule rule identity, not punctuality. A cron entry contains multiple local slots; compare run times with expected Asia/Taipei schedule and check missed slots separately."
          }
          path = Path("output/schedule_trigger.json")
          path.write_text(json.dumps(record, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(record, ensure_ascii=False))
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Restore P0-A monitor state cache
        uses: actions/cache/restore@v4
        with:
          path: output/monitor_state.json
          key: sky-monitor-state-${{ github.run_id }}
          restore-keys: |
            sky-monitor-state-
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check TWSE trading calendar
        id: calendar
        shell: bash
        run: |
          set -euo pipefail
          python -m src.trading_calendar --out output/trading_calendar_status.json
          SHOULD_SCAN="$(python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("output/trading_calendar_status.json").read_text(encoding="utf-8"))
          if x.get("source_status") != "PASS":
              raise SystemExit("Official trading calendar unavailable; scan withheld.")
          print("true" if x.get("should_scan") is True else "false")
          PY
          )"
          echo "should_scan=$SHOULD_SCAN" >> "$GITHUB_OUTPUT"

      - name: Diagnose data sources
        if: steps.calendar.outputs.should_scan == 'true'
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
        run: python -m src.diagnose_sources | tee source-diagnostics.json
        continue-on-error: true
      - name: Run scanner
        if: steps.calendar.outputs.should_scan == 'true'
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
          MAX_PRICE: "100"
          TOP_N: "100"
          DEEP_DIVE_N: "12"
          MIN_VOLUME: "500"
          MIN_TRADE_VALUE: "10000000"
          STRICT_OFFICIAL_MODE: "1"
          ALLOW_MIS_OTC_FALLBACK: "1"
          ACCOUNT_EQUITY: ${{ vars.ACCOUNT_EQUITY || '500000' }}
          RISK_PER_TRADE_PCT: ${{ vars.RISK_PER_TRADE_PCT || '0.01' }}
          DAILY_LOSS_LIMIT_PCT: ${{ vars.DAILY_LOSS_LIMIT_PCT || '0.02' }}
          MAX_PORTFOLIO_HEAT_PCT: ${{ vars.MAX_PORTFOLIO_HEAT_PCT || '0.03' }}
          MAX_POSITION_PCT: ${{ vars.MAX_POSITION_PCT || '0.20' }}
          CORRELATION_LIMIT_PCT: ${{ vars.CORRELATION_LIMIT_PCT || '0.02' }}
          MAX_CONCURRENT_POSITIONS: ${{ vars.MAX_CONCURRENT_POSITIONS || '3' }}
          CAUTION_LOSS_STREAK: ${{ vars.CAUTION_LOSS_STREAK || '3' }}
          DEFENSIVE_LOSS_STREAK: ${{ vars.DEFENSIVE_LOSS_STREAK || '5' }}
          LOCKDOWN_DRAWDOWN_PCT: ${{ vars.LOCKDOWN_DRAWDOWN_PCT || '0.06' }}
          LOT_SIZE: ${{ vars.LOT_SIZE || '1000' }}
          DAILY_PNL: ${{ vars.DAILY_PNL || '0' }}
          OPEN_RISK: ${{ vars.OPEN_RISK || '0' }}
          CONCURRENT_POSITIONS: ${{ vars.CONCURRENT_POSITIONS || '0' }}
          CORRELATED_OPEN_RISK: ${{ vars.CORRELATED_OPEN_RISK || '0' }}
          ACCOUNT_DRAWDOWN_PCT: ${{ vars.ACCOUNT_DRAWDOWN_PCT || '0' }}
          CONSECUTIVE_LOSSES: ${{ vars.CONSECUTIVE_LOSSES || '0' }}
          PAPER_TRADING_MODE: "shadow"
          MONITOR_STATE_BACKEND: ${{ vars.MONITOR_STATE_BACKEND || 'file' }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          MONITOR_STATE_REDIS_KEY: ${{ vars.MONITOR_STATE_REDIS_KEY || 'sky:p0a:monitor_state' }}
        run: python -m src.main
      - name: Publish all MCR research observations even when live scan is blocked
        if: always()
        run: |
          python -m unittest tests.test_mcr_observation_report -v
          python -m research.mcr_observation_report
      - name: Always publish all-market informational observations (non-trading)
        if: always() && steps.calendar.outputs.should_scan == 'true'
        continue-on-error: true
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
        run: |
          python -m research.sky_full_universe_information
          cat output/sky_quickscan_information/latest.md >> "$GITHUB_STEP_SUMMARY"
      - name: Join MCR research observations to available all-market information
        if: always()
        continue-on-error: true
        run: |
          python -m unittest tests.test_mcr_intraday_information -v
          python -m research.mcr_intraday_information
          cat output/mcr_intraday_information_latest.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish sanitized MCR scan receipt for mobile status and independent audit
        if: always() && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          def get(path):
              try: return json.loads(Path(path).read_text(encoding='utf-8'))
              except (OSError, ValueError): return {}
          mcr=get('output/mcr_intraday_information_latest.json')
          observed=get('output/sky_quickscan_information/full_universe.json')
          status={
            'schema':'SKY_MCR_INTRADAY_HEALTH_V1',
            'published_at_utc':datetime.now(timezone.utc).isoformat(),
            'run_id':os.getenv('GITHUB_RUN_ID'),
            'run_url':'https://github.com/'+os.getenv('GITHUB_REPOSITORY','')+'/actions/runs/'+os.getenv('GITHUB_RUN_ID',''),
            'financing_source_date':mcr.get('margin_source_date'),
            'quote_observed_at':mcr.get('quote_observed_at'),
            'mcr_observation_count':mcr.get('candidate_count'),
            'mcr_with_observed_price':mcr.get('with_observed_price'),
            'mcr_fresh_executed_count':mcr.get('fresh_executed_count'),
            'all_market_universe_count':observed.get('universe_count'),
            'all_market_observed_price_count':observed.get('observed_price_count'),
            'all_market_fresh_executed_count':observed.get('fresh_executed_count'),
            'by_exchange':observed.get('by_exchange'),
            'mcr_quote_status_counts':mcr.get('quote_status_counts'),
            'data_blockers':mcr.get('data_blockers'),
            'action':'禁止交易',
            'trade_eligible':False,
            'notice':'Research only. No new trading approval; never substitute financing balance for margin maintenance.'
          }
          Path('/tmp/sky_mcr_status.json').write_text(json.dumps(status,ensure_ascii=False,indent=2)+chr(10))
          print('MCR_RECEIPT',status['mcr_observation_count'],status['mcr_with_observed_price'],status['mcr_fresh_executed_count'])
          PY
          TARGET="repos/${GITHUB_REPOSITORY}/contents/docs/SKY_MCR_INTRADAY_HEALTH_LATEST.json"
          CONTENT=$(base64 -w0 /tmp/sky_mcr_status.json)
          for TRY in 1 2 3; do
            SHA=$(gh api "$TARGET" --jq '.sha' 2>/dev/null || true)
            if [ -n "$SHA" ]; then
              gh api --method PUT "$TARGET" -f message="ops: publish MCR scan health [skip ci]" -f content="$CONTENT" -f sha="$SHA" -f branch=main >/dev/null && break
            else
              gh api --method PUT "$TARGET" -f message="ops: publish MCR scan health [skip ci]" -f content="$CONTENT" -f branch=main >/dev/null && break
            fi
            if [ "$TRY" = 3 ]; then exit 1; fi
            sleep 2
          done
      - name: Verify operational market coverage
        if: steps.calendar.outputs.should_scan == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("output/latest.json")
          if not path.is_file():
              raise SystemExit("Scan result missing; cannot verify market coverage.")
          data = json.loads(path.read_text(encoding="utf-8"))
          print("Operational full market:", data.get("operational_full_market_scan"))
          print("Quote coverage percent:", data.get("quote_coverage_pct"))
          gate = data.get("live_market_evidence") or {}
          print("Verified live market evidence:", {k:v for k,v in gate.items() if k != "accepted_rows"})
          print("Market decision gate:", data.get("market_data_gate"))
          if (data.get("operational_full_market_scan") is not True
              or gate.get("valid_whole_market_operational") is not True
              or data.get("quote_scope") != "WHOLE_MARKET_EXECUTED_LIVE"
              or data.get("market_data_gate") != "PASS_FULL_MARKET_LIVE"):
              raise SystemExit("BLOCKED_EXTERNAL_DATA: full-market actual executed quotes not verified; no trades.")
          PY
      - name: Save P0-A monitor state cache
        if: steps.calendar.outputs.should_scan == 'true' && success()
        uses: actions/cache/save@v4
        with:
          path: output/monitor_state.json
          key: sky-monitor-state-${{ github.run_id }}
      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-scan-${{ github.run_id }}
          path: |
            output/
            source-diagnostics.json
            output/trading_calendar_status.json
          if-no-files-found: warn
          retention-days: 90
      - name: Notify Telegram when intraday scan fails
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: PYTHONPATH=. python research/intraday_scan_failure_alert.py
