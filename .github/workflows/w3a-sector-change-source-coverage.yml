name: W3A Sector Change Source Coverage

on:
  pull_request:
    paths:
      - "research/sector_change_source_registry_2023_2026.json"
      - "research/audit_sector_change_source_coverage.py"
      - "tests/test_sector_change_source_coverage.py"
      - ".github/workflows/w3a-sector-change-source-coverage.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: Test source coverage gate
        run: python -m pytest -q tests/test_sector_change_source_coverage.py
      - name: Audit current registry
        run: |
          python research/audit_sector_change_source_coverage.py             --registry research/sector_change_source_registry_2023_2026.json             --out research_output/sector_change_source_coverage.json
      - name: Publish status
        if: always()
        run: cat research_output/sector_change_source_coverage.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w3a-sector-change-source-coverage
          path: research_output/sector_change_source_coverage.json
          if-no-files-found: error
          retention-days: 30
