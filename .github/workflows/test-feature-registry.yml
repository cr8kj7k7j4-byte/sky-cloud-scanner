name: P0-F Feature Registry Validation

on:
  push:
    branches: [main]
    paths:
      - "src/feature_registry.py"
      - "src/feature_store.py"
      - "src/feature_parity.py"
      - "tests/test_feature_registry.py"
      - "tests/test_feature_parity.py"
      - "P0_F_FEATURE_REGISTRY.md"
      - ".github/workflows/test-feature-registry.yml"
  pull_request:
    paths:
      - "src/feature_registry.py"
      - "src/feature_store.py"
      - "src/feature_parity.py"
      - "tests/test_feature_registry.py"
      - "tests/test_feature_parity.py"
      - "P0_F_FEATURE_REGISTRY.md"
      - ".github/workflows/test-feature-registry.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest
        run: pip install pytest
      - name: Validate P0-F feature registry and parity
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_feature_registry.py tests/test_feature_parity.py
