name: Sky margin evidence collection
on:
  pull_request:
    paths:
      - "research/margin_evidence/**"
      - ".github/workflows/margin-evidence.yml"
  workflow_dispatch:
    inputs:
      report_date:
        description: 'Official margin report date YYYY-MM-DD (blank uses Taiwan today)'
        required: false
        type: string
  schedule:
    # Taiwan 23:30; allow postmarket official reports time to publish.
    - cron: "30 15 * * 1-5"

permissions:
  contents: write
concurrency:
  group: sky-margin-evidence-writer
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test validation and failure handling
        run: python -m unittest discover -s research/margin_evidence -p 'test_*.py' -v
      - name: Probe official historical reports
        if: github.event_name == 'pull_request'
        id: probe
        run: python research/margin_evidence/collect.py --date 2026-10-30
      - name: Install calendar dependency
        if: github.event_name != 'pull_request'
        run: python -m pip install requests
      - name: Resolve intended official report date
        if: github.event_name != 'pull_request'
        id: report_date
        shell: bash
        run: |
          set -euo pipefail
          # The 15:30 UTC schedule targets Taiwan 23:30 of the SAME UTC date.
          # GitHub may dispatch after Taiwan midnight, e.g. 00:33 next day.
          # Never substitute the delayed runner's Taipei calendar date.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            REPORT_DATE="$(date -u +%F)"
            DATE_BASIS="SCHEDULED_UTC_DATE_TAIPEI_2330"
          else
            REPORT_DATE="${{ inputs.report_date }}"
            if [ -n "$REPORT_DATE" ]; then
              DATE_BASIS="MANUAL_EXPLICIT_DATE"
            else
              REPORT_DATE="$(TZ=Asia/Taipei date +%F)"
              DATE_BASIS="MANUAL_TAIPEI_DATE"
            fi
          fi
          [[ "$REPORT_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || exit 1
          echo "report_date=$REPORT_DATE" >> "$GITHUB_OUTPUT"
          echo "date_basis=$DATE_BASIS" >> "$GITHUB_OUTPUT"
          echo "Margin evidence target: $REPORT_DATE ($DATE_BASIS)"
      - name: Check official trading calendar
        if: github.event_name != 'pull_request'
        id: calendar
        run: |
          python -m src.trading_calendar --date "${{ steps.report_date.outputs.report_date }}" --out output/calendar.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path('output/calendar.json').read_text())
          if data.get('source_status') != 'PASS':
              raise SystemExit('Calendar unavailable; collection withheld')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('open=' + str(data.get('should_scan') is True).lower() + '\n')
          PY
      - name: Collect official margin evidence
        if: steps.calendar.outputs.open == 'true'
        id: collect
        run: |
          # Preserve fail-closed report-date checks; retry publication lag only.
          for attempt in 1 2 3; do
            if python research/margin_evidence/collect.py --date "${{ steps.report_date.outputs.report_date }}"; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Official reports still unavailable or unverified after retries" >&2
              exit 1
            fi
            sleep 90
          done
      - name: Normalize and verify source hashes
        if: steps.collect.outcome == 'success' || steps.probe.outcome == 'success'
        run: python research/margin_evidence/normalize.py
      - name: Checkout isolated evidence branch
        if: (steps.collect.outcome == 'success' || steps.probe.outcome == 'success') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/checkout@v4
        with:
          ref: data/margin-evidence
          path: evidence-store
          fetch-depth: 0
      - name: Persist immutable timestamped snapshot
        if: (steps.collect.outcome == 'success' || steps.probe.outcome == 'success') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json, os, shutil
          from pathlib import Path
          src = Path('output/margin_evidence')
          manifest = json.loads((src / 'manifest.json').read_text(encoding='utf-8'))
          if manifest.get('collection_status') != 'PASS':
              raise SystemExit('Refusing to persist invalid snapshot')
          date = manifest['requested_date']
          if len(date) != 10 or date[4] != '-' or date[7] != '-':
              raise SystemExit('Invalid date')
          target = Path('evidence-store/margin-snapshots') / date / (os.environ['RUN_ID'] + '-' + os.environ['RUN_ATTEMPT'])
          if target.exists():
              raise SystemExit('Snapshot path already exists; refusing overwrite')
          target.mkdir(parents=True)
          for name, record in manifest['sources'].items():
              filename = record.get('file', '')
              if record.get('status') != 'PASS' or Path(filename).name != filename:
                  raise SystemExit('Invalid source record')
              shutil.copyfile(src / filename, target / filename)
          shutil.copyfile(src / 'normalized.json', target / 'normalized.json')
          manifest['github_event'] = os.environ['EVENT_NAME']
          manifest['snapshot_kind'] = 'historical_probe_not_pit' if os.environ['EVENT_NAME'] == 'pull_request' else 'contemporaneous_collection'
          (target / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('Evidence snapshot:', target)
          PY
          cd evidence-store
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add margin-snapshots/
          git diff --cached --quiet && { echo "No snapshot changes"; exit 1; }
          git commit -m "Archive margin evidence run ${RUN_ID}-${RUN_ATTEMPT}"
          git push origin HEAD:data/margin-evidence
          echo "Stored to data/margin-evidence; evidence is not a trade signal." >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve source and diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: margin-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/calendar.json
            output/margin_evidence/
          if-no-files-found: warn
          retention-days: 90
