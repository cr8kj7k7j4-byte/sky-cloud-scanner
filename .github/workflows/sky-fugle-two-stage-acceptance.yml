name: Sky Fugle Two-Stage Bounded Acceptance (Research Only)
on:
  push:
    branches:
      - research/fugle-two-stage-entitlement-audit-20261110
    paths:
      - research/sky_fugle_two_stage_acceptance.py
      - tests/test_sky_fugle_two_stage_acceptance.py
      - .github/workflows/sky-fugle-two-stage-acceptance.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bounded-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded test dependencies
        run: python -m pip install pytest requests
      - name: Check fail-closed contracts without API credentials
        run: PYTHONPATH=. python -m pytest -q tests/test_sky_fugle_two_stage_acceptance.py
      - name: Verify existing paid key is configured (without revealing value)
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
        run: |
          python - <<'PY'
          import os
          if not os.environ.get("FUGLE_API_KEY"):
              raise SystemExit("MISSING_FUGLE_API_KEY")
          print("EXISTING_FUGLE_KEY_CONFIGURED")
          PY
      - name: Run bounded two-stage paid endpoint audit (no orders)
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
        run: PYTHONPATH=. python -m research.sky_fugle_two_stage_acceptance
      - name: Verify research-only and record per-endpoint evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("output/fugle_two_stage_acceptance.json").read_text())
          assert x["research_only"] and not x["production_eligible"]
          assert not x["full_market_executed_certified"]
          assert x["individual"]["requests_made"] <= 12
          print("SNAPSHOT_TSE",x["snapshot"].get("TSE",{}).get("request_status"),
                "SNAPSHOT_OTC",x["snapshot"].get("OTC",{}).get("request_status"))
          print("INDIVIDUAL",x["individual"]["status_counts"])
          print("QUOTA_VERDICT",x["quota_verdict"])
          PY
      - name: Publish sanitized acceptance result to research branch for independent readback
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/research/fugle-two-stage-entitlement-audit-20261110'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          source = Path("output/fugle_two_stage_acceptance.json")
          result = {
              "schema": "SKY_FUGLE_TWO_STAGE_ACCEPTANCE_RECEIPT_V1",
              "run_id": os.getenv("GITHUB_RUN_ID"),
              "run_url": "https://github.com/" + os.getenv("GITHUB_REPOSITORY","") + "/actions/runs/" + os.getenv("GITHUB_RUN_ID",""),
              "head_sha": os.getenv("GITHUB_SHA"),
              "recorded_at_utc": datetime.now(timezone.utc).isoformat(),
              "research_only": True,
              "production_eligible": False,
              "trade_action": "禁止交易"
          }
          if source.exists():
              data=json.loads(source.read_text())
              result["status"]="RECORDED"
              result["snapshot"]=data.get("snapshot",{})
              result["individual"]={
                  k: v for k,v in data.get("individual",{}).items() if k!="items"
              }
              result["quota_verdict"]=data.get("quota_verdict")
              result["checked_at_tpe"]=data.get("checked_at_tpe")
          else:
              result["status"]="NO_AUDIT_OUTPUT"
          Path("/tmp/sky_fugle_two_stage_receipt.json").write_text(json.dumps(result,ensure_ascii=False,indent=2)+"\n")
          PY
          TARGET="repos/${GITHUB_REPOSITORY}/contents/docs/SKY_FUGLE_TWO_STAGE_ACCEPTANCE_LATEST.json"
          CONTENT=$(base64 -w0 /tmp/sky_fugle_two_stage_receipt.json)
          SHA=$(gh api "$TARGET" --jq '.sha' 2>/dev/null || true)
          if [ -n "$SHA" ]; then
            gh api --method PUT "$TARGET" -f message="research: publish bounded Fugle acceptance result [skip ci]" -f content="$CONTENT" -f sha="$SHA" -f branch=research/fugle-two-stage-entitlement-audit-20261110 >/dev/null
          else
            gh api --method PUT "$TARGET" -f message="research: publish bounded Fugle acceptance result [skip ci]" -f content="$CONTENT" -f branch=research/fugle-two-stage-entitlement-audit-20261110 >/dev/null
          fi
      - name: Upload bounded sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-fugle-two-stage-bounded-${{ github.run_id }}
          path: output/fugle_two_stage_acceptance.json
          if-no-files-found: warn
          retention-days: 30
