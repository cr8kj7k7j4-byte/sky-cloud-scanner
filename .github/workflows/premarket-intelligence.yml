name: Sky Premarket Intelligence

on:
  workflow_dispatch:
  schedule:
    - cron: "20 8 * * 1-5"
      timezone: "Asia/Taipei"

permissions:
  contents: read

jobs:
  premarket:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt beautifulsoup4

      - name: Run P0-EVT premarket event scan
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          PREMARKET_REDIS_KEY: ${{ vars.PREMARKET_REDIS_KEY || 'sky:p0evt:latest' }}
          PREMARKET_EVENT_MAX_SYMBOLS: ${{ vars.PREMARKET_EVENT_MAX_SYMBOLS || '2000' }}
          PREMARKET_LOOKBACK_DAYS: ${{ vars.PREMARKET_LOOKBACK_DAYS || '3' }}
          PREMARKET_EVENT_WORKERS: ${{ vars.PREMARKET_EVENT_WORKERS || '8' }}
          PREMARKET_RANK_LIMIT: ${{ vars.PREMARKET_RANK_LIMIT || '50' }}
        run: python -m src.premarket_pipeline

      - name: Upload premarket artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-premarket-${{ github.run_id }}
          path: output/premarket/
          if-no-files-found: warn
          retention-days: 14
