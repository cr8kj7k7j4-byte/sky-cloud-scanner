name: Sky 100 Phase 6 Rule Ablation

on:
  push:
    branches:
      - feat/sky-100-phase6-rule-ablation
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research dependencies
        run: pip install pandas numpy
      - name: Compile
        run: python -m compileall -q src research tests
      - name: Phase 6 tests
        run: python tests/test_rule_ablation_lab.py
      - name: Risk engine tests
        run: python tests/test_risk_engine.py
