name: MCR One-Year Data and Proxy Backtest
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/mcr_one_year_pilot.py'
      - '.github/workflows/mcr-one-year-pilot.yml'
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 2025-11-10 through 2026-11-06 historical data and proxy test
        env:
          FINMIND_API_TOKEN: ${{ secrets.FINMIND_API_TOKEN }}
        run: python -m research.mcr_one_year_pilot --out research_output/mcr_one_year_pilot.json
      - name: Verify audit output and no Production claim
        run: |
          python -c "import json; d=json.load(open('research_output/mcr_one_year_pilot.json')); assert d['decision']=='INSUFFICIENT_DATA'; assert not d['production_signal']; print('MCR data-quality gate checked')"
      - uses: actions/upload-artifact@v4
        with:
          name: mcr-one-year-pilot-audit
          path: research_output/mcr_one_year_pilot.json
          retention-days: 30
