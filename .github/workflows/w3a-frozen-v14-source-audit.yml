name: W3A Frozen v1.4 Replay Source Audit

on:
  pull_request:
    paths:
      - "research/SKY_DAY_V14_FROZEN_RULE_SOURCE_REGISTRY.json"
      - "research/audit_frozen_v14_rule_sources.py"
      - "tests/test_frozen_v14_rule_sources.py"
      - "research/frozen_v14_evidence_replay_adapter.py"
      - "tests/test_frozen_v14_evidence_replay_adapter.py"
      - ".github/workflows/w3a-frozen-v14-source-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest -q tests/test_frozen_v14_rule_sources.py tests/test_frozen_v14_evidence_replay_adapter.py
      - run: |
          python research/audit_frozen_v14_rule_sources.py             --registry research/SKY_DAY_V14_FROZEN_RULE_SOURCE_REGISTRY.json             --out research_output/frozen_v14_rule_source_audit.json
      - if: always()
        run: cat research_output/frozen_v14_rule_source_audit.json >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w3a-frozen-v14-rule-source-audit
          path: research_output/frozen_v14_rule_source_audit.json
          if-no-files-found: error
          retention-days: 30
