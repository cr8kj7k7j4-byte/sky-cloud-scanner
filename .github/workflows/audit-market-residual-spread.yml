name: Sky VNext Residual Ranking Baseline

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/audit-market-residual-spread.yml'

permissions:
  actions: read
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Download historical 5m artifact
        uses: dawidd6/action-download-artifact@v11
        with:
          run_id: 39963770301
          name_is_regexp: true
          name: sky-history-5m-.*
          path: _hist
          search_artifacts: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare history dataset
        id: data
        run: |
          mkdir -p _hist_unpacked
          HIST_TAR=$(find _hist -name 'sky-history-5m-*.tar.gz' | head -1)
          test -n "$HIST_TAR"
          tar -xzf "$HIST_TAR" -C _hist_unpacked
          HIST_DIR=$(find _hist_unpacked -type d -path '*/research_data/history' | head -1)
          test -n "$HIST_DIR"
          echo "history_dir=$HIST_DIR" >> "$GITHUB_OUTPUT"

      - name: Run VNext residual ranking baseline
        run: |
          python research/audit_market_residual_spread.py             --history-dir "${{ steps.data.outputs.history_dir }}"             --out research_output_residual_spread

      - name: Publish summary
        if: always()
        run: |
          if [ -f research_output_residual_spread/vnext_residual_ranking_baseline.md ]; then
            cat research_output_residual_spread/residual_spread_summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-vnext-residual-ranking-${{ github.run_id }}
          path: research_output_residual_spread
          if-no-files-found: warn
          retention-days: 14
