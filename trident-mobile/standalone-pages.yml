name: TRIDENT Standalone Pages Deployment
# Install this workflow ONLY in a dedicated TRIDENT repository.
# Never enable this workflow in the existing Sky Cloud Scanner repository.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.repository == 'cr8kj7k7j4-byte/trident-iphone-workstation'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify isolated TRIDENT release
        run: |
          test -s index.html
          test -s manifest.webmanifest
          grep -q 'NO TRADE' index.html
          ! grep -Eiq '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|api[_-]?secret[[:space:]]*[:=]|access[_-]?token[[:space:]]*[:=])' index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
