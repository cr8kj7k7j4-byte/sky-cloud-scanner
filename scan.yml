name: Sky Cloud Scanner v0.3

on:
  workflow_dispatch:
  schedule:
    - cron: "10 9 * * 1-5"
      timezone: "Asia/Taipei"
    - cron: "10 10 * * 1-5"
      timezone: "Asia/Taipei"
    - cron: "10 11 * * 1-5"
      timezone: "Asia/Taipei"
    - cron: "10 12 * * 1-5"
      timezone: "Asia/Taipei"
    - cron: "0 13 * * 1-5"
      timezone: "Asia/Taipei"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Diagnose data sources
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
        run: python -m src.diagnose_sources | tee source-diagnostics.json
        continue-on-error: true
      - name: Run scanner
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAX_PRICE: "100"
          TOP_N: "100"
          DEEP_DIVE_N: "12"
          MIN_VOLUME: "500"
          MIN_TRADE_VALUE: "10000000"
          STRICT_OFFICIAL_MODE: "1"
          ALLOW_MIS_OTC_FALLBACK: "1"
        run: python -m src.main
      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-scan-${{ github.run_id }}
          path: |
            output/
            source-diagnostics.json
          if-no-files-found: warn
          retention-days: 14
